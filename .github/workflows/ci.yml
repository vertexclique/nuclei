name: CI

on: [push, pull_request]

# One run per ref: a new push or PR update cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # The macOS runners are Apple Silicon: the aarch64 toolchain runs
          # natively there (an x86_64 one cannot run on the arm64 hosts).
          - toolchain: aarch64-apple-darwin
            os: macos-latest
          # The completion port backend.
          - toolchain: x86_64-pc-windows-msvc
            os: windows-latest

    name: stable - ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain }}

      - name: check
        run: cargo check --all --bins --tests

      - name: tests
        run: cargo test --all

      - name: tests on epoll
        if: runner.os == 'Linux'
        run: cargo test --all
        env:
          NUCLEI_BACKEND: epoll

  # `#[nuclei::bench]` expands to a benchmark, which only nightly's test
  # harness takes: built and run here, each benchmark's body once.
  bench_macro_on_nightly:
    name: The bench macro on nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: bench macro
        run: cargo test --test macros_bench
        env:
          RUSTFLAGS: --cfg nuclei_nightly

  # The suite under AddressSanitizer on both Linux backends: shards that
  # go with operations out and tasks and timers left, and the memory the
  # driver lends the kernel. It sees what this process does with that
  # memory (that the kernel never writes memory that is gone is the slots'
  # rules), and LeakSanitizer what is never freed. The test that no sync
  # primitive makes a system call is left out: the sanitizer's runtime
  # makes its own.
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: tests on io_uring
        run: cargo test -p nuclei --target x86_64-unknown-linux-gnu -- --skip hot_loops_make_no_system_call_but_sched_yield

      - name: tests on epoll
        run: cargo test -p nuclei --target x86_64-unknown-linux-gnu -- --skip hot_loops_make_no_system_call_but_sched_yield
        env:
          NUCLEI_BACKEND: epoll

  # The io_uring probe in each sandbox it meets (benches/reference/probe-matrix.sh): the plain
  # host, systemd units that kill or deny the io_uring calls, Docker's default seccomp profile
  # and unconfined, and the io_uring_disabled sysctl; each must report what that sandbox gives.
  probe_matrix:
    name: The io_uring probe in each sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: probe matrix
        run: bash benches/reference/probe-matrix.sh
        env:
          PROBE_SYSTEMD_RUN: sudo systemd-run
          PROBE_SYSCTL: "1"

  check_fmt_and_docs:
    name: Checking fmt and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

      # Doc warnings stay visible but not fatal while the legacy runtime is
      # in the tree; it is on its way out and its doc nits go with it.
      - name: doc
        run: cargo doc
