name: CI

on: [push, pull_request]

# One run per ref: a new push or PR update cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - toolchain: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # macos-latest is Apple Silicon, where only the aarch64 toolchain
          # runs natively; macos-15-intel is the Intel host for x86_64.
          - toolchain: aarch64-apple-darwin
            os: macos-latest
          - toolchain: x86_64-apple-darwin
            os: macos-15-intel
          # The completion port backend.
          - toolchain: x86_64-pc-windows-msvc
            os: windows-latest

    name: stable - ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    # A test that hangs fails the job here, not at the runner's six hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain }}

      - name: check
        run: cargo check --all --bins --tests

      - name: tests
        run: cargo test --all --no-fail-fast

      - name: tests on epoll
        if: runner.os == 'Linux'
        run: cargo test --all --no-fail-fast
        env:
          NUCLEI_BACKEND: epoll

      # The IO counts of `stats` are built only with the `io-stats` feature: the suite with it
      # on, on Linux's two backends and on macOS.
      - name: tests with io-stats
        if: runner.os != 'Windows'
        run: cargo test --all --features nuclei/io-stats --no-fail-fast

      - name: tests with io-stats on epoll
        if: runner.os == 'Linux'
        run: cargo test --all --features nuclei/io-stats --no-fail-fast
        env:
          NUCLEI_BACKEND: epoll

  # The kqueue backend on FreeBSD, tested in a FreeBSD VM on a Linux runner (the cross-target
  # clippy below only lints it). The crates only: the examples pull in C libraries.
  freebsd:
    name: stable - x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: tests in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            cargo test -p nuclei -p nuclei-macros --no-fail-fast
            cargo test -p nuclei -p nuclei-macros --features nuclei/io-stats --no-fail-fast
            # The file tests again on UFS, in a memory disk: the VM's own file system is ZFS,
            # which reserves no space, so `allocate`'s reservations, and the zeros UFS writes
            # where it cannot free a range, run there.
            mdconfig -a -t swap -s 1g -u 9
            newfs -U /dev/md9 > /dev/null
            mkdir -p /mnt/ufs
            mount /dev/md9 /mnt/ufs
            chmod 1777 /mnt/ufs
            TMPDIR=/mnt/ufs cargo test -p nuclei --lib --no-fail-fast fs::

  # `#[nuclei::bench]` expands to a benchmark, which only nightly's test
  # harness takes: built and run here, each benchmark's body once.
  bench_macro_on_nightly:
    name: The bench macro on nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: bench macro
        run: cargo test --test macros_bench
        env:
          RUSTFLAGS: --cfg nuclei_nightly

  # The suite under AddressSanitizer on both Linux backends: shards that
  # go with operations out and tasks and timers left, and the memory the
  # driver lends the kernel. It sees what this process does with that
  # memory (that the kernel never writes memory that is gone is the slots'
  # rules), and LeakSanitizer what is never freed. The test that no sync
  # primitive makes a system call is left out: the sanitizer's runtime
  # makes its own.
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: tests on io_uring
        run: cargo test -p nuclei --target x86_64-unknown-linux-gnu --no-fail-fast -- --skip hot_loops_make_no_system_call_but_sched_yield

      - name: tests on epoll
        run: cargo test -p nuclei --target x86_64-unknown-linux-gnu --no-fail-fast -- --skip hot_loops_make_no_system_call_but_sched_yield
        env:
          NUCLEI_BACKEND: epoll

  # The loom models: every interleaving each model reaches within its preemption bound, of the
  # runtime's task, park handshake and IO source sides, and of the sync primitives. The commands
  # are the ones the models' own docs give; the long models marked ignored stay a local run.
  loom:
    name: Loom models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: the runtime's models
        run: cargo test --release -p nuclei --lib -- rt::task::loom_tests rt::handshake::loom_tests io::side::loom_tests

      - name: the sync models
        run: cargo test --release -p nuclei --lib -- sync::loom_tests

  # The io_uring probe in each sandbox it meets (benches/reference/probe-matrix.sh): the plain
  # host, systemd units that kill or deny the io_uring calls, Docker's default seccomp profile
  # and unconfined, and the io_uring_disabled sysctl; each must report what that sandbox gives.
  probe_matrix:
    name: The io_uring probe in each sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: probe matrix
        run: bash benches/reference/probe-matrix.sh
        env:
          PROBE_SYSTEMD_RUN: sudo systemd-run
          PROBE_SYSCTL: "1"

  # Instructions per operation of each runtime row (ci/op_count), counted under cachegrind
  # because the runners have no hardware counters, against ci/op_budget.txt: a change that
  # makes an operation cost more user-space instructions fails here. The budgets are this
  # runner's counts (the C library picks its copy routines per CPU model).
  op_counts:
    name: Op counts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # The budgets hold for one compiler: its inlining moves rows. This is the latest stable.
      - name: compiler
        run: rustc -Vv

      - name: op counts
        run: bash ci/op_counts.sh

  check_fmt_and_docs:
    name: Checking fmt and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-pc-windows-msvc, x86_64-unknown-freebsd

      - name: fmt
        run: cargo fmt --all -- --check

      # Every feature on, `io-stats` and `recycle` included.
      - name: clippy
        run: cargo clippy --all --all-targets --all-features -- -D warnings

      # The other systems' code, checked from here with nothing linked: their own jobs build and
      # test it but do not lint it. The crates only, as the examples and benches pull in C
      # libraries that do not cross-build.
      - name: clippy for macOS, Windows and FreeBSD
        run: |
          for target in aarch64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-freebsd; do
            cargo clippy -p nuclei -p nuclei-macros --target "$target" --lib --tests --all-features -- -D warnings
          done

      # Doc warnings stay visible but not fatal while the legacy runtime is
      # in the tree; it is on its way out and its doc nits go with it.
      - name: doc
        run: cargo doc
