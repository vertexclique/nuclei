name: Pages

# The site is the static site/ folder, published as it is but for its version placeholders,
# which the deploy fills from Cargo.toml (no other build step). It deploys on a push that
# touches it or Cargo.toml, on master and on the 0.5 branch, and by hand.
on:
  push:
    branches: [master, modernize-2026]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # A version bump redeploys, so the site shows the new version.
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The site never states a version by hand. Its files hold placeholders, and this step fills
      # them from Cargo.toml in the copy that is deployed (the committed files keep the
      # placeholders), so a version bump needs no edit to the site:
      #   @@NUCLEI_MINOR@@  major.minor of [package] version, what a dependency line asks for ("0.5")
      #   @@RUST_VERSION@@  [package] rust-version, the minimum Rust ("1.99")
      # The deploy stops if Cargo.toml lacks a value or a placeholder is left unfilled.
      - name: Fill in the version from Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          rust=$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          minor=$(printf '%s' "$version" | cut -d . -f 1,2)
          if [ -z "$version" ] || [ -z "$rust" ] || [ -z "$minor" ]; then
            echo "Cargo.toml gave no version or rust-version" >&2
            exit 1
          fi
          echo "nuclei $version (dependency line $minor), Rust $rust"
          grep -rlIZ -e '@@NUCLEI_MINOR@@' -e '@@RUST_VERSION@@' site \
            | xargs -0 -r sed -i -e "s/@@NUCLEI_MINOR@@/$minor/g" -e "s/@@RUST_VERSION@@/$rust/g"
          if grep -rnI '@@[A-Z_]*@@' site; then
            echo "a placeholder above was left unfilled" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
