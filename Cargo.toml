[package]
name = "nuclei"
version = "0.5.0"
authors = ["Mahmut Bulut <vertexclique@gmail.com>"]
edition = "2024"
rust-version = "1.90"
description = "Proactive IO & runtime system"
keywords = ["io", "async", "uring", "iouring", "proactor"]
categories = ["concurrency", "asynchronous"]
homepage = "https://github.com/vertexclique/nuclei"
repository = "https://github.com/vertexclique/nuclei"
documentation = "https://docs.rs/nuclei"
license = "Apache-2.0/MIT"
readme = "README.md"
exclude = [
    "data/*",
	".github/*",
	"examples/*",
	"graphstore/*",
	"tests/*",
	"img/*",
	"ci/*",
	"benches/*",
	"doc/*",
	"docs/*",
	"*.png",
	"*.dot",
	"*.yml",
	"*.toml",
	"*.md"
]
autoexamples = false


[features]
default = ["iouring", "epoll", "attributes"]
# The kernel interfaces nuclei may use on Linux; both on by default, and the
# runtime picks the one the machine offers.
epoll = []
iouring = []

# `#[nuclei::main]`, `#[nuclei::test]` and `#[nuclei::bench]`.
attributes = ["nuclei-macros"]

# Node memory from kovan's per-thread magazine cache over a slab layer, instead of the global
# allocator. Off by default and meant for applications: cargo turns a feature on for every user
# of a crate in the build, so a library that enabled it would enable it for all of them.
recycle = ["kovan/recycle", "kovan-channel/recycle", "kovan-map/recycle", "kovan-queue/recycle"]

[dependencies]
nuclei-macros = { version = "0.5.0", path = "nuclei-macros", optional = true }
futures-io = "0.3"
futures-core = { version = "0.3", default-features = false }
kovan = "0.2"
kovan-channel = "0.2"
kovan-map = "0.2"
kovan-queue = "0.2"

[target.'cfg(target_family = "unix")'.dependencies]
libc = { version = "0.2" }

# `--cfg loom` swaps the sync module's atomics and cells for loom's mocks.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

# `#[nuclei::main]` run as a program of its own.
[[test]]
name = "macros_main"
harness = false

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "sync_new"
harness = false

[[bench]]
name = "sync_mpsc"
harness = false

# Declaring `loom` keeps `unexpected_cfgs` quiet in the ordinary build
# without turning the lint off.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(nuclei_nightly)'] }


[workspace]
members = [
  ".",
  "examples",
  "nuclei-macros",
]
