[package]
name = "nuclei"
version = "0.4.3"
authors = ["Mahmut Bulut <vertexclique@gmail.com>"]
edition = "2024"
rust-version = "1.90"
description = "Proactive IO & runtime system"
keywords = ["io", "async", "uring", "iouring", "proactor"]
categories = ["concurrency", "asynchronous"]
homepage = "https://github.com/vertexclique/nuclei"
repository = "https://github.com/vertexclique/nuclei"
documentation = "https://docs.rs/nuclei"
license = "Apache-2.0/MIT"
readme = "README.md"
exclude = [
    "data/*",
	".github/*",
	"examples/*",
	"graphstore/*",
	"tests/*",
	"img/*",
	"ci/*",
	"benches/*",
	"doc/*",
	"docs/*",
	"*.png",
	"*.dot",
	"*.yml",
	"*.toml",
	"*.md"
]
autoexamples = false


[features]
default = ["async-exec", "iouring", "attributes"]
# Devs should enable these features to use iouring on linux.
#default = ["asyncstd", "iouring"]
epoll = []
iouring = ["rustix-uring", "rustix"]

async-exec = ["async-global-executor"]

attributes = ["nuclei-attributes"]

# Node memory from kovan's per-thread magazine cache over a slab layer, instead of the global
# allocator. Off by default and meant for applications: cargo turns a feature on for every user
# of a crate in the build, so a library that enabled it would enable it for all of them.
recycle = ["kovan/recycle", "kovan-map/recycle", "kovan-queue/recycle"]

[dependencies]
nuclei-attributes = { version = "0.1", optional = true }
lever = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
socket2 = { version = "0.3.19", features = ["pair", "unix"] }
pin-utils = "0.1.0"
pin-project-lite = "0.2"
crossbeam-channel = "0.5"
once_cell = "1.19.0"
os_socketaddr = "0.2.5"
ahash = "0.8.7"
kovan = "0.2"
kovan-map = "0.2"
kovan-queue = "0.2"

# vertexia: the executor stack has its own `cfg(loom)` paths and cannot build under `--cfg loom`;
# see src/lib.rs.
[target.'cfg(not(loom))'.dependencies]
async-global-executor = { version = "2.4", optional = true, features = ["async-io"] }

# Other backends
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38", optional = true }
rustix-uring = { version = "0.2.0", optional = true }

[target.'cfg(target_family = "unix")'.dependencies]
libc = { version = "0.2" }

# `--cfg loom` swaps the sync module's atomics and cells for loom's mocks.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "sync_new"
harness = false

[[bench]]
name = "sync_mpsc"
harness = false

# Declaring `loom` keeps `unexpected_cfgs` quiet in the ordinary build
# without turning the lint off.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }


[workspace]
members = [
  ".",
  "examples",
  "nuclei-macros",
]
