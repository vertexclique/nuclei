[package]
name = "echo"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nuclei = { path = "../..", default-features = false, features = ["iouring", "epoll"] }
monoio = "0.2"
glommio = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time"] }
futures-lite = "2"
socket2 = "0.6"
hdrhistogram = "7"
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
