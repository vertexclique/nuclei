[package]
name = "nuclei-macros"
version = "0.5.0"
authors = ["Mahmut Bulut <vertexclique@gmail.com>"]
edition = "2024"
rust-version = "1.99"
description = "Attribute macros for the nuclei runtime"
keywords = ["io", "async", "uring", "iouring", "proactor"]
categories = ["concurrency", "asynchronous"]
repository = "https://github.com/vertexclique/nuclei"
documentation = "https://docs.rs/nuclei"
license = "Apache-2.0/MIT"
autotests = false

[lib]
proc-macro = true

# The doc examples use the macros through the runtime that re-exports them.
[dev-dependencies]
nuclei = { path = ".." }
