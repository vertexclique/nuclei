\* The side takes connections ahead and then meets the listener's other error: the stream yields what it took
\* first, then ends on the error, with nothing left queued, and accepts nothing after.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make
    Outages = 1          \* times the descriptors run out
    MaxDelay = 2         \* the longest pause, in ticks
    Resets = 0           \* no peer resets its connection
    Other = TRUE         \* the listener fails once with another error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux)
    Ahead = TRUE         \* the side takes connections ahead, then keeps its error
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    EndsOnlyForOther
    NoneLeftQueued
PROPERTIES                     \* must hold over every behaviour
    OtherEnds
    NothingAfterEnd
