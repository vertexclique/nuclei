\* macOS: three connections and two outages, pauses up to four ticks, and an accept that fails for want of a descriptor
\* closes the connection it took. The side checks for a free descriptor before the next accept, so each outage costs at
\* most the one connection its first failed accept took, and every other connection is served once descriptors are free.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 3                \* connections the peers make
    Outages = 2          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Resets = 0           \* no peer resets its connection
    Other = FALSE        \* no other error
    Drops = TRUE         \* a failed accept closes the connection it took (macOS)
    Ahead = FALSE        \* the stream's polls accept one at a time
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    FirstWaitLeast
    LostPerOutage
    EndsOnlyForOther
PROPERTIES                     \* must hold over every behaviour
    AllServed
    NothingAfterEnd
