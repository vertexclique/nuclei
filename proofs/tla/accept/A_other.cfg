\* An outage and then another error of the listener: the other error ends the stream, which accepts nothing after.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make
    Outages = 1          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Resets = 0           \* no peer resets its connection
    Other = TRUE         \* the listener fails once with another error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux, the BSDs)
    Ahead = FALSE        \* the stream's polls accept one at a time
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    FirstWaitLeast
    LostPerOutage
    EndsOnlyForOther
PROPERTIES                     \* must hold over every behaviour
    OtherEnds
    NothingAfterEnd
