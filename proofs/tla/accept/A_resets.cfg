\* Two connections their peers keep and two they reset while they wait in the backlog, in any order, and an outage of
\* descriptors: each reset one is skipped and the stream asks again at once, so every kept connection is served, the
\* stream never ends, and the pauses keep their rules.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make and keep
    Outages = 1          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Resets = 2           \* connections the peers reset in the backlog
    Other = FALSE        \* no other error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux, the BSDs)
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    FirstWaitLeast
    LostPerOutage
    EndsOnlyForOther
PROPERTIES                     \* must hold over every behaviour
    AllServed
    NothingAfterEnd
