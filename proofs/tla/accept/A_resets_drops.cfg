\* macOS: two kept connections, one reset, and an outage in which a failed accept closes the connection it took, which
\* may be the reset one: every kept connection is served or closed by that accept, and no more are closed than outages.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make and keep
    Outages = 1          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Resets = 1           \* connections the peers reset in the backlog
    Other = FALSE        \* no other error
    Drops = TRUE         \* a failed accept closes the connection it took (macOS)
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    FirstWaitLeast
    LostPerOutage
    EndsOnlyForOther
PROPERTIES                     \* must hold over every behaviour
    AllServed
    NothingAfterEnd
