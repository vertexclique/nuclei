\* A reset connection and then the listener's own error: the reset one is skipped, and the listener's error still ends
\* the stream, which accepts nothing after.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 1                \* connections the peers make and keep
    Outages = 0          \* the descriptors never run out
    MaxDelay = 4         \* the longest pause, in ticks
    Resets = 1           \* connections the peers reset in the backlog
    Other = TRUE         \* the listener fails once with another error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux, the BSDs)
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    LostPerOutage
    EndsOnlyForOther
PROPERTIES                     \* must hold over every behaviour
    OtherEnds
    NothingAfterEnd
