\* A ring's multishot accept (`Ahead`): three connections and one outage of descriptors. The accept takes what
\* comes into the side's queue and ends with EMFILE when the descriptors run out; the stream yields the queued
\* connections first, then pauses, and its next poll asks for another accept: no busy loop, the first pause after
\* an accept the least, nothing left queued, and the whole backlog served once descriptors are free again.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 3                \* connections the peers make
    Outages = 1          \* times the descriptors run out
    MaxDelay = 2         \* the longest pause, in ticks
    Resets = 0           \* Linux hands a reset connection over as it is
    Other = FALSE        \* no other error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux)
    Ahead = TRUE         \* the side takes connections ahead, then keeps its error
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    FirstWaitLeast
    EndsOnlyForOther
    NoneLeftQueued
PROPERTIES                     \* must hold over every behaviour
    AllServed
