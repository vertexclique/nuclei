\* Two connections and two outages of descriptors, pauses of one up to four ticks: no busy loop, the first pause after an
\* accept the least, and the whole backlog served once descriptors are free again.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make
    Outages = 2          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Other = FALSE        \* no other error
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
    FirstWaitLeast
PROPERTIES                     \* must hold over every behaviour
    AllServed
    NothingAfterEnd
