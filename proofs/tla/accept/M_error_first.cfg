\* MUTATION error_first: the side hands the error it met over before the connections it took ahead of it; the
\* listener's other error ends the stream with those connections still queued, never yielded, closed when the
\* stream drops. Expected: NoneLeftQueued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make
    Outages = 0          \* the descriptors never run out
    MaxDelay = 2         \* the longest pause, in ticks
    Resets = 0           \* no peer resets its connection
    Other = TRUE         \* the listener fails once with another error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux)
    Ahead = TRUE         \* the side takes connections ahead, then keeps its error
    Mutation = "error_first"
INVARIANTS                     \* must hold in every reachable state
    NoneLeftQueued
