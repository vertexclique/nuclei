\* MUTATION no_backoff: the stream asks the listener again at once after EMFILE, with no timer. It asks twice with no tick
\* between while the descriptors are still out: a busy loop. Expected: NoBusyLoop broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make
    Outages = 1          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Other = FALSE        \* no other error
    Mutation = "no_backoff"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoBusyLoop
