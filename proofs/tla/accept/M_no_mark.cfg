\* MUTATION no_mark: an accept that failed for want of a descriptor leaves the side checking nothing, so the retry
\* accepts with no check and closes a second connection in the same outage. Expected: LostPerOutage broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 3                \* connections the peers make
    Outages = 1          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Other = FALSE        \* no other error
    Drops = TRUE         \* a failed accept closes the connection it took (macOS)
    Mutation = "no_mark" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    LostPerOutage
