\* MUTATION no_probe: on macOS the stream's retry accepts at once, with no check for a free descriptor first, as it did
\* before. Every retry while the descriptors are out closes one more connection of the backlog, so one outage costs two
\* (the hang the stream met on macOS: its retries closed the whole backlog). Expected: LostPerOutage broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 3                \* connections the peers make
    Outages = 1          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Other = FALSE        \* no other error
    Drops = TRUE         \* a failed accept closes the connection it took (macOS)
    Mutation = "no_probe"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    LostPerOutage
