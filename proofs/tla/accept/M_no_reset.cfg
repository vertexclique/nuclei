\* MUTATION no_reset: the pause does not start over after an accept. After one outage grew it, the first pause of the next
\* outage is longer than the least, so a server waits up to the most for a backlog it could take at once.
\* Expected: FirstWaitLeast broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 2                \* connections the peers make
    Outages = 2          \* times the descriptors run out
    MaxDelay = 4         \* the longest pause, in ticks
    Other = FALSE        \* no other error
    Mutation = "no_reset"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    FirstWaitLeast
