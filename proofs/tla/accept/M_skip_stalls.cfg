\* MUTATION skip_stalls: the side drops the reset connection's error but asks the listener nothing more, so the poll
\* waits for another connection to come (the next edge, or an accept issued for it). When the reset one came last, none
\* comes, and the kept connection ahead of it waits in the backlog for good. Expected: AllServed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 1                \* connections the peers make and keep
    Outages = 0          \* the descriptors never run out
    MaxDelay = 4         \* the longest pause, in ticks
    Resets = 1           \* connections the peers reset in the backlog
    Other = FALSE        \* no other error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux, the BSDs)
    Mutation = "skip_stalls"\* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllServed
