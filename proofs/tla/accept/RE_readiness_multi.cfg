\* `accept_multi`'s stream on epoll and kqueue, a reset connection and the listener's own error: the reset one is
\* skipped and the listener's error reaches the task: the stream ends with it, and `take_error` says what it was.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and reset
    ListenerErr = TRUE   \* the listener fails once with its own error
    Backend = "readiness" \* epoll and kqueue
    Form = "multi"       \* `accept_multi`'s stream
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoLostToCaller
PROPERTIES                     \* must hold over every behaviour
    ErrSurfaces
