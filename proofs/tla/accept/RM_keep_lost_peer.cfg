\* MUTATION keep_lost_peer: a plain accept that finds a multishot accept's connection reset (its peer ENOTCONN) returns
\* that error, as it did before. Expected: NoLostToCaller broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and reset
    ListenerErr = FALSE  \* the listener has no error of its own
    NetErr = FALSE       \* a lost connection answers a reset's error
    Backend = "multishot" \* io_uring's multishot accept
    Form = "accept"      \* `accept` (and `incoming`)
    Mutation = "keep_lost_peer" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoLostToCaller
