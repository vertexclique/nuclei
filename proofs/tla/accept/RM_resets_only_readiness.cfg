\* MUTATION resets_only (the code before): the classifier knows only a reset's errors, so a connection's network
\* error on Linux is taken for the listener's: `accept` returns it to the task. Expected: NoLostToCaller broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and lose
    ListenerErr = FALSE
    NetErr = TRUE
    Backend = "readiness"
    Form = "accept"
    Mutation = "resets_only"
INVARIANTS                     \* must hold in every reachable state
    NoLostToCaller
