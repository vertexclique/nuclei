\* MUTATION skip_listener: a multishot accept's end with the listener's own error is skipped as a reset connection's,
\* so the stream never ends with it. Expected: ErrSurfaces broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 0           \* connections the peers make and reset
    ListenerErr = TRUE   \* the listener fails once with its own error
    Backend = "multishot" \* io_uring's multishot accept
    Form = "multi"       \* `accept_multi`'s stream
    Mutation = "skip_listener" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    ErrSurfaces
