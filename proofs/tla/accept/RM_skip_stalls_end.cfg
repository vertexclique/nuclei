\* MUTATION skip_stalls: a multishot accept that ends with a reset connection's error wakes nobody, so the stream's
\* task waits with no accept out, and the kept connection waits in the backlog for good. Expected: AllKeptServed
\* broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and reset
    ListenerErr = FALSE  \* the listener has no error of its own
    Backend = "multishot" \* io_uring's multishot accept
    Form = "multi"       \* `accept_multi`'s stream
    Mutation = "skip_stalls" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllKeptServed
