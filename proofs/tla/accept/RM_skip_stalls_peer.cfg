\* MUTATION skip_stalls: a plain accept that skips a multishot accept's reset connection looks only at what the side
\* holds, and sends no accept once the multishot one ended: the task waits with nothing out, and the kept connection
\* waits in the backlog for good. Expected: AllKeptServed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 2           \* connections the peers make and reset
    ListenerErr = FALSE  \* the listener has no error of its own
    Backend = "multishot" \* io_uring's multishot accept
    Form = "accept"      \* `accept` (and `incoming`)
    Mutation = "skip_stalls" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllKeptServed
