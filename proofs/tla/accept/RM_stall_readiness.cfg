\* MUTATION stall_ahead: a readiness side's loop that meets a reset connection stops with nothing held, no error, and
\* the listener not marked blocked: the edge that brought both connections is spent, no other comes, and the kept
\* connection waits in the backlog for good. Expected: AllKeptServed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and reset
    ListenerErr = FALSE  \* the listener has no error of its own
    NetErr = FALSE       \* a lost connection answers a reset's error
    Backend = "readiness" \* epoll and kqueue
    Form = "multi"       \* `accept_multi`'s stream
    Mutation = "stall_ahead" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllKeptServed
