\* MUTATION uncounted_op: a completed accept's lost connection is skipped and not counted (IOCP, io_uring's single
\* accept). Expected: SkipsCounted broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and lose
    ListenerErr = FALSE
    NetErr = FALSE
    Backend = "completion"
    Form = "accept"
    Mutation = "uncounted_op"
INVARIANTS                     \* must hold in every reachable state
    SkipsCounted
