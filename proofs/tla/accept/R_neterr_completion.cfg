\* `accept_multi` on io_uring's single accept: a connection's network error is skipped and counted, and the stream goes
\* on to serve the kept one.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and lose
    ListenerErr = FALSE
    NetErr = TRUE
    Backend = "completion"
    Form = "multi"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLostToCaller
    SkipsCounted
PROPERTIES                     \* must hold over every behaviour
    AllKeptServed
