\* `accept_multi` on io_uring's multishot accept: one that ends with a connection's network error is armed again, the
\* skip counted, and the kept connection served.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and lose
    ListenerErr = FALSE
    NetErr = TRUE
    Backend = "multishot"
    Form = "multi"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLostToCaller
    SkipsCounted
PROPERTIES                     \* must hold over every behaviour
    AllKeptServed
