\* `accept` on epoll: a connection lost before it is accepted answers one of Linux's network errors (EPROTO,
\* ENETDOWN...): it is the connection's, skipped and counted, and the kept one is served.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 1           \* connections the peers make and lose
    ListenerErr = FALSE
    NetErr = TRUE
    Backend = "readiness"
    Form = "accept"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLostToCaller
    SkipsCounted
PROPERTIES                     \* must hold over every behaviour
    AllKeptServed
