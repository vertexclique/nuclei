\* `accept` (and `incoming`) on epoll and kqueue: one kept connection and two its peers reset before, during or after
\* an accept takes them. Each reset one is skipped or handed over as it is, the kept one is served, and the task never
\* sees a reset one's error.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waits for connections for good once it served them
CONSTANTS
    Kept = 1             \* connections the peers make and keep
    Doomed = 2           \* connections the peers make and reset
    ListenerErr = FALSE  \* the listener has no error of its own
    Backend = "readiness" \* epoll and kqueue
    Form = "accept"      \* `accept` (and `incoming`)
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoLostToCaller
PROPERTIES                     \* must hold over every behaviour
    AllKeptServed
