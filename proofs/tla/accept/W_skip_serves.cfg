\* WITNESS: a peer resets its connection in the backlog, the side skips its error, and the next accept takes the kept
\* connection behind it. Expected: NoSkipServes broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stream waits for connections for good once it served them
CONSTANTS
    N = 1                \* connections the peers make and keep
    Outages = 0          \* the descriptors never run out
    MaxDelay = 4         \* the longest pause, in ticks
    Resets = 1           \* connections the peers reset in the backlog
    Other = FALSE        \* no other error
    Drops = FALSE        \* a failed accept leaves the connection in the backlog (Linux, the BSDs)
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoSkipServes
