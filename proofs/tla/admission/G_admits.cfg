\* GREEN: both guards on. A small queue gets a group of half its size and the cap stays at half;
\* long-lived operations of every kind are not counted, so a finite one waits only while a finite one is in the kernel.
SPECIFICATION Spec              \* the algorithm, the ring weakly fair
CHECK_DEADLOCK FALSE           \* a ring that waits for the next event is not a deadlock
CONSTANTS
    C = 4                  \* completion queue slots (a small ring)
    G = 8                  \* buffers the configuration asks for: more than the queue holds
    MaxLong = 3            \* long-lived operations at most
    MaxFin = 3             \* finite operations at most
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoRoomDeadlock
    CqNeverOverfull
