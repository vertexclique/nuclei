\* GREEN: a kernel that ends a poll whose edge finds the queue full drops that end for want of memory. The shard,
\* told of the drop, cancels every operation it has out, each still in the kernel ending with the cancel and its
\* side arming another, then sweeps what never ended: the lost poll ends for its side with an error and its side
\* arms another too. No poll waits for good, the sweep ends none the kernel still holds, and every drop is counted.
SPECIFICATION Spec              \* the algorithm, the ring and the sides weakly fair
CHECK_DEADLOCK FALSE           \* a ring that waits for the next event is not a deadlock
CONSTANTS
    C = 4                  \* completion queue slots (a small ring)
    G = 8                  \* buffers the configuration asks for: more than the queue holds
    MaxLong = 1            \* long-lived operations at most
    MaxFin = 2             \* finite operations at most
    Polls = 2              \* two sides keep a multishot poll armed
    MaxEdges = 3           \* edges their polls bring
    MaxCancel = 0          \* cancels of the ring's own
    Kernel = "ends"
    AllocFails = TRUE      \* an entry past the queue may be dropped for want of memory
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoRoomDeadlock
    CqNeverOverfull
    ShardLives
    NoFalseSweep
PROPERTIES                     \* must hold over every behaviour
    DropsCounted
    DroppedRecovered
    EndedRearmed
