\* GREEN: two sides that read by readiness keep a multishot poll armed beside the cap's operations, and the ring
\* cancels one of its operations. Their entries have no room kept: a poll's edge that finds the queue full ends
\* the poll, and the side arms another; the cap still keeps room for the arrivals and the finite completions,
\* and a finite operation waits only while a finite one is in the kernel.
SPECIFICATION Spec              \* the algorithm, the ring and the sides weakly fair
CHECK_DEADLOCK FALSE           \* a ring that waits for the next event is not a deadlock
CONSTANTS
    C = 4                  \* completion queue slots (a small ring)
    G = 8                  \* buffers the configuration asks for: more than the queue holds
    MaxLong = 1            \* long-lived operations at most
    MaxFin = 2             \* finite operations at most
    Polls = 2              \* two sides keep a multishot poll armed
    MaxEdges = 4           \* edges their polls bring
    MaxCancel = 1          \* one cancel of the ring's own
    Kernel = "ends"        \* an edge into a full queue ends its poll
    AllocFails = FALSE     \* the kernel always has memory for an entry past the queue
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoRoomDeadlock
    CqNeverOverfull
PROPERTIES                     \* must hold over every behaviour
    EndedRearmed
