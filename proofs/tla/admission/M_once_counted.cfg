\* RED: counts one-shot long-lived operations (a receive into a buffer, a poll for bytes, an accept), as the ring did
\* before. Idle receives use up the cap; a send or the next accept waits in room behind them for good. Expected: NoRoomDeadlock broken.
SPECIFICATION Spec              \* the algorithm, the ring weakly fair
CHECK_DEADLOCK FALSE           \* a ring that waits for the next event is not a deadlock
CONSTANTS
    C = 4                  \* completion queue slots (a small ring)
    G = 8                  \* buffers the configuration asks for: more than the queue holds
    MaxLong = 3            \* long-lived operations at most
    MaxFin = 3             \* finite operations at most
    Mode = "once_counted"
INVARIANTS                     \* must hold in every reachable state
    NoRoomDeadlock
