\* Edges, two tasks on one descriptor, three writes: every byte is taken, and a clear made while the
\* other task's look holds the side is kept, so no task finds the side ready with no edge since its clear.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Writes = 3                 \* bytes the peer writes
    Ring = FALSE               \* epoll's and kqueue's edges
    Tasks = 2                  \* two tasks look and call
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousReady
    Counted
PROPERTIES                     \* must hold over every behaviour
    AllTaken
