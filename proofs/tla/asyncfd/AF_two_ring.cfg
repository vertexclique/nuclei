\* io_uring's armed poll, two tasks, two writes: as AF_two, with the poll's completions as the edges.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Writes = 2                 \* bytes the peer writes
    Ring = TRUE                \* a ring's poll, armed while a task waits
    Tasks = 2                  \* two tasks look and call
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousReady
    Counted
PROPERTIES                     \* must hold over every behaviour
    AllTaken
