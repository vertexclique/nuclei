\* io_uring, a stream read by readiness: the handle's read takes one byte from the socket with its multishot poll
\* armed; the switch stops the poll, whose end brings nothing, and the caller's calls take every byte once, in
\* the order written.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Writes = 3                 \* bytes the peer writes
    Ring = TRUE                \* io_uring
    FirstRead = "ready"        \* the ring's stream read by readiness, its poll armed
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    InOrder
PROPERTIES                     \* must hold over every behaviour
    AllTaken
