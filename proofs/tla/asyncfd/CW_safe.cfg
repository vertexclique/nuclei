\* Four bytes behind, three of the task's own: the socket gets them once, in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Behind = 4
    Own = 3
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OutOrder
