\* A socket that holds one unread byte: the task's sends wait for each of the peer's reads, and every byte goes
\* out once, in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Behind = 2                 \* bytes written through the handle
    Own = 3                    \* bytes of the task's own
    Room = 1                   \* the socket holds one unread byte
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OutOrder
PROPERTIES                     \* must hold over every behaviour
    AllOut
