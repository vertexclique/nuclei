\* MUTATION clear_last_wins: of two clears left while a third task holds the side, the one left last is kept,
\* though it is of a look an edge came after; the newer one, which could still clear, is lost, and its task
\* finds the side ready with no edge since its clear. Expected: NoSpuriousReady broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* safety only
CONSTANTS
    Writes = 2                 \* bytes the peer writes
    Ring = FALSE               \* epoll's and kqueue's edges
    Tasks = 3                  \* three tasks look and call
    Mutation = "clear_last_wins"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousReady
