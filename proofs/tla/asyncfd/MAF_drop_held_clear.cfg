\* MUTATION drop_held_clear (the code before the fix): a clear is a poll of the side, which finds the side held
\* by the other task's look and is lost. The task then finds the side ready though no edge came since its clear,
\* calls, finds nothing and spins. Expected: NoSpuriousReady broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* safety only
CONSTANTS
    Writes = 2                 \* bytes the peer writes
    Ring = FALSE               \* epoll's and kqueue's edges
    Tasks = 2                  \* two tasks look and call
    Mutation = "drop_held_clear"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousReady
