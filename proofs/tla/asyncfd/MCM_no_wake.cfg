\* MUTATION no_wake: a stopped receive ends with the side ready, and nobody wakes the waiting caller. Expected: AllTaken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Writes = 3
    Ring = TRUE
    Mutation = "no_wake"
PROPERTIES                     \* must hold over every behaviour
    AllTaken
