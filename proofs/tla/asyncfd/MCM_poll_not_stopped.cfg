\* MUTATION poll_not_stopped: the switch to the caller's calls stops a receive but leaves the stream's multishot
\* poll armed; the caller's call waits for the driver's operation to end, and a poll that stays armed never
\* does. Expected: AllTaken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Writes = 2                 \* bytes the peer writes
    Ring = TRUE                \* io_uring
    FirstRead = "ready"        \* the ring's stream read by readiness, its poll armed
    Mutation = "poll_not_stopped"
PROPERTIES                     \* must hold over every behaviour
    AllTaken
