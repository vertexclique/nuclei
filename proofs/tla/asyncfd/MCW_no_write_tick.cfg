\* MUTATION no_write_tick: a send that would block clears the side without looking at the count; the peer's read
\* between the call and the clear brought the only edge, and the task waits for good with room in the socket.
\* Expected: AllOut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the liveness property catches
CONSTANTS
    Behind = 1                 \* one byte written through the handle
    Own = 2                    \* two of the task's own
    Room = 1                   \* the socket holds one unread byte
    Mutation = "no_write_tick"
PROPERTIES                     \* must hold over every behaviour
    AllOut
