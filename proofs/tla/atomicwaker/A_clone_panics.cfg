\* One task whose first clone of its waker panics while it holds REGISTERING, against two
\* threads that set its event and wake the cell at once (one of them may meet the registration
\* that panics): the guard gives the word back, so the cell recovers, the slot has one party at a
\* time, and the task ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1"}
    Wakers = {"k1", "k2"}
    Displacing = FALSE
    ClonePanics = {"t1"}        \* t1's first clone panics
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotExclusive
    SelfWoken
    TakeLowersOnlyItsBit
PROPERTIES                     \* must hold over every behaviour
    AllEnd
    Recovers
