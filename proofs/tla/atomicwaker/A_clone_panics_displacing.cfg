\* Two tasks sharing a displacing cell, the second's first clone panicking while the first may be
\* registered: the guard leaves the first one's waker in the slot (or has it woken, when a wake met
\* the registration), so neither sleeps for good, and the cell recovers.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1", "t2"}
    Wakers = {"k1"}
    Displacing = TRUE
    ClonePanics = {"t2"}        \* t2's first clone panics
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotExclusive
    SelfWoken
    TakeLowersOnlyItsBit
PROPERTIES                     \* must hold over every behaviour
    AllEnd
    Recovers
