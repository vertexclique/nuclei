\* One task registers (and again after each wake) against two threads that set its event
\* and wake the cell at once: the slot has one party at a time, a take only ever lowers
\* its own bit, and the task always ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1"}
    Wakers = {"k1", "k2"}
    Displacing = FALSE
    ClonePanics = {}
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotExclusive
    SelfWoken
    TakeLowersOnlyItsBit
PROPERTIES                     \* must hold over every behaviour
    AllEnd
