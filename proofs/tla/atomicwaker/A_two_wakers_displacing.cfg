\* The same against two wakes at once, a take meeting another take and either meeting a
\* registration.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1", "t2"}
    Wakers = {"k1", "k2"}
    Displacing = TRUE
    ClonePanics = {}
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotExclusive
    SelfWoken
PROPERTIES                     \* must hold over every behaviour
    AllEnd
