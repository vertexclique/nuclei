\* MUTATION clone_unguarded: no guard around the clone. A clone that panics leaves REGISTERING up
\* for good: every later registration finds the cell in use and wakes itself at once (a busy
\* loop), and every take finds it in use and takes nothing. Expected: Recovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1"}
    Wakers = {"k1"}
    Displacing = FALSE
    ClonePanics = {"t1"}        \* t1's first clone panics
    Mutation = "clone_unguarded"
PROPERTIES                     \* must hold over every behaviour
    Recovers
