\* MUTATION failure_path_drops_displaced: a displacing registration that a wake met drops
\* the waker it replaced. That waker's task was registered and asleep, and nothing else
\* will wake it. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1", "t2"}
    Wakers = {"k1"}
    Displacing = TRUE
    Mutation = "failure_path_drops_displaced"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
