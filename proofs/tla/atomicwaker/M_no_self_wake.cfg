\* MUTATION no_self_wake: a registration that finds a take in progress does not wake its
\* own waker: the cell owes it the wake of the take, which found the slot empty, and a
\* caller that does not look again would miss it. Expected: SelfWoken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1"}
    Wakers = {"k1"}
    Displacing = FALSE
    Mutation = "no_self_wake"
INVARIANTS                     \* must hold in every reachable state
    SelfWoken
