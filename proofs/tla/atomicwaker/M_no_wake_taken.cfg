\* MUTATION no_wake_taken: a registration that a wake met takes its waker back out without
\* waking it; the wake took nothing, so the wake is lost to a caller that does not look
\* again. Expected: SelfWoken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Tasks = {"t1"}
    Wakers = {"k1"}
    Displacing = FALSE
    Mutation = "no_wake_taken"
INVARIANTS                     \* must hold in every reachable state
    SelfWoken
