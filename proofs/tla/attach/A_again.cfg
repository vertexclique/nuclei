\* An attach off the ring's thread and an evict, after which the source attaches to shard B
\* under a token of the same number, in every order: every safety property, and every thread
\* finishes.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Close = FALSE
    Evict = TRUE
    Again = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLeak
    TableFollows
    NoForeignSlot
PROPERTIES                     \* must hold over every behaviour
    Termination
