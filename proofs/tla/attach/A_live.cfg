\* Liveness: under weak fairness every thread finishes, the ring's mailbox empties and every
\* request is performed.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    Close = TRUE         \* the handle closes
    Evict = TRUE         \* the shard evicts the source
    Again = FALSE        \* no attach to B
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
