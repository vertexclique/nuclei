\* MUTATION attach_closed: `attach_now` does not refuse a handle that closed. The attach comes after the close,
\* with the descriptor out of the source, and the ring puts the file of a closed descriptor (whose number another
\* file may have taken) into its table. Expected: NoClosedInstall broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Close = TRUE         \* the handle closes
    Evict = FALSE        \* no evict
    Again = FALSE        \* no attach to B
    Mutation = "attach_closed"
INVARIANTS                     \* must hold in every reachable state
    NoClosedInstall
