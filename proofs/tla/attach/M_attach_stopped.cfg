\* MUTATION attach_stopped: `attach_now` does not refuse a shard that stopped. The attach lands after the shard
\* evicted its sources, the ring installs it, and the source stays registered with a shard that is going away.
\* Expected: NoLeak broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Close = FALSE        \* the handle stays open
    Evict = TRUE         \* the shard evicts the source
    Again = FALSE        \* no attach to B
    Mutation = "attach_stopped"
INVARIANTS                     \* must hold in every reachable state
    NoLeak
