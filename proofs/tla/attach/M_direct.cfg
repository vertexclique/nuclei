\* MUTATION direct: the ring's thread writes the registration itself after its look, without
\* the sides, as the code did before. Expected: a close between the look and the write leaves the
\* file in the table (NoLeak broken).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Close = TRUE         \* the handle closes
    Evict = FALSE        \* no evict
    Again = FALSE        \* no attach to B
    Mutation = "direct"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoLeak
