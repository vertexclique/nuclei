\* MUTATION evict_keeps_slot: the evict of a registered source posts no detach to the ring, so the ring's table
\* keeps the slot of a source no longer registered with it. Expected: TableFollows broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Close = FALSE        \* the handle stays open
    Evict = TRUE         \* the shard evicts the source
    Again = FALSE        \* no attach to B
    Mutation = "evict_keeps_slot"
INVARIANTS                     \* must hold in every reachable state
    TableFollows
