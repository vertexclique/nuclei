\* MUTATION no_lease: the attach posted to the ring holds no lease on the handle's object, so a close between the
\* ring's look and its install closes the descriptor, and the ring puts the file of a closed (or reused) number into
\* its table. Expected: NoClosedInstall broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Close = TRUE         \* the handle closes
    Evict = FALSE        \* no evict
    Again = FALSE        \* no attach to B
    Mutation = "no_lease"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoClosedInstall
