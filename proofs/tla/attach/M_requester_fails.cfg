\* MUTATION requester_fails: the shard's posted attach comes after the retire, is refused for the missing descriptor, and the shard takes the refusal for a registration's failure, left for the sides (the code before the fix). Expected: the owner's first read after get_mut answers it on a valid handle (NoSpuriousError broken).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Posted = TRUE        \* the registering thread runs no shard: a shard asks the attach later
    Mutation = "requester_fails"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousError
