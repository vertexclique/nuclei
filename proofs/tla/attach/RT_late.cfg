\* A read from a thread that runs no shard while the registration finishes, in every order: one submit for the waiter,
\* and no deadlock (the read is served even when the registration lands between its route and its step).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Registered = FALSE   \* the registration is still under way when the read comes
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    OneSubmit
