\* A read from the thread of another shard, which runs a ring of its own, with the registration in
\* place before it: the fast check does not take the home's `here` for its own, so the read goes to
\* the home's ring through a kick. One submit, none on the other ring, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Registered = TRUE    \* the registration is in place before the read
    Reader = "other"     \* the reader runs another shard, with a ring of its own
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    OneSubmit
    OnlyHomeIssues
