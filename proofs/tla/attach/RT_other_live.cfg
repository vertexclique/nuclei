\* Liveness: a read from another shard's thread while the registration is still under way is
\* served in the end, through the home's ring, and every thread ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    Registered = FALSE   \* the registration is still under way when the read comes
    Reader = "other"     \* the reader runs another shard, with a ring of its own
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    OneSubmit
    OnlyHomeIssues
PROPERTIES                     \* must hold over every behaviour
    Served
    Termination
