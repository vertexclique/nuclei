\* Two tasks wait twice at a barrier of two, the first task's first wait dropped
\* (its arrival stays counted, so the generations shift and a last wait can be
\* left waiting for an arrival that never comes, by design): every safety
\* property, every remaining wait of a finished generation completes.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    N = 2
    Rounds <- TwoTwo
    Drops = {1}
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyRelease
    OneLeaderEach
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    ReleasedTogether
