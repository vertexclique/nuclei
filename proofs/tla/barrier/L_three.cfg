\* Three tasks wait once at a barrier of two: the first two complete their
\* generation; the third waits for a second one, by design. Every safety property.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    N = 2
    Rounds <- ThreeOne
    Drops = {}
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyRelease
    OneLeaderEach
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    ReleasedTogether
