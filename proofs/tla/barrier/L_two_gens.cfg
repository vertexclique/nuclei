\* Two tasks wait twice each at a barrier of two: two generations, every safety
\* property, and every wait of a finished generation completes.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    N = 2
    Rounds <- TwoTwo
    Drops = {}
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyRelease
    OneLeaderEach
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    ReleasedTogether
