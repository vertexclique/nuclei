\* MUTATION leader_unfused: the leader's finished wait keeps no mark that it led,
\* so a poll of it after completion arrives again. That phantom arrival stands in
\* for a real one: the next generation completes with one task short, and a wait
\* returns before its group has met. Expected: NoEarlyRelease broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    N = 2
    Rounds <- TwoTwo
    Drops = {}
    Mutation = "leader_unfused"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyRelease
