\* A thread waits with a deadline (`block_on_until`) for a future another thread makes ready,
\* its park returning for no reason once, while the deadline passes at any point: the wait
\* ends with the output or with None, None only past the deadline and right after a poll,
\* and the thread holds no retired value while it sleeps.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Wasm = FALSE
    ReadyAtOnce = FALSE
    Spurious = 1                 \* spurious returns of a park
    Deadline = TRUE
    Retires = TRUE               \* a pending poll retires into the batch
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoErrorOffWasm
    NeverEarly
    FinalPoll
    SleepsHoldingNothing
PROPERTIES                     \* must hold over every behaviour
    Ends
