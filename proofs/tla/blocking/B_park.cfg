\* A thread waits for a future another thread makes ready, its park returning for no
\* reason up to twice: the unpark is never lost, wherever it lands, and the wait ends with
\* the output.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Wasm = FALSE
    ReadyAtOnce = FALSE
    Spurious = 2                 \* spurious returns of a park
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoErrorOffWasm
    WasmNeverParks
PROPERTIES                     \* must hold over every behaviour
    Ends
