\* wasm32, a future ready at once: the output.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Wasm = TRUE
    ReadyAtOnce = TRUE
    Spurious = 0                 \* spurious returns of a park
    Deadline = FALSE
    Retires = FALSE              \* a pending poll retires into the batch
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoErrorOffWasm
    WasmNeverParks
PROPERTIES                     \* must hold over every behaviour
    Ends
