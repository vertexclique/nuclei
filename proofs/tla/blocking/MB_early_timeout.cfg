\* MUTATION early_timeout: a park that returns for no reason is taken for the deadline, and
\* the wait answers None before it. Expected: NeverEarly broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Wasm = FALSE
    ReadyAtOnce = FALSE
    Spurious = 1                 \* spurious returns of a park
    Deadline = TRUE
    Retires = FALSE              \* a pending poll retires into the batch
    Mutation = "early_timeout"
INVARIANTS                     \* must hold in every reachable state
    NeverEarly
    FinalPoll
