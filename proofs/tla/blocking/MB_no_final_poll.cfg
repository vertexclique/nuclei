\* MUTATION no_final_poll: a park that returns past the deadline answers None without the poll
\* that would take a value made ready meanwhile. Expected: FinalPoll broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Wasm = FALSE
    ReadyAtOnce = FALSE
    Spurious = 0                 \* spurious returns of a park
    Deadline = TRUE
    Retires = FALSE              \* a pending poll retires into the batch
    Mutation = "no_final_poll"
INVARIANTS                     \* must hold in every reachable state
    NeverEarly
    FinalPoll
