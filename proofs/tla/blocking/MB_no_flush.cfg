\* MUTATION no_flush: the thread parks without submitting what its poll retired. Expected:
\* SleepsHoldingNothing broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Wasm = FALSE
    ReadyAtOnce = FALSE
    Spurious = 0                 \* spurious returns of a park
    Deadline = FALSE
    Retires = TRUE               \* a pending poll retires into the batch
    Mutation = "no_flush"
INVARIANTS                     \* must hold in every reachable state
    SleepsHoldingNothing
