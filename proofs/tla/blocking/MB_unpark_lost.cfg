\* MUTATION unpark_lost: an unpark that comes before the park is dropped. The future is
\* made ready and its waker called between the poll and the park, and the thread sleeps
\* for good. Expected: Ends broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Wasm = FALSE
    ReadyAtOnce = FALSE
    Spurious = 0                 \* spurious returns of a park
    Mutation = "unpark_lost"
PROPERTIES                     \* must hold over every behaviour
    Ends
