\* Two senders, a receiver that receives until the end, and a sender waiting in closed():
\* every receive wakes for a value or the end, the end only once every value was taken,
\* and closed() ends once the receiver went.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1, 2}
    RxRecvs = 3                 \* receives of the first receiver
    Subscribe = FALSE
    SubRecvs = 0                \* receives of the subscribed receiver
    WithClosed = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
PROPERTIES                     \* must hold over every behaviour
    AllEnd
