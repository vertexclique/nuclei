\* One sender that subscribes a receiver before its send, against the first receiver: the
\* subscribed one takes the value from its start, and both end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1}
    RxRecvs = 3                 \* receives of the first receiver
    Subscribe = TRUE
    SubRecvs = 2                \* receives of the subscribed receiver
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
PROPERTIES                     \* must hold over every behaviour
    AllEnd
