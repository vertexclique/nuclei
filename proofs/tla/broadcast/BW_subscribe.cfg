\* The same with a receiver subscribed by the first sender before its send: it takes every
\* value from its start, and ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1, 2}
    RxRecvs = 3                 \* receives of the first receiver
    Subscribe = TRUE
    SubRecvs = 3                \* receives of the subscribed receiver
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
PROPERTIES                     \* must hold over every behaviour
    AllEnd
