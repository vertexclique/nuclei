\* MUTATION close_no_notify: the last sender sets the closed flag without notify_waiters;
\* a receive asleep for the end sleeps for good. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1}
    RxRecvs = 2                 \* receives of the first receiver
    Subscribe = FALSE
    SubRecvs = 0                \* receives of the subscribed receiver
    WithClosed = FALSE
    Mutation = "close_no_notify"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
