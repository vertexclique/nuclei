\* MUTATION closed_no_recount: closed() makes its Notified and waits without reading the
\* count again; the last receiver went between its first read and the Notified. Expected:
\* AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1}
    RxRecvs = 1                 \* receives of the first receiver
    Subscribe = FALSE
    SubRecvs = 0                \* receives of the subscribed receiver
    WithClosed = TRUE
    Mutation = "closed_no_recount"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
