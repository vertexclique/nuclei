\* MUTATION last_rx_no_notify: the last receiver goes without waking closed(), which
\* sleeps for good. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1}
    RxRecvs = 1                 \* receives of the first receiver
    Subscribe = FALSE
    SubRecvs = 0                \* receives of the subscribed receiver
    WithClosed = TRUE
    Mutation = "last_rx_no_notify"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
