\* MUTATION notified_after_look: a receive makes its Notified after its look. The send
\* lands between the two and its notify_waiters is before the Notified: the receive
\* sleeps for good with the value there. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1}
    RxRecvs = 2                 \* receives of the first receiver
    Subscribe = FALSE
    SubRecvs = 0                \* receives of the subscribed receiver
    WithClosed = FALSE
    Mutation = "notified_after_look"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
