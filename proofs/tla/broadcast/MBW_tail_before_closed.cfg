\* MUTATION tail_before_closed: a look reads the tail before the closed flag. It reads the
\* tail at its next position, the last send claims and publishes that position and its
\* sender goes, and the look then sees the flag: the end, with a value owed not taken.
\* Expected: EndAfterAll broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {1}
    RxRecvs = 2                 \* receives of the first receiver
    Subscribe = FALSE
    SubRecvs = 0                \* receives of the subscribed receiver
    WithClosed = FALSE
    Mutation = "tail_before_closed"
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
