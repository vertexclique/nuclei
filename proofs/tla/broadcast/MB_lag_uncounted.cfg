\* MUTATION lag_uncounted: a lag skips values without counting them. Expected: Counted broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the end of every process is not a deadlock here
CONSTANTS
    Cap = 2              \* a ring of two
    Senders = {1, 2}     \* two senders
    PerSender = 3        \* three values each
    Mutation = "lag_uncounted"
INVARIANTS                     \* must hold in every reachable state
    Counted
