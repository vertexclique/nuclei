\* MUTATION over_later: a send publishes over a later position. Expected: Finishes broken (the receiver waits for good).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the end of every process is not a deadlock here
CONSTANTS
    Cap = 2              \* a ring of two
    Senders = {1, 2}     \* two senders
    PerSender = 3        \* three values each
    Mutation = "over_later"
PROPERTIES                     \* must hold over every behaviour
    Finishes
