\* MUTATION upgrade_closed: an upgrade makes a sender after the last one went, so its values come after the receiver saw the close. Expected: Counted broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the end of every process is not a deadlock here
CONSTANTS
    Cap = 2              \* a ring of two
    Senders = {1}        \* one sender
    PerSender = 2        \* two values each
    Weak = {2}           \* a weak sender trying one upgrade
    Mutation = "upgrade_closed"
INVARIANTS                     \* must hold in every reachable state
    Counted
