\* PB_safe's three senders (two, and a weak one upgrading at any point) with one value each, over every behaviour: the receiver reaches the close.
\* Over every behaviour the check walks every path of every state, so PB_safe's race is split in two smaller ones: here all three senders race, one value each; in PB_live_values two race with three values each. Why one value is enough here: three senders still put three positions on a ring of two, so the receiver still lags, a send still finds a position a ring later in its slot, an upgrade still succeeds or finds no sender left, and a send published over a later position (MB_over_later) still leaves the receiver waiting for good.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the end of every process is not a deadlock here
CONSTANTS
    Cap = 2              \* a ring of two
    Senders = {1, 2}     \* two senders
    PerSender = 1        \* one value each
    Weak = {3}           \* a weak sender trying one upgrade
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Finishes
