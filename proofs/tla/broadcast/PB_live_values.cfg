\* One sender and a weak sender upgrading at any point, three values each, over every behaviour: the receiver reaches the close.
\* The other half of PB_safe's race (PB_live has the first): two senders with three values each. The upgrade can come first, so this holds two senders racing three values each from the start, and it can come at any later point or find no sender left; the receiver still lags, a send still finds a position a ring later in its slot, and a send published over a later position (MB_over_later) still leaves the receiver waiting for good.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the end of every process is not a deadlock here
CONSTANTS
    Cap = 2              \* a ring of two
    Senders = {1}        \* one sender
    PerSender = 3        \* three values each
    Weak = {2}           \* a weak sender trying one upgrade
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Finishes
