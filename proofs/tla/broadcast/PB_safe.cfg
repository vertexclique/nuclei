\* Two senders racing on a ring of two, a weak sender upgrading at any point, one receiver: everything sent is taken or reported lost.
\* The two senders run the same code from the same start and no property names one of them, so a state and the same state with the two swapped are one state to TLC (SYMMETRY): every state is still checked, up to the senders' names, about half as many of them. Every mutation of Counted and every witness of this family still breaks its property at these constants with the swap on (MB_over_later breaks Finishes, which PB_live and PB_live_values check without it).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the end of every process is not a deadlock here
CONSTANTS
    Cap = 2              \* a ring of two
    Senders = {s1, s2}   \* two senders, named by model values so they can be swapped
    PerSender = 3        \* three values each
    Weak = {3}           \* a weak sender trying one upgrade
    Mutation = "none"
SYMMETRY Perms                 \* both namings of the two senders are one state (MC_Broadcast.tla)
INVARIANTS                     \* must hold in every reachable state
    Counted
    Forward
