\* WITNESS: a weak sender's upgrade makes a sender. Expected: NoUpgrade broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the end of every process is not a deadlock here
CONSTANTS
    Cap = 2              \* a ring of two
    Senders = {1}        \* one sender
    PerSender = 2        \* two values each
    Weak = {2}           \* a weak sender trying one upgrade
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoUpgrade
