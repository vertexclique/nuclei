\* A worker and two threads that serve its runtime with no shard, each asking for three buffers of a pool
\* that holds two: no pool holds more than the runtime's cap, and every buffer asked for is given in the end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that is done stops
CONSTANTS
    Cap = 2                    \* the runtime's cap, in buffers
    Default = 3                \* the default, more than the cap
    Threads = 2                \* threads that run no shard
    Takes = 3                  \* buffers each asks for
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    PerPool
    Total
    Counted
PROPERTIES                     \* must hold over every behaviour
    AllGiven
