\* MUTATION late_cap: a pool thread runs a job that needs buffers before it says which runtime it serves (as a
\* thread that enters a runtime after IO of its own does): its pool grew under the default, and the serve frees
\* only its idle buffers past the cap, so it holds more than the cap until the rest come back. Expected: PerPool
\* broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that is done stops
CONSTANTS
    Cap = 2                    \* the runtime's cap, in buffers
    Default = 3                \* the default, more than the cap
    Threads = 1                \* one thread that runs no shard
    Takes = 3                  \* buffers it asks for
    Mutation = "late_cap"
INVARIANTS                     \* must hold in every reachable state
    PerPool
