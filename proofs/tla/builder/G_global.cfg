\* GREEN: two build_global calls at once, each after its own setters of the two counts, the
\* machine free to refuse. One that finds the default running answers AlreadyExists and builds
\* nothing; two that look before either sets it both build, and the second answers AlreadyExists
\* with its runtime dropped; there is never a second default. Two callers are every race the one
\* default allows: a third finds it set, or loses as the second does.
SPECIFICATION Spec              \* every order of setter calls and of the callers' steps
CONSTANTS
    \* the settings the setters may call; the others stay unset
    Use = {"worker_threads", "max_worker_threads"}
    MachineCount = 2         \* the cores of the machine, every one the process's
    MachineFails = TRUE      \* whether the machine may refuse a build whose settings fit
    First = "build_global"   \* what caller 1 calls
    Second = "build_global"  \* what caller 2 calls
    Mode = "ok"              \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    SettersNeverPanic
    BuildOkIffValid
    ErrorNamesFailingSetting
    WorkerCount
    SecondGlobalIsAlreadyExists
    OneDefault
    InitReportsFailure
    InitConfigFits
