\* GREEN: one build with ring settings, a handoff, on_long_poll and the two counts, the machine
\* free to refuse. Each of the six ring settings stands for one rule of IoUringConfiguration (a
\* queue too short, receive buffers not a power of two, not below twice the queue, buffers too
\* small, and too small with receive buffers off, which fits), met with every other setting.
SPECIFICATION Spec              \* every order of setter calls and of the callers' steps
CONSTANTS
    \* the settings the setters may call; the others stay unset
    Use = {"io_uring", "handoff_after", "on_long_poll", "worker_threads", "max_worker_threads"}
    MachineCount = 2         \* the cores of the machine, every one the process's
    MachineFails = TRUE      \* whether the machine may refuse a build whose settings fit
    First = "build"          \* what caller 1 calls
    Second = "none"          \* what caller 2 calls
    Mode = "ok"              \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    SettersNeverPanic
    BuildOkIffValid
    ErrorNamesFailingSetting
    WorkerCount
    SecondGlobalIsAlreadyExists
    OneDefault
    InitReportsFailure
    InitConfigFits
