\* GREEN: one build, after any order of calls to the setters of eight settings with a range or a
\* partner: the stack size, nesting, blocking threads, handoff_after, on_long_poll and the three
\* knobs. Every setting fits or fails as documented, an error names a setting that fails, and no
\* setter panics. Every combination of their values is reached (the last call wins, so another
\* order only makes the same builders again), each value standing for every value on its side of
\* the bound, so every setting that fails alone, every pair that fails at once, and on_long_poll
\* with each handoff_after (unset, None, too short, fine) meet the order validate checks them in.
SPECIFICATION Spec              \* every order of setter calls and of the callers' steps
CONSTANTS
    \* the settings the setters may call; the others stay unset
    Use = {"thread_stack_size", "max_nesting", "max_blocking_threads", "handoff_after", "on_long_poll", "event_interval", "global_queue_interval", "max_io_events_per_tick"}
    MachineCount = 2         \* the cores of the machine, every one the process's
    MachineFails = FALSE     \* whether the machine may refuse a build whose settings fit
    First = "build"          \* what caller 1 calls
    Second = "none"          \* what caller 2 calls
    Mode = "ok"              \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    SettersNeverPanic
    BuildOkIffValid
    ErrorNamesFailingSetting
    WorkerCount
    SecondGlobalIsAlreadyExists
    OneDefault
    InitReportsFailure
    InitConfigFits
