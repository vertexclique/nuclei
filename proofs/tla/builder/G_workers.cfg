\* GREEN: one build with the counts and both lists of cores, the machine free to refuse. The
\* runtime starts with worker_threads, else the list's length, else the machine's two cores, held to
\* max_worker_threads (0, 1 or 2: below, at and between those counts); an empty list, or one naming
\* a core the process may not run on, is refused under its own name, for the workers and the pool.
SPECIFICATION Spec              \* every order of setter calls and of the callers' steps
CONSTANTS
    \* the settings the setters may call; the others stay unset
    Use = {"worker_threads", "max_worker_threads", "worker_cores", "blocking_cores"}
    MachineCount = 2         \* the cores of the machine, every one the process's
    MachineFails = TRUE      \* whether the machine may refuse a build whose settings fit
    First = "build"          \* what caller 1 calls
    Second = "none"          \* what caller 2 calls
    Mode = "ok"              \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    SettersNeverPanic
    BuildOkIffValid
    ErrorNamesFailingSetting
    WorkerCount
    SecondGlobalIsAlreadyExists
    OneDefault
    InitReportsFailure
    InitConfigFits
