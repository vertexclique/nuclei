\* MUTATION count_ignores_cores: worker_count ignores worker_cores and starts one worker per core of the
\* machine: a list of one core starts two.
\* One build, with the setters of these settings alone, is the smallest run that meets it. Expected: WorkerCount broken.
SPECIFICATION Spec              \* every order of setter calls and of the callers' steps
CONSTANTS
    \* the settings the setters may call; the others stay unset
    Use = {"worker_cores"}
    MachineCount = 2         \* the cores of the machine, every one the process's
    MachineFails = FALSE     \* whether the machine may refuse a build whose settings fit
    First = "build"          \* what caller 1 calls
    Second = "none"          \* what caller 2 calls
    Mode = "count_ignores_cores" \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    WorkerCount
