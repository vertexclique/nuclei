\* MUTATION knob_asserts: the setter of a knob asserts its value is at least 1, as it did before:
\* event_interval(0) panics in the setter, before build could refuse it.
\* One build, with the setters of these settings alone, is the smallest run that meets it. Expected: SettersNeverPanic broken.
SPECIFICATION Spec              \* every order of setter calls and of the callers' steps
CONSTANTS
    \* the settings the setters may call; the others stay unset
    Use = {"event_interval"}
    MachineCount = 2         \* the cores of the machine, every one the process's
    MachineFails = FALSE     \* whether the machine may refuse a build whose settings fit
    First = "build"          \* what caller 1 calls
    Second = "none"          \* what caller 2 calls
    Mode = "knob_asserts"    \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    SettersNeverPanic
