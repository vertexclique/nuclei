\* MUTATION no_early_check: build_global does not look at the default first, and builds a whole
\* runtime (its threads started) before the set tells it one runs.
\* Two callers and no setting are the smallest run that meets it: one sets the default, the other meets it. Expected: SecondGlobalIsAlreadyExists broken.
SPECIFICATION Spec              \* every order of setter calls and of the callers' steps
CONSTANTS
    \* the settings the setters may call; the others stay unset
    Use = {}
    MachineCount = 2         \* the cores of the machine, every one the process's
    MachineFails = FALSE     \* whether the machine may refuse a build whose settings fit
    First = "build_global"   \* what caller 1 calls
    Second = "build_global"  \* what caller 2 calls
    Mode = "no_early_check"  \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    SecondGlobalIsAlreadyExists
