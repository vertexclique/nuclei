\* A shard that parks and wakes while a reader reads its word at any moment: every read is within the truth.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the clock's last tick is an end, not a deadlock
CONSTANTS
    MaxT = 8             \* eight ticks: several parks and reads, with reads straddling each change
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NeverBelow
    NeverAboveGap
