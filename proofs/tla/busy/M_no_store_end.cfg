\* MUTATION no_store_end: a wake leaves the word saying parked, so a reader after it counts the running time as
\* parked, more than its own read's gap. Expected: NeverAboveGap broken.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the clock's last tick is an end, not a deadlock
CONSTANTS
    MaxT = 4             \* enough for a park, a wake and a read after it
    Mutation = "no_store_end"
INVARIANTS                     \* must hold in every reachable state
    NeverAboveGap
