\* MUTATION publish_overwrites: the publish the park's own drive makes on its way into the kernel stores the total
\* over the parked word, so a reader during the park decodes the time before it and the sleeping shard reads as
\* busy again. Expected: NeverBelow broken.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the clock's last tick is an end, not a deadlock
CONSTANTS
    MaxT = 4             \* enough for one park, its publish, and one read inside it
    Mutation = "publish_overwrites"
INVARIANTS                     \* must hold in every reachable state
    NeverBelow
