\* WITNESS: the new runner's first drive submits the operation.
\* Expected: NoFirstDrive broken.
SPECIFICATION Spec              \* the algorithm, the shard weakly fair
CHECK_DEADLOCK FALSE           \* a run that ends once the operation is submitted is not a deadlock
CONSTANTS
    N = 13                 \* runs between drives by count
    Q = 4                  \* runs between reads of the coarse clock
    Slow = 2               \* time of a task under the handoff threshold
    Long = 5               \* time of a task past it
    DriveBound = 1         \* time since the last drive that makes a read drive
    Bound = 14             \* the most the operation may wait
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoFirstDrive
