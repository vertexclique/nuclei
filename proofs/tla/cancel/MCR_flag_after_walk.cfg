\* MUTATION flag_after_walk: the cancel raises the flag only after its walk. A child inserted
\* while the walk runs, and not yielded by it, read the flag before it went up: it is never
\* cancelled. Expected: AllChildrenCancelled broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Mutation = "flag_after_walk"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    AllChildrenCancelled
