\* MUTATION flag_before_insert: a new child reads its parent's flag before it is
\* in the registry. Expected: RacingChildCancelled broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    WithY = FALSE
    DropAll = FALSE
    Mutation = "flag_before_insert"
INVARIANTS                     \* must hold in every reachable state
    RacingChildCancelled
