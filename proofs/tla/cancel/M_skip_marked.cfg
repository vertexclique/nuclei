\* MUTATION skip_marked: a walk does not go into a child another call marked.
\* Expected: CancelReturnsWithSubtree broken (that call may still be on its way down).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    WithY = TRUE
    DropAll = FALSE
    Mutation = "skip_marked"
INVARIANTS                     \* must hold in every reachable state
    CancelReturnsWithSubtree
