\* Two producers of three values each, capacity 2 on a ring of 2: no write over a value not taken, the right lap's value taken, each once, never more than the capacity in flight, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Producers = {"p1", "p2"}
    Pushes = 3
    Cap = 2
    Cells = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoClobber
    RightValue
    TakenOnce
    WithinCap
