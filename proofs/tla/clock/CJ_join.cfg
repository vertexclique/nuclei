\* A guest joins, arms a timer one unit away and parks while an attempt decides a jump to
\* the old shard's timer at 3: the attempt that did not see the guest sees the count move
\* and does not jump, so the clock never passes the guest's timer.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Near = 1                    \* the guest arms its timer one unit from the clock
    Far = 3                     \* the old shard's timer
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ClockNeverPassesArmed
