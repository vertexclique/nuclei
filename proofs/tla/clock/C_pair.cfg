\* Two shards, each given one item of work that arms its timer: the scenario where a stale
\* deadline, a busy path that does not wait or a woken shard that does not wait each leave a timer
\* behind (the M_ configurations), with the code as it is. Expected: pass.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 2
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
