\* Two shards, each given one item of work that arms its timer: the scenario where a stale
\* deadline, a busy path that does not wait or a woken shard that does not wait each leave a timer
\* behind (the M_ configurations), with the code as it is. Expected: pass.
\* Every invariant and no temporal property: a timer on each of two shards makes too many states
\* to check every behaviour as well. TimersFire is checked where one shard arms its timers
\* (C_rearm, C_safe_live). The three races above need this size, two delays and a timer on each
\* shard, to break ClockNeverPassesArmed, and they break it here.
\* With no blocking job the shards are alike (the same code, and the pusher may give its work
\* to any of them) and no invariant names one, so a state and the same state with the shards
\* renamed are one state to TLC (SYMMETRY): every state is still checked, up to the shards'
\* names, about half as many of them.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {s1, s2}           \* two shards, named by model values so they can be swapped
    Pushes = 2
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
SYMMETRY Perms                  \* every renaming of the shards is one state (MC_Clock.tla)
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
