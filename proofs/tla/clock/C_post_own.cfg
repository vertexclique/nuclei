\* One shard, one item of work that arms its timer, and a timer op posted to that shard by another
\* thread, at any moment, which wakes it if it is parked: it applies the op and parks idle again,
\* so the clock still jumps to its timer and it fires. Expected: pass, every invariant and
\* TimersFire over every behaviour.
\* With the wake taken away, an op posted after the shard's last look before it sleeps leaves it
\* asleep and not idle, its own attempt finding it so, with its timer armed: the same hang as
\* M_post_no_wake, on the shard that holds the timer.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1}
    Late = {}                   \* the clock counts its shard
    Pushes = 1                  \* one item of work
    PushTo = {1}                \* to the shard
    Posts = 1                   \* one timer op posted
    PostTo = {1}                \* to the shard
    Job = FALSE                 \* no blocking job
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
