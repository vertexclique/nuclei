\* Two shards, one item of work that arms a timer on shard 1, and a timer op (a removal or a
\* cancel of a sleep dropped on another thread) posted to shard 2, which wakes it: the shard
\* applies the op and parks idle again, so the clock still jumps to the timer and it fires.
\* Expected: pass, every invariant and TimersFire over every behaviour.
\* The op goes to the shard without the timer, whose holding it would hold up the other's jump; an
\* op posted to the shard with the timer is C_post_own, and with the wake taken away the hang is
\* M_post_no_wake. The two choices in one run took 67 s, more than a configuration may take.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {}                   \* the clock counts every shard
    Pushes = 1                  \* one item of work
    PushTo = {1}                \* to shard 1
    Posts = 1                   \* one timer op posted
    PostTo = {2}                \* to shard 2
    Job = FALSE                 \* no blocking job
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
