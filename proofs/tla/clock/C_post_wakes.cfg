\* Two shards, one item of work that arms a timer on shard 1, and a timer op (a removal or a
\* cancel of a sleep dropped on another thread) posted to either shard, which wakes it: the shard
\* applies the op and parks idle again, so the clock still jumps to the timer and it fires.
\* Expected: pass, every invariant and TimersFire over every behaviour.
\* One item to one shard keeps it small enough to check every behaviour; the op may go to the
\* shard with the timer or to the other, the one its post must not leave holding up the jump.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {}                   \* the clock counts every shard
    Pushes = 1                  \* one item of work
    PushTo = {1}                \* to shard 1
    Posts = 1                   \* one timer op posted
    PostTo = {1, 2}             \* to either shard
    Job = FALSE                 \* no blocking job
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
