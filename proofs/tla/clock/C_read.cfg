\* Two threads reading the clock twice each while it is paused, the system's clock moving on three times: no thread's readings go back, whether a reading meets the pause before its mark, between its stores or after it. Expected: pass.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Readers = {1, 2}            \* two reading threads
    Reads = 2                   \* two readings each
    MaxTime = 3                 \* the system's clock moves on three times
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ReaderMonotonic
CHECK_DEADLOCK FALSE
