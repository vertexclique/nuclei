\* Two shards and a pusher, each shard arming up to two timers (a fired timer's task arms it
\* again): as C_safe, without the blocking job. Expected: pass.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 1
    Job = FALSE
    Delays = {1, 2}
    Timers = 2
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
