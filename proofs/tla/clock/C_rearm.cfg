\* Two shards and a pusher, each shard arming up to two timers (a fired timer's task arms it
\* again), without the blocking job (C_safe has it). Expected: pass.
\* One delay loses nothing here: the one item of work goes to one shard, so only that shard ever
\* arms a timer, one at a time, and the clock only moves to a deadline that shard armed. Whatever
\* the delays, the clock and the deadlines stand in the same order (0, then the first deadline,
\* then the second), and the protocol only compares them, so a run with delays 1 and 2 is a run
\* with delay 1 under other numbers. One look instead of two (M_no_recheck) still breaks NoBadJump
\* with these constants, and no attempt at the park (M_no_attempt) still breaks TimersFire.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 1
    Job = FALSE
    Delays = {1}                \* one delay: with one shard arming, more give the same runs
    Timers = 2
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
