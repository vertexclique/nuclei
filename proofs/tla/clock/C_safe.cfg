\* Two shards, a pusher and a blocking job, each shard arming one timer one step after the clock:
\* no jump leaves an armed timer behind or comes while work is in flight, and every armed timer
\* fires. Expected: pass.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 1
    Job = TRUE
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
