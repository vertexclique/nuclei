\* Two shards, a pusher and work in flight (a blocking job, or the rest of a poll the handoff took
\* from its thread), each shard arming one timer one step after the clock: no jump leaves an armed
\* timer behind or comes while work is in flight. Expected: pass.
\* The pusher gives its one item to shard 1 here, the shard the job wakes too, and to shard 2 in
\* C_safe_other: the pusher's only choice is where its one item goes, so the two runs together
\* walk every behaviour of the pusher beside the job, each about half of them, within the time a
\* configuration may take.
\* Every invariant and no temporal property: the pusher beside the job makes too many states to
\* check every behaviour as well. That every armed timer fires (TimersFire) is checked in two
\* smaller runs, C_safe_live (the job alone) and C_rearm (the pusher alone), where no attempt at
\* the park (M_no_attempt) breaks it. A jump that does not look at the jobs (M_no_job_check) or
\* looks only once (M_no_recheck) breaks NoBadJump.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {}                   \* the clock counts every shard
    Pushes = 1                  \* the pusher gives one item of work
    PushTo = {1}                \* to shard 1, the job's
    Posts = 0                   \* no timer op posted
    PostTo = {1, 2}             \* (no post)
    Job = TRUE                  \* the blocking job gives shard 1 one item of work
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
