\* Two shards, a pusher and a blocking job, each shard arming one timer one step after the clock:
\* no jump leaves an armed timer behind or comes while work is in flight. Expected: pass.
\* Every invariant and no temporal property: the pusher beside the job makes too many states to
\* check every behaviour as well. That every armed timer fires (TimersFire) is checked in two
\* smaller runs, C_safe_live (the job alone) and C_rearm (the pusher alone), where no attempt at
\* the park (M_no_attempt) breaks it. Here a jump that does not look at the jobs (M_no_job_check)
\* or looks only once (M_no_recheck) breaks NoBadJump.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 1                  \* the pusher gives one item of work to either shard
    Job = TRUE                  \* the blocking job gives shard 1 one item of work
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
