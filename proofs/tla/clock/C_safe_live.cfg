\* C_safe without the pusher, over every behaviour: the job's item of work arms one timer on
\* shard 1 one step after the clock, every invariant holds and every armed timer fires.
\* Expected: pass.
\* The job alone is few enough states to check every behaviour, and still reaches the hang the
\* ending guards against: no attempt at the park (M_no_attempt) breaks TimersFire here. A jump
\* that does not look at the jobs (M_no_job_check) or looks only once (M_no_recheck) still breaks
\* NoBadJump. C_safe checks the job beside the pusher, for every invariant.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 0                  \* no pusher: the job's item is the only work
    Job = TRUE                  \* the blocking job gives shard 1 one item of work
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
