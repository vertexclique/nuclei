\* C_safe with the pusher's one item given to shard 2, the shard the job does not wake: two shards,
\* a pusher and a blocking job, each shard arming one timer one step after the clock; no jump
\* leaves an armed timer behind or comes while work is in flight. Expected: pass.
\* With C_safe (the item to shard 1) it walks every behaviour of the pusher beside the job.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {}                   \* the clock counts every shard
    Pushes = 1                  \* the pusher gives one item of work
    PushTo = {2}                \* to shard 2, the one the job does not wake
    Posts = 0                   \* no timer op posted
    PostTo = {1, 2}             \* (no post)
    Job = TRUE                  \* the blocking job gives shard 1 one item of work
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
