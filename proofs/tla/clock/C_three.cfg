\* Three shards and a pusher, one timer each: as C_safe, without the blocking job (C_safe has it).
\* Expected: pass.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2, 3}
    Pushes = 1
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
