\* Three shards and a pusher, one timer each, without the blocking job (C_safe has it): no jump
\* leaves an armed timer behind or comes while work is in flight. Expected: pass.
\* Every invariant and no temporal property: three shards make too many states to check every
\* behaviour as well. TimersFire is checked with two shards (C_rearm, C_safe_live). One look
\* instead of two (M_no_recheck) breaks NoBadJump here.
\* With no blocking job the shards are alike (the same code, and the pusher may give its work
\* to any of them) and no invariant names one, so a state and the same state with the shards
\* renamed are one state to TLC (SYMMETRY): every state is still checked, up to the shards'
\* names, about a sixth as many of them.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {s1, s2, s3}       \* three shards, named by model values so they can be swapped
    Pushes = 1
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
SYMMETRY Perms                  \* every renaming of the shards is one state (MC_Clock.tla)
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
