\* A sleep a thread outside the runtime makes and polls, against a paused clock's jump: the
\* poll counts itself in flight and waits for a jump being decided, so a jump comes before its
\* look (the sleep then ends at once) or after its post (the worker is then not idle), and an armed
\* timer is never behind the clock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE
CONSTANTS
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ForeignNeverPassed
