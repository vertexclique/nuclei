\* A thread inside the runtime's block_on from before the pause, the pause made by a task on a
\* worker: the pause finds the thread's mark and joins its own shard, so the clock never jumps
\* while the thread is busy nor past its timer, and its sleep comes due.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what a property catches
CONSTANTS
    Near = 1                    \* the visiting thread's timer, one unit on
    Far = 3                     \* the workers' timer
    Leaves = FALSE
    Mutation = "none"
INVARIANTS
    NoBadJump
    ClockNeverPassesArmed
PROPERTIES
    ThreadEnds
