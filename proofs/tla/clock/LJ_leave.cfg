\* The same, the thread leaving block_on after its sleep while the pause may be joining it: the
\* join that lands after the thread left finds the mark gone and is taken back, so no own shard
\* stays a guest after its thread left.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what a property catches
CONSTANTS
    Near = 1                    \* the visiting thread's timer, one unit on
    Far = 3                     \* the workers' timer
    Leaves = TRUE
    Mutation = "none"
INVARIANTS
    NoBadJump
    ClockNeverPassesArmed
PROPERTIES
    ThreadEnds
    NoStaleGuest
