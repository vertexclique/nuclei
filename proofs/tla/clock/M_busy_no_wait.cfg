\* MUTATION busy_no_wait: a shard that finds work as it is about to sleep runs it without waiting
\* for an advance in progress. Expected: ClockNeverPassesArmed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 2
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "busy_no_wait"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
