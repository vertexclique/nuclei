\* MUTATION check_then_read: an unmarked clock's reading looks at the mark first and reads the system's time after, as before the fix. Expected: ReaderMonotonic broken.
\* The bug it plants: a thread finds the clock unmarked and is held up; the pause marks the clock and stops it at the time then; the system's clock moves on; the thread reads it, later than the paused time, and hands that out, leaving no trace. Its next reading is the paused time: earlier.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Readers = {1}               \* one reading thread is enough
    Reads = 2                   \* two readings
    MaxTime = 2                 \* the system's clock moves on twice
    Mutation = "check_then_read" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    ReaderMonotonic
CHECK_DEADLOCK FALSE
