\* MUTATION detached_uncounted: the rest of a poll the handoff took from its thread is left out of
\* the count of work in flight an attempt reads, as before the fix. Expected: NoBadJump broken.
\* The taken poll stands where the blocking job does in C_safe, out of the count. The bug it
\* plants: shard 2 runs its item and arms its timer, both shards park idle with the shard handed
\* on, and an attempt jumps to the timer while the poll still runs on its thread: a timeout the
\* poll's work would have met fires first, and the poll reads a clock that moved under it. Counted,
\* as in C_safe, the same run breaks nothing.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {}                   \* the clock counts every shard
    Pushes = 1                  \* one item of work
    PushTo = {2}                \* to shard 2
    Posts = 0                   \* no timer op posted
    PostTo = {1, 2}             \* (no post)
    Job = TRUE                  \* a taken poll in flight at the start, ending with an item for shard 1
    Delays = {1}
    Timers = 1
    Mutation = "detached_uncounted"
    defaultInitValue = 0
INVARIANTS
    NoBadJump
CHECK_DEADLOCK FALSE
