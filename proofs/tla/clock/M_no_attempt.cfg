\* MUTATION no_attempt: a parking shard sleeps without trying to move the clock, so only the job
\* moves it. Expected: TimersFire broken (the shard asleep with its timer armed and nothing to
\* wake it).
\* One shard and the blocking job are enough to reach it: the job gives shard 1 an item of work
\* and tries the advance while the shard still has that item to run, so it finds the shard busy
\* and lets go; the shard then runs the item, arms its timer and parks without trying, and nothing
\* ever moves the clock again. More shards, a pusher, a second delay or a second timer only add
\* runs around that same hang.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1}                \* the one shard the job wakes
    Pushes = 0                  \* no pusher: the job's item is the only work
    Job = TRUE
    Delays = {1}                \* one delay: the hang does not depend on how far the timer is
    Timers = 1                  \* one timer: the first one armed already hangs
    Mutation = "no_attempt"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
PROPERTY TimersFire
