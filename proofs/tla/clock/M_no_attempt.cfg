\* MUTATION no_attempt: a parking shard sleeps without trying to move the clock, so only the job
\* moves it. Expected: a deadlock (shards asleep with timers armed and nothing to wake them).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 1
    Job = TRUE
    Delays = {1, 2}
    Timers = 2
    Mutation = "no_attempt"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
PROPERTY TimersFire
