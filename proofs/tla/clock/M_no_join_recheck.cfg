\* MUTATION no_join_recheck: a pause's join does not look at the mark again. A thread that left
\* between the pause's look and its join stays a guest, which is never idle, for good.
\* Expected: NoStaleGuest broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what a property catches
CONSTANTS
    Near = 1                    \* the visiting thread's timer, one unit on
    Far = 3                     \* the workers' timer
    Leaves = TRUE
    Mutation = "no_join_recheck"
PROPERTIES
    NoStaleGuest
