\* MUTATION no_recheck: the advance moves the clock after one look at the shards, not two, so a
\* shard that woke after its look is not seen. Expected: NoBadJump broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {}                   \* the clock counts every shard
    Pushes = 1
    PushTo = {1, 2}             \* the pusher may give its work to any of them
    Posts = 0                   \* no timer op posted
    PostTo = {1, 2}             \* (no post)
    Job = FALSE
    Delays = {1, 2}
    Timers = 2
    Mutation = "no_recheck"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
