\* MUTATION no_wait_advance: a shard that wakes reads the clock without waiting for an advance in
\* progress. Expected: ClockNeverPassesArmed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 2
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "no_wait_advance"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
