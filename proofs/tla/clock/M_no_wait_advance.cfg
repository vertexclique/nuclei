\* MUTATION no_wait_advance: a shard that wakes reads the clock without waiting for an advance in
\* progress. Expected: ClockNeverPassesArmed broken.
\* With no blocking job the shards are alike and no invariant names one, so a state and the
\* same state with the two shards swapped are one state to TLC (SYMMETRY): the search still
\* meets every state up to the shards' names, about half as many, and so the bug.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {s1, s2}           \* two shards, named by model values so they can be swapped
    Pushes = 2
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "no_wait_advance"
    defaultInitValue = 0
SYMMETRY Perms                  \* every renaming of the shards is one state (MC_Clock.tla)
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
