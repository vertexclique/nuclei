\* MUTATION no_wait_advance: the foreign poll counts itself in flight but does not wait for a jump
\* being decided. A worker that looked before the count jumps after the poll looked at the clock,
\* and the request lands behind it. Expected: ForeignNeverPassed broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE
CONSTANTS
    Mutation = "no_wait_advance"
INVARIANTS                     \* must hold in every reachable state
    ForeignNeverPassed
