\* MUTATION one_wheel: one wheel for every runtime the shard serves, read by the clock of the one
\* the thread is innermost in (the code before 0.5.4's fix, the witness W_one_wheel). Runtime A's
\* sleep fires inside B's nested `block_on`, by B's clock advanced five units, while A's clock is
\* still before the sleep's deadline. Expected: NeverEarly broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Advance = 5                 \* B's paused clock is advanced five units
    Watched = FALSE
    Mutation = "one_wheel"
INVARIANTS                     \* must hold in every reachable state
    NeverEarly
CHECK_DEADLOCK FALSE
