\* MUTATION pause_reads_first: the pause reads the time it stops at before it marks the clock, as before the fix. Expected: ReaderMonotonic broken.
\* The bug it plants: the pause reads the time; the system's clock moves on; a thread reads it, finds the clock still unmarked and hands that later time out, leaving no trace; the pause then marks the clock and stops it at the earlier time. The thread's next reading is that earlier time.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Readers = {1}               \* one reading thread is enough
    Reads = 2                   \* two readings
    MaxTime = 2                 \* the system's clock moves on twice
    Mutation = "pause_reads_first" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    ReaderMonotonic
CHECK_DEADLOCK FALSE
