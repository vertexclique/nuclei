\* MUTATION pause_unclaimed: the pause joins the visiting shards without holding the advance
\* claim. A parked worker decides a jump between the pause and the join, while the thread inside
\* block_on is busy and not yet counted. Expected: NoBadJump broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what a property catches
CONSTANTS
    Near = 1                    \* the visiting thread's timer, one unit on
    Far = 3                     \* the workers' timer
    Leaves = FALSE
    Mutation = "pause_unclaimed"
INVARIANTS
    NoBadJump
