\* MUTATION post_no_wake: a timer op another thread posts (a removal or a cancel) wakes no shard,
\* as before the fix: only an arm request did. Expected: TimersFire broken.
\* The bug it plants: the shard runs its item, arms its timer and parks; the op is posted to it
\* after its last look for work, so it sleeps holding the op, which makes it not idle: its own
\* attempt finds it so and lets go, and nothing wakes it. With more shards, any one left parked
\* holding an op holds every jump of the runtime the same way, and every sleeper on it hangs.
\* The constants of C_post_own, the run with the wake: one shard is enough for the hang, and keeps
\* the run within the time a configuration may take (two shards, as C_post_wakes, took 57 s).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1}
    Late = {}                   \* the clock counts its shard
    Pushes = 1                  \* one item of work
    PushTo = {1}                \* to the shard
    Posts = 1                   \* one timer op posted
    PostTo = {1}                \* to the shard
    Job = FALSE                 \* no blocking job
    Delays = {1}
    Timers = 1
    Mutation = "post_no_wake"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
