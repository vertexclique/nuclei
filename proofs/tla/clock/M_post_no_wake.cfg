\* MUTATION post_no_wake: a timer op another thread posts (a removal or a cancel) wakes no shard,
\* as before the fix: only an arm request did. Expected: TimersFire broken.
\* The bug it plants: shard 1 runs its item, arms its timer and parks; shard 2 is parked when the
\* op is posted to it, and stays parked holding it, so it is not idle. Every attempt then finds
\* shard 2 not idle and lets go, shard 1 sleeps with its timer armed, and nothing wakes either:
\* every sleeper of the runtime hangs. The op goes to shard 2 only, the shard without the timer,
\* as in C_post_wakes; one posted to the shard with the timer after its last look before it
\* sleeps hangs it the same way (C_post_own is that run with the wake).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {}                   \* the clock counts every shard
    Pushes = 1                  \* one item of work
    PushTo = {1}                \* to shard 1
    Posts = 1                   \* one timer op posted
    PostTo = {2}                \* to shard 2
    Job = FALSE                 \* no blocking job
    Delays = {1}
    Timers = 1
    Mutation = "post_no_wake"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
