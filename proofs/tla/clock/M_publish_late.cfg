\* MUTATION publish_late: a shard publishes its deadline after it says it parks, so another shard
\* may jump past it. Expected: ClockNeverPassesArmed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 2
    Job = FALSE
    Delays = {1, 2}
    Timers = 1
    Mutation = "publish_late"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
CHECK_DEADLOCK FALSE
