\* MUTATION swap_on_watched: the nested poll swaps B's wheels in on a worker's shard too. The
\* handoff takes the shard while the poll blocks, and the swap back after the poll writes the
\* wheels of a shard another runner now runs: a data race. Expected: NoTouchAfterTake broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Advance = 5                 \* B's paused clock is advanced five units
    Watched = TRUE              \* a worker's shard
    Mutation = "swap_on_watched"
INVARIANTS                     \* must hold in every reachable state
    NoTouchAfterTake
CHECK_DEADLOCK FALSE
