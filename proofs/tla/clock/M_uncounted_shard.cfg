\* A shard that runs the runtime's tasks but that the clock does not count. Expected: TimersFire
\* broken.
\* As a mutation, it takes away the `Guest` a detached thread's own shard enters in `finish_home`:
\* without it, the shard that runs the thread's bound tasks after its worker's shard was handed on
\* is not counted, and the timers those tasks arm are on it. As a witness, it is today's code for
\* a thread inside `block_on` since before another thread paused the clock, an open question: the
\* `Guest` its call entered counted it only if the clock was paused then.
\* What goes wrong: shard 2, not counted, runs its item and arms its timer; every attempt (its own
\* too) looks only at shard 1, finds no deadline to move to and lets go; shard 2 sleeps with its
\* timer armed, and nothing ever moves the clock to it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Late = {2}                  \* shard 2 is not counted
    Pushes = 1                  \* one item of work
    PushTo = {2}                \* to shard 2
    Posts = 0                   \* no timer op posted
    PostTo = {1, 2}             \* (no post)
    Job = FALSE                 \* no blocking job
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    ClockNeverPassesArmed NoBadJump
PROPERTY TimersFire
CHECK_DEADLOCK FALSE
