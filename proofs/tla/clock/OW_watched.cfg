\* A worker's shard, whose polls the handoff may take, serves runtime A, and a task calls runtime
\* B's `block_on` on it: the nested poll swaps no wheel in (the shard may be taken mid-poll), so a
\* thread never touches a shard taken from it; A's sleep still fires by A's clock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Advance = 5                 \* B's paused clock is advanced five units
    Watched = TRUE              \* a worker's shard
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NeverEarly
    NoTouchAfterTake
CHECK_DEADLOCK FALSE
