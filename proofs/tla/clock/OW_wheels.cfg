\* A thread's own shard serves two runtimes' `block_on`, each with its wheel: runtime A's sleep
\* waits on A's wheel, fired by A's clock even inside B's nested `block_on`, whose paused clock is
\* advanced five units. The sleep never ends before its deadline on A's clock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Advance = 5                 \* B's paused clock is advanced five units
    Watched = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NeverEarly
CHECK_DEADLOCK FALSE
