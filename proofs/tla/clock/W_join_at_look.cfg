\* WITNESS of a shape that costs nothing on `block_on`: no mark; a thread inside block_on joins a
\* paused clock only at its own next timer look, before it reads a deadline. The pause, made by a
\* task on a worker, cannot find the thread; between the thread arming its timer and its next look
\* a parked worker finds every member idle and jumps the clock to the workers' timer, past the
\* thread's. Expected: ClockNeverPassesArmed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what a property catches
CONSTANTS
    Near = 1                    \* the visiting thread's timer, one unit on
    Far = 3                     \* the workers' timer
    Leaves = FALSE
    Mutation = "join_at_look"
INVARIANTS
    ClockNeverPassesArmed
