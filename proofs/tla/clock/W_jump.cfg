\* WITNESS: the clock jumps, so the passing runs check jumps. Expected: NoJumpW broken.
\* C_safe_live's constants, the blocking job alone, are enough: the job's item arms shard 1's
\* timer, both shards park, and an attempt moves the clock to it. Every passing run that has the
\* job (C_safe beside a pusher that has not pushed yet) holds these same runs, and the races that
\* break ClockNeverPassesArmed at C_pair's size do so by a jump.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Shards = {1, 2}
    Pushes = 0                  \* no pusher: the job's item is the only work
    Job = TRUE                  \* the blocking job gives shard 1 one item of work
    Delays = {1}
    Timers = 1
    Mutation = "none"
    defaultInitValue = 0
INVARIANTS
    NoJumpW
CHECK_DEADLOCK FALSE
