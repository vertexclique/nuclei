\* WITNESS (today's code): a read that loaded the altered flag before the pause set it
\* takes the system's time after the pause stored its base, and records it nowhere: the
\* reader's next read gives the base, earlier than what it just read. TLC finds the order
\* that makes one reader see the clock go back, so the high-water mark covers only reads
\* of an altered clock. Expected: ReadsMonotonic broken.
