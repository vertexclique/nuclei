\* A stream to a loopback address on macOS, two bytes behind and one in the kernel: after the drain the close waits
\* until the kernel holds no byte unacknowledged or the time the linger has left ran out, so the reset overtakes no data unless the
\* cap ran out first; the socket closes.
SPECIFICATION Spec              \* the algorithm, every actor but the drain's clock weakly fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 2            \* bytes behind as the handle drops
    Kernel = 1           \* bytes in the kernel's queue as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Platform = "mac_loopback"
    Acks = TRUE          \* whether the peer's kernel acknowledges
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DrainedBeforeClose
PROPERTIES                     \* must hold over every behaviour
    ResetOrBound
    Closes
