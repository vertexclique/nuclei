\* A stream to a loopback address on macOS, one byte behind, with a peer that never acknowledges: after the drain the
\* wait for the acknowledgement is ended by its cap, and the socket closes, never held for the drain's time.
SPECIFICATION Spec              \* the algorithm, every actor but the drain's clock weakly fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 1            \* bytes behind as the handle drops
    Kernel = 0           \* bytes in the kernel's queue as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Platform = "mac_loopback"
    Acks = FALSE          \* whether the peer's kernel acknowledges
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DrainedBeforeClose
PROPERTIES                     \* must hold over every behaviour
    Closes
