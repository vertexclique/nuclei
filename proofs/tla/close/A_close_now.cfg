\* Any stream but one to macOS's loopback: two bytes behind and one in the kernel as the handle drops. The drain
\* hands nuclei's write-behind to the kernel and the close comes at once, with no wait for acknowledgements: the
\* wire keeps its order, so the reset comes after the data and the reader takes it.
SPECIFICATION Spec              \* the algorithm, every actor but the drain's clock weakly fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 2            \* bytes behind as the handle drops
    Kernel = 1           \* bytes in the kernel's queue as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Platform = "other"
    Acks = TRUE          \* whether the peer's kernel acknowledges
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DrainedBeforeClose
PROPERTIES                     \* must hold over every behaviour
    ResetOrBound
    Closes
