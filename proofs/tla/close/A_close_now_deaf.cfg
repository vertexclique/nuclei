\* Any stream but one to macOS's loopback, one byte behind, with a peer that never acknowledges: the drain hands the
\* byte to the kernel, which has room for it, and the close comes at once after, never held by the peer. (A peer that
\* never acknowledges a full queue holds the drain for its time, write_behind_linger, as it holds any drain.)
SPECIFICATION Spec              \* the algorithm, every actor but the drain's clock weakly fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 1            \* bytes behind as the handle drops
    Kernel = 0           \* bytes in the kernel's queue as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Platform = "other"
    Acks = FALSE          \* whether the peer's kernel acknowledges
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DrainedBeforeClose
PROPERTIES                     \* must hold over every behaviour
    Closes
