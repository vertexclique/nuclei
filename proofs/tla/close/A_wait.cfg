\* Two bytes behind as a zero-linger handle drops, a kernel queue of two: the linger drains them, waits until the
\* kernel holds nothing unacknowledged (or its time runs out), then resets: the reader takes the reset after every
\* byte, or the time ran out.
SPECIFICATION Spec              \* the algorithm, the clock alone not fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 2            \* bytes behind as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Mutation = "none"    \* the rule this run takes away, if any
INVARIANTS                     \* must hold in every reachable state
    WholeBeforeReset
PROPERTIES                     \* must hold over every behaviour
    ResetOrDeadline
