\* Nothing behind as a zero-linger handle drops, two bytes its writes handed the kernel, a queue of two: the kernel
\* still holds bytes the peer has not acknowledged, so a linger task takes the socket, waits until it holds none (or
\* its time runs out), then resets: the reader takes the reset after every byte, or the time ran out.
SPECIFICATION Spec              \* the algorithm, the clock alone not fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 0            \* bytes behind as the handle drops
    Kernel = 2           \* bytes in the kernel's queue as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Mutation = "none"    \* the rule this run takes away, if any
INVARIANTS                     \* must hold in every reachable state
    WholeBeforeReset
PROPERTIES                     \* must hold over every behaviour
    ResetOrDeadline
