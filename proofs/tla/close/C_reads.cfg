\* A peer that reads: every one of the five ends, chosen after two bytes written and a kernel queue of one.
\* Each must keep every byte or reset: no FIN before a byte the peer never got, an abort that resets and
\* never drains, nothing made up; and every process ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Bytes = 2            \* bytes written before the end: one more than the kernel's queue holds
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"shut_write", "shut_both", "shut_read", "abort", "drop"} \* every end
    Peer = "reads"       \* the peer takes what comes
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    Conserved
    FinMeansWhole
    AbortResets
    AbortDoesNotDrain
PROPERTIES                     \* must hold over every behaviour
    Termination
