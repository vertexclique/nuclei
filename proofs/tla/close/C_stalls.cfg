\* A peer that never reads: an abort, or a drop whose linger runs out of time with a byte still behind (two
\* written, the kernel's queue holds one). Each ends with a reset, never a FIN, and every process ends. A shut
\* of the writing half is left out: it waits for the peer, as std's blocking shutdown after a blocking write does.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Bytes = 2            \* bytes written before the end: one stays behind
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"abort", "drop"} \* the ends that need no reading peer
    Peer = "stalls"      \* the peer never reads
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    Conserved
    FinMeansWhole
    AbortResets
    AbortDoesNotDrain
PROPERTIES                     \* must hold over every behaviour
    Termination
