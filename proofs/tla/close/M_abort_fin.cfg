\* MUTATION abort_fin: an abort drops the bytes behind and closes without SO_LINGER 0. The close is a plain one,
\* whose FIN reaches the peer after the bytes the kernel queued: a cut stream that ends as a whole one.
\* Expected: FinMeansWhole broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the end
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"abort"}     \* the abort this run breaks
    Peer = "reads"       \* the peer takes what comes, the FIN with it
    Mutation = "abort_fin" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    FinMeansWhole
