\* MUTATION both_first: a shut of both halves asks the kernel at once, with a byte still behind: as with the
\* writing half alone, the FIN comes after a cut stream. Expected: FinMeansWhole broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the end
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"shut_both"} \* the shut this run breaks
    Peer = "reads"       \* the peer takes what comes, the FIN with it
    Mutation = "both_first" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    FinMeansWhole
