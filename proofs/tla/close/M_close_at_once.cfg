\* MUTATION close_at_once: on macOS's loopback a drop with nothing behind closes at once, though its kernel holds bytes
\* unacknowledged, and the reset overtakes them. Expected: ResetOrBound broken.
SPECIFICATION Spec              \* the algorithm, every actor but the drain's clock weakly fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 0            \* bytes behind as the handle drops
    Kernel = 2           \* bytes in the kernel's queue as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Platform = "mac_loopback"
    Acks = TRUE          \* whether the peer's kernel acknowledges
    Mutation = "close_at_once"
PROPERTIES                     \* must hold over every behaviour
    ResetOrBound
