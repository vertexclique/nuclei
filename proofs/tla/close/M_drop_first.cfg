\* MUTATION drop_first: the handle drops what it read ahead before the kernel shuts the half, not after. The
\* driver reads the queued byte ahead in between, the kernel drops nothing more, and the task reads it after
\* the shut, which std's read never returns. Expected: AsStd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "other"   \* the kernel drops its queue
    Mutation = "drop_first" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    AsStd
