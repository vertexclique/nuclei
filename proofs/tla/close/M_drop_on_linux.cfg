\* MUTATION drop_on_linux: the handle drops what it read ahead on Linux too, whose kernel keeps its queue
\* readable: the task misses bytes std's reads return. Expected: AsStd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "linux"   \* the kernel keeps its queue readable
    Mutation = "drop_on_linux" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    AsStd
