\* MUTATION expiry_fin: a linger whose time runs out with a byte behind closes as a plain close, as the code did
\* before the linger was a setting: the peer, slow but reading, gets the FIN after a cut stream.
\* Expected: FinMeansWhole broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the end
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"drop"}      \* the drop whose linger runs out
    Peer = "reads"       \* the peer reads, too late for the linger
    Mutation = "expiry_fin" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    FinMeansWhole
