\* MUTATION keep_ahead: where the kernel drops its queue, the handle keeps what it read ahead, so the task's
\* reads after the shut return a byte std's never would. Expected: AsStd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "other"   \* the kernel drops its queue
    Mutation = "keep_ahead" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    AsStd
