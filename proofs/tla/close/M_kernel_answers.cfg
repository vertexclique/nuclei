\* MUTATION kernel_answers (Windows): the side is not marked shut as it drops its read-ahead, so the task's read
\* after the shut goes to the kernel, which answers it with an error where unix answers the end. Expected:
\* AnswersEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "windows"
    PortFilled = FALSE
    Mutation = "kernel_answers"
INVARIANTS                     \* must hold in every reachable state
    AnswersEnd
