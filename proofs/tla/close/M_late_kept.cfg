\* MUTATION late_kept (the code before, Windows): a completion port's receive takes the queued byte before the
\* shutdown, and its completion reaches the side after the shut; its byte becomes read-ahead whatever the side's mark
\* says, and the task's read returns it where std's answers the end. Expected: AsStd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "windows"
    PortFilled = TRUE
    Mutation = "late_kept"
INVARIANTS                     \* must hold in every reachable state
    AsStd
