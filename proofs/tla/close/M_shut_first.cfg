\* MUTATION shut_first: a shut of the writing half asks the kernel at once, with a byte still behind. The kernel
\* refuses that byte once the half is shut and sends the FIN after the one it queued, so the peer takes a cut
\* stream for a whole one. Expected: FinMeansWhole broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the end
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"shut_write"} \* the shut this run breaks
    Peer = "reads"       \* the peer takes what comes, the FIN with it
    Mutation = "shut_first" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    FinMeansWhole
