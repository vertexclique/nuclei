\* Linux: two bytes unread, one read ahead, the other in the kernel's queue. After the shut of the reading half
\* the task reads both, then the end, as std's reads do after its shutdown; and the task and the driver end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "linux"   \* the kernel keeps its queue readable
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    AsStd
PROPERTIES                     \* must hold over every behaviour
    Termination
