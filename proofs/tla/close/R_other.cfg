\* macOS, the other BSDs and Windows: two bytes unread, one read ahead, the other in the kernel's queue, which
\* the kernel drops as it shuts the half. The handle drops what it read ahead, wherever the driver's reads
\* left it, so the task's first read after the shut answers the end, as std's does; and both processes end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "other"   \* the kernel drops its queue
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    AsStd
PROPERTIES                     \* must hold over every behaviour
    Termination
