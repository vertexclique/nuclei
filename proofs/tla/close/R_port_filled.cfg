\* Windows: a completion port's receive takes the queued byte before the shutdown, and its completion reaches the
\* side after the shut dropped the read-ahead. The side is marked shut by then, so the byte is dropped as it comes
\* and the task's read answers the end, as std's does.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "windows"
    PortFilled = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    AsStd
    AnswersEnd
PROPERTIES                     \* must hold over every behaviour
    Termination
