\* Windows: two bytes unread, one read ahead, the other in the kernel's queue, which the kernel drops as it shuts the
\* half, and a read made after the shutdown the kernel would answer with an error. The handle drops what it read
\* ahead and marks the side shut, so the task's reads after the shut answer the end, as on unix, with no call.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "windows"
    PortFilled = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    AsStd
    AnswersEnd
PROPERTIES                     \* must hold over every behaviour
    Termination
