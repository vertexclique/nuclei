\* WITNESS: on macOS's loopback the cap runs out with data still on the wire and the reset is lost: the bet the cap makes
\* is that the loopback acknowledges within it. Expected: NoCapLoss broken.
SPECIFICATION Spec              \* the algorithm, every actor but the drain's clock weakly fair
CHECK_DEADLOCK FALSE           \* actors that are done wait for nothing
CONSTANTS
    Bytes = 2            \* bytes behind as the handle drops
    Kernel = 0           \* bytes in the kernel's queue as the handle drops
    Room = 2             \* bytes the kernel's queue holds
    Platform = "mac_loopback"
    Acks = TRUE          \* whether the peer's kernel acknowledges
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoCapLoss
