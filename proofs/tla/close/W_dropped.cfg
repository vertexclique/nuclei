\* WITNESS: where the kernel drops its queue, the handle's drop of its read-ahead drops a byte, which the run
\* must reach to show it checks that drop at all. Expected: NothingDropped broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "other"   \* the kernel drops its queue
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NothingDropped
