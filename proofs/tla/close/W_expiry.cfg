\* WITNESS: a dropped handle's linger runs out of time with a byte behind, which the run must reach to show it
\* checks what an expired linger does. Expected: NoExpiry broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the end
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"drop"}      \* a drop with a byte behind
    Peer = "stalls"      \* the peer never reads
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoExpiry
