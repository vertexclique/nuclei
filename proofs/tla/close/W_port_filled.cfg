\* WITNESS (the code as it is, Windows): a completion port's receive takes the queued byte before the shutdown,
\* and its completion reaches the side after the shut dropped the read-ahead; the byte becomes read-ahead after
\* the shut, and the task's read returns it where std's answers the end. How the shut is to drop it is the
\* operator's to decide. Expected: AsStd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* safety only
CONSTANTS
    Sent = 2             \* bytes the peer sent that the task has not read
    Ahead = 1            \* of them, read ahead before the shut
    Platform = "other"   \* the kernel drops its queue (Windows)
    PortFilled = TRUE    \* a port's receive took the queued byte before the shutdown
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    AsStd
