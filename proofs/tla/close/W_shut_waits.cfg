\* WITNESS: a shut of the writing half finds bytes behind and waits for them, which the run must reach to show
\* it checks a shut that drains. Expected: NoShutWait broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the end
    Room = 1             \* bytes the kernel's send queue holds
    Ends = {"shut_write"} \* a shut of the writing half
    Peer = "reads"       \* the peer takes what comes
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoShutWait
