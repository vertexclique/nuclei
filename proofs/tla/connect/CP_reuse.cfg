\* Two ports, two destinations, five connects: with the option, a connect fails only where std's would.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the client ends once its connects are made
CONSTANTS
    Ports = 2            \* ephemeral ports the system has
    Dests = 2            \* destinations the client connects to
    Conns = 5            \* connects the client makes
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    AsStd
