\* MUTATION ealready_error: a dial sent again after the move's cancel finds the socket connecting, and its
\* EALREADY is taken as the connect's error, though the socket connects. Expected: OneResult broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process that waits for good is what the properties catch
CONSTANTS
    Backend = "ring"           \* the backend
    Refused = TRUE             \* the peer may refuse
    Moves = TRUE               \* the source moves once while an operation is out
    Drops = FALSE               \* the caller may drop the future
    Mutation = "ealready_error"
INVARIANTS                     \* must hold in every reachable state
    OneResult
