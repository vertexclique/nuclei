\* MUTATION fresh_socket: the connect after a full backlog is made on a socket the connect makes itself, so the
\* stream comes back without the options its caller set. Expected: OwnSocket broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Accepts = TRUE       \* the place frees, for the new socket
    Mutation = "fresh_socket" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    OwnSocket
