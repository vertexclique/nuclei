\* MUTATION no_retry: a full backlog's EAGAIN goes back to the caller, where std's blocking connect waits for a
\* place. Expected: NoWouldBlock broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Accepts = TRUE       \* the place would free
    Mutation = "no_retry" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoWouldBlock
