\* MUTATION pool: the old way. A full backlog drops the socket and makes a blocking connect of a new one on a pool
\* thread; the caller drops the future, and the thread stays blocked in a connect nothing waits for.
\* Expected: FreedOnDrop broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Accepts = FALSE      \* the place never frees, so the thread never returns
    Mutation = "pool"    \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    FreedOnDrop
