\* A listener that accepts: the connect meets the full backlog, pauses and connects again on its own socket once
\* the place frees, or its caller drops it first. It never answers EAGAIN, never hands back another socket,
\* never says it connected without a connection, holds no pool thread; and it answers, every process ending.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Accepts = TRUE       \* the listener frees its place
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWouldBlock
    OwnSocket
    OkMeansQueued
    FreedOnDrop
PROPERTIES                     \* must hold over every behaviour
    Termination
