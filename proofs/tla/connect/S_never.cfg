\* A listener that never accepts: the connect waits for as long as its caller lets it, as std's blocking connect
\* does, and a drop of its future at any await frees everything. Termination is not checked: nothing ends the
\* wait but the caller.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Accepts = FALSE      \* the listener keeps its place taken
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWouldBlock
    OwnSocket
    OkMeansQueued
    FreedOnDrop
