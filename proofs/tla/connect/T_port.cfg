\* On a port: ConnectEx ends with the decision; the caller hears its socket's verdict, and hears it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process that waits for good is what the properties catch
CONSTANTS
    Backend = "port"           \* the backend
    Refused = TRUE             \* the peer may refuse
    Moves = FALSE               \* the source moves once while an operation is out
    Drops = FALSE               \* the caller may drop the future
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneResult
PROPERTIES                     \* must hold over every behaviour
    Termination
