\* On epoll and kqueue: connect(2) in progress (or connected at once), the write edge, the socket's error; the
\* caller hears its socket's verdict, and hears it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process that waits for good is what the properties catch
CONSTANTS
    Backend = "readiness"           \* the backend
    Refused = TRUE             \* the peer may refuse
    Moves = FALSE               \* the source moves once while an operation is out
    Drops = FALSE               \* the caller may drop the future
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneResult
PROPERTIES                     \* must hold over every behaviour
    Termination
