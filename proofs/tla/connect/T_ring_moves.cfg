\* On a ring whose source moves while an operation is out: the cancel gives the dial back, it is sent again,
\* and the EALREADY (then a poll and the socket's error), EISCONN or refusal it finds end it as the socket
\* decided.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process that waits for good is what the properties catch
CONSTANTS
    Backend = "ring"           \* the backend
    Refused = TRUE             \* the peer may refuse
    Moves = TRUE               \* the source moves once while an operation is out
    Drops = FALSE               \* the caller may drop the future
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneResult
PROPERTIES                     \* must hold over every behaviour
    Termination
