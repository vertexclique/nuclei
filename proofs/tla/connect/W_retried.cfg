\* WITNESS: a connect meets the full backlog, pauses, and connects on its own socket once the listener freed the
\* place, which the run must reach to show it checks the retry at all. Expected: NeverRetried broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Accepts = TRUE       \* the listener frees its place
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NeverRetried
