\* Three acquires of a lock another thread also takes once, with a budget of two: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Acqs            \* three acquires
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
