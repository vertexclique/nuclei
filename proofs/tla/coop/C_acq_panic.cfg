\* Three acquires of a lock another thread also takes once, with a budget of two, the refusal's
\* wake of the hot task panicking: the refused acquire gave the lock back first, so no lock is
\* lost, the queued thread is served, and every thread ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Acqs            \* three acquires
    WakePanics = TRUE      \* the refusal's wake panics
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
PROPERTIES                     \* must hold over every behaviour
    Termination
