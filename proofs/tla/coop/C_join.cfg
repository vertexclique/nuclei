\* Three awaits of handles whose tasks already finished, with a budget of two: the third is refused
\* and the task yields to the other one. Every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Joins           \* three finished handles awaited
    WakePanics = FALSE     \* every waker works
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
