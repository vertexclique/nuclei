\* Liveness: the awaits of three finished handles all complete, the other task runs, and every
\* thread ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Joins           \* three finished handles awaited
    WakePanics = FALSE     \* every waker works
    Mutation = "none"      \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
