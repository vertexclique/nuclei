\* Two receives, a `block_on` nested in the poll whose future receives with its own budget, and two
\* more, with a budget of two: the task's budget is put back after the nested poll. Every safety
\* property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Nested          \* a nested block_on between receives
    WakePanics = FALSE     \* every waker works
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
