\* An IO operation that answers Pending, then two receives, with a budget of two: the Pending one
\* gets its spend back, so the poll completes both receives. Every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Pended          \* an IO poll that answers Pending, then two receives
    WakePanics = FALSE     \* every waker works
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
