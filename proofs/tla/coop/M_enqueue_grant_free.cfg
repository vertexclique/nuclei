\* MUTATION enqueue_grant_free: an acquire whose first attempt fails queues, the other thread lets go of the lock in between, and the pass of the queueing grants it at once; the grant completes the acquire in the same poll and spends nothing, so a poll completes more than its budget. Expected: BoundedPoll broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Acqs            \* three acquires
    Mutation = "enqueue_grant_free"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedPoll
