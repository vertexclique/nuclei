\* MUTATION give_back_no_serve: a refused acquire gives the lock back free and serves nobody, so the thread that queued while the hot task held it waits while the lock is free. Expected: NoIdleWhileQueued broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Acqs            \* three acquires
    Mutation = "give_back_no_serve"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoIdleWhileQueued
