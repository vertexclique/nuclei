\* MUTATION join_free: the await of a finished handle spends nothing and is never refused, as today's
\* `Task::poll`: a loop over finished handles takes every output in one poll, never yielding to the
\* other task. Expected: BoundedPoll broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Joins           \* three finished handles awaited
    WakePanics = FALSE     \* every waker works
    Mutation = "join_free" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedPoll
