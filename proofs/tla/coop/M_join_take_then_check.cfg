\* MUTATION join_take_then_check: the await of a finished handle takes the output before it looks at
\* the budget, and a refusal throws the output away. Expected: NoValueLost broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Joins           \* three finished handles awaited
    WakePanics = FALSE     \* every waker works
    Mutation = "join_take_then_check" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoValueLost
