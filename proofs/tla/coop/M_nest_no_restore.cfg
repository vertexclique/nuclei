\* MUTATION nest_no_restore: the task's poll goes on with the budget its nested `block_on` left, not
\* its own. After two receives the poll had nothing left, the nested poll left one of its fresh two,
\* and the task completes a third. Expected: BoundedPoll broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Nested          \* a nested block_on between receives
    WakePanics = FALSE     \* every waker works
    Mutation = "nest_no_restore" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedPoll
