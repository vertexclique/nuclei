\* MUTATION no_spend: an operation that completes spends nothing, so the hot task completes its whole program in one poll and the other task waits for all of it. Expected: BoundedPoll broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Recvs           \* three receives
    Mutation = "no_spend"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedPoll
