\* MUTATION no_wake: a refused receive ends the poll without waking its task, so nobody ever polls the hot task again. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Recvs           \* three receives
    Mutation = "no_wake"    \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Termination
