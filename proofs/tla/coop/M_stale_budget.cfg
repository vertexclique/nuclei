\* MUTATION stale_budget: a poll starts with what the last one left instead of a fresh budget. The
\* first poll spends both, and every later one starts spent: the hot task is refused again and again
\* and never completes its third receive. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Recvs           \* three receives
    WakePanics = FALSE     \* every waker works
    Mutation = "stale_budget" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Termination
