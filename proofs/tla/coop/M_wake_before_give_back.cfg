\* MUTATION wake_before_give_back: a refused acquire wakes its task before it gives the lock back,
\* as `coop::spend` did inside `taken_at_once` and `FairWait::poll_admitted`. A wake that panics
\* unwinds the poll with the lock taken and never given back. Expected: Conservation broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Budget = 2             \* two operations per poll
    Ops <- Acqs            \* three acquires
    WakePanics = TRUE      \* the refusal's wake panics
    Mutation = "wake_before_give_back"
INVARIANTS                     \* must hold in every reachable state
    Conservation
