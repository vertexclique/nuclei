\* The arrivals' use: three arrivals while another thread holds the read side twice, takes that
\* may fail on a fence, and the owner's nudge. In order, no pop past the queue, and every arrival in.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Producers = {}              \* (the returns' use only)
    Items = 3                   \* three arrivals
    Holds = 2                   \* the other thread holds the side twice
    Ring = TRUE                 \* the arrivals' use
    Mutation = "none"           \* no rule taken away
INVARIANTS                      \* must hold in every reachable state
    InOrder
    NoPastEnd
PROPERTIES                      \* must hold over every behaviour
    AllTaken
