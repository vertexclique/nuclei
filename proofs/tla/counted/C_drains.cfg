\* Two threads post two items each while the shard takes them and a thread that posts to the
\* stopped shard drains at once with it: none taken twice or out of its poster's order, and every
\* item taken, the count below zero for a moment or not.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Producers = {"p1", "p2"}    \* two threads post
    Items = 2                   \* two each
    Drainers = {"d1"}           \* one drains at once with the shard
    Holds = 0                   \* (the arrivals' use only)
    Ring = FALSE                \* the shard's use
    Mutation = "none"           \* no rule taken away
INVARIANTS                      \* must hold in every reachable state
    InOrder
PROPERTIES                      \* must hold over every behaviour
    AllTaken
