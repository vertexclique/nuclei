\* The returns' use: two threads give two chunks back each while the ring's thread takes them in.
\* No chunk taken twice or out of its thread's order, no pop past the queue, and every chunk in.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Producers = {"p1", "p2"}    \* two threads give chunks back
    Items = 2                   \* two each
    Holds = 0                   \* (the arrivals' use only)
    Ring = FALSE                \* the returns' use
    Mutation = "none"           \* no rule taken away
INVARIANTS                      \* must hold in every reachable state
    InOrder
    NoPastEnd
PROPERTIES                      \* must hold over every behaviour
    AllTaken
