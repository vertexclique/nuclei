\* MUTATION count_first: a push counts its chunk before it claims the queue's cell, so the count
\* says more than the queue holds and the ring's thread pops a cell that is not there.
\* Expected: NoPastEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE            \* a stuck process is not what this run looks for
CONSTANTS
    Producers = {"p1", "p2"}    \* two threads give chunks back
    Items = 1                   \* one each
    Drainers = {}               \* no drainer
    Holds = 0                   \* (the arrivals' use only)
    Ring = FALSE                \* the returns' use
    Mutation = "count_first"    \* the rule this run takes away
INVARIANTS                      \* must hold in every reachable state
    NoPastEnd
