\* MUTATION count_late: the ring's thread counts a queued arrival only after it left ARRIVALS, so
\* the holder that does the work finds a count of zero and the arrival stays queued with nothing
\* left to take it. Expected: AllTaken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE            \* a stuck process is not what this run looks for
CONSTANTS
    Producers = {}              \* (the returns' use only)
    Items = 2                   \* two arrivals
    Drainers = {}               \* no drainer
    Holds = 1                   \* the other thread holds the side once
    Ring = TRUE                 \* the arrivals' use
    Mutation = "count_late"     \* the rule this run takes away
PROPERTIES                      \* must hold over every behaviour
    AllTaken
