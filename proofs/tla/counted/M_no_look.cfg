\* MUTATION no_look: the ring's thread, holding the read side, hands its arrival in with no look at
\* the queue, so it goes in ahead of an arrival queued before it. Expected: InOrder broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE            \* a stuck process is not what this run looks for
CONSTANTS
    Producers = {}              \* (the returns' use only)
    Items = 2                   \* two arrivals
    Drainers = {}               \* no drainer
    Holds = 1                   \* the other thread holds the side once
    Ring = TRUE                 \* the arrivals' use
    Mutation = "no_look"        \* the rule this run takes away
INVARIANTS                      \* must hold in every reachable state
    InOrder
