\* MUTATION sub_read: a pass that stops at a push still writing its cell takes the count it read
\* off the count, not what it popped, so a chunk stays in the queue with a count of zero and is
\* never taken in. Expected: AllTaken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE            \* a stuck process is not what this run looks for
CONSTANTS
    Producers = {"p1", "p2"}    \* two threads give chunks back
    Items = 1                   \* one each
    Holds = 0                   \* (the arrivals' use only)
    Ring = FALSE                \* the returns' use
    Mutation = "sub_read"       \* the rule this run takes away
PROPERTIES                      \* must hold over every behaviour
    AllTaken
