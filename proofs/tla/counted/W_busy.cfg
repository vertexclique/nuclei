\* WITNESS: a pass of the ring's thread stops at a push still writing its cell, and the chunk
\* counted behind it waits for the next pass. Expected: NoBusy broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Producers = {"p1", "p2"}    \* two threads give chunks back
    Items = 1                   \* one each
    Drainers = {}               \* no drainer
    Holds = 0                   \* (the arrivals' use only)
    Ring = FALSE                \* the returns' use
    Mutation = "none"           \* no rule taken away
INVARIANTS                      \* must hold in every reachable state
    NoBusy
