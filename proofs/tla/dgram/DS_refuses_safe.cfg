\* As DS_safe on a kernel that refuses a datagram with no room and raises no writable edge for a read (FreeBSD's Unix datagram socket): the datagrams the kernel took reach the peer once, in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Refuses = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    InOrder
