\* MUTATION refusal_waits: the call takes the kernel's refusal (`ENOBUFS`) for "not now" and waits for a writable edge, which a FreeBSD Unix datagram socket's reads never raise: the call waits forever. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Refuses = TRUE
    Mutation = "refusal_waits"
PROPERTIES                     \* must hold over every behaviour
    Termination
