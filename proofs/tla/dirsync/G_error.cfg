\* F_FULLFSYNC fails with an I/O error: the error is the answer, with no weaker call after it.
SPECIFICATION Spec              \* the algorithm, weakly fair
CONSTANTS
    Takes = {"full", "barrier", "plain"}
    Fails = "full"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StrongestMade
    NoOkWithoutSync
    ErrorStands
PROPERTIES                     \* must hold of every behaviour
    Termination
