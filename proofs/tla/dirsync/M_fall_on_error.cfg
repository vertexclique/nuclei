\* MUTATION fall_on_error: an I/O error of F_FULLFSYNC falls back as a refusal would, and the
\* weaker call answers Ok. Expected: ErrorStands broken.
SPECIFICATION Spec              \* the algorithm, weakly fair
CHECK_DEADLOCK FALSE           \* the run looks for one broken invariant
CONSTANTS
    Takes = {"full", "barrier", "plain"}
    Fails = "full"
    Mutation = "fall_on_error"
INVARIANTS                     \* must hold in every reachable state
    ErrorStands
