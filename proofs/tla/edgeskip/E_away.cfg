\* The side's claim stayed with a thread that no longer runs the driver, and that thread writes with its stores
\* in its own buffer: the driver passes over no edge of a side biased to another thread, so it never reads that
\* thread's stale idle; the write goes out, no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Spurious = FALSE      \* an edge for nobody comes first
    Writer = "away"       \* who writes
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    WriteGoes
