\* A biased side: an edge for nobody, then a foreign write the socket may refuse. The driver passes
\* over the first edge, never the one the refused write waits for: the write goes out, no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Spurious = TRUE      \* an edge for nobody comes first
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    WriteGoes
