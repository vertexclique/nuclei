\* The owner thread writes, its polls between the driver's events: an edge for nobody is passed over, never the
\* one its refused write waits for, whose release published that an edge is wanted; the write goes out, no
\* deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Spurious = TRUE      \* an edge for nobody comes first
    Writer = "owner"       \* who writes
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    WriteGoes
