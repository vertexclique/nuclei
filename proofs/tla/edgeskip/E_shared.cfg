\* A side made shared (no heavy fence in the process): the driver never passes over an edge, and the
\* foreign write goes out, no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = FALSE       \* the side starts shared
    Spurious = TRUE      \* an edge for nobody comes first
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    WriteGoes
