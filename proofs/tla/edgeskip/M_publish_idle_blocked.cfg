\* MUTATION publish_idle_blocked: the owner's release publishes the side idle though its write was refused and
\* it waits for an edge; the driver passes over that edge and the write waits for good. Expected: deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Spurious = FALSE      \* an edge for nobody comes first
    Writer = "owner"       \* who writes
    Mutation = "publish_idle_blocked"
PROPERTIES                     \* must hold over every behaviour
    WriteGoes
