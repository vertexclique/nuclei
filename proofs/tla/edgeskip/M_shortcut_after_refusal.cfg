\* MUTATION shortcut_after_refusal: the owner's release takes the `published` shortcut, idle with no look,
\* after a write the socket refused too; the driver passes over the edge it waits for. Expected: deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Spurious = FALSE      \* an edge for nobody comes first
    Writer = "owner"       \* who writes
    Mutation = "shortcut_after_refusal"
PROPERTIES                     \* must hold over every behaviour
    WriteGoes
