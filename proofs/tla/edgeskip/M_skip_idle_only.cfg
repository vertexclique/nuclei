\* MUTATION skip_idle_only: the driver's look reads `write_idle` alone. The edge a foreign writer's
\* refused write waits for comes while that writer still holds the side, its not-idle store still
\* in its buffer: the driver passes over it, and the writer waits for good. Expected: deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Spurious = FALSE     \* no edge for nobody
    Writer = "foreign"       \* a task on another thread writes
    Mutation = "skip_idle_only"  \* the rule this run takes away
