\* MUTATION skip_no_owner: the driver's look leaves out the claim's compare with its own thread, and reads the
\* idle the claimant's release left before its refusal's store landed; it passes over the edge the write waits
\* for. Expected: deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Spurious = FALSE      \* an edge for nobody comes first
    Writer = "away"       \* who writes
    Mutation = "skip_no_owner"
PROPERTIES                     \* must hold over every behaviour
    WriteGoes
