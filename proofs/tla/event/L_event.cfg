\* Two waiters and an event set twice: every safety property, and both end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- TwoAwait
    Counters = 0
    Count = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyWake
    LatchOpensAtZero
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    AllWokenAfterSet
