\* A waiter dropped beside one that awaits, and the event set: every safety
\* property, and the awaiting one ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- DropAwait
    Counters = 0
    Count = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyWake
    LatchOpensAtZero
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    AllWokenAfterSet
