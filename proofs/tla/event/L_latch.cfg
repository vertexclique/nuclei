\* Two waiters and a latch of two counted down by two threads: every safety
\* property, the latch opens when counted, and both waiters end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- TwoAwait
    Counters = 2
    Count = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyWake
    LatchOpensAtZero
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    AllWokenAfterSet
    OpensWhenCounted
