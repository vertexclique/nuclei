\* A latch of two counted down by three threads (the third finds it open): every
\* safety property, and both waiters end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- TwoAwait
    Counters = 3
    Count = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoEarlyWake
    LatchOpensAtZero
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    AllWokenAfterSet
    OpensWhenCounted
