\* MUTATION exit_ignores_dirty: the drain gives its role up over a change made
\* during its pass. Expected: NoStrandedArrival broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- TwoAwait
    Counters = 0
    Count = 2
    Mutation = "exit_ignores_dirty"
INVARIANTS                     \* must hold in every reachable state
    NoStrandedArrival
