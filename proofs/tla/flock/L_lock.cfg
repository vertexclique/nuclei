\* A free file, the future dropped wherever it waits or never: the call that never waits locks it and the
\* same step returns it, so once the caller is done the file is locked only if the caller holds the lock, and it ends.
SPECIFICATION Spec              \* the algorithm; the other process and the caller's drop are not fair
CHECK_DEADLOCK FALSE           \* the timer waits for good once the caller is done
CONSTANTS
    CanFail = FALSE
    Outsider = FALSE
    Threads = 1
    Write = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
    ReturnedIsHeld
PROPERTIES                     \* must hold of every behaviour
    EndsOnceFree
