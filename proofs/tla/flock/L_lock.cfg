\* A lock that always succeeds, with the future dropped at any point: once both are done the file
\* is locked only if the caller holds the lock, a returned lock is held, and both always end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    CanFail = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
    ReturnedIsHeld
PROPERTIES                     \* must hold of every behaviour
    EveryoneEnds
