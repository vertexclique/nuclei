\* Another process holds the lock and may never let go, and the pool has one thread: the lock keeps no thread
\* (its calls never wait, on the caller's thread), so a write of the file made once the future is gone runs.
SPECIFICATION Spec              \* the algorithm; the other process and the caller's drop are not fair
CHECK_DEADLOCK FALSE           \* the timer waits for good once the caller is done
CONSTANTS
    CanFail = FALSE
    Outsider = TRUE
    Threads = 1
    Write = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
    ReturnedIsHeld
PROPERTIES                     \* must hold of every behaviour
    WriteServed
    EndsOnceFree
