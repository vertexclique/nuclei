\* As L_lock, with a blocking lock that may fail: a failed lock leaves nothing locked.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    CanFail = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
    ReturnedIsHeld
PROPERTIES                     \* must hold of every behaviour
    EveryoneEnds
