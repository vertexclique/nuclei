\* Another process holds the lock at first and the call may fail: the future sleeps on its timer and asks again,
\* or is dropped while it sleeps holding nothing; once the other process let go it gets the lock or its error.
SPECIFICATION Spec              \* the algorithm; the other process and the caller's drop are not fair
CHECK_DEADLOCK FALSE           \* the timer waits for good once the caller is done
CONSTANTS
    CanFail = TRUE
    Outsider = TRUE
    Threads = 1
    Write = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
    ReturnedIsHeld
PROPERTIES                     \* must hold of every behaviour
    EndsOnceFree
