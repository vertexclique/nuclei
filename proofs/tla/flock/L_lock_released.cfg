\* Another process holds the lock at first and the pool has two threads: the lock's job waits on one of them, and
\* a write made once the future is gone runs on the other. Once both are done the file is locked only if the
\* caller holds the lock.
SPECIFICATION Spec              \* the algorithm; the other process is not fair
CHECK_DEADLOCK FALSE           \* the job may wait for good on the other process
CONSTANTS
    CanFail = TRUE             \* the lock may fail
    Outsider = TRUE            \* another process holds the lock at first
    Threads = 2                \* two threads: the write has one of its own
    Write = TRUE               \* a write of the file comes once the future is gone
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
    ReturnedIsHeld
PROPERTIES                     \* must hold of every behaviour
    WriteServed
