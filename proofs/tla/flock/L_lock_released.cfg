\* Another process holds the lock at first, the call may fail and the pool has two threads: a write made once
\* the future is gone runs, and once both are done the file is locked only if the caller holds the lock.
SPECIFICATION Spec              \* the algorithm; the other process and the caller's drop are not fair
CHECK_DEADLOCK FALSE           \* the timer waits for good once the caller is done
CONSTANTS
    CanFail = TRUE
    Outsider = TRUE
    Threads = 2
    Write = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
    ReturnedIsHeld
PROPERTIES                     \* must hold of every behaviour
    WriteServed
    EndsOnceFree
