\* MUTATION drop_ignores_held: a dropped future that finds HELD does not unlock the file. The job
\* locked the file and wrote HELD, then the future is dropped before it took the result: the lock
\* is held by nobody and is never given back.
\* Expected: NoOwnerlessLock broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a locked file at the end is not what this run looks for
CONSTANTS
    CanFail = FALSE
    Mutation = "drop_ignores_held"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
