\* MUTATION drop_reads_then_writes: the drop reads the word and writes GONE in two steps instead
\* of one swap. The job writes HELD between them: the drop read WAITING, so it unlocks nothing, and
\* its GONE then covers the job's HELD; the file stays locked with nobody to give it back.
\* Expected: NoOwnerlessLock broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a locked file at the end is not what this run looks for
CONSTANTS
    CanFail = FALSE
    Mutation = "drop_reads_then_writes"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
