\* MUTATION blocking_on_pool (the code before): the lock is a blocking call, a job of the pool that waits in the
\* kernel on the pool's one thread while another process keeps the lock for good. Dropping the future cannot reach the
\* job, so the thread stays held and a write of the same file made after the drop never runs. Expected: WriteServed broken.
SPECIFICATION Spec              \* the algorithm; the other process and the caller's drop are not fair
CHECK_DEADLOCK FALSE           \* the timer waits for good once the caller is done
CONSTANTS
    CanFail = FALSE
    Outsider = TRUE
    Threads = 1
    Write = TRUE
    Mutation = "blocking_on_pool"
PROPERTIES                     \* must hold of every behaviour
    WriteServed
