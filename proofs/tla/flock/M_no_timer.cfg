\* MUTATION no_timer: a call that finds the lock held sleeps with no timer set, and nothing wakes it: once the
\* other process let go the future still sleeps, for good. Expected: EndsOnceFree broken.
SPECIFICATION Spec              \* the algorithm; the other process and the caller's drop are not fair
CHECK_DEADLOCK FALSE           \* the timer waits for good once the caller is done
CONSTANTS
    CanFail = FALSE
    Outsider = TRUE
    Threads = 1
    Write = FALSE
    Mutation = "no_timer"
PROPERTIES                     \* must hold of every behaviour
    EndsOnceFree
