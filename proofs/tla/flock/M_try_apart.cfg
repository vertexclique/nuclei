\* MUTATION try_apart: the call that locks the file and the return of the lock are two steps, and the future is
\* dropped between them: the file stays locked with no caller to give it back. Expected: NoOwnerlessLock broken.
SPECIFICATION Spec              \* the algorithm; the other process and the caller's drop are not fair
CHECK_DEADLOCK FALSE           \* the timer waits for good once the caller is done
CONSTANTS
    CanFail = FALSE
    Outsider = FALSE
    Threads = 1
    Write = FALSE
    Mutation = "try_apart"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerlessLock
