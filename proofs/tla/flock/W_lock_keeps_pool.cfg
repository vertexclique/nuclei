\* WITNESS (the code as it is): another process holds the file's lock and never lets go. The job waits in the
\* kernel on the pool's one thread; the future is dropped, which swaps GONE but cannot reach the job there, so
\* the thread stays held, and a write of the same file made after the drop never runs. How a dropped job is to
\* let go of its thread is the operator's to decide. Expected: WriteServed broken.
SPECIFICATION Spec              \* the algorithm; the other process is not fair
CHECK_DEADLOCK FALSE           \* a job that waits for good is what the property catches
CONSTANTS
    CanFail = FALSE            \* the lock succeeds once the other process lets go
    Outsider = TRUE            \* another process holds the lock, and may never let go
    Threads = 1                \* the pool's one thread
    Write = TRUE               \* a write of the file comes once the future is gone
    Mutation = "none"
PROPERTIES                     \* must hold of every behaviour
    WriteServed
