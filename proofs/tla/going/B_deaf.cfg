\* A completion port whose peer never reads: the send out as A goes never ends, and the drain's time runs out
\* with bytes held; the drain task ends all the same, the rest given up.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = TRUE         \* one of them is out
    Cancels = FALSE      \* a port never cancels it
    PeerReads = FALSE    \* the peer never reads
    DrainTimes = TRUE    \* the drain's time may run out
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    DrainEnds
