\* A readiness poller (epoll, kqueue): two bytes wait in the write-behind and none is out as A goes. The drain task
\* registers the source with W, whose first edge writes them out: every byte reaches the kernel, and the task ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = FALSE        \* none of them is out
    Cancels = FALSE      \* nothing to cancel
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    Conserved
PROPERTIES                     \* must hold over every behaviour
    AllSent
    DrainEnds
