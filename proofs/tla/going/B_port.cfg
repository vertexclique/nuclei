\* A completion port: one byte is out with a TCP send, which the eviction leaves out, and one waits behind it. The
\* drain task cannot move the handle while the send is out; the send's end (its packet delivered by A's keeper) wakes
\* it, it registers the source with W, and W sends the rest: every byte reaches the kernel, and the task ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = TRUE         \* one of them is out
    Cancels = FALSE      \* a port never cancels a TCP send
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    Conserved
PROPERTIES                     \* must hold over every behaviour
    AllSent
    DrainEnds
