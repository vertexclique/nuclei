\* A ring: one byte is out with a send the eviction cancels, so it may come back undone, and one waits behind it. The
\* drain task registers the source with W once the cancelled send has ended, and W sends what is left: every byte
\* reaches the kernel once, and the task ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = TRUE         \* one of them is out
    Cancels = TRUE       \* the eviction cancels it
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    Conserved
PROPERTIES                     \* must hold over every behaviour
    AllSent
    DrainEnds
