\* Shard A goes and evicts the source itself, while a task on B registers it
\* again under a token of the same number: nothing stranded, everything ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Held = FALSE
    Failed = FALSE
    Poller = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStrandedOp
PROPERTIES                     \* must hold of every behaviour
    AllEnd
