\* As G_alone, with the eviction performed by a thread that holds a side as it
\* lets go: nothing stranded, everything ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Held = TRUE
    Failed = FALSE
    Poller = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStrandedOp
PROPERTIES                     \* must hold of every behaviour
    AllEnd
