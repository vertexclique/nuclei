\* MUTATION register_late: `RunAll` registers its waker after its looks, not before. It finds the list
\* empty; the push comes and its wake finds no waker to take; the run registers and sleeps with the
\* linger in the list, until its bound runs out. Expected: NoLostWake broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mutation = "register_late"
INVARIANTS                     \* must hold in every reachable state
    NoLostWake
