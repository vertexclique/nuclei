\* MUTATION bound_drops: as the drop's own bound runs out, a linger its run was running is dropped with the run,
\* as `RunAll` did: the handle's object closes with bytes never sent. Expected: AllSent broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits up to its bound
    Bound = TRUE         \* the drop's own bound may run out
    Mutation = "bound_drops" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllSent
