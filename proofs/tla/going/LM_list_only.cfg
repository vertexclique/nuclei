\* MUTATION list_only: the runtime's drop runs only what its list holds as it looks, and returns, though a linger's
\* task held by a call (a file's write a keeper finishes) hands its linger back only later: the bug of the fix's
\* first form, which left a file's last writes unlanded. Expected: DropWaits broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits
    Mutation = "list_only"
INVARIANTS                     \* must hold in every reachable state
    DropWaits
