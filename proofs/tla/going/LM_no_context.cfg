\* MUTATION no_context: the task held by its write drops where the write ends outside its runtime, so its handle's
\* linger goes to a thread of its own and the drop does not wait for it: the bug the first form of the fix had, a
\* file's last write landing after the drop returned. Expected: DropWaits broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits
    Mutation = "no_context"
INVARIANTS                     \* must hold in every reachable state
    DropWaits
