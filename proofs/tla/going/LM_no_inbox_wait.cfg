\* MUTATION no_inbox_wait: the drop does not wait for a stopped worker's inbox to be drained, so when another thread
\* drains the held task's wake after the write counted itself out, the task's linger comes after the drop returned.
\* Expected: DropWaits broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits
    Bound = FALSE        \* the drop's own bound never runs out
    Mutation = "no_inbox_wait"
INVARIANTS                     \* must hold in every reachable state
    DropWaits
