\* MUTATION pool_delivers: the task held by its write as the runtime drops is dropped on K, the blocking pool's
\* thread that ended the write, and its handle delivers the bytes there itself, as a drop off a worker does. The
\* delivery's writes wait for the pool, which is K: its linger time runs out, the bytes are given up, and the
\* drop returns without them. Expected: DropWaits broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits
    Bound = FALSE        \* the drop's own bound never runs out
    Mode = "drop"        \* the runtime drops (the process does not exit meanwhile)
    Mutation = "pool_delivers"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    DropWaits
