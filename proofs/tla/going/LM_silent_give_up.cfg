\* MUTATION silent_give_up: a linger whose write failed or whose time ran out gives the rest up without a word (the code before the fix). Expected: GiveUpSaid broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* (no drop of the runtime here)
    Bound = FALSE        \* (no drop of the runtime here)
    Mode = "exit_fail"
    Mutation = "silent_give_up"
INVARIANTS                     \* must hold in every reachable state
    GiveUpSaid
