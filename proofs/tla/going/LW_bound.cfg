\* WITNESS: the drop's own bound runs out before every byte reached the peer, which the run must reach to show it
\* checks what becomes of a linger the drop was still running. Expected: NoBoundOut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits up to its bound
    Bound = TRUE         \* the drop's own bound may run out
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoBoundOut
