\* A background shutdown: it waits for nothing, yet every byte reaches the peer, no runtime is started for a linger,
\* and every process ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = TRUE    \* the shutdown waits for nothing
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    NoDefault
PROPERTIES                     \* must hold over every behaviour
    AllSent
    Termination
