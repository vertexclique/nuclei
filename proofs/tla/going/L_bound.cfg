\* The drop's own bound runs out while a linger still runs: the drop returns early, and the linger goes on on a
\* thread of its own, as one it never took does. Every byte still reaches the peer, no runtime is started for it,
\* and every process ends. DropWaits is not checked: the bound is what lets the drop return first.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits up to its bound
    Bound = TRUE         \* the drop's own bound may run out
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    NoDefault
PROPERTIES                     \* must hold over every behaviour
    AllSent
    Termination
