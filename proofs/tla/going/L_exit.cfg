\* The process default runtime, never dropped: a task on its worker drops a file whose write-behind holds bytes, and main returns. The exit waits for the linger, so every byte reaches the file, or its loss is said.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* (no drop of the runtime here)
    Bound = FALSE        \* (no drop of the runtime here)
    Mode = "exit"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    ExitDelivers
    NoDefault
