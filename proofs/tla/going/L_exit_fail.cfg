\* As L_exit, and the linger's write may fail or its time run out: it gives the rest up and says so (a warning and a count), and the exit leaves nothing unsaid.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* (no drop of the runtime here)
    Bound = FALSE        \* (no drop of the runtime here)
    Mode = "exit_fail"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    ExitDelivers
    GiveUpSaid
    NoDefault
