\* A file dropped on a thread that is no worker (block_on's thread) delivers its write-behind before its drop returns, and the exit after it leaves nothing.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* (no drop of the runtime here)
    Bound = FALSE        \* (no drop of the runtime here)
    Mode = "off_worker"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    OffWorkerDelivers
    ExitDelivers
    NoDefault
