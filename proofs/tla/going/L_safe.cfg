\* A handle with bytes behind and a write out, dropped while its runtime runs or as the runtime drops: every safety
\* property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Total = 2            \* bytes in the handle's write-behind
    Background = FALSE   \* the runtime's drop, which waits
    Bound = FALSE        \* the drop's own bound never runs out
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TypeOK
    DropWaits
    NoDefault
