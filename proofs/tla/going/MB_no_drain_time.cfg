\* MUTATION no_drain_time: the drain has no time limit, and with a peer that never reads it waits for good.
\* Expected: DrainEnds broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = TRUE         \* one of them is out
    Cancels = FALSE      \* a port never cancels it
    PeerReads = FALSE    \* the peer never reads
    DrainTimes = TRUE    \* the drain's time may run out
    Mutation = "no_drain_time"
PROPERTIES                     \* must hold over every behaviour
    DrainEnds
