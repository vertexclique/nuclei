\* MUTATION end_first: the holder's eviction clears the registration's token and
\* shard with its state, before it posts the detach (the order before this fix).
\* A's wait ends in between, A settles with nothing in its mailbox and goes, and
\* the detach lands after: A's ring keeps the source's file and the handle's
\* object never closes. Expected: NoStrandedDetach broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Held = TRUE
    Failed = FALSE
    Poller = FALSE
    Mutation = "end_first"
INVARIANTS                     \* must hold in every reachable state
    NoStrandedDetach
