\* MUTATION keep_home: a failed ring attach leaves its shard with its token.
\* Expected: AllEnd broken (A waits for a registration that never was).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Held = FALSE
    Failed = TRUE
    Poller = FALSE
    Mutation = "keep_home"
PROPERTIES                     \* must hold of every behaviour
    AllEnd
