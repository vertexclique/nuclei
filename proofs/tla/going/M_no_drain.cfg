\* MUTATION no_drain: A goes and leaves the bytes to whoever polls the write side next, as it did before. The send out
\* ends, nobody issues the byte behind it, and the peer waits for it for good (the hang a handle written from one
\* thread and read from another met on Windows). Expected: AllSent broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = TRUE         \* one of them is out
    Cancels = FALSE      \* a port never cancels a TCP send
    Mutation = "no_drain"\* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllSent
