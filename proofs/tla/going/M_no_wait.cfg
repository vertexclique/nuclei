\* MUTATION no_wait: A looks at what is out before the holder's eviction.
\* Expected: NoStrandedOp broken (the cancel lands after A has gone).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Held = TRUE
    Failed = FALSE
    Poller = FALSE
    Mutation = "no_wait"
INVARIANTS                     \* must hold in every reachable state
    NoStrandedOp
