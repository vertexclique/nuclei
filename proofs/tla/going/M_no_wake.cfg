\* MUTATION no_wake: an operation's end wakes nobody. The drain task found the send out on its first poll and waits for
\* its end, which never wakes it, so it never registers the source and the byte behind the send stays. Expected:
\* AllSent broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = TRUE         \* one of them is out
    Cancels = FALSE      \* a port never cancels a TCP send
    Mutation = "no_wake" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllSent
