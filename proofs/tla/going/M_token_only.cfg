\* MUTATION token_only: A's wait checks the token alone. Expected: AllEnd broken
\* (A waits for B's registration, whose receive waits for A's cancel).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Held = FALSE
    Failed = FALSE
    Poller = TRUE
    Mutation = "token_only"
PROPERTIES                     \* must hold of every behaviour
    AllEnd
