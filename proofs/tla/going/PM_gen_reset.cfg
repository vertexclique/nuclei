\* MUTATION gen_reset: a drain starts the table's generations over (the code before), so a failed attach's release that comes late removes the next registration in the slot, which then stalls in no table. Expected: NoForeignRelease broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Early = FALSE            \* whether the attach names its shard before it takes the ask (a ring)
    Stalls = FALSE           \* the holder always lets go of its side in the end
    Fails = TRUE            \* whether the attach fails, the handle closed first
    Mutation = "gen_reset"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoForeignRelease
