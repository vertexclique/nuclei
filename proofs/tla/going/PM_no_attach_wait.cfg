\* MUTATION no_attach_wait: the shard waits only for a registration that names it, not for the attach still asked of it (the code before), so it leaves before the holder posts the install, whose lease then keeps the descriptor open while the shard is away. Expected: NoLeaseLeft broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Early = TRUE            \* whether the attach names its shard before it takes the ask (a ring)
    Stalls = FALSE           \* the holder always lets go of its side in the end
    Fails = FALSE            \* whether the attach fails, the handle closed first
    Mutation = "no_attach_wait"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoLeaseLeft
