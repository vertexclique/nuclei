\* MUTATION wait_unbounded: the shard's wait for the eviction has no deadline, as before the fix: a holder that stops for good while it holds its side keeps the shard, and the thread that runs it, spinning for good. Expected: WaitEnds broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Early = TRUE            \* whether the attach names its shard before it takes the ask (a ring)
    Stalls = TRUE           \* the holder may stop for good while it holds its side
    Fails = FALSE            \* whether the attach fails, the handle closed first
    Mutation = "wait_unbounded"       \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    WaitEnds
