\* As P_poller, with an attach that fails and posts a release of its token, which may reach the shard only at its next block_on: the generation the drain moved on keeps it from the next registration.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Early = FALSE            \* whether the attach names its shard before it takes the ask (a ring)
    Stalls = FALSE           \* the holder always lets go of its side in the end
    Fails = TRUE            \* whether the attach fails, the handle closed first
    Mutation = "none"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoForeignRelease NoLeaseLeft
PROPERTIES                     \* must hold over every behaviour
    AllEnd
