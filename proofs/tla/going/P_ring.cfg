\* A ring: the attach left to the holder posts its install, and the eviction its release, to the shard that left; the shard waits for both, applies them, and no lease is left to it; nothing removes the next registration; everything ends.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Early = TRUE            \* whether the attach names its shard before it takes the ask (a ring)
    Fails = FALSE            \* whether the attach fails, the handle closed first
    Mutation = "none"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoForeignRelease NoLeaseLeft
PROPERTIES                     \* must hold over every behaviour
    AllEnd
