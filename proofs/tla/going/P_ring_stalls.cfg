\* A ring, and a holder whose thread stops for good while it holds its side: the shard's wait for the eviction gives up at its deadline, saying so, and the shard moves on; nothing removes the next registration.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Early = TRUE            \* whether the attach names its shard before it takes the ask (a ring)
    Stalls = TRUE           \* the holder may stop for good while it holds its side
    Fails = FALSE            \* whether the attach fails, the handle closed first
    Mutation = "none"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoForeignRelease
PROPERTIES                     \* must hold over every behaviour
    WaitEnds
