\* As U_alive, with the runtime dropped at some moment: a linger handed before the drop began runs on
\* the linger thread, still counted, so the drop waits for it; one handed during the drop goes to the
\* list, one after it to the linger thread. Every byte reaches the peer, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every fair process weakly fair
CONSTANTS
    Drops = TRUE         \* the runtime is dropped
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    DropWaits
PROPERTIES                     \* must hold over every behaviour
    AllSent
