\* No value panics, on a ring a keeper reaps.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Reapable = TRUE  \* a keeper can reap the ring
    Panics = 0       \* 0 of the two values panic as they are dropped
    Mutation = "none"\* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWriteIntoFreed
    NoAbort
    GoesToTheEnd
    ValuesTold
    ValuesAfterSettle
