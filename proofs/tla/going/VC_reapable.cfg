\* Both values panic as they are dropped, on a ring a keeper reaps: the operation is
\* cancelled first, the ring and the operation go to the keeper, which frees the buffer once
\* the kernel is done.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Reapable = TRUE  \* a keeper can reap the ring
    Panics = 2       \* 2 of the two values panic as they are dropped
    Mutation = "none"\* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWriteIntoFreed
    NoAbort
    GoesToTheEnd
    ValuesTold
    ValuesAfterSettle
PROPERTIES                     \* must hold over every behaviour
    Termination
