\* Both values panic as they are dropped, with the ring's operation out on a ring only the
\* shard reaps: it settles first, both panics are logged, the shard goes to its end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Reapable = FALSE \* only the shard reaps its ring
    Panics = 2       \* 2 of the two values panic as they are dropped
    Mutation = "none"\* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWriteIntoFreed
    NoAbort
    GoesToTheEnd
    ValuesTold
    ValuesAfterSettle
PROPERTIES                     \* must hold over every behaviour
    Termination
