\* MUTATION no_catch, on a ring a keeper reaps: the panic unwinds after the cancel and
\* before the hand-off, the ring is dropped with the operation still out, and the kernel
\* writes into its freed buffer. Expected: NoWriteIntoFreed broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Reapable = TRUE  \* a keeper can reap the ring
    Panics = 1       \* 1 of the two values panic as they are dropped
    Mutation = "no_catch"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoWriteIntoFreed
