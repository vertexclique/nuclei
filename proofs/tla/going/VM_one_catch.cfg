\* MUTATION one_catch: one catch around both values: the second value's panic comes while
\* the first one unwinds, and aborts the process. Expected: NoAbort broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Reapable = FALSE \* only the shard reaps its ring
    Panics = 2       \* 2 of the two values panic as they are dropped
    Mutation = "one_catch"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoAbort
