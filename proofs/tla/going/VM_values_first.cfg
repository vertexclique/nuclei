\* MUTATION values_first: the values go before the ring settles, as they once did, their
\* user code running while the kernel may still write. Expected: ValuesAfterSettle broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Reapable = FALSE \* only the shard reaps its ring
    Panics = 1       \* 1 of the two values panic as they are dropped
    Mutation = "values_first"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    ValuesAfterSettle
