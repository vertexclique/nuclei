\* WITNESS: the drain's time runs out with bytes still held, which the run must reach to show it checks what an
\* expired drain does. Expected: NoDrainTimeout broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and W's driver wait for work for good once it is done
CONSTANTS
    Total = 2            \* bytes the writes took
    OpOut = TRUE         \* one of them is out
    Cancels = FALSE      \* a port never cancels it
    PeerReads = FALSE    \* the peer never reads
    DrainTimes = TRUE    \* the drain's time may run out
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoDrainTimeout
