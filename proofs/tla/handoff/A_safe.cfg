\* A worker that backs out of its park rings a monitor that sleeps, as a park's end does, and the
\* monitor looks at the parks again after it says it sleeps: a running worker is always watched,
\* and the monitor asleep holds no retired value back.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the worker ends running, the monitor watches for good
CONSTANTS
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    SleepsHoldingNothing
PROPERTIES                     \* must hold over every behaviour
    Watched
