\* The rest of a taken poll spawns a task while no worker takes tasks, then waits, in a blocking
\* call or a nested block_on, for a task bound to its thread that another thread wakes: the wait
\* ends, the bound task runs, the spawned task runs, and the own shard never sleeps through the wake.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties say, not a deadlock
CONSTANTS
    Waits = "bound"      \* the wait is for the bound task's end
    Bound = TRUE         \* the bound task is live, and woken by another thread
    Spawn = TRUE         \* a task is spawned first
    OwnFails = FALSE     \* the own shard starts
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStrandedBound
PROPERTIES                     \* must hold over every behaviour
    WaitsEnd
    BoundRuns
    SpawnRuns
