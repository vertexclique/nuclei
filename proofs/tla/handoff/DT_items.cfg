\* The rest of a taken poll, its budget perhaps spent, waits in a blocking call for two operations
\* that are ready at once, while a task bound to its thread is woken by another: the wait ends on the
\* own shard (a fresh budget each poll), and the bound task runs, during the wait or after it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties say, not a deadlock
CONSTANTS
    Waits = "items"      \* the wait is for two ready operations
    Bound = TRUE         \* a bound task is live, and woken by another thread
    Spawn = FALSE        \* nothing is spawned
    OwnFails = FALSE     \* the own shard starts
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStrandedBound
PROPERTIES                     \* must hold over every behaviour
    WaitsEnd
    BoundRuns
