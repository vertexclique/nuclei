\* The rest of a taken poll, its budget perhaps spent, spawns a task and waits in a blocking call for
\* two ready operations, on a thread whose own shard cannot start: the wait parks the thread, its
\* polls unbudgeted, and ends; the spawned task runs on the shard the poll lost.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties say, not a deadlock
CONSTANTS
    Waits = "items"      \* the wait is for two ready operations
    Bound = FALSE        \* no bound task
    Spawn = TRUE         \* a task is spawned first
    OwnFails = TRUE      \* the own shard cannot start: the wait parks
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    WaitsEnd
    SpawnRuns
