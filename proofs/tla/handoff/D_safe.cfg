\* A detached thread's calls: the leaf push's run with one poll a turn, its first runner taken in
\* that poll, whose code then makes one more call into the runtime on the slot it was taken from, a
\* leaf push, a bracket or an IO owner's step, as the code may once a call around a nested
\* `block_on` found the take: at most one thread inside the shard, the detached thread staying out
\* through that call, and an IO owner's step on it marking nothing through the slot the detach
\* cleared.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
    NoMarkWithoutSlot
