\* D_safe with two calls a poll, and two calls on the old slot after the take (a leaf push and a
\* bracket, in either order, each backing out on the claim taken for good): at most one thread
\* inside the shard, and the detached thread staying out through both.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 2
    MaxBrackets = 2
    Nested = FALSE
    Fence = "heavy"
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
