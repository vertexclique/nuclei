\* A heavy fence that may fail (`fence::heavy` false): the monitor cancels its claim, counts the
\* failure and takes nothing that time; it may fail at every take. Two polls a turn and one handoff:
\* at most one thread inside the shard, a detached thread stays out.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "failing"
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
