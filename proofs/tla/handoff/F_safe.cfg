\* No heavy fence (macOS, the BSDs, a Linux without membarrier): the runner takes a full fence
\* between its word and its claim (a poll's end, a call's mark, the leaf push's), the monitor one
\* between its claim and its look at the word. The leaf push's run of L_safe: at most one thread
\* inside the shard, a detached thread stays out.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "full"
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
