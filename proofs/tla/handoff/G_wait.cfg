\* The monitor takes a blocked poll's shard with no spare waiting, as the code does: the first
\* runner's first poll never returns, the monitor takes the shard, the start of a thread for it fails
\* once, the gift waits with the monitor across a tick, the shard its own, and the next start runs
\* it. At most one actor inside the shard throughout, the blocked thread stays out, and every remote
\* push is run.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = TRUE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "wait"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
PROPERTIES                     \* must hold of every behaviour
    Rescued
