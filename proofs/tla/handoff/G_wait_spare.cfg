\* As G_wait, with every start of a thread failing and the first runner's poll returning: the gift
\* waits with the monitor until the taken thread itself comes back from its poll, finds the shard
\* taken and waits as a spare, and is handed the shard again with a fresh slot. At most one actor
\* inside the shard throughout, the taken thread stays out until it is handed the shard, and every
\* remote push is run.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "wait_no_start"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
PROPERTIES                     \* must hold of every behaviour
    Rescued
