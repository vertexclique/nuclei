\* Two threads, one handoff, a remote push. The borrower's closure may block for good on the lent
\* shard, which then stays lent, as a pinned `with` holds its worker today: the safety properties
\* still hold (no property of progress is claimed for such a closure).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {"block"}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
