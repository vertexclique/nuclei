\* Two threads, one handoff. A runner's call, and a borrower's closure on the lent shard, may wake a
\* task bound to their thread into the shard's own queues; the borrower's closure may run those
\* queues in a nested `block_on`, and may panic. Every safety property, a bound task run only on
\* its own thread among them; every request served.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = TRUE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {"panic"}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Bound = TRUE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
    BoundOnCreator
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
