\* Three threads, two handoffs, a remote push. Thread 1's poll is taken and its `with` asks for
\* the shard back; the second runner's first poll may block for good, before or after it polls
\* the lend task, so the monitor takes the shard again (a lend task whose bracket finds it taken
\* goes back into the shard's queues) and the third runner lends it. Every safety property
\* (HB_chain_done checks, on a smaller run, that the request is served and the push run).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 3
    MaxPolls = 1
    MaxHandoffs = 2
    Pushes = 1
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = TRUE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
