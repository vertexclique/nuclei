\* Three threads, two handoffs, a remote push, as HB_chain with no call of a poll on the shard it
\* runs: thread 1's poll is taken and its `with` asks for the shard back; the second runner's
\* first poll may block for good, before or after it polls the lend task, and the third runner
\* lends it. The request is served, and the push run.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 3
    MaxPolls = 1
    MaxHandoffs = 2
    Pushes = 1
    Calls = 0
    DetachedCalls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = TRUE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Bound = FALSE
    Mode = "ok"
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
    Rescued
