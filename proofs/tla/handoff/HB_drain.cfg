\* Two threads, one handoff, a remote push, and the worker may be stopped at any moment: it takes
\* the lend task still, and its loop ends only once no poll of its tasks runs on another thread (the
\* detached poll, then the thread's bound task, which asks for the shard too). Every safety property;
\* every request served.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Calls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {1}
    Cancels = FALSE
    Close = FALSE
    Drain = TRUE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
    OutsideWordAtPollEnd
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
