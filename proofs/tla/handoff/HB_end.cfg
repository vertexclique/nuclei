\* Two threads, one handoff. The waiting borrower's task may be cancelled (its wait goes on), and
\* its closure on the lent shard may panic: the unwind gives the shard back. After the poll, the
\* thread's bound task asks for the shard too, with the same ends. Every safety property; every
\* request served.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {"panic"}
    BoundWiths = {1}
    Cancels = TRUE
    Close = FALSE
    Drain = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
    OutsideWordAtPollEnd
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
