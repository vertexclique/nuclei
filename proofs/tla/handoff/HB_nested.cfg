\* Two threads, one handoff, a remote push, `block_on` on the worker, one call after a detach.
\* Thread 1 may lose the shard during its nested `block_on`'s poll, then its `with` asks for the
\* shard back; thread 2 may lend it from its own nested `block_on`'s loop, its outer poll waiting
\* meanwhile. Every safety property; every request served, every push run.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Calls = 1
    DetachedCalls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {1, 2}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Bound = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
    Rescued
