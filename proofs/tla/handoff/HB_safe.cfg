\* Two threads, one handoff, a remote push, two calls a poll. Thread 1's poll is taken; its later
\* calls (a leaf push and a bracket on its old slot, a `with`) find no shard, and the `with` asks
\* for the shard back. Thread 2, its runner, lends it between its polls, or defers it while its
\* own `with` has the value lent (a nested `block_on` polls the lend task there). Every safety
\* property; every request served, every push run.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Calls = 2
    Withs = {1, 2}
    Nested = TRUE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
    OutsideWordAtPollEnd
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
    Rescued
