\* Three threads, two handoffs, two borrowers: thread 1's poll is taken, then the second runner's
\* (in its `with`); both ask for the shard back, and the third runner lends it to each in turn. A
\* borrower's `with`, on the lent shard, may poll the other's lend task: it defers it. Every safety
\* property (HB_two_done checks that every request is served, on a smaller run).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 3
    MaxPolls = 1
    MaxHandoffs = 2
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1, 2}
    Nested = FALSE
    NestedLoan = TRUE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    ExclusiveValue
    DetachedStaysOut
    DetachedHoldsOnlyLent
    LendHeld
    LentHasBorrower
    LenderHasLoan
    NoFailedWith
