\* Three threads, two handoffs, two borrowers, as HB_two, each poll making no call on the shard it
\* runs: thread 1's poll and the second runner's are taken, each `with` then asks for the shard
\* back, and a runner lends it to each in turn. Every request served.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 3
    MaxPolls = 1
    MaxHandoffs = 2
    Pushes = 0
    Calls = 0
    DetachedCalls = 1
    Withs = {1, 2}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Mode = "ok"
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
