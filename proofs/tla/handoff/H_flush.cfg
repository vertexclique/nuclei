\* H_safe's runtime with the threads' kovan batches tracked: a thread whose shard went submits
\* what it retired before it parks as a spare, so a spare holds nothing back.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 1
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "flush"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
    BoundOnCreator
    SpareHoldsNothing
