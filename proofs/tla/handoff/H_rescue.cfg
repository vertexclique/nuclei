\* The first runner's first poll never returns: the monitor hands the shard to the spare, which
\* runs the remote push. At most one thread inside the shard throughout. One poll a turn and one
\* push, as L_rescue has: the poll that never returns is the first, and the push may come before
\* the take or after it (two polls a turn and two pushes made the run past a minute, for no case
\* of its own: H_safe checks two polls a turn for safety).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = TRUE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
PROPERTIES                     \* must hold of every behaviour
    Rescued
