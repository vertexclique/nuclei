\* The first runner's first poll never returns: the monitor hands the shard to the spare, which
\* runs both remote pushes. At most one thread inside the shard throughout.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 1
    Pushes = 2
    Bounds = 0
    BlockForever = TRUE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
PROPERTIES                     \* must hold of every behaviour
    Rescued
