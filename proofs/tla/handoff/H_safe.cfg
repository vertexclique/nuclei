\* Two threads, two handoffs (the shard goes to the spare and back to the first thread with a
\* fresh slot), one remote push and one bound task: at most one thread inside the shard, a
\* detached thread stays out, a bound task runs on its creator only.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 1
    BlockForever = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
    BoundOnCreator
