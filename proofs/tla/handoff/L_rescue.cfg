\* The leaf push, and the first runner's only poll never returns: whether its call pushed as a
\* leaf or backed out to the full bracket, the poll is outside again after it, the monitor hands
\* the shard to the spare, and the spare runs the remote push. At most one thread inside the shard.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = TRUE
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
PROPERTIES                     \* must hold of every behaviour
    Rescued
