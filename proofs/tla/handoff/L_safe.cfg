\* The leaf push: each poll's call may be the push of a task into the shard's LIFO slot, tried
\* first as a leaf that backs out to the full bracket. Two threads, one handoff (the leaf's calls
\* race the take) and one remote push: at most one thread inside the shard, a detached thread
\* stays out.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
