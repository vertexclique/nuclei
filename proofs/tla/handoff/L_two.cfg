\* Two calls in one poll: the leaf push's run with one poll a turn, each poll making up to two
\* calls into the runtime (a leaf push whose word is still in the buffer, then a bracket, or the
\* other way), raced by one take: at most one thread inside the shard, a detached thread stays out.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 2
    Nested = FALSE
    Fence = "heavy"
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
