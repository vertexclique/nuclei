\* MUTATION home_not_moved: the home of the thread's bound tasks keeps naming the taken shard until
\* the poll ends, as before the fix: a remote wake of the bound task during the wait goes to the
\* shard's new runner, which never runs it, while the own shard sleeps. Expected: NoStrandedBound
\* broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties say, not a deadlock
CONSTANTS
    Waits = "bound"      \* the wait is for the bound task's end
    Bound = TRUE         \* the bound task is live, and woken by another thread
    Spawn = FALSE        \* nothing is spawned
    OwnFails = FALSE     \* the own shard starts
    Mutation = "home_not_moved"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoStrandedBound
