\* MUTATION park_no_own_shard: a blocking call on a detached thread with no own shard parks the thread
\* instead of making one, as before the fix: the bound task it waits for runs only on that thread's
\* own shard, which never runs. Expected: WaitsEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties say, not a deadlock
CONSTANTS
    Waits = "bound"      \* the wait is for the bound task's end
    Bound = TRUE         \* the bound task is live, and woken by another thread
    Spawn = FALSE        \* nothing is spawned
    OwnFails = FALSE     \* the own shard could start
    Mutation = "park_no_own_shard"  \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    WaitsEnd
