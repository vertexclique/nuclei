\* MUTATION spawn_own: a spawn from a detached thread while no worker takes tasks goes to the thread's
\* own shard, as before the fix: the poll ends, the thread has no bound task to finish, and the task
\* waits for a block_on that never comes. Expected: SpawnRuns broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties say, not a deadlock
CONSTANTS
    Waits = "none"       \* the poll ends with no wait
    Bound = FALSE        \* no bound task
    Spawn = TRUE         \* a task is spawned
    OwnFails = FALSE     \* the own shard starts
    Mutation = "spawn_own"  \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    SpawnRuns
