\* MUTATION reuse_held: the cell's signal is reused while a clone of its waker is still held (no
\* `strong_count == 1` check). The first call's future hands X its waker and ends; the second call
\* reuses that signal, and X's wake reaches the second call's future. Expected: NoStaleWake broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* X waits for good once the calls are over
CONSTANTS
    Mutation = "reuse_held"
INVARIANTS                     \* must hold in every reachable state
    NoStaleWake
