\* MUTATION reuse_moved_kept: both rules that keep a moved signal off the shard taken away (no look at
\* `moved` in `reset`, and a call taken during its run keeps its signal in the cell of the shard it
\* lost, as `block_on` did before its look at the take). The first call is taken and aims its signal
\* at the old thread's own shard, keeps it in the cell, and the second call on the shard runs with
\* it: its wakes go to the other shard. Expected: WakesItsShard broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* X waits for good once the calls are over
CONSTANTS
    Mutation = "reuse_moved_kept"
INVARIANTS                     \* must hold in every reachable state
    WakesItsShard
