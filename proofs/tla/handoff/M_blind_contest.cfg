\* MUTATION blind_contest: the runner cancels a claim with a plain store of "none" where it
\* cancels with a compare-and-swap from pending: coming back to a shard already taken it clears the
\* claim and goes in, beside the spare that now runs it. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "blind_contest"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
