\* MUTATION blind_take: the monitor takes with a plain store of "taken" where it takes with a
\* compare-and-swap from pending: a runner that cancelled the claim and went back in finds the shard
\* taken from under it, the monitor in as well. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "blind_take"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
