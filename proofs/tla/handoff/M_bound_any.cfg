\* MUTATION bound_any: any runner pops the bound inbox, the new one included. Expected: BoundOnCreator broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 0
    Bounds = 1
    BlockForever = FALSE
    Mode = "bound_any"
INVARIANTS                     \* must hold in every reachable state
    BoundOnCreator
