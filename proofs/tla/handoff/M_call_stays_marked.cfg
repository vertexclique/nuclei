\* MUTATION call_stays_marked: a call into the runtime ends without putting the poll's word
\* back. The first runner's first poll makes a call, then never returns: the word says "loop"
\* for good, the monitor never sees a poll to take, and the shard is never handed on.
\* Expected: Rescued broken (the remote pushes are never run).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 1
    Pushes = 2
    Bounds = 0
    BlockForever = TRUE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "call_stays_marked"
PROPERTIES                     \* must hold of every behaviour
    Rescued
