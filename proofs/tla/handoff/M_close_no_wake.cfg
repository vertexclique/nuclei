\* MUTATION close_no_wake: the borrower waits for the lend alone. The runtime shuts down with the
\* lend task still queued, no runner polls it again, and the borrower waits for good (its frame
\* keeps the shard alive, so no drop of the shard would tell it). Expected: HandBackDone broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    Cancels = FALSE
    Close = TRUE
    Drain = FALSE
    Mode = "close_no_wake"
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
