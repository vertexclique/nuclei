\* MUTATION drain_early: a stopped worker exits once its queues are empty, not counting a task
\* whose poll runs on a detached thread; that poll's request then waits for good. Expected:
\* HandBackDone broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = TRUE
    Records = FALSE
    Bound = FALSE
    Mode = "drain_early"
PROPERTIES                     \* must hold of every behaviour
    HandBackDone
