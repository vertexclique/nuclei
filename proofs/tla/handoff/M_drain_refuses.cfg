\* MUTATION drain_refuses: a stopped worker refuses the lend task, as it refuses new work, and the
\* `with` answers an error. Expected: NoFailedWith broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Calls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = TRUE
    Mode = "drain_refuses"
INVARIANTS                     \* must hold in every reachable state
    NoFailedWith
