\* MUTATION no_leaf_fence: with no heavy fence, the leaf push reads its claim with only the
\* compiler's fence after its mark: the monitor reads the old word and takes while the leaf, which
\* read no claim, pushes inside. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "full"
    Mode = "no_leaf_fence"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
