\* MUTATION no_fence, with no heavy fence: the monitor looks at the runner's word with no fence
\* after its claim, whose store is still in its buffer: the runner, fenced, reads no claim and goes
\* in, and the monitor, which read the old word, takes. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "full"
    Mode = "no_fence"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
