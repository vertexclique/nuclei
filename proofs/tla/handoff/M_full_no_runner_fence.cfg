\* MUTATION no_runner_fence: with no heavy fence, the runner's way back in (a poll's end, a
\* call's mark) reads its claim with only the compiler's fence after its word: its store still in its
\* buffer, the monitor reads the old word and takes while the runner, which read no claim, goes in.
\* Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "full"
    Mode = "no_runner_fence"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
