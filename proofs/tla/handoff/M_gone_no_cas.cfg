\* MUTATION gone_no_cas: the borrower woken by the shutdown writes gone with a plain store, over a
\* lend that came first: its runner waits for a shard that never comes back. Expected:
\* LenderHasLoan broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = TRUE
    Drain = FALSE
    Mode = "gone_no_cas"
INVARIANTS                     \* must hold in every reachable state
    LenderHasLoan
