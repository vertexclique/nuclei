\* A limit of the rescue, stated (no rule is taken away): user code on the monitor's thread that
\* blocks (the long-poll hook told of another place's poll in the same pass, a task's destructor as
\* `let_go`, `Spare::drop` or a hand-over into a stopped shard drops it) stops every rescue after
\* it. The monitor blocks there before it takes the blocked poll's shard, and the remote push waits
\* for good. Expected: Rescued broken, until that code runs off the monitor's thread.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = TRUE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "hook_blocks"
PROPERTIES                     \* must hold of every behaviour
    Rescued
