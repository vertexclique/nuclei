\* MUTATION keep_ref: a take that does not happen (the runner came back first) forgets the reference
\* it got without letting go of it: the shard keeps a reference nobody holds and is never freed.
\* Expected: RefsHeld broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* both processes end
CONSTANTS
    Mutation = "keep_ref"    \* the failed take keeps its reference
INVARIANTS                     \* must hold in every reachable state
    RefsHeld
