\* MUTATION leaf_keeps_mark: a leaf push that backs out leaves its mark up. The full bracket then
\* reads "loop" as the word to put back, so after the call the word says loop for the rest of
\* the poll; the first runner's only poll never returns, the monitor never sees a poll to take,
\* and the shard is never handed on, at L_rescue's size. Expected: Rescued broken (the remote
\* push is never run).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = TRUE
    Mode = "leaf_keeps_mark"
PROPERTIES                     \* must hold of every behaviour
    Rescued
