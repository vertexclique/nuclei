\* MUTATION leaf_keeps_mark, the word it leaves: a leaf push that backs out with its mark still up
\* makes the full bracket save "loop" as the word to put back, so the poll ends on "loop", not on
\* its outside word, and a run's come-back that writes the word it finds would not write the poll's
\* own. Expected: OutsideWordAtPollEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    Mode = "leaf_keeps_mark"
INVARIANTS                     \* must hold in every reachable state
    OutsideWordAtPollEnd
