\* MUTATION leaf_no_check: the leaf push goes into the shard without reading its claim. The
\* monitor's fence finds the poll's "task" word, the monitor takes the shard, and the leaf
\* pushes into it too. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    Mode = "leaf_no_check"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
