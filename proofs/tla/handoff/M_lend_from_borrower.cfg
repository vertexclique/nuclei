\* MUTATION lend_from_borrower: a borrower's `with`, on the lent shard, polls the other borrower's
\* lend task and lends the shard on. Expected: ExclusiveValue broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 3
    MaxPolls = 1
    MaxHandoffs = 2
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1, 2}
    Nested = FALSE
    NestedLoan = TRUE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Mode = "lend_from_borrower"
INVARIANTS                     \* must hold in every reachable state
    ExclusiveValue
