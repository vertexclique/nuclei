\* MUTATION lend_keeps_queues: the runner lends with its bound task still in the shard's own
\* queues, never handed to its home, and the borrower's nested `block_on` runs it on the
\* borrower's thread. Expected: BoundOnCreator broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = TRUE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {"panic"}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Bound = TRUE
    Mode = "lend_keeps_queues"
INVARIANTS                     \* must hold in every reachable state
    BoundOnCreator
