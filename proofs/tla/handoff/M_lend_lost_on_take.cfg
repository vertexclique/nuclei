\* MUTATION lend_lost_on_take: a lend task whose bracket finds the shard taken is dropped, not put
\* back into the shard's queues. Expected: LendHeld broken (its borrower would wait for good).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 3
    MaxPolls = 1
    MaxHandoffs = 2
    Pushes = 0
    Calls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Mode = "lend_lost_on_take"
INVARIANTS                     \* must hold in every reachable state
    LendHeld
