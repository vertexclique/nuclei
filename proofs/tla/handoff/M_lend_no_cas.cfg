\* MUTATION lend_no_cas: the runner lends with a plain store, over the gone its borrower wrote at
\* the shutdown: the shard is lent to a thread gone on. Expected: LentHasBorrower broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = TRUE
    Drain = FALSE
    Mode = "lend_no_cas"
INVARIANTS                     \* must hold in every reachable state
    LentHasBorrower
