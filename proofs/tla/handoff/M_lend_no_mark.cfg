\* MUTATION lend_no_mark: the lend task's code lends with no bracket, its word still outside. The
\* monitor takes the shard from the runner while the borrower is in it. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 3
    MaxPolls = 1
    MaxHandoffs = 2
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Bound = FALSE
    Mode = "lend_no_mark"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
