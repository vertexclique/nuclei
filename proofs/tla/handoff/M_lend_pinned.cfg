\* MUTATION lend_pinned: a runner whose `with` has the value lent (a nested `block_on` in it polls
\* the lend task) lends the shard anyway. Expected: ExclusiveValue broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1, 2}
    Nested = TRUE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Mode = "lend_pinned"
INVARIANTS                     \* must hold in every reachable state
    ExclusiveValue
