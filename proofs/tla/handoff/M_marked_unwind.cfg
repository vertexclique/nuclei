\* MUTATION marked_unwind: a call that unwinds (a panic in it that the task's code catches) has
\* no guard to end it, as an IO owner's step had none (`After`'s drop left the mark): the word says
\* "loop" for the rest of the poll, which then never returns; the monitor never sees a poll to take.
\* Expected: Rescued broken (the remote pushes are never run).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 1
    Pushes = 2
    Bounds = 0
    BlockForever = TRUE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "marked_unwind"
PROPERTIES                     \* must hold of every behaviour
    Rescued
