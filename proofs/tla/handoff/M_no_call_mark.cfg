\* MUTATION no_call_mark: a call into the runtime from the task's code reads its claim without
\* marking itself first: the monitor's look after its fence still finds the poll's "task" word,
\* takes the shard, and the runner goes in too. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "no_call_mark"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
