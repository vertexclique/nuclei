\* MUTATION no_handback: the code before the hand-back. A `with` whose poll lost the shard answers
\* the access error, as on CI run 41348513281 (macOS: a worker stalled past the threshold before
\* its `with`). Expected: NoFailedWith broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Mode = "no_handback"
INVARIANTS                     \* must hold in every reachable state
    NoFailedWith
