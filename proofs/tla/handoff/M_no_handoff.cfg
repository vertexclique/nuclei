\* MUTATION no_handoff: the monitor never hands a shard over (the runtime as it was). The first
\* runner's first poll never returns. Expected: Rescued broken (the remote pushes are never run).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 0
    Pushes = 2
    Bounds = 0
    BlockForever = TRUE
    Mode = "ok"
PROPERTIES                     \* must hold of every behaviour
    Rescued
