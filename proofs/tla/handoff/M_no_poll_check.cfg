\* MUTATION no_poll_check: the runner goes back into the shard at the end of a poll without reading its claim. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    Mode = "no_poll_check"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
