\* MUTATION no_recheck: the monitor takes the shard without reading the runner's word again. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    Mode = "no_recheck"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
