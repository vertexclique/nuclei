\* MUTATION owner_skips_running: an IO owner's step marks its call (`mark_call`) with no look at
\* the shard the thread runs first. On a thread its shard was taken from, that mark reads the
\* thread's own slot, which the detach cleared: a null slot in the code, at D_safe's size.
\* Expected: NoMarkWithoutSlot broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    Mode = "owner_skips_running"
INVARIANTS                     \* must hold in every reachable state
    NoMarkWithoutSlot
