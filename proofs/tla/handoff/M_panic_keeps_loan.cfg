\* MUTATION panic_keeps_loan: a closure that panics on the lent shard unwinds with no guard to
\* give it back. Expected: LentHasBorrower broken (the runner would wait for good).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {"panic"}
    BoundWiths = {1}
    Cancels = TRUE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Bound = FALSE
    Mode = "panic_keeps_loan"
INVARIANTS                     \* must hold in every reachable state
    LentHasBorrower
