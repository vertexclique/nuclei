\* MUTATION ready_first: the loop answers a future that finished in the poll that found the
\* take before it looks at the take, as `run_loop` did: the nested `block_on` keeps its waker in the
\* lost shard's cell (`keep_signal`), a write into the shard the monitor handed to the spare, at
\* N_safe's size. Expected: DetachedStaysOut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    MaxBrackets = 1
    Nested = TRUE
    Fence = "heavy"
    Mode = "ready_first"
INVARIANTS                     \* must hold in every reachable state
    DetachedStaysOut
