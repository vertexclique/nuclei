\* MUTATION slot_reuse: the spare is handed the blocked runner's slot, its claim cleared. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    Mode = "slot_reuse"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
