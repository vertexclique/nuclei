\* MUTATION spare_no_flush: a thread whose shard went parks as a spare holding what it retired.
\* Expected: SpareHoldsNothing broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 1
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "spare_no_flush"
INVARIANTS                     \* must hold in every reachable state
    SpareHoldsNothing
