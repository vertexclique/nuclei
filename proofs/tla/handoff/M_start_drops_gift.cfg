\* MUTATION start_drops_gift: a start of a thread for the gift that fails lets the gift go, where the
\* code keeps it for the next tick (`give` answers it back, `waiting` holds it): the shard taken
\* from the blocked thread is then nobody's, and the remote push it holds is never run. Expected:
\* Rescued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = TRUE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "start_drops_gift"
PROPERTIES                     \* must hold of every behaviour
    Rescued
