\* MUTATION stopped_on_take: the worker loop's own future, finished in the poll whose end found
\* the take, is answered "stopped" with no look at the take (`run_worker`), as it was: the runner
\* skips its bound tasks and its life's "back", at N_safe's size. Expected: TakenReportsDetached
\* broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    MaxBrackets = 1
    Nested = TRUE
    Fence = "heavy"
    Mode = "stopped_on_take"
INVARIANTS                     \* must hold in every reachable state
    TakenReportsDetached
