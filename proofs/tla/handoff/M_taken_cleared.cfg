\* MUTATION taken_cleared: the runner that finds its shard taken clears the claim as it detaches,
\* as a reset of its slot would. Only the detached thread's later calls read that slot: the next
\* one, a leaf push or a bracket, finds no claim and goes into the shard the monitor took, at
\* D_safe's size. Expected: DetachedStaysOut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "taken_cleared"
INVARIANTS                     \* must hold in every reachable state
    DetachedStaysOut
