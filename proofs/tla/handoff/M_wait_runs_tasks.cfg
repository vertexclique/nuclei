\* MUTATION wait_runs_tasks: the borrower's wait runs the thread's tasks (a nested `block_on` on
\* its own shard), so its bound task asks for the shard too, from inside the wait; the runner lends
\* to the outer request while the thread waits in the inner one. Expected: LentHasBorrower broken
\* (a deadlock: each waits for the other).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Records = FALSE
    Bound = FALSE
    Mode = "wait_runs_tasks"
INVARIANTS                     \* must hold in every reachable state
    LentHasBorrower
