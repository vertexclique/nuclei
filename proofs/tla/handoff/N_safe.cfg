\* A call's nested `block_on` on the same shard and slot: the first runner's one poll makes
\* a call that runs a nested poll, which the monitor may take; the nested future may finish in the
\* poll that found the take, and the worker loop's own future may finish in the poll whose end found
\* it. Then one more call on the old slot. At most one thread inside the shard, a detached thread
\* staying out, and a worker loop that never answers "stopped" for a shard taken from it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    MaxBrackets = 1
    Nested = TRUE
    Fence = "heavy"
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    Exclusive
    DetachedStaysOut
    TakenReportsDetached
