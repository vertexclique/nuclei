\* Both checks of the reuse and the keep guard in place: two calls, a clone of a waker handed out
\* once, a take during either call. A waker kept from one call never wakes a later call's future, and
\* no call on the shard waits on a signal aimed at another shard.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* X waits for good once the calls are over
CONSTANTS
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleWake
    WakesItsShard
