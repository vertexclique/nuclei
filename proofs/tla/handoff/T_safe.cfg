\* The monitor holds the shard before it claims the runner's slot: whenever the runner comes back,
\* the shard is never freed, every reference has its holder, and a taken shard reaches a spare.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* both processes end
CONSTANTS
    Mutation = "none"    \* no rule broken
INVARIANTS                     \* must hold in every reachable state
    NoLoss
    RefsHeld
PROPERTIES                     \* must hold over every behaviour
    Rescued
