\* The monitor holds the shard before it claims the runner's slot: whenever the runner comes back,
\* the shard is never freed, every reference has its holder, and a taken shard reaches a spare. The
\* runner's life says detached only while it is still in the poll the take found it in, and not
\* once both sides are done, whichever of the monitor's detach and the runner's back comes first.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* both processes end
CONSTANTS
    Mutation = "none"    \* no rule broken
INVARIANTS                     \* must hold in every reachable state
    NoLoss
    RefsHeld
    LifeMeansBlocked
    LifeTrue
PROPERTIES                     \* must hold over every behaviour
    Rescued
