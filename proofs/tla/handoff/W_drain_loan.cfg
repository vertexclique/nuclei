\* WITNESS: a loan is served while the worker drains. Expected: NoDrainLoan broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {1}
    Cancels = FALSE
    Close = FALSE
    Drain = TRUE
    Records = TRUE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoDrainLoan
