\* WITNESS: with no heavy fence the monitor still takes a blocked poll's shard (so F_safe checks
\* a take at all). Expected: NoHandoff broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "full"
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoHandoff
