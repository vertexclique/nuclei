\* WITNESS: a borrower is told the runtime shut down. Expected: NoGone broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 0
    Calls = 1
    DetachedCalls = 0
    Withs = {1}
    Nested = FALSE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = TRUE
    Drain = FALSE
    Records = TRUE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoGone
