\* WITNESS: a detached thread's leaf push reads the taken claim of the slot it was taken from and
\* backs out, as Handoff.tla's W_stale_back. Expected: NoStaleBack broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a thread that waits for good is what a property says, not a deadlock
CONSTANTS
    NThreads = 2
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Calls = 1
    DetachedCalls = 2
    Withs = {1, 2}
    Nested = TRUE
    NestedLoan = FALSE
    NestedBlockOn = {}
    BlockSecond = FALSE
    Ends = {}
    BoundWiths = {}
    Cancels = FALSE
    Close = FALSE
    Drain = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoStaleBack
