\* A limit of the rescue, stated (no rule is taken away): user code the runtime runs inside the
\* shard (a timer's waker as `fire_timers` wakes it, a park hook, a `ShardLocal::with` closure, a
\* nested `block_on` future dropped inside the shard) that blocks is never rescued. The runner's word
\* says it is in the loop, so the monitor never sees a poll to take, and the remote push waits for
\* good. Expected: Rescued broken, until such code runs outside the shard.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 0
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "inside_block"
PROPERTIES                     \* must hold of every behaviour
    Rescued
