\* WITNESS: a leaf push finds a claim up and backs out to the full bracket. Expected: NoLeafBack broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    NoLeafBack
