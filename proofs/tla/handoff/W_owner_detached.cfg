\* WITNESS: a detached thread's IO owner step finds the thread runs no shard and goes the way of
\* any other thread, a bracket on the slot it was taken from, at D_safe's size. Expected:
\* NoOwnerDetached broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    NoOwnerDetached
