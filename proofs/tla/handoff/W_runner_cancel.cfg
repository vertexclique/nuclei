\* WITNESS: a runner coming back into its shard cancels a pending claim with its own compare-and-swap, before the monitor takes. Expected: NoRunnerCancel broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 2
    MaxHandoffs = 2
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    Mode = "ok"
INVARIANTS                     \* must hold in every reachable state
    NoRunnerCancel
