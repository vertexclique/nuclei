\* WITNESS: a detached thread's leaf push reads the taken claim of the slot it was taken from and
\* backs out, at D_safe's size. Expected: NoStaleBack broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    MaxPolls = 1
    MaxHandoffs = 1
    Pushes = 1
    Bounds = 0
    BlockForever = FALSE
    DetachedCalls = 1
    MaxBrackets = 1
    Nested = FALSE
    Fence = "heavy"
    Mode = "leaf"
INVARIANTS                     \* must hold in every reachable state
    NoStaleBack
