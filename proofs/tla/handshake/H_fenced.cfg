\* Relaxed accesses with a sequentially consistent fence on both sides, two wakers: no
\* wake is lost, a burst notifies once.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Wakers = 2
    Mode = "fenced"
INVARIANTS                     \* must hold in every reachable state
    OneNotify
PROPERTIES                     \* must hold of every behaviour
    AllEnd
