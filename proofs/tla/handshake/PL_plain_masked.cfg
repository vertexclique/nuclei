\* The count's load plain, as before the fix, in the code's order: the inbox's sequentially consistent
\* load before it waits for the shard's store, so no wake is lost. Only that order kept it right.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    CountLoad = "plain"  \* the count's load relaxed
    Order = "inbox"      \* the inbox's head looked at first
PROPERTIES                     \* must hold of every behaviour
    AllEnd
