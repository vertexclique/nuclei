\* The count's load sequentially consistent, as the fix makes it, looked at first: the shard sees the
\* post or the poster sees the shard parked, so no wake is lost.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    CountLoad = "seqcst" \* the count's load sequentially consistent
    Order = "count"      \* the count looked at first
PROPERTIES                     \* must hold of every behaviour
    AllEnd
