\* Every hook call of the runner, and the name of its thread, may panic, and each panic is caught where
\* it is called: the shard is never dropped while the runtime runs, no task runs twice, every task
\* runs, no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mutation = "none"    \* every hook's panic caught
INVARIANTS                     \* must hold in every reachable state
    NoLoss
    RunOnce
PROPERTIES                     \* must hold over every behaviour
    AllRan
