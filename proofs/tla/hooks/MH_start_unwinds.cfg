\* MUTATION start_unwinds: the start hook panics before the runner takes up its shard, and the panic
\* leaves `runner`, as before the fix. The run it was handed (the monitor's gift, or a worker's first
\* run) is dropped with it, the shard's only strong reference: the shard goes while the runtime runs,
\* with the task it queues and the one woken later. Expected: NoLoss broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the invariant is what this run looks for
CONSTANTS
    Mutation = "start_unwinds"
INVARIANTS                     \* must hold in every reachable state
    NoLoss
