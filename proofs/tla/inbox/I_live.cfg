\* Liveness: every push is taken, the shard never sleeping through one; two pushers of two
\* rounds, so each pushes its task again after it was taken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Producers = {"p1", "p2"}
    Rounds = 2
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    AllTaken
