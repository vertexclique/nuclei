\* Three pushers, two rounds each: the same properties. The pushers run the same code, each
\* pushing its own task, and no property names one of them, so a state and the same state with
\* the pushers' names swapped are one state to TLC (SYMMETRY): every state of the three-pusher
\* run is still checked, up to the pushers' names, about a sixth as many of them.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Producers = {p1, p2, p3}    \* three pushers, named by model values so they can be swapped
    Rounds = 2
    Mutation = "none"
SYMMETRY Perms                  \* every renaming of the pushers is one state (MC_Inbox.tla)
INVARIANTS                     \* must hold in every reachable state
    NoDuplicate
    Counted
    EmptyAtSleep
