\* A delaying interval of period 2, polled late by any amount and reset once: each next
\* tick at least a period after the late one, and no deadline past the clock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Period = 2                  \* the interval's period
    Behavior = "delay"           \* what a late tick does
    MaxStep = 3                 \* the clock moves on by 1 to 3 units a step
    Horizon = 9                 \* the clock stops at 9
    Range = 40                  \* the last instant the clock can name
    ClampAt = 1                 \* (skip_clamp only) the most periods a skip counts
    Resets = 1                  \* resets the task may make
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    InRange
    DelayGap
