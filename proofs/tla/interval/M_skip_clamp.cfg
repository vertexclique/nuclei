\* MUTATION skip_clamp: a skip counts the periods it missed, at most ClampAt of them (the
\* u32 the code clamped to), and adds them to the late tick. Late by more periods than
\* that, its next deadline is still behind now and the next tick fires at once: a burst
\* where a skip was asked for. Expected: SkipAhead broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Period = 1                  \* the interval's period
    Behavior = "skip"           \* what a late tick does
    MaxStep = 3                 \* the clock moves on by 1 to 3 units a step
    Horizon = 9                 \* the clock stops at 9
    Range = 40                  \* the last instant the clock can name
    ClampAt = 2                 \* (skip_clamp only) the most periods a skip counts
    Resets = 0                  \* resets the task may make
    Mutation = "skip_clamp"
INVARIANTS                     \* must hold in every reachable state
    SkipAhead
