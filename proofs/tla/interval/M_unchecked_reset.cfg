\* MUTATION unchecked_reset: `reset` adds the period to now as it is: a period past the
\* clock panics there. Expected: InRange broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Period = 30                  \* the interval's period
    Behavior = "delay"           \* what a late tick does
    MaxStep = 3                 \* the clock moves on by 1 to 3 units a step
    Horizon = 9                 \* the clock stops at 9
    Range = 20                  \* the last instant the clock can name
    ClampAt = 1                 \* (skip_clamp only) the most periods a skip counts
    Resets = 1                  \* resets the task may make
    Mutation = "unchecked_reset"
INVARIANTS                     \* must hold in every reachable state
    InRange
