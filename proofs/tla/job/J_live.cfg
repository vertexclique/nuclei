\* Liveness: calls that end only when cancelled, every job cancelled. Under weak fairness every
\* job's call is cancelled and its packet posted, so both threads finish: no cancel is lost and
\* no canceller keeps the job from freeing the word.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    Jobs = 3             \* 3 jobs, one after another
    Blocks = TRUE        \* a call ends only when cancelled
    Cancel = "always"    \* the holder cancels every job
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStray
PROPERTIES                     \* must hold over every behaviour
    Termination
