\* Three jobs, each ending by itself or by a cancel, cancelled or not: every safety property.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Jobs = 3             \* 3 jobs, one after another
    Blocks = FALSE       \* a call may end by itself
    Cancel = "maybe"     \* the holder may cancel each job, or not
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStray
    WordFreeBetweenJobs
