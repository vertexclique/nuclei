\* MUTATION no_cancelling: the canceller calls CancelSynchronousIo without holding the job in its
\* call. Expected: a cancel lands in the thread's next call, of another file (NoStray broken).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Jobs = 2             \* 2 jobs, one after another
    Blocks = FALSE       \* a call may end by itself
    Cancel = "maybe"     \* the holder may cancel each job, or not
    Mutation = "no_cancelling"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoStray
