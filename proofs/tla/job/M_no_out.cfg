\* MUTATION no_out: the job does not say its call is over, so a canceller whose cancel finds no
\* call cannot tell before from after and keeps trying. Expected: Termination broken (it can take
\* the word back each time just before the job would free it).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    Jobs = 1             \* 1 job
    Blocks = FALSE       \* a call may end by itself
    Cancel = "always"    \* the holder cancels every job
    Mutation = "no_out"  \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Termination
