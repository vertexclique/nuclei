\* MUTATION no_retry: a canceller whose cancel finds the job not in its call yet gives up.
\* Expected: a deadlock (the job enters its call after, and blocks for good).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Jobs = 1             \* 1 job
    Blocks = TRUE        \* a call ends only when cancelled
    Cancel = "always"    \* the holder cancels every job
    Mutation = "no_retry"\* the rule this run takes away
