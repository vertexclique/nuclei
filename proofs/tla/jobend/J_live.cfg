\* Liveness: under weak fairness every write ends, so no wake is lost.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Rounds = 3              \* three writes, one after another
    Warm = 1                \* one block in the cache at the start: steady state
    Mutation = "none"       \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
