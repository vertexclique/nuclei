\* Three writes from a warm cache: no block from the allocator, each write
\* counted until its wake went, each job counted out after it, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Rounds = 3              \* three writes, one after another
    Warm = 1                \* one block in the cache at the start: steady state
    Mutation = "none"       \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoAllocation
    CountedUntilWoken
    CountedOutAfterWake
