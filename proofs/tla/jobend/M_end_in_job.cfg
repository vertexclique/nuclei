\* MUTATION end_in_job: the end is left and woken inside the job, and the
\* job's task freed after; the task goes on first. Expected: NoAllocation broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Rounds = 3              \* three writes, one after another
    Warm = 1                \* one block in the cache at the start: steady state
    Mutation = "end_in_job" \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoAllocation
