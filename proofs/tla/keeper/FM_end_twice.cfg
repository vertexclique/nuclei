\* MUTATION end_twice: the held send given up on ends for its side a second time, and counts out a second time (a count below zero keeps a later retire waiting). Expected: EndsOnce broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Held = TRUE          \* whether the operation only holds its memory, its end come
    Stuck = TRUE            \* whether the operation ignores the cancel
    Mutation = "end_twice"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    EndsOnce
