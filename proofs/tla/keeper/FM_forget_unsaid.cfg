\* MUTATION forget_unsaid (the code before): an operation is given up on with nothing said and no count anyone
\* sees. Expected: GivenUpSaid broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Held = FALSE          \* whether the operation only holds its memory, its end come
    Stuck = TRUE            \* whether the operation ends only after the shard gave up, if ever
    File = FALSE            \* whether the operation is a file's call
    Within = TRUE           \* whether a file's call ends within the linger time
    Mutation = "forget_unsaid"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    GivenUpSaid
