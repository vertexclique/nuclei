\* A file's call that ignores the cancel and outlasts the short wait, but ends within the linger time (a write in
\* the kernel under a slow device): the shard waits for it past the short wait, so it is never given up on, its
\* memory goes back only after its completion, and everything ends.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Held = FALSE          \* whether the operation only holds its memory, its end come
    Stuck = FALSE            \* whether the operation ends only after the shard gave up, if ever
    File = TRUE            \* whether the operation is a file's call
    Within = TRUE           \* whether a file's call ends within the linger time
    Mutation = "none"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoScribble EndsOnce FileNotGivenUp GivenUpSaid
PROPERTIES                     \* must hold over every behaviour
    Ends
