\* An operation that ignores the cancel as its shard goes: it is given up on, its memory kept for good, and its end an error, so its task gets it and the retire returns.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Held = FALSE          \* whether the operation only holds its memory, its end come
    Stuck = TRUE            \* whether the operation ignores the cancel
    File = FALSE            \* a source's operation
    Within = TRUE           \* (a file's call only)
    Mutation = "none"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoScribble EndsOnce GivenUpSaid
PROPERTIES                     \* must hold over every behaviour
    Ends
