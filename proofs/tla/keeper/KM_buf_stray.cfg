\* MUTATION buf_with_poller, with a thread that kept the notifier (Proactor::wake) instead of the handshake: its write after the poller went has the read write freed memory. Expected: NoWriteAfterFree broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Op = "detach"             \* what the other thread posts
    Stray = TRUE            \* whether a thread that kept the notifier writes the eventfd once
    Mutation = "buf_with_poller"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoWriteAfterFree
