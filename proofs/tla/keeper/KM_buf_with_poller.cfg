\* MUTATION buf_with_poller: the read of the wake lands in memory the poller frees (the code before); a poster that saw the keeper parked writes the eventfd after the keeper let go of the ring, and the read, still armed, writes freed memory. Expected: NoWriteAfterFree broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Op = "register"             \* what the other thread posts
    Stray = FALSE            \* whether a thread that kept the notifier writes the eventfd once
    Mutation = "buf_with_poller"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoWriteAfterFree
