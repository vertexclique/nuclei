\* MUTATION keeper_drops: the keeper drops a registration it finds in the mailbox (the code before), so the source stays claimed with no shard to make its registration and its task waits for good. Expected: NoStuckRegistration broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Op = "register"             \* what the other thread posts
    Stray = FALSE            \* whether a thread that kept the notifier writes the eventfd once
    Mutation = "keeper_drops"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoStuckRegistration
