\* MUTATION no_look: the keeper says it sleeps but does not look at the mailbox after, so a detach posted just before, whose poster saw no flag, waits for good. Expected: Ends broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Op = "detach"             \* what the other thread posts
    Stray = FALSE            \* whether a thread that kept the notifier writes the eventfd once
    Mutation = "no_look"       \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    Ends
