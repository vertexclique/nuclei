\* MUTATION post_no_look: the poster never looks whether the mailbox closed, so a registration posted after the keeper closed it stays claimed for good. Expected: NoStuckRegistration broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Op = "register"             \* what the other thread posts
    Stray = FALSE            \* whether a thread that kept the notifier writes the eventfd once
    Mutation = "post_no_look"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoStuckRegistration
