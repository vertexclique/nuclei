\* A detach posted to a going shard at any moment, its cancel what ends the operation out, with a stray waker: the keeper wakes for it and applies it, the read of the wake writes no freed memory, and everything ends.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Op = "detach"             \* what the other thread posts
    Stray = TRUE            \* whether a thread that kept the notifier writes the eventfd once
    Mutation = "none"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoWriteAfterFree NoStuckRegistration NoStranded
PROPERTIES                     \* must hold over every behaviour
    Ends
