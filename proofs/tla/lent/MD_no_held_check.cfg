\* MUTATION no_held_check: a task holding its own buffer takes the lent one back for a datagram that came ahead,
\* so it receives into another task's buffer and drops its own. Expected: OwnBuffer broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Ahead = TRUE           \* an operation of the driver's may bring a datagram ahead
    Mutation = "no_held_check"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    OwnBuffer
