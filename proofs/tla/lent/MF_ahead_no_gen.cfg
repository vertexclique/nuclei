\* MUTATION ahead_no_gen: cells read ahead before a positional write ended still count, so a later cursor read hands out what the cell held before it. Expected: NoStaleRead broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "generation"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "ahead_no_gen"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
