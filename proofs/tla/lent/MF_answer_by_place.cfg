\* MUTATION answer_by_place: a landed write's answer goes to whichever write asks next. The writer's task goes
\* away with a write out; its next write, another one, takes that write's answer and makes no call: it answers
\* success for bytes that never reach the file. Expected: AllLanded broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "answer_by_place"
INVARIANTS                     \* must hold in every reachable state
    AllLanded
