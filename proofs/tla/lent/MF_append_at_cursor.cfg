\* MUTATION append_at_cursor: an append lands where the cursor was, so the one after the seek writes over the first. Expected: NoOverwrite broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE
    Appending = TRUE
    Scenario = "cursor"
    SyncMayFail = FALSE
    Mutation = "append_at_cursor"
INVARIANTS                     \* must hold in every reachable state
    NoOverwrite
