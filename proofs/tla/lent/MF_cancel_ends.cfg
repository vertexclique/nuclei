\* MUTATION cancel_ends: a write on the ring, cancelled as its shard went, ends there. Expected: AllLanded broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Mutation = "cancel_ends"
INVARIANTS                     \* must hold in every reachable state
    AllLanded
