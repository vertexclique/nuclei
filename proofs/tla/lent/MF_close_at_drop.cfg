\* MUTATION close_at_drop: the handle's descriptor closes as it is dropped, with a write that went away still out
\* on it, which then runs on a closed descriptor (or one another file took). Expected: NoCallOnClosed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "cursor"
    SyncMayFail = FALSE
    Ending = "drop"        \* dropped once no task borrows it
    Mutation = "close_at_drop"
INVARIANTS                     \* must hold in every reachable state
    NoCallOnClosed
