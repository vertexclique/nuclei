\* MUTATION cursor_stays: the cursor stays where an append was made, short of the end. Expected: CursorAtEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE
    Appending = TRUE
    Mutation = "cursor_stays"
INVARIANTS                     \* must hold in every reachable state
    CursorAtEnd
