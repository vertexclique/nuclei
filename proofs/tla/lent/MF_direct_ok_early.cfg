\* MUTATION direct_ok_early (the code before): a write of a file opened for direct IO is answered as it is
\* submitted, from a copy, before its kernel write landed: a caller that takes its return as its bytes on the device
\* is told too early, and its error goes to the next call. Expected: DirectWriteLanded broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "direct_ok_early"
INVARIANTS                     \* must hold in every reachable state
    DirectWriteLanded
