\* MUTATION direct_through_ahead: a read of a file opened for direct IO reads ahead, asking the kernel for more than its caller did. Expected: DirectExact broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Mutation = "direct_through_ahead"
INVARIANTS                     \* must hold in every reachable state
    DirectExact
