\* MUTATION direct_through_behind: a write to a file opened for direct IO joins the write-behind, and goes out with the next one as one kernel write. Expected: DirectExact broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Mutation = "direct_through_behind"
INVARIANTS                     \* must hold in every reachable state
    DirectExact
