\* MUTATION failure_moves_cursor: a direct write the kernel failed leaves the cursor past it: the next write lands
\* one cell on, and the file has a gap where no write landed. Expected: FailureKeepsCursor broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "failure_moves_cursor"
INVARIANTS                     \* must hold in every reachable state
    FailureKeepsCursor
