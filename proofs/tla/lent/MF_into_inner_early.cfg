\* MUTATION into_inner_early: `into_inner` hands the object back without waiting for the jobs still out, and the
\* caller closes it while one of them has yet to run. Expected: NoCallOnClosed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Ending = "into_inner"  \* handed back at once
    Mutation = "into_inner_early"
INVARIANTS                     \* must hold in every reachable state
    NoCallOnClosed
