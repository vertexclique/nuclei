\* MUTATION iopoll_refusal_ends: the polled ring's refusal of a call is the call's end (the code before the fix): a buffered write fails with EOPNOTSUPP, a sync with EINVAL, and the failure stays the handle's for good. Expected: NothingRefused broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_iopoll"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "iopoll_refusal_ends"
INVARIANTS                     \* must hold in every reachable state
    NothingRefused
