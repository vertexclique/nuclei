\* MUTATION no_epoch_check: a read's result counts when only the cursor is the same. Expected: NoStaleRead broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "cursor"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "no_epoch_check"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
