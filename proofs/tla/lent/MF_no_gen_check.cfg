\* MUTATION no_gen_check: a cursor read job's result counts whatever positional write ended while it was out, so it counts what the cell held before that write. Expected: NoStaleRead broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "generation"
    SyncMayFail = FALSE
    Mutation = "no_gen_check"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
