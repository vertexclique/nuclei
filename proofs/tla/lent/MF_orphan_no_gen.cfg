\* MUTATION orphan_no_gen: the file takes a positional write whose task went away with the generation where it was, so cells read ahead while it was out are handed out after it landed. Expected: NoStaleRead broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "generation"
    SyncMayFail = FALSE
    Mutation = "orphan_no_gen"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
