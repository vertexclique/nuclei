\* MUTATION orphan_unordered: a cursor write goes out while a positional write whose task went away is still out, so the older positional write lands on top of it. Expected: PositionalOrder broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "orphan_unordered"
INVARIANTS                     \* must hold in every reachable state
    PositionalOrder
