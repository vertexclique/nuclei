\* MUTATION close_at_drop: the descriptor closes as the handle is dropped, while a positional write whose task
\* went away is still out on it; the write then runs on a closed descriptor (or one another file took).
\* Expected: NoCallOnClosed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Ending = "drop"        \* dropped once no task borrows it
    Mutation = "close_at_drop"
INVARIANTS                     \* must hold in every reachable state
    NoCallOnClosed
