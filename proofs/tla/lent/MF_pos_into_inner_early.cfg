\* MUTATION into_inner_early: `into_inner` hands the object back while a positional write whose task went away is
\* still out, and the caller closes it before the write ran. Expected: NoCallOnClosed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Ending = "into_inner"  \* handed back at once
    Mutation = "into_inner_early"
INVARIANTS                     \* must hold in every reachable state
    NoCallOnClosed
