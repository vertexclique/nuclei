\* MUTATION pos_skips_wait: a positional write goes while the cursor write accepted before it is still out, so it lands first and the cursor write lands on top of it. Expected: PositionalOrder broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Mutation = "pos_skips_wait"
INVARIANTS                     \* must hold in every reachable state
    PositionalOrder
