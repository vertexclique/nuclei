\* MUTATION pr_skips_wait: a positional read goes while the cursor write accepted before it is still out, and reads what the cell held before it. Expected: PosReadSees broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Mutation = "pr_skips_wait"
INVARIANTS                     \* must hold in every reachable state
    PosReadSees
