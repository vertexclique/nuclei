\* MUTATION sticky_unshared: a clone keeps a record of its own (the code before the fix). The clone's sync takes the error of the lost write-back; the handle's sync, called after, finds no error in its own record nor in the kernel, and answers success for the lost writes. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_clone"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sticky_unshared"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
