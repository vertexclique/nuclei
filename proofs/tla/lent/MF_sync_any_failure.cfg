\* MUTATION sync_any_failure: a sync fails if any call failed, one made after its own too. The first sync's call succeeds; before its task takes the answer, the second sync's call fails; the first then reports a failure that is not its own. Expected: NoFalseFailure broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sync_any_failure"
INVARIANTS                     \* must hold in every reachable state
    NoFalseFailure
