\* MUTATION sync_drain: the sync goes once the write-behind went out, its order after the writes left to the ring's drain; a write on the blocking pool is not the ring's, so the device keeps the file without it. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = FALSE
    Mutation = "sync_drain"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
