\* MUTATION sync_forgets: a failed sync is reported once and forgotten, so the next sync calls the device again and says it succeeded. Expected: NoSyncAfterFailure broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sync_forgets"
INVARIANTS                     \* must hold in every reachable state
    NoSyncAfterFailure
