\* MUTATION sync_forgets_loss: a sync reads only whether a sync call failed before (the code before the fix). The kernel fails the first write, the writer's flush reports it and forgets it, and a sync called after makes its call and answers success for the lost write. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_lost"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sync_forgets_loss"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
