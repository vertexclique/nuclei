\* MUTATION sync_kernel_view: a sync decides on what the kernel finished rather than on what its file state took the end of. It polls the writes, the kernel then fails the write in flight, and the sync, seeing nothing in flight, makes its call before any poll took the failure: the call succeeds, and the sync answers success for the lost write. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_lost"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sync_kernel_view"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
