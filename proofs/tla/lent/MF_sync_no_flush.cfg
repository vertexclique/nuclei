\* MUTATION sync_no_flush: the sync goes while a write it covers is still in the write-behind or in flight, so the device keeps the file without it. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sync_no_flush"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
