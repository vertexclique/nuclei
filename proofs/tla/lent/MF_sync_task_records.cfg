\* MUTATION sync_task_records: a call's failure counts only for its own task, as when the task kept its call's result (the code before the fix). A sync's task goes away after its call failed in the kernel; the next sync takes that call's end, drops the failure, makes its own call, which the kernel answers with no error (it reported the one it had), and says the lost writes are durable. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE      \* a sync's task may go away with its call out
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sync_task_records"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
