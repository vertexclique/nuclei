\* MUTATION sync_unserialized: a sync makes its call while another's is out (the code before the fix). The device fails a write-back, the first call reports the error, the second finds none and its end reaches its task before the first's: it says the lost writes are durable. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "sync_unserialized"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
