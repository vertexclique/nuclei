\* MUTATION syncs_per_handle (the code before): the syncs of a handle and of its clone go at once, each handle
\* making its own calls with the failure record shared. The clone's call takes the kernel's error first, and the
\* handle's call, made beside it, finds no error left and answers success for the lost writes: the record holds
\* the clone's failure only once its end was taken, after the handle's call was made. Expected: SyncCovers broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "sync_clone_race"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "syncs_per_handle"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
