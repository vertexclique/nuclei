\* MUTATION wakes_no_lender: the completion into the read-ahead wakes only the plain readers, so the lender never looks again. Expected: a deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Total = 3            \* bytes that arrive
    Cap = 2              \* room of the lender's buffer
    Mutation = "wakes_no_lender"
