\* MUTATION take_keeps_slot: the buffer is taken back while the side still counts it lent. Expected: NoScribble broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Total = 3            \* bytes that arrive
    Cap = 2              \* room of the lent buffer
    MayLeave = TRUE
    Mutation = "take_keeps_slot"
INVARIANTS                     \* must hold in every reachable state
    NoScribble
