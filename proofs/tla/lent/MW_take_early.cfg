\* MUTATION take_early: the task takes its buffer back once some of it went out. Expected: NoScribble broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Room = 2             \* bytes the socket's buffer holds
    MayLeave = FALSE
    Mutation = "take_early"
INVARIANTS                     \* must hold in every reachable state
    NoScribble
