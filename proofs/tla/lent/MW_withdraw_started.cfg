\* MUTATION withdraw_started: a lender that goes away withdraws a write that started. Expected: WireOrder broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Room = 2             \* bytes the socket's buffer holds
    MayLeave = TRUE
    Mutation = "withdraw_started"
INVARIANTS                     \* must hold in every reachable state
    WireOrder
