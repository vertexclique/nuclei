\* MUTATION no_keeper: the shard goes and its sends keep what they hold for good, with nobody to apply their notifications (the bounded wait and forget this replaces). A Released that waits for one never resolves. Expected: Finishes broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Room = 4             \* units the socket holds between the task's send and the peer's reads
    PeerLen = 0          \* units the peer writes before it reads
    Room2 = 1            \* units of the peer's write the task's end holds
    MayLeave = FALSE       \* whether the task may go away while A is lent
    MayDrop = FALSE        \* whether the task may drop a Released
    MayFail = FALSE        \* whether a send may fail
    Teardown = TRUE       \* whether the ring may go with sends out
    Reapable = TRUE        \* whether another thread can reap the ring (multi-issuer)
    Mutation = "no_keeper"  \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    Finishes
