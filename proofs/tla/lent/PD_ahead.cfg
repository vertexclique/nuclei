\* Two tasks' owned receives, the driver queueing datagrams ahead while a buffer waits lent (a ring, a port): every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Ahead = TRUE           \* an operation of the driver's may bring a datagram ahead
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    OwnBuffer
    NoLostBuffer
    Conserved
