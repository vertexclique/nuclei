\* Liveness with datagrams ahead: both tasks get a datagram and every process ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Ahead = TRUE           \* an operation of the driver's may bring a datagram ahead
