\* A file opened to append, any task may go away: every safety property, the appends landing at the end and the cursor following them.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = TRUE
    Scenario = "cursor"
    SyncMayFail = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
    AllLanded
    NoTornRead
    NoOverwrite
    CursorAtEnd
