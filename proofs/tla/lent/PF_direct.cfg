\* A file opened for direct IO: every kernel read and write is exactly one a caller made, no stale or torn read, every write lands.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DirectExact
    NoStaleRead
    NoTornRead
    AllLanded
