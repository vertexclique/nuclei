\* A file opened for direct IO whose writes the kernel may fail (an unaligned one): each write answers only once it
\* landed, a failed one its own error with the cursor taken back, and every write that answered success is in the file.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DirectExact
    NoStaleRead
    NoTornRead
    AllLanded
    DirectWriteLanded
    FailureKeepsCursor
