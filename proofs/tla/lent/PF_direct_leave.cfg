\* A file opened for direct IO, the writer's task going away with a write out: each write answers only once it
\* landed, a write whose task went away still lands and its answer goes to no other write, and every write that
\* answered success is in the file.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DirectExact
    NoStaleRead
    NoTornRead
    AllLanded
    DirectWriteLanded
    FailureKeepsCursor
