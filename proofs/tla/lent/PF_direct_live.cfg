\* Liveness on a file opened for direct IO: every task and the pool end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
VIEW LiveView                  \* states told apart only by what a step reads (see LiveView)
PROPERTIES                     \* must hold over every behaviour
    Termination
