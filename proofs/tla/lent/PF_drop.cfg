\* Two readers and a writer on one file, any of them may go away, then the handle dropped with jobs still out:
\* every safety property, no call on a descriptor that closed, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "cursor"
    SyncMayFail = FALSE
    Ending = "drop"        \* dropped once no task borrows it: the last lease closes its object
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
    AllLanded
    NoTornRead
    NoCallOnClosed
