\* A file opened to sync each write (O_DSYNC, O_SYNC, FILE_FLAG_WRITE_THROUGH), reads through the read-ahead, the
\* kernel may fail a write: each write answers only once it landed, with its own result, a failed one leaving the
\* cursor where it was made, and every write that answered success is in the file (a task that goes away is
\* PF_direct_leave's, the same writes on a direct file).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "dsync"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
    NoTornRead
    AllLanded
    DirectWriteLanded
    FailureKeepsCursor
