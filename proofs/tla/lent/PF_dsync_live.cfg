\* Liveness on a file opened to sync each write: every task and the pool end. Writes the kernel fails and a task
\* that goes away are left to PF_dsync, a safety configuration, so this one stays within its time.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "dsync"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
VIEW LiveView                  \* states told apart only by what a step reads (see LiveView)
PROPERTIES                     \* must hold over every behaviour
    Termination
