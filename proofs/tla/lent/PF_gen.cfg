\* A cursor read through the read-ahead and one into its own buffer beside a positional write of cell 1, whose task may go away: no read counts a stale or torn cell unless the positional write races it, and positional calls never move the cursor or the epoch.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "generation"
    SyncMayFail = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
    NoTornRead
PROPERTIES                     \* must hold over every behaviour
    PositionalKeepsCursor
