\* Two readers and a writer on one file, any of them may go away, then the object handed back by `into_inner`,
\* which the caller closes at once: every safety property, no call on a descriptor that closed, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Ending = "into_inner"  \* handed back once no lease is out
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
    AllLanded
    NoTornRead
    NoCallOnClosed
