\* Two readers and a writer on one file, any of them may go away: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "cursor"
    SyncMayFail = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
    AllLanded
    NoTornRead
