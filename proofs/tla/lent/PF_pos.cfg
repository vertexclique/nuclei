\* A positional write and a positional read of cell 0 beside the cursor writer's write of it, the positional writer may go away: each cell a positional write reached holds the write that came last, a positional read sees the cursor writes before it, every cursor write lands, and positional calls never move the cursor or the epoch.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    PositionalOrder
    PosReadSees
    AllLanded
PROPERTIES                     \* must hold over every behaviour
    PositionalKeepsCursor
