\* A positional write and a positional read beside the cursor writer, the positional writer may go away with its
\* write still out, then the handle dropped: the write left to the file still lands on an open descriptor, and
\* every positional rule holds.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Ending = "drop"        \* dropped once no task borrows it: the last lease closes its object
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    PositionalOrder
    PosReadSees
    AllLanded
    NoCallOnClosed
