\* As PF_pos_drop, but the object is handed back by `into_inner`, which the caller closes at once: the handle
\* waits for the positional write left by its task before it hands the object back.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Ending = "into_inner"  \* handed back once no lease is out
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    PositionalOrder
    PosReadSees
    AllLanded
    NoCallOnClosed
