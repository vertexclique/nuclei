\* Two readers and a writer that stay until their jobs end: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "cursor"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoStaleRead
    AllLanded
    NoTornRead
