\* Two syncs beside a write in flight and one in the write-behind, the device may fail a sync: what a good sync covers is durable, no sync succeeds after one failed, and every write lands.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
    NoSyncAfterFailure
    AllLanded
