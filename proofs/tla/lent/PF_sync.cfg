\* Two syncs beside a write in flight and one in the write-behind, the device may fail a write-back: what a good sync covers is durable, no sync called after a failure succeeds, a sync fails only for its own call or one before it, and every write lands.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
    NoSyncAfterFailure
    NoFalseFailure
    AllLanded
