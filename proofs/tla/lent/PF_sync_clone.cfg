\* A sync of a clone of the handle fails for a write-back the device lost, then a sync of the handle is called: it reads the record the two share and fails too, with no call, though the kernel has no error left to report to it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_clone"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
    NoSyncAfterFailure
    NoFalseFailure
    AllLanded
