\* The syncs of a handle and of its clone go at once, the device may fail a write-back: the record the two share
\* keeps their calls, one at a time, so a call never goes beside the clone's to find the kernel's error taken by
\* it, and what a good sync covers is durable.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "sync_clone_race"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
    NoSyncAfterFailure
    NoFalseFailure
    AllLanded
