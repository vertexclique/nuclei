\* Two syncs beside a write in flight and one in the write-behind, on a ring that polls for its completions and refuses a sync and a buffered write: each refused call is made again on the blocking pool, so none is refused, every write lands, and each sync covers what it must.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_iopoll"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
    NoSyncAfterFailure
    NoFalseFailure
    AllLanded
    NothingRefused
