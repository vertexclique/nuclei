\* Liveness on a ring that polls for its completions: every refused call is made again, and every task and the pool end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_iopoll"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Termination
