\* The kernel fails a cursor write the handle had accepted, beside two syncs: a flush reports it once, and every sync after that fails too (the record the handle keeps), so no sync that answers success covers a lost write.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    MayLeave = FALSE     \* every sync's task waits for its answer
    Appending = FALSE
    Scenario = "sync_lost"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SyncCovers
    NoSyncAfterFailure
    NoFalseFailure
    AllLanded
