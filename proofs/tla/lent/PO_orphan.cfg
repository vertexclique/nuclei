\* Owned receives of a datagram that fills the buffer, one longer and one shorter, each of which its task may give up:
\* a later receive gets every datagram whole, none whole is dropped, and each is in one place.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a buffer lent with no datagram left waits for good
CONSTANTS
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoCutPassed
    NoWholeDropped
    Conserved
