\* Liveness: under weak fairness the lender reads every byte and the end, and every process ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Total = 3            \* bytes that arrive
    Cap = 2              \* room of the lender's buffer
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Termination
