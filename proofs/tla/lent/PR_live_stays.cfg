\* Liveness with a lender that stays: every byte is taken and every process ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Total = 3            \* bytes that arrive
    Cap = 2              \* room of the lent buffer
    MayLeave = FALSE
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Termination
