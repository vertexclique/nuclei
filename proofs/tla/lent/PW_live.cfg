\* Liveness: under weak fairness the peer reads everything and every process ends, whether the lender stays or goes.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Room = 2             \* bytes the socket's buffer holds
    MayLeave = TRUE
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Termination
