\* A socket that holds one byte, so the lent buffer goes out one byte a call: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Room = 1             \* bytes the socket's buffer holds
    MayLeave = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    WireOrder
    Delivered
    NoScribble
