\* A lender that stays until its write completes: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Room = 2             \* bytes the socket's buffer holds
    MayLeave = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    WireOrder
    Delivered
    NoScribble
