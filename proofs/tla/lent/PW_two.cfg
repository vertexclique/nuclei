\* A socket that holds two bytes, a lender that may go away: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Room = 2             \* bytes the socket's buffer holds
    MayLeave = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    WireOrder
    Delivered
    NoScribble
