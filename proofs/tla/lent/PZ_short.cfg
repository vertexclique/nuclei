\* A socket that holds one unit, so every chunk is cut short; a Released may be dropped and a send may fail: every safety property, and no deadlock.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CONSTANTS
    Room = 1             \* units the socket holds between the task's send and the peer's reads
    PeerLen = 0          \* units the peer writes before it reads
    Room2 = 1            \* units of the peer's write the task's end holds
    MayLeave = FALSE       \* whether the task may go away while A is lent
    MayDrop = TRUE        \* whether the task may drop a Released
    MayFail = TRUE        \* whether a send may fail
    Teardown = FALSE       \* whether the ring may go with sends out
    Mutation = "none"  \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    WireOrder
    Delivered
    NoScribble
