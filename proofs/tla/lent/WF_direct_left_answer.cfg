\* WITNESS: the writer's task goes away with a direct write out: the write lands, and its answer is never
\* taken. Expected: NoLeftAnswer broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLeftAnswer
