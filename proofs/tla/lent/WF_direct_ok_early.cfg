\* WITNESS of the code as it is: a copied write on a direct file is answered as it is submitted, before its kernel write landed, so a caller that takes the write's return as its bytes on the device (a file opened with O_DIRECT and O_DSYNC) is told too early, and its error goes to the next call. Making it Ready only once it landed needs a way to tell a write polled again from a new one after a dropped one, an operator decision. Expected: DirectWriteLanded broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = FALSE
    Appending = FALSE
    Scenario = "direct"
    SyncMayFail = FALSE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    DirectWriteLanded
