\* WITNESS: a job is still out when its handle is dropped, and it closes the object once it ran.
\* Expected: NoJobAfterDrop broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Ending = "drop"        \* dropped once no task borrows it
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoJobAfterDrop
