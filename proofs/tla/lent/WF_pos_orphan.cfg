\* WITNESS: the positional write of a task that went away lands and the file takes it. Expected: NoPosOrphanLanded broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE
    Appending = FALSE
    Scenario = "positional"
    SyncMayFail = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoPosOrphanLanded
