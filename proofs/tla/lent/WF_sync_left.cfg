\* WITNESS: a sync's task goes away with its call out, and the other sync takes that call's end. Expected: NoLeftTaken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    MayLeave = TRUE      \* a sync's task may go away with its call out
    Appending = FALSE
    Scenario = "sync"
    SyncMayFail = TRUE
    Ending = "none"      \* the handle outlives the run
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLeftTaken
