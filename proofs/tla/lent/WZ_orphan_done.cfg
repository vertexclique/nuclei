\* WITNESS: the side finishes the write of a task that went away. Expected: NoOrphanDone broken.
SPECIFICATION Spec              \* the system, every step that must happen weakly fair
CHECK_DEADLOCK FALSE           \* a stuck run is what a property looks for, or not this run's concern
CONSTANTS
    Room = 2             \* units the socket holds between the task's send and the peer's reads
    PeerLen = 0          \* units the peer writes before it reads
    Room2 = 1            \* units of the peer's write the task's end holds
    MayLeave = TRUE       \* whether the task may go away while A is lent
    MayDrop = FALSE        \* whether the task may drop a Released
    MayFail = FALSE        \* whether a send may fail
    Teardown = FALSE       \* whether the ring may go with sends out
    Reapable = TRUE        \* whether another thread can reap the ring (multi-issuer)
    Mutation = "none"  \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoOrphanDone
