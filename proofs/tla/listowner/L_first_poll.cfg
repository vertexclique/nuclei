\* A first poll of A that may block while the shard is taken: T1 edits only what it still owns, posts the rest, and the owner applies it. Every invariant holds.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the shard's end is an end, not a deadlock
CONSTANTS
    AListed = FALSE             \* A not listed yet: its pending lists it
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OwnerOnly
    NoUseAfterFree
    NoDangling
    NoDoubleLink
    NoDeadListed
    NoneLost
