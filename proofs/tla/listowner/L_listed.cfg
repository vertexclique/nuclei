\* A later poll of a listed A that may block while the shard is taken: a ready unlists it through the owner, and A lives until then. Every invariant holds.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the shard's end is an end, not a deadlock
CONSTANTS
    AListed = TRUE             \* A listed by an earlier poll: its ready unlists it
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OwnerOnly
    NoUseAfterFree
    NoDangling
    NoDoubleLink
    NoDeadListed
    NoneLost
