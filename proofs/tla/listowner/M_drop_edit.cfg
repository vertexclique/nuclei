\* MUTATION drop_edit: after the take T1 posts nothing, so a pending A is on no list and the drop never ends it.
\* Expected: NoneLost broken.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the shard's end is an end, not a deadlock
CONSTANTS
    AListed = FALSE             \* A not listed yet
    Mutation = "drop_edit"
INVARIANTS                     \* must hold in every reachable state
    OwnerOnly
    NoUseAfterFree
    NoDangling
    NoDoubleLink
    NoDeadListed
    NoneLost
