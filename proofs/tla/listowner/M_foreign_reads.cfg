\* MUTATION foreign_reads: a thread off the owner drops A's future and decides from its look at A's links; the owner
\* applies T1's posted list between the look and the drop, so X sees A off, posts nothing, and A stays linked with no
\* future and no unlist on its way.
\* Expected: NoDeadListed broken.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the shard's end is an end, not a deadlock
CONSTANTS
    AListed = FALSE             \* A not listed yet: T1's pending lists it through the owner
    Mutation = "foreign_reads"
INVARIANTS                     \* must hold in every reachable state
    OwnerOnly
    NoUseAfterFree
    NoDangling
    NoDoubleLink
    NoDeadListed
    NoneLost
