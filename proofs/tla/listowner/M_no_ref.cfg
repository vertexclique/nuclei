    AListed = TRUE             \* A listed by an earlier poll
    Mutation = "no_ref"
INVARIANTS                     \* must hold in every reachable state
    OwnerOnly
    NoUseAfterFree
    NoDangling
    NoDoubleLink
    NoDeadListed
    NoneLost
