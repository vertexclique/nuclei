\* MUTATION no_skip_ended: A ended on the owner before the posted list was applied, and the apply links a task with no
\* future, whose memory then goes while it is linked: a node the owner's next walk would follow.
\* Expected: NoDangling broken.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the shard's end is an end, not a deadlock
CONSTANTS
    AListed = FALSE             \* A not listed yet
    Mutation = "no_skip_ended"
INVARIANTS                     \* must hold in every reachable state
    OwnerOnly
    NoUseAfterFree
    NoDangling
    NoDoubleLink
    NoDeadListed
    NoneLost
