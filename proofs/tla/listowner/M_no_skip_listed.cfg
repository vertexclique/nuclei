\* MUTATION no_skip_listed: the owner listed A itself on a later pending poll, then applies the posted list and links A a second time.
\* Expected: NoDoubleLink broken.
SPECIFICATION Spec              \* every behaviour of the steps
CHECK_DEADLOCK FALSE           \* the shard's end is an end, not a deadlock
CONSTANTS
    AListed = FALSE             \* A not listed yet
    Mutation = "no_skip_listed"
INVARIANTS                     \* must hold in every reachable state
    OwnerOnly
    NoUseAfterFree
    NoDangling
    NoDoubleLink
    NoDeadListed
    NoneLost
