\* A closed() wait, sends and the receiver's close: the close ends the wait, a send after
\* it fails, the end only once every value sent was received.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- ClosedThenSend
    RxProg <- P_recv_close_recv_recv
    Reentrant = FALSE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotsConserved
    EndAfterAll
PROPERTIES                     \* must hold over every behaviour
    AllEnd
