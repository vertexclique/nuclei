\* Two closed() waits; the first one's waker panics as the close wakes it. The close's guard wakes
\* the other before the panic goes on, so every task with a working waker ends.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- TwoClosed
    RxProg <- P_close
    Reentrant = FALSE
    WakePanics = {1}
    RecvPanics = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotsConserved
PROPERTIES                     \* must hold over every behaviour
    OthersEnd
