\* The receiver drops after one try: its drop gives every queued value's slot back and
\* ends the closed() wait.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 2                     \* the channel's slots
    Progs <- SendAndClosed
    RxProg <- P_try_drop
    Reentrant = FALSE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotsConserved
PROPERTIES                     \* must hold over every behaviour
    AllEnd
