\* One slot; the second send waits for it. The first receive gives the slot to that send, whose
\* waker panics: the value in hand goes back to the front and the slot is taken back as a debt.
\* The receiver gets both values once each, in order, and no slot is made up.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- SendTwice
    RxProg <- P_recv_recv
    Reentrant = FALSE
    WakePanics = {}
    RecvPanics = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotsConserved
    EndAfterAll
    NoValueLost
PROPERTIES                     \* must hold over every behaviour
    AllEnd
