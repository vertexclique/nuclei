\* The receiver's registration clones its waker, and the clone may run the send in the middle:
\* the send's wake finds the cell empty, and the look again after the clone finds the value. The
\* sender keeps its handle until the receiver is done, so only that look can end the receive.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- SendHold
    RxProg <- P_recv
    Reentrant = TRUE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotsConserved
    EndAfterAll
    NoValueLost
PROPERTIES                     \* must hold over every behaviour
    AllEnd
