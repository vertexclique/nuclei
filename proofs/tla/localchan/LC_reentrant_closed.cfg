\* A closed() wait clones its waker before it looks and joins the list, and the clone may run the
\* close in the middle: the look after the clone finds it, and the wait ends.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- OneClosed
    RxProg <- P_close
    Reentrant = TRUE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotsConserved
    EndAfterAll
PROPERTIES                     \* must hold over every behaviour
    AllEnd
