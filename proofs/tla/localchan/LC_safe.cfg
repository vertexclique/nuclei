\* Two senders, one dropping a reservation, against four receives on one slot: no slot
\* lost, the end only with every value received, every task done.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- TwoSenders
    RxProg <- P_recv_recv_recv_recv
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotsConserved
    EndAfterAll
PROPERTIES                     \* must hold over every behaviour
    AllEnd
