\* A sender in closed() then a send, against a close then a receive: the close wakes the
\* sender, whose send fails and gets its value back; the receive ends with the error.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_park_send
    RxProg <- P_close_recv
    Reentrant = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    NoSendPastClose
PROPERTIES                     \* must hold over every behaviour
    Termination
