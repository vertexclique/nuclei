\* The receiver's registration clones its waker, and the clone may run the sender's send (or its
\* drop) in the middle: the send's wake finds the cell empty, and the poll's look again after the
\* clone finds the value. The value once, and both tasks done.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_send
    RxProg <- P_recv
    Reentrant = TRUE            \* a clone is a step of its own
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    NoSendPastClose
PROPERTIES                     \* must hold over every behaviour
    Termination
