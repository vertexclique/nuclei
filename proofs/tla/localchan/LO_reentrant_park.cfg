\* A sender waiting in closed() whose registration's clone may run the receiver's close in the
\* middle: the close's wake finds the cell empty, and the look again after the clone finds the
\* close. Both tasks done.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_park
    RxProg <- P_close
    Reentrant = TRUE            \* a clone is a step of its own
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    NoSendPastClose
PROPERTIES                     \* must hold over every behaviour
    Termination
