\* MUTATION close_stops_at_panic: the close's loop ends at the panicking waker. A wait it had not
\* reached yet sleeps for good, and a second close returns at once. Expected: OthersEnd broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- TwoClosed
    RxProg <- P_close
    Reentrant = FALSE
    WakePanics = {1}
    RecvPanics = FALSE
    Mutation = "close_stops_at_panic"
PROPERTIES                     \* must hold over every behaviour
    OthersEnd
