\* MUTATION closed_no_relook: a closed() wait joins the list after its clone without looking again.
\* The close the clone ran woke the list before the wait was in it, and the wait sleeps for good.
\* Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- OneClosed
    RxProg <- P_close
    Reentrant = TRUE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "closed_no_relook"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
