\* MUTATION finish_ignores_reserved: the end is answered with a slot reserved and not used
\* yet. The sender reserved before the close and pushes after the receiver answered the
\* end: a value nobody takes. Expected: EndAfterAll broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- OneSend
    RxProg <- P_close_recv_recv
    Reentrant = FALSE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "finish_ignores_reserved"
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
