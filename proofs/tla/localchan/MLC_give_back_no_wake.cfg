\* MUTATION give_back_no_wake: a dropped reservation gives its slot back without waking
\* the receiver. The closed receiver waits for that slot to end the stream, and sleeps
\* on. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- ReserveDropHold
    RxProg <- P_close_recv
    Reentrant = FALSE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "give_back_no_wake"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
