\* MUTATION last_drop_no_wake: the last sender goes without waking the receiver, which
\* took the one value and sleeps for the end. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- OneSend
    RxProg <- P_recv_recv
    Mutation = "last_drop_no_wake"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
