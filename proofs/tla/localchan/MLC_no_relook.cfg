\* MUTATION no_relook: the receiver answers Pending after its registration's clone without looking
\* again. The send the clone ran woke an empty cell, and the receiver sleeps for good beside the
\* value, its sender waiting for it to end. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- SendHold
    RxProg <- P_recv
    Reentrant = TRUE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "no_relook"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
