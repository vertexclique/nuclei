\* MUTATION pop_lost: no guard on the receive. The slot's waiting send panics as it is woken, and
\* the value the receive held is dropped as the panic unwinds. Expected: NoValueLost broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- SendTwice
    RxProg <- P_recv_recv
    Reentrant = FALSE
    WakePanics = {}
    RecvPanics = TRUE
    Mutation = "pop_lost"
INVARIANTS                     \* must hold in every reachable state
    NoValueLost
PROPERTIES                     \* must hold over every behaviour
    AllEnd
