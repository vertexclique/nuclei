\* MUTATION push_no_wake: a push wakes nobody. The receiver registered and sleeps; the
\* value comes, and the sender keeps the channel open. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* the channel's slots
    Progs <- SendHold
    RxProg <- P_recv
    Reentrant = FALSE
    WakePanics = {}
    RecvPanics = FALSE
    Mutation = "push_no_wake"
PROPERTIES                     \* must hold over every behaviour
    AllEnd
