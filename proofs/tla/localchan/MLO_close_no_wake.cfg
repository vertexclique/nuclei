\* MUTATION close_no_wake: the close wakes nobody; the sender in closed() sleeps for good.
\* Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_park
    RxProg <- P_close
    Mutation = "close_no_wake"
PROPERTIES                     \* must hold over every behaviour
    Termination
