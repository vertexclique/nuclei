\* MUTATION closed_no_relook: a sender's closed() poll answers Pending after its registration's
\* clone without looking again. A close the clone ran woke an empty cell, and the sender sleeps
\* for good after the close. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_park
    RxProg <- P_close
    Reentrant = TRUE            \* a clone is a step of its own
    Mutation = "closed_no_relook"
PROPERTIES                     \* must hold over every behaviour
    Termination
