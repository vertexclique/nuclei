\* MUTATION drop_no_wake: the sender's drop wakes nobody; the receiver registered and
\* sleeps for good. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_drop
    RxProg <- P_recv
    Reentrant = FALSE
    Mutation = "drop_no_wake"
PROPERTIES                     \* must hold over every behaviour
    Termination
