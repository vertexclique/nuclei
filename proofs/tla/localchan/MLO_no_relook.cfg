\* MUTATION no_relook: the receiver's poll answers Pending after its registration's clone without
\* looking again. A send the clone ran woke an empty cell, and the receiver sleeps for good beside
\* the value. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_send
    RxProg <- P_recv
    Reentrant = TRUE            \* a clone is a step of its own
    Mutation = "no_relook"
PROPERTIES                     \* must hold over every behaviour
    Termination
