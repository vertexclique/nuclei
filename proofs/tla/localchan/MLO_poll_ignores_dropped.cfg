\* MUTATION poll_ignores_dropped: a poll completes only on the sent and closed bits. The
\* sender drops without sending; the woken receiver registers again and sleeps for good.
\* Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_drop
    RxProg <- P_recv
    Reentrant = FALSE
    Mutation = "poll_ignores_dropped"
PROPERTIES                     \* must hold over every behaviour
    Termination
