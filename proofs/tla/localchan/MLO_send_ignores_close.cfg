\* MUTATION send_ignores_close: a send after the close answers Ok. Expected:
\* NoSendPastClose broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Prog <- P_send
    RxProg <- P_close
    Mutation = "send_ignores_close"
INVARIANTS                     \* must hold in every reachable state
    NoSendPastClose
