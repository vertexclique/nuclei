\* Two tasks that need both permits and one that needs one, each acquire cloning its waker as a
\* step of its own before it joins the line: a release that lands during the clone is seen by the
\* look after it, so nobody joins a line beside its free permits. Every safety property.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsBig      \* a and b need 2, c needs 1
    Cancels = {}           \* nobody's acquire is dropped
    Tries = {}             \* nobody only tries
    Reentrant = TRUE       \* the clone before a join is a step of its own
    WakePanics = {}        \* every waker works
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
