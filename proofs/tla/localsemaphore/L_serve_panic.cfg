\* The task that needs both permits releases them to the two waiting tasks that need one, the
\* waker of "a" panicking as the serve grants it: the serve's guard serves the rest of the line,
\* so nobody is left at the front beside its free permits. Every safety property.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsMixed    \* b needs 2, a and c need 1
    Cancels = {}           \* nobody's acquire is dropped
    Tries = {}             \* nobody only tries
    Reentrant = FALSE      \* a clone is part of its poll
    WakePanics = {"a"}     \* a's waker panics when it is granted
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
