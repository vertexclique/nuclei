\* An attempt that never waits racing a big waiter: every safety property, and no deadlock.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsMixed    \* b needs 2, a and c need 1
    Cancels = {}           \* no acquire is dropped
    Tries = {"c"}           \* c only tries
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
