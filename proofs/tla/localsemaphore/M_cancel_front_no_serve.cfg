\* MUTATION cancel_front_no_serve: the front waiter is dropped and the line is not served again, so the next waiter sleeps with its permit free. Expected: NoIdleFront broken.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsMixed    \* b needs 2, a and c need 1
    Cancels = {"b"}         \* b's acquire may be dropped
    Tries = {}             \* nobody only tries
    Mutation = "cancel_front_no_serve"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoIdleFront
