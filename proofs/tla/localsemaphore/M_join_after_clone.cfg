\* MUTATION join_after_clone: an acquire joins the line after its clone without looking again. A
\* release the clone ran (a permit dropped in it) served a line the acquire was not in yet, so it
\* sleeps at the front with its permits free. Expected: NoIdleFront broken.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsBig      \* a and b need 2, c needs 1
    Cancels = {}           \* nobody's acquire is dropped
    Tries = {}             \* nobody only tries
    Reentrant = TRUE       \* the clone before a join is a step of its own
    WakePanics = {}        \* every waker works
    Mutation = "join_after_clone"
INVARIANTS                     \* must hold in every reachable state
    NoIdleFront
