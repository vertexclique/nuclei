\* WITNESS: an acquire is dropped after its grant and before it took it, and its permits pass on. Expected: NoPassOn broken.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsBig      \* a and b need 2, c needs 1
    Cancels = {"b"}         \* b's acquire may be dropped
    Tries = {}             \* nobody only tries
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoPassOn
