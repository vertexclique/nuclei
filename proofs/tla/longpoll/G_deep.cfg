\* GREEN: three levels of polls: a block_on inside a task's poll whose loop polls a task that calls
\* block_on again, or a block_on future that calls block_on. Every report names the innermost noted
\* task. Five polls reach a task's poll three deep, whose end must put back the task of the level
\* above (not the outermost, not 0), and a future two block_on calls deep, which must still name
\* the outermost task. OncePerPoll is not checked (see G_nested.cfg).
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 5          \* polls the runner begins in all
    MaxDepth = 3          \* polls on its stack at once at most
    Streak = 1            \* equal reads past the first that make a poll long
    Brackets = FALSE      \* whether a poll's code may call into the runtime beside block_on
    Mode = "ok"           \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    ReportedIsOnStack
    NamesInnermostNoted
    SlotTracksStack
