\* GREEN: the runner polls three tasks one after the other, and each may call into the runtime
\* any number of times. Every report names the poll's own task while it is on the stack, comes
\* once per poll, and never names a poll that began after the long one. Three polls and a streak of two are enough: a poll's word comes back after each
\* call into the runtime, and a new poll's word follows one that ended, the only ways a word repeats
\* or a note goes stale without nesting; the monitor may read at any moment in between.
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 3          \* polls the runner begins in all
    MaxDepth = 1          \* polls on its stack at once at most
    Streak = 2            \* equal reads past the first that make a poll long
    Brackets = TRUE       \* whether a poll's code may call into the runtime beside block_on
    Mode = "ok"           \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    ReportedIsOnStack
    NamesInnermostNoted
    OncePerPoll
    NoNewerName
    SlotTracksStack
