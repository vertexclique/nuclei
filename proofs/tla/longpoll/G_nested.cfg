\* GREEN: a task's poll calls block_on, whose loop polls its future first and then a task or the
\* future again, and every poll may call into the runtime. Every report names a task on the stack,
\* the innermost noted one. Four polls are the first that let a nested task's poll end and its
\* enclosing task's poll, or the block_on future's, run on, where a note left behind or lost would
\* show. OncePerPoll does not hold once polls nest (W_twice_after_nesting.cfg), so it is not here.
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 4          \* polls the runner begins in all
    MaxDepth = 2          \* polls on its stack at once at most
    Streak = 1            \* equal reads past the first that make a poll long
    Brackets = TRUE       \* whether a poll's code may call into the runtime beside block_on
    Mode = "ok"           \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    ReportedIsOnStack
    NamesInnermostNoted
    SlotTracksStack
