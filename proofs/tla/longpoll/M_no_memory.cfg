\* MUTATION no_memory: the monitor does not remember the word it reported, so a poll that stays
\* long is reported again at every streak. Expected: OncePerPoll broken. One poll is enough.
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 1          \* polls the runner begins in all
    MaxDepth = 1          \* polls on its stack at once at most
    Streak = 1            \* equal reads past the first that make a poll long
    Brackets = FALSE      \* whether a poll's code may call into the runtime beside block_on
    Mode = "no_memory"    \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    OncePerPoll
