\* MUTATION no_reread: the monitor calls the hook with the task it read without looking at the
\* word again. The runner ends the long poll and begins the next between the monitor's read of
\* the word and its read of the task, so the hook names the newer poll's task as the long one's.
\* Expected: NoNewerName broken. Two polls, one after the other, are the least that show it.
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 2          \* polls the runner begins in all
    MaxDepth = 1          \* polls on its stack at once at most
    Streak = 1            \* equal reads past the first that make a poll long
    Brackets = FALSE      \* whether a poll's code may call into the runtime beside block_on
    Mode = "no_reread"    \* the rule this run breaks: no second look at the word
INVARIANTS                     \* must hold in every reachable state
    NoNewerName
