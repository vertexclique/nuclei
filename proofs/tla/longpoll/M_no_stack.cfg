\* MUTATION no_stack: begin keeps no stack of the tasks it replaced, so every end puts 0 back. Once
\* a task polled inside a block_on of task S ends, the slot says 0 while S's poll, or its block_on
\* future's, runs on, and the long poll reads 0 and reports nothing: S is lost. Expected:
\* NamesInnermostNoted broken. Three polls (S, the block_on's future, the nested task) reach it.
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 3          \* polls the runner begins in all
    MaxDepth = 2          \* polls on its stack at once at most
    Streak = 1            \* equal reads past the first that make a poll long
    Brackets = FALSE      \* whether a poll's code may call into the runtime beside block_on
    Mode = "no_stack"     \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    NamesInnermostNoted
