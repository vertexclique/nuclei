\* MUTATION one_cell: begin keeps the task it replaced in one cell instead of a stack, so a nested
\* begin overwrites the outer one's. S's end then puts S itself back, and the next poll, read long
\* before its begin, is reported as S, whose poll ended. Expected: ReportedIsOnStack broken. Five
\* polls reach it: S, its block_on's future, a nested task, the future again (Ready), the next task.
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 5          \* polls the runner begins in all
    MaxDepth = 2          \* polls on its stack at once at most
    Streak = 1            \* equal reads past the first that make a poll long
    Brackets = FALSE      \* whether a poll's code may call into the runtime beside block_on
    Mode = "one_cell"     \* the rule this run breaks, if any
INVARIANTS                     \* must hold in every reachable state
    ReportedIsOnStack
