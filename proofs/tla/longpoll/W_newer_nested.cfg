\* WITNESS: the second look at the word cannot see a poll that began and ended inside the long
\* one. A task's poll calls block_on, whose loop polls its future and then a task; the monitor
\* reads the long word, then the slot names the nested task, which ends, and the block_on returns
\* to the long poll's own word before the second look. Expected: NoNewerName broken, as the docs
\* of on_long_poll allow. Four polls, two deep, leave room for the block_on future to be polled
\* again before it returns.
SPECIFICATION Spec              \* every behaviour of the runner and the monitor
CONSTANTS
    MaxPolls = 4          \* polls the runner begins in all
    MaxDepth = 2          \* polls on its stack at once at most
    Streak = 1            \* equal reads past the first that make a poll long
    Brackets = FALSE      \* whether a poll's code may call into the runtime beside block_on
    Mode = "ok"           \* no rule broken
INVARIANTS                     \* must hold in every reachable state
    NoNewerName
