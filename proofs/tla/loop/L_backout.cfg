\* Idle passes may look at no driver (a park that backs out with the spin cold), in any order with the
\* other turns: each keeps the count of runs and counts like the future's own turn, so the driver still
\* gets a look at least once every 2N - 1 turns.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = TRUE         \* an idle pass may look at no driver
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "loop"          \* the run loop
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
