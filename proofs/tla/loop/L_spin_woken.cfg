\* A warm spin may find the future woken from another thread just after the pass looked at it, in any
\* order with the other turns: its first look asks the poller before it looks at the future, so the
\* pass looks, and the driver still gets a look at least once every 2N - 1 turns.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = TRUE         \* an idle pass may look at no driver
    SpinWoken = TRUE       \* a warm spin may find the future woken
    Mode = "loop"          \* the run loop
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
