\* Turns driven by hand, any number of tasks ready: at most 2N run between two looks.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = FALSE        \* every idle pass looks: L_backout checks the passes that do not
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "turn"          \* turns driven by hand
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TurnGap
