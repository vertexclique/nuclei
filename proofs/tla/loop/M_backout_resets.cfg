\* MUTATION backout_resets: an idle pass that looked at no driver is counted like the future's own turn,
\* but starts the count of runs over, as the code did before. Runs and such passes take turns, each count
\* stays below N, and the driver is never looked at. Expected: BoundedGap broken.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CHECK_DEADLOCK FALSE           \* a stuck loop is not what this run looks for
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = TRUE         \* an idle pass may look at no driver
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "loop"          \* the run loop
    Mutation = "backout_resets"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
