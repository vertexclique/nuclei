\* MUTATION backout_uncounted: an idle pass that looked at no driver keeps the count of runs, but is not
\* counted itself: work posted at that moment, again and again, keeps the driver from ever being looked
\* at. Expected: BoundedGap broken.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CHECK_DEADLOCK FALSE           \* a stuck loop is not what this run looks for
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = TRUE         \* an idle pass may look at no driver
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "loop"          \* the run loop
    Mutation = "backout_uncounted"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
