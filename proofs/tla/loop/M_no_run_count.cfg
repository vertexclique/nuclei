\* MUTATION no_run_count: a task's run is not counted down to the next look, so tasks that keep waking
\* each other run for good and the driver is never looked at. Expected: BoundedGap broken.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CHECK_DEADLOCK FALSE           \* a stuck loop is not what this run looks for
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = FALSE        \* every idle pass looks: L_backout checks the passes that do not
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "loop"          \* the run loop
    Mutation = "no_run_count"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
