\* MUTATION no_self_woken_count: the future's own turns are not counted.
\* Expected: BoundedGap broken (a future that keeps waking itself starves the driver).
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CHECK_DEADLOCK FALSE           \* a stuck loop is not what this run looks for
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = FALSE        \* every idle pass looks: L_backout checks the passes that do not
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "loop"          \* the run loop
    Mutation = "no_self_woken_count"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
