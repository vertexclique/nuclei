\* MUTATION spin_woken_unlooked: a warm spin's first look reads the future's flag before it asks the
\* poller, as the code did before, and stops there when the future was woken: the pass starts the count
\* of runs over with no look. A future woken from another thread in that window, again and again, keeps
\* the poller from being looked at. Expected: BoundedGap broken.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CHECK_DEADLOCK FALSE           \* a stuck loop is not what this run looks for
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = TRUE         \* an idle pass may look at no driver
    SpinWoken = TRUE       \* a warm spin may find the future woken
    Mode = "loop"          \* the run loop
    Mutation = "spin_woken_unlooked"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
