\* MUTATION turn_unbounded: a turn driven by hand runs every task ready, with no bound, as
\* `run_ready` did: a task that keeps yielding keeps the turn from looking at its timers or
\* its poller, or returning. Expected: TurnGap broken.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CHECK_DEADLOCK FALSE           \* a stuck loop is not what this run looks for
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = FALSE        \* every idle pass looks: L_backout checks the passes that do not
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "turn"          \* turns driven by hand
    Mutation = "turn_unbounded"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    TurnGap
