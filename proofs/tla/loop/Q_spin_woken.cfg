\* The stated limit, for the operator (no rule is taken away): a warm spin that finds the future woken at
\* its very first look counts as a look without asking the poller. A future woken from another thread in
\* that window, again and again, keeps the poller from being looked at. Counting such a pass as a
\* back-out is counted would close it, at about 70 instructions a round trip on the socket rows (a look
\* every N passes). Expected: BoundedGap broken.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = TRUE         \* an idle pass may look at no driver
    SpinWoken = TRUE       \* a warm spin may find the future woken first
    Mode = "loop"          \* the run loop
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    BoundedGap
