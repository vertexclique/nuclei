\* WITNESS: 2N tasks run between two looks of turns driven by hand (the end of one turn, the
\* start of the next). Expected: TurnGapBelowItsBound broken.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CHECK_DEADLOCK FALSE           \* a stuck loop is not what this run looks for
CONSTANTS
    N = 3                  \* the driver interval
    BackOut = FALSE        \* every idle pass looks: L_backout checks the passes that do not
    SpinWoken = FALSE      \* every warm spin asks the poller first
    Mode = "turn"          \* turns driven by hand
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    TurnGapBelowItsBound
