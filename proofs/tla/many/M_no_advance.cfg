\* MUTATION no_advance: the call sends a read out and does not move on to the next, so the same read goes
\* out again. Expected: EachOnce broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    N = 2                      \* two reads
    Cap = 2                    \* a window of two
    Mutation = "no_advance"
INVARIANTS                     \* must hold in every reachable state
    EachOnce
