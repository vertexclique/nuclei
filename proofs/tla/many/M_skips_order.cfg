\* MUTATION skips_order: the reads go out before the cursor write accepted before the call landed, so a
\* read of cell 0 can read what the cell held before it. Expected: ResultInPlace broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    N = 2                      \* two reads, the first of cell 0
    Cap = 2                    \* both may go out
    Mutation = "skips_order"
INVARIANTS                     \* must hold in every reachable state
    ResultInPlace
