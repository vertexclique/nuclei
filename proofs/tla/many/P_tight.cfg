\* Three reads through a window of one: the reads go out one at a time, and every rule holds.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    N = 3                      \* three reads
    Cap = 1                    \* a window of one
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    WithinCap
    ResultInPlace
    EachOnce
    AllAnswered
PROPERTIES                     \* must hold of every behaviour
    Termination
