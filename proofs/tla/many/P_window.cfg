\* Four reads through a window of two, the kernel making them in any order: never more than two out,
\* each result in its own place and seeing the write before the call, each read out once, every read
\* answered, and both parties end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    N = 4                      \* four reads, two of them of cell 0
    Cap = 2                    \* a window of two
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    WithinCap
    ResultInPlace
    EachOnce
    AllAnswered
PROPERTIES                     \* must hold of every behaviour
    Termination
