\* Three peers, one of which sends nothing and ends at once, against a party whose polls
\* the budget may refuse: every value is taken, the end comes only once every channel
\* ended, and the party never sleeps through a value or an end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Sends <- ThreePeers         \* values each peer sends (MC_MeshEnd.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoEarlyEnd
PROPERTIES                     \* must hold over every behaviour
    Ends
