\* MUTATION end_on_one: the poll answers the end once any channel ended. The peer that
\* sends nothing ends first, with values still coming from the others. Expected: NoEarlyEnd
\* broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Sends <- ThreePeers         \* values each peer sends (MC_MeshEnd.tla)
    Mutation = "end_on_one"     \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoEarlyEnd
