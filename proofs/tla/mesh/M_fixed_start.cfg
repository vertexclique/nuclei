\* MUTATION fixed_start: every receive starts at the first channel, so the flooding peer, always refilled, is served before the quiet one again and again. Expected: QuietServed broken.
SPECIFICATION Spec              \* every peer and the party, weakly fair
CHECK_DEADLOCK FALSE           \* an unfair order is what this run looks for
CONSTANTS
    Floods = 3             \* the flooding peer sends three values
    Mutation = "fixed_start"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    QuietServed
