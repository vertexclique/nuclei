\* Liveness: the party takes every value, and every peer ends.
SPECIFICATION Spec              \* every peer and the party, weakly fair
CHECK_DEADLOCK FALSE           \* a stuck party is what the property catches
CONSTANTS
    Floods = 3             \* the flooding peer sends three values
    Mutation = "none"      \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
