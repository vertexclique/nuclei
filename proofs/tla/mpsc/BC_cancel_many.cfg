\* A request for both slots polled once and dropped, racing single sends:
\* its share (or its grant) goes on to the next waiter. Sender 1 starts the
\* request and drops it; sender 2 sends twice, so the request can hold one slot
\* set aside while sender 2's first value holds the other, and sender 2's second
\* send waits behind it for what it hands on. Losing that hand-on
\* (drop_pass_on), serving a later request first, the message queue's
\* mutations, every lost hand-over or wakeup but the three below, and the
\* witnesses of a withdrawal at the grant and of a drop with a share all still
\* show at this size. With two values on two slots no send ever waits for a
\* value the receiver slept through, so the receiver's own handshake mutations
\* (wake_before_write, flag_before_write, raise_after_look) cannot deadlock
\* here; BC_cancel_one, with a dropped send on one slot, still finds all three.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_cancel_many_vs2   \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    EndOnEmpty
    ExactlyOnce
    PerSenderOrder
