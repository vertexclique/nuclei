\* A single send polled once and dropped on a channel of one slot. Sender 1
\* starts a send and drops it; sender 2 sends twice, so the dropped wait can be
\* in line in front of or behind sender 2's second send, be granted the slot or
\* withdraw first, and must hand on what it held. Losing that hand-on
\* (drop_pass_on), every lost wakeup or hand-over, and a value read twice still
\* break their property at this size. (With one slot the queue never holds two
\* values, here or at any size, so queue_lifo and skip_busy cannot show.)
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_cancel_one_vs2    \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    EndOnEmpty
    ExactlyOnce
    PerSenderOrder
