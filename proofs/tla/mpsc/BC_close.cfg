\* The receiver receives once, closes, and drains to the end, racing a
\* request for both slots and single sends. Sender 1 asks for both slots once
\* and gives them back unused; sender 2 sends twice. The request can wait with
\* part of its share when the close comes, be granted before it, or begin after
\* it, and sender 2's second send can go in through a slot reserved before the
\* close, after the receiver took its first value. Every mutation the run at
\* four operations broke still breaks its property at this size: the close
\* ones (close_keeps_set_aside, try_ignores_close, take_after_close,
\* finish_early), serving a later request first, the message queue's order,
\* and the lost wakeups. release_no_pass and exit_ignores_release, which the
\* four-operation run could not show (its first operations are sends, which
\* never wait, so the close always comes and fails every waiter), deadlock
\* here too: the receiver's first value may have to come through a hand-over.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_unused_vs2        \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_close           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    EndOnEmpty
    ExactlyOnce
    PerSenderOrder
