\* The close racing a request for both slots that is polled once and
\* dropped. Sender 1 starts the request, drops it, then sends; sender 2 sends
\* once. The dropped request can hold part of its share, be granted, or
\* withdraw when the close comes, and sender 1's send can begin before or after
\* the close. Losing the hand-on of what the request held (drop_pass_on), the
\* close mutations (close_keeps_set_aside, try_ignores_close, take_after_close,
\* finish_early), serving a later request first (try_ignores_queue), and the
\* witnesses of a withdrawal at the grant, a drop with a share, the close's
\* refund and a failure by the close still show at this size. The message
\* queue's order, a smaller request served past the front, and the receiver's
\* own handshake need more sends than this program makes: BC_close finds each
\* of them with the close.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_cancel_send_vs1   \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_close           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    EndOnEmpty
    ExactlyOnce
    PerSenderOrder
