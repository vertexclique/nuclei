\* A request for both slots, put in nothing, among single sends: the
\* slots it gives back go to the waiters behind it, in order. Sender 1 asks for
\* both slots once and puts nothing in; sender 2 sends twice, so a send can wait
\* behind the request while it holds part of its share, and the slots it gives
\* back must go on to that send. Serving the smaller send first
\* (skip_unfit_front) or past the line (try_ignores_queue), every lost wakeup or
\* hand-over, and every mutation of the message queue still break their
\* property at this size.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_unused_vs2        \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    EndOnEmpty
    ExactlyOnce
    PerSenderOrder
