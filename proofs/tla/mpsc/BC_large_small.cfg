\* A request for both slots, put in nothing, among single sends: the
\* slots it gives back go to the waiters behind it, in order.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_large_small       \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    EndMeansDrained
    ExactlyOnce
    PerSenderOrder
