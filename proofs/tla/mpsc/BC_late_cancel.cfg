\* A request for the one slot that parks with its waker armed, may be polled once with no
\* wake, and is dropped while it waits, racing two sends and a receiver that drains: a
\* grant that reached it before the drop goes back, one after it skips it, and every
\* safety property holds.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_late_cancel       \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    EndOnEmpty
    ExactlyOnce
    PerSenderOrder
    PermitsSound
