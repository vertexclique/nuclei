\* Liveness with a dropped wait on one slot.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_live_cancel       \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
