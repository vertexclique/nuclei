\* Liveness with a dropped wait on one slot. One sender sends, then starts a send
\* it polls once and drops, then sends again: the dropped wait waits for the slot
\* the first value holds, may be granted it or withdraw first, and whatever it
\* held must come back, or the last send waits forever. Losing that hand-back
\* (drop_pass_on) breaks this property at this size, and so does each of the
\* eight mutations that loses a wakeup. A dropped wait whose share a waiting
\* send of another sender inherits is checked by BC_cancel_one, whose search
\* also finds every state where a thread is stuck.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_cancel       \* its program (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
