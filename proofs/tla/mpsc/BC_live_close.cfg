\* Liveness when the receiver closes: every waiter ends, the receiver too. One
\* sender sends, then asks for both slots: the request waits for the slot the
\* value holds, with the other set aside, and the receiver takes the value and
\* closes, so the request is either granted first or failed by the close, and
\* the receiver must still see the end. The six mutations that lose a wakeup
\* (park_no_look, grant_no_wake, rx_no_recheck, wake_before_write,
\* flag_before_write, raise_after_look) break this property at this size; a
\* hand-over that never comes (release_no_pass, exit_ignores_release) cannot
\* break it in a run that closes, as the close's own pass fails every waiter,
\* and breaks BC_live_many instead. A close racing two senders is checked by
\* BC_close, whose search also finds every state where a thread is stuck.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_many         \* its program (MC_BoundedChannel.tla)
    RxProg <- R_close           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
