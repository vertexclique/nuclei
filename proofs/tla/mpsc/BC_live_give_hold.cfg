\* Liveness: the receiver closes and drains while the one sender reserves a slot, gives it
\* back unused and then keeps its handle until the receiver is done: the give-back's wake of
\* the closed, idle channel is what ends the receiver.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_give_hold         \* its program (MC_BoundedChannel.tla)
    RxProg <- R_close_first     \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
