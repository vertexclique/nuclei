\* Liveness with a request for both slots among single sends. Sender 1 asks for
\* both slots once and puts one value in; sender 2 sends once. Either the request
\* waits with one slot set aside while sender 2's value holds the other, and the
\* receiver's release must complete and grant it, or it takes both first and
\* sender 2 waits for the slot it gives back. Each of the eight mutations that
\* loses a wakeup or a hand-over breaks this property at this size. A send
\* waiting behind the request is checked by BC_many, whose search also finds
\* every state where a thread is stuck.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_many_vs1          \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
