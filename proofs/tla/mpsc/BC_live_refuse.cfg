\* Liveness of the receiver when a send refused for the budget gives its slot
\* back. One sender takes the one slot and is refused; the receiver closes at
\* once and waits for the slot to come back. The give-back leaves the closed
\* channel idle and wakes the receiver, which ends, whether or not the refused
\* future is ever polled again: its next poll is not fair.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair but the refused poll
CHECK_DEADLOCK FALSE           \* a future nobody polls again is what this run allows
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_refused      \* its program (MC_BoundedChannel.tla)
    RxProg <- R_close_first     \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Safe
PROPERTIES                     \* must hold over every behaviour
    ReceiverEnds
