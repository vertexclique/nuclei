\* Liveness: with every thread weakly fair, every thread finishes: no waiter
\* whose request can be served sleeps forever (no lost wakeup). One sender sends
\* three times through one slot: each send after the first waits for the slot
\* the value before it holds, the receiver's release must hand it over, and a
\* send can queue while the receiver's pass still holds the drain role. Every
\* step where a plain send's wakeup can be lost is in that run: each of the
\* eight mutations that loses one (park_no_look, grant_no_wake, release_no_pass,
\* exit_ignores_release, rx_no_recheck, wake_before_write, flag_before_write,
\* raise_after_look) breaks this property at this size. Two senders racing on
\* the slot are checked by BC_sends, whose search also finds every state where a
\* thread is stuck.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_sends        \* its program (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
