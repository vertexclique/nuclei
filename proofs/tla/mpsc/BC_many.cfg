\* A request for both slots queued among single sends: its share is set aside
\* while it waits, and nothing behind it is served first. Sender 1 asks for both
\* slots once and puts one value in; sender 2 sends twice. That is enough for
\* what this run guards: the request can wait with one slot set aside while
\* sender 2's first value holds the other, sender 2's second send can queue
\* behind it and must not be served first, and the slot it gives back goes on
\* to that send. Serving a later request first (try_ignores_queue,
\* skip_unfit_front), every lost wakeup or hand-over, and every mutation of the
\* message queue still break their property at this size.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_many_vs2          \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    EndOnEmpty
    ExactlyOnce
    PerSenderOrder
