\* Three sends from two senders through one slot, the receiver draining:
\* every safety property, and no state where a thread is stuck while the rest
\* are done (TLC's deadlock check).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_sends             \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
    FifoFair
    CloseSemantics
    CloseReturnsShare
    EndMeansDrained
    ExactlyOnce
    PerSenderOrder
