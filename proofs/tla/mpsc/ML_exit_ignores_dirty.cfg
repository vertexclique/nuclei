\* MUTATION exit_ignores_dirty: the drain gives its role up over a dirty mark. The sender
\* queues while the receiver's release passes; the pass found nobody and lowers QUEUED on
\* its way out, so no later release passes again and the queued sender sleeps for good, and
\* the receiver with it. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_sends        \* its program (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "exit_ignores_dirty"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
