\* MUTATION last_drop_no_wake: the last sender goes without waking the receiver, which drained
\* every value and sleeps waiting for the next. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_sends        \* its program (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "last_drop_no_wake"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
