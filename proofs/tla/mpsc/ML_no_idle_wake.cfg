\* MUTATION no_idle_wake: `wake_if_finished` wakes nobody. The closed receiver sleeps waiting
\* for the reserved slot to come back; the give-back makes the channel idle and wakes
\* nobody, and the sender keeps its handle: the receiver sleeps for good. Expected:
\* Termination broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_give_hold         \* its program (MC_BoundedChannel.tla)
    RxProg <- R_close_first     \* the receiver's program
    Mutation = "no_idle_wake"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
