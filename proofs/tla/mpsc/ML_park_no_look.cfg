\* MUTATION park_no_look checked as liveness: under weak fairness some
\* thread never finishes. Expected: Termination broken. One sender's three
\* sends on one slot are enough: the receiver's release grants the second send
\* between its arrival and its park, the park arms the waker without looking,
\* and nothing is left to call it.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_sends        \* its program (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "park_no_look"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    Termination
