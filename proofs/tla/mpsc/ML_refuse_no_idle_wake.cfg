\* MUTATION refuse_no_idle_wake: the send refused for the budget gives its slot
\* back with a bare release, which wakes no receiver. The receiver closed and
\* sleeps until the slot comes back; the give-back leaves the channel closed
\* and idle without telling it, and the refused future is never polled again,
\* so nothing else does. Expected: ReceiverEnds broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair but the refused poll
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_refused      \* its program (MC_BoundedChannel.tla)
    RxProg <- R_close_first     \* the receiver's program
    Mutation = "refuse_no_idle_wake"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
PROPERTIES                     \* must hold over every behaviour
    ReceiverEnds
