\* MUTATION close_grant_as_ok: a request for both slots, waiting when the receiver closes, takes
\* the close's grant for its slots and sends through permits it never got. Expected:
\* PermitsSound broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1}                \* 1 sender thread
    Prog <- P_solo_many         \* its program (MC_BoundedChannel.tla)
    RxProg <- R_close           \* the receiver's program
    Mutation = "close_grant_as_ok"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    PermitsSound
