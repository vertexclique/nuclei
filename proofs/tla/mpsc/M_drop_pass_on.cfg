\* MUTATION drop_pass_on: what a leaving waiter held (a grant it never
\* looked at, a share at its grant, a set-aside nobody is left for) is
\* dropped instead of handed on. Expected: Conservation broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_cancel_many       \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "drop_pass_on"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
