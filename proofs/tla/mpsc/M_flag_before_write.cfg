\* MUTATION flag_before_write: a send looks at the receiver's flag before it writes its
\* value: a receiver that raised it after that look, and found the cell still being
\* written, sleeps with no wake to come. Expected: a deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_sends             \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "flag_before_write" \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
