\* MUTATION pop_lost: no guard on the value in hand. A give-back whose waker panics unwinds the
\* receive and drops the value it took. Expected: NoValueLost broken.
SPECIFICATION Spec              \* the algorithm, both tasks weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* one slot
    Values = 3                  \* the values 1, 2, 3
    Panics = 1
    Mutation = "pop_lost"
INVARIANTS
    NoValueLost
