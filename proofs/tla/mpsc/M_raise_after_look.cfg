\* MUTATION raise_after_look: the receiver says it waits only after its look again: a
\* send between the look and the flag skips the waker. Expected: a deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_sends             \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "raise_after_look" \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
