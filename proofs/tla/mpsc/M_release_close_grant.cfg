\* MUTATION release_close_grant: a request the close granted, then dropped, gives back the
\* two slots it asked for, which the close's grant never carried. Expected: Conservation
\* broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_cancel_send_vs1   \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_close           \* the receiver's program
    Mutation = "release_close_grant"   \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    Conservation
