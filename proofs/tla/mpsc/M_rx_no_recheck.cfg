\* MUTATION rx_no_recheck: the receiver registers its waker and sleeps
\* without looking again, missing a value sent just before. Expected: a
\* deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_sends             \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "rx_no_recheck"  \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
