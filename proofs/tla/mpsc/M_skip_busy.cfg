\* MUTATION skip_busy: the receiver passes over the oldest cell while its
\* value is being written and takes the first written cell behind it (the
\* queue kovan had before). One sender puts two values in. Expected:
\* PerSenderOrder broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1}                \* 1 sender thread
    Prog <- P_pair              \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "skip_busy"      \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    PerSenderOrder
