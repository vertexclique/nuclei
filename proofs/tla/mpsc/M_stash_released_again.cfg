\* MUTATION stash_released_again: the stashed value gives its slot back when it comes out, as a
\* value of the queue does. Its slot went back already, so the channel holds one slot more than
\* it has. Expected: SlotsConserved broken.
SPECIFICATION Spec              \* the algorithm, both tasks weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* one slot
    Values = 3                  \* the values 1, 2, 3
    Panics = 1
    Mutation = "stash_released_again"
INVARIANTS
    SlotsConserved
