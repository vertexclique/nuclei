\* MUTATION take_after_close: a pass sets slots aside after the close.
\* Expected: CloseSemantics broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 2                       \* the channel has 2 slots
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_many              \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_close           \* the receiver's program
    Mutation = "take_after_close"  \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    CloseSemantics
