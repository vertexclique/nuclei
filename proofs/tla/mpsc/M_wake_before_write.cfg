\* MUTATION wake_before_write: a send wakes the receiver before it writes its
\* value. A receiver that looked in between parks on the cell being written,
\* and no wake is left for it; with one slot, the senders behind wait for that
\* slot forever. Expected: a deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_sends             \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "wake_before_write" \* the rule this run takes away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
