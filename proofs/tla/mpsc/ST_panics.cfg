\* Three values through one slot, the first two give-backs meeting a waker that panics: each
\* stashed value comes out next, once, in order, with no second give-back; every value received.
SPECIFICATION Spec              \* the algorithm, both tasks weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* one slot
    Values = 3                  \* the values 1, 2, 3
    Panics = 2
    Mutation = "none"
INVARIANTS
    InOrder
    NoValueLost
    SlotsConserved
PROPERTIES
    AllReceived
