\* Three values through one slot, every give-back with a working waker: each value once, in
\* order, no slot lost or made up, all received.
SPECIFICATION Spec              \* the algorithm, both tasks weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Cap = 1                     \* one slot
    Values = 3                  \* the values 1, 2, 3
    Panics = 0
    Mutation = "none"
INVARIANTS
    InOrder
    NoValueLost
    SlotsConserved
PROPERTIES
    AllReceived
