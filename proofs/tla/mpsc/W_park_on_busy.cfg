\* WITNESS: the receiver parks while the oldest cell is claimed and not
\* written yet, and the send's wake after its write gets it going.
\* Expected: NoParkOnBusy broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Cap = 1                       \* the channel has 1 slot
    Senders = {1, 2}             \* 2 sender threads
    Prog <- P_sends             \* their programs (MC_BoundedChannel.tla)
    RxProg <- R_drain           \* the receiver's program
    Mutation = "none"           \* no rule taken away
    defaultInitValue = 0        \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    NoParkOnBusy
