\* MUTATION previous_decides: a nested frame is foreign when its runtime is not the one its call found, and
\* its loop runs under the one found. An enter guard of another runtime before the call, or a third
\* runtime's block_on inside a foreign frame's future, finds a runtime S does not serve: the loop runs
\* under it. Expected: LoopSeesOwn broken.
SPECIFICATION Spec              \* the algorithm, the thread weakly fair
CHECK_DEADLOCK FALSE           \* a stack full to its bound stops there: safety is what this run looks for
CONSTANTS
    Runtimes = {"A", "B", "C"}  \* the runtimes the code may enter or block on
    L = "A"                    \* the runtime S serves
    MaxStack = 4                 \* the deepest stack of frames, polls and guards
    Mutation = "previous_decides"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    LoopSeesOwn
