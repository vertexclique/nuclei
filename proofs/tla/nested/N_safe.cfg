\* Any nesting of block_on of three runtimes on one shard, enter guards, timers and panics among them: S's
\* loop runs, and polls its tasks, with the runtime it serves current and its wheels in place, each nested
\* frame's future is polled with its own runtime and wheels, code inside an enter guard sees what it
\* entered, a visitor task (another runtime's, placed on the shard) runs with its own runtime current, and no
\* timer is dropped while a frame of its runtime is still on the shard.
SPECIFICATION Spec              \* the algorithm, the thread weakly fair
CHECK_DEADLOCK FALSE           \* a stack full to its bound stops there: safety is what this run looks for
CONSTANTS
    Runtimes = {"A", "B", "C"}  \* the runtimes the code may enter or block on
    L = "A"                    \* the runtime S serves
    MaxStack = 7                 \* the deepest stack of frames, polls and guards
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    LoopSeesOwn
    TaskSeesOwn
    FutureSeesOwn
    EnterSeesIt
    LoopWheelsOwn
    FutureWheelsOwn
    NoTimerLost
