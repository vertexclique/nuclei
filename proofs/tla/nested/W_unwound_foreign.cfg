\* WITNESS: a panic unwinds through a foreign frame and a task's poll below it catches it, so N_safe checks
\* the runtime the guards put back. Expected: NoUnwoundForeign broken.
SPECIFICATION Spec              \* the algorithm, the thread weakly fair
CHECK_DEADLOCK FALSE           \* a stack full to its bound stops there: safety is what this run looks for
CONSTANTS
    Runtimes = {"A", "B", "C"}  \* the runtimes the code may enter or block on
    L = "A"                    \* the runtime S serves
    MaxStack = 6                 \* the deepest stack of frames, polls and guards
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoUnwoundForeign
