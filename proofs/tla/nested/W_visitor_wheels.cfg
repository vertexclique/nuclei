    Runtimes = {"A", "B", "C"}  \* the runtimes the code may enter or block on
    L = "A"                    \* the runtime S serves
    MaxStack = 6                 \* the deepest stack of frames, polls and guards
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    VisitorWheelsOwn
