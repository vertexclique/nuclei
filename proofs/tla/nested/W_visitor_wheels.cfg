\* WITNESS of a limit: a visitor is polled with the shard's wheels in place even while a frame of its runtime
\* holds that runtime's: its sleeps wait in the shard's runtime's wheels, and with only one of the two clocks
\* paused, fire by the other. Expected: VisitorWheelsOwn broken.
SPECIFICATION Spec              \* the algorithm, the thread weakly fair
CHECK_DEADLOCK FALSE           \* a stack full to its bound stops there: safety is what this run looks for
