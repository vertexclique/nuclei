\* Two waiters and a notify_waiters, in any order: every safety property, and
\* every waiter made before the call ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiter made after the last call waits for good, by design
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- Broadcast
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    AwaitersMadeBeforeAWaitersCallEnd
