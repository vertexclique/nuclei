\* One waiter dropped, one awaiting, one notify_one: every safety property, and
\* the awaiting one ends, a grant to the dropped one passed on.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- DropAwait
    Notifier <- OneOne
    NotifyAfterQueued = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    EveryAwaiterEnds
