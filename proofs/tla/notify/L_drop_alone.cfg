\* One waiter queues and is dropped while a notify_one comes: whether the notify granted it
\* (and the drop passed it on) or found it withdrawn, the notification ends as the permit.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- OneDrop
    Notifier <- OneOne
    Notifier2 = <<>>              \* no second notifier
    NotifyAfterQueued = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    QueuedOneGeneration
    OneIsKept
