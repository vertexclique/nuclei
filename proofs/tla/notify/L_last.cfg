\* Two queued waiters, a notify_last then a notify_one: every safety property,
\* and both end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- LastThenOne
    NotifyAfterQueued = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    EveryAwaiterEnds
