\* A notify_one and a notify_waiters from two notifiers at once, two waiters made and
\* queued at any moment around them: every safety property, the queued waiters of one
\* generation, and every waiter made before the broadcast ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- OneOne
    Notifier2 <- Broadcast          \* a notify_waiters at the same time
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    QueuedOneGeneration
PROPERTIES                     \* must hold of every behaviour
    AwaitersMadeBeforeAWaitersCallEnd
