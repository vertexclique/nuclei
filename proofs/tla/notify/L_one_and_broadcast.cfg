\* A notify_one and a notify_waiters from two notifiers at once, a waiter made and queued
\* at any moment around them: every safety property, and the waiter, if made before the
\* broadcast, ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiter made after every call waits for good, by design
CONSTANTS
    Waiters <- OneAwait
    Notifier <- OneOne
    Notifier2 <- Broadcast          \* a notify_waiters at the same time
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    QueuedOneGeneration
PROPERTIES                     \* must hold of every behaviour
    AwaitersMadeBeforeAWaitersCallEnd
