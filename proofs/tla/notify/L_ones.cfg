\* Two queued waiters and two notify_one calls: every safety property, and both
\* end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- TwoOnes
    NotifyAfterQueued = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    EveryAwaiterEnds
