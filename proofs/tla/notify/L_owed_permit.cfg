\* A waiter made before a notify_waiters and a notify_one, and one made after
\* both. The broadcast owes the first waiter its wake, so the permit the
\* notify_one stores is the second's, even when the broadcast lands between the
\* first waiter's look at the generation and its take of the permit: every
\* safety property, no permit kept by a waiter the broadcast owed, and the late
\* waiter ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- BroadcastThenOne
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    NoPermitEatenByOwed
PROPERTIES                     \* must hold of every behaviour
    LateAwaiterEnds
