\* A waiter made before a notify_waiters and a notify_one, and one made after
\* both. The broadcast owes the first waiter its wake; when the broadcast lands
\* between that waiter's look at the generation and its take of the permit,
\* the waiter looks again after the take and passes the permit on: every safety
\* property, and no permit kept by a waiter the broadcast owed. (The late
\* waiter's end is not checked here: the pass's own read of the generation
\* leaves a path open, which W_owed_to_woken shows.)
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiter left without a notification waits for good, as W_owed_to_woken shows
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- BroadcastThenOne
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    NoPermitEatenByOwed
