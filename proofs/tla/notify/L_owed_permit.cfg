\* A waiter made before a notify_waiters and a notify_one, and one made after
\* both. The broadcast owes the first waiter its wake, so the permit the
\* notify_one stores is the second's: when the broadcast lands between the first
\* waiter's look at the generation and its take of the permit (the waiter looks
\* again after the take and passes the permit on), and when both calls land
\* while a pass runs (the notify_one's count carries the generation after the
\* broadcast: a pass that read the one before gives it back). Every safety
\* property, no permit kept by a waiter the broadcast owed, and the late waiter
\* ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the threads end, and the run with them
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- BroadcastThenOne
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    NoPermitEatenByOwed
PROPERTIES                     \* must hold of every behaviour
    LateAwaiterEnds
