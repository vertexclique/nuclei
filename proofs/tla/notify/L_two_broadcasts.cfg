\* Two notifiers each call notify_waiters at once, as two watch senders do, with two
\* waiters made and queued at any moment around them: every safety property, the queued
\* waiters always of one generation, and every waiter made before the last call ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- Broadcast
    Notifier2 <- Broadcast          \* a second notify_waiters at the same time
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    QueuedOneGeneration
PROPERTIES                     \* must hold of every behaviour
    AwaitersMadeBeforeAWaitersCallEnd
