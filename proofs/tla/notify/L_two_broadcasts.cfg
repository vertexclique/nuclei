\* Two notifiers each call notify_waiters at once, as two watch senders do, with a waiter
\* made and queued at any moment around them: every safety property, and the waiter, if
\* made before the last call, ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiter made after every call waits for good, by design
CONSTANTS
    Waiters <- OneAwait
    Notifier <- Broadcast
    Notifier2 <- Broadcast          \* a second notify_waiters at the same time
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    QueuedOneGeneration
PROPERTIES                     \* must hold of every behaviour
    AwaitersMadeBeforeAWaitersCallEnd
