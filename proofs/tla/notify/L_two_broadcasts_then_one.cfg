\* A waiter made before two notify_waiters and a notify_one, and one made after
\* them all: a pass may read the generation between the two broadcasts, and take
\* the notify_one's word, made at the second; the word is newer than the pass,
\* which gives it back for the pass the second broadcast asks for, and that one
\* keeps the count for a waiter of its generation, or the permit. Every safety
\* property, and the late waiter ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the threads end, and the run with them
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- TwoBroadcastsThenOne
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
PROPERTIES                     \* must hold of every behaviour
    LateAwaiterEnds
