\* MUTATION newer_as_old: a pass takes an owed word of a newer generation than
\* the one it read as older. It reads the generation after the first broadcast and
\* expires the early waiter; the second broadcast and the notify_one land, the count
\* made at the second; the pass gives it to the early waiter, which both broadcasts
\* had woken: the permit is lost and the late waiter waits for good. Expected:
\* LateAwaiterEnds broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck waiter is what the property says, not a deadlock
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- TwoBroadcastsThenOne
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = FALSE
    Mutation = "newer_as_old"
PROPERTIES                     \* must hold of every behaviour
    LateAwaiterEnds
