\* MUTATION no_recheck checked as liveness: the permit kept by the waiter the
\* broadcast owed is lost to the waiter made after the notify_one, which waits
\* for good. Expected: LateAwaiterEnds broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- BroadcastThenOne
    NotifyAfterQueued = FALSE
    Mutation = "no_recheck"
PROPERTIES                     \* must hold of every behaviour
    LateAwaiterEnds
