\* MUTATION split_word: the owed counts carry no generation, every count is
\* current, as before the counts went into the word. A pass reads the generation,
\* the broadcast and the notify_one land, and the pass serves the notify_one to
\* the waiter the broadcast already woke: the permit is lost and the late waiter
\* waits for good. Expected: LateAwaiterEnds broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck waiter is what the property says, not a deadlock
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- BroadcastThenOne
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = FALSE
    Mutation = "split_word"
PROPERTIES                     \* must hold of every behaviour
    LateAwaiterEnds
