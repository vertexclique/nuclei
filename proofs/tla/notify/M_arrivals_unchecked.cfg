\* MUTATION arrivals_unchecked: the pass queues every arrival whatever its generation. A
\* waiter made before a notify_waiters queues only after a newer one did: it lands behind
\* the newer front, where the front-first expiry never reaches it, and the queued waiters
\* are of two generations. Expected: QueuedOneGeneration broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- Broadcast
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = FALSE
    Mutation = "arrivals_unchecked"
INVARIANTS                     \* must hold in every reachable state
    QueuedOneGeneration
