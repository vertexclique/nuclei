\* MUTATION count_withdrawn_grant: the pass counts an owed wake as served when the front
\* node it looked at withdrew before the grant. The dropped waiter eats the notify_one, and
\* the waiter behind it, which nobody grants, sleeps for good. Expected: EveryAwaiterEnds
\* broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- DropAwait
    Notifier <- OneOne
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = TRUE
    Mutation = "count_withdrawn_grant"
PROPERTIES                     \* must hold of every behaviour
    EveryAwaiterEnds
