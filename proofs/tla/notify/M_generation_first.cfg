\* MUTATION generation_first: a pass reads the generation before it takes the
\* arrivals. Expected: NoSpuriousWake broken (a newer arrival is woken).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- Broadcast
    NotifyAfterQueued = FALSE
    Mutation = "generation_first"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
