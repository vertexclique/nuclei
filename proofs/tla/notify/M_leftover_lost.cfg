\* MUTATION leftover_lost: an owed wake that found no waiting node is dropped instead of
\* stored as the permit. The waiter withdrew before the pass, so the notify_one is lost.
\* Expected: OneIsKept broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- OneDrop
    Notifier <- OneOne
    Notifier2 = <<>>              \* no second notifier
    NotifyAfterQueued = TRUE
    Mutation = "leftover_lost"
INVARIANTS                     \* must hold in every reachable state
    OneIsKept
