\* MUTATION no_recheck: a waiter that took the permit does not look at the
\* generation again. A broadcast that landed between its look and its take
\* already owed it its wake, yet it keeps the permit, which a waiter made after
\* the notify_one never finds. Expected: NoPermitEatenByOwed broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- BroadcastThenOne
    Notifier2 = <<>>              \* no second notifier
    NotifyAfterQueued = FALSE
    Mutation = "no_recheck"
INVARIANTS                     \* must hold in every reachable state
    NoPermitEatenByOwed
