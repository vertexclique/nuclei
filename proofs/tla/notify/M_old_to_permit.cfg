\* MUTATION old_to_permit: the waiters a pass expires take none of the older
\* counts, which all become the permit. The notify_one came while the early waiter
\* was queued, the broadcast after it, and one pass takes both: the waiter is
\* expired, the count left over stores a permit, and the waiter made after both
\* calls takes it. Expected: NoSparePermit broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- OneThenBroadcast
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = TRUE
    Mutation = "old_to_permit"
INVARIANTS                     \* must hold in every reachable state
    NoSparePermit
