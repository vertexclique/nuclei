\* MUTATION owed_before_generation: a pass takes the owed words before it reads
\* the generation. The notify_one comes between the take and the read, the
\* broadcast after it, still before the read: the pass expires the queued waiter
\* without the count, and the next pass takes the count as older with nobody to
\* give it to, so it stores a permit, which the waiter made after both calls
\* takes. Expected: NoSparePermit broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- OneThenBroadcast
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = TRUE
    Mutation = "owed_before_generation"
INVARIANTS                     \* must hold in every reachable state
    NoSparePermit
