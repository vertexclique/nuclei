\* MUTATION permit_not_converted: a pass leaves a stored permit where it is. The notify_one
\* stores its permit just after the waiter found none, and the waiter queues: no later poll
\* takes a permit past a queued waiter, so it sleeps beside the permit for good.
\* Expected: EveryAwaiterEnds broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- OneAwait
    Notifier <- OneOne
    Notifier2 = <<>>              \* no second notifier
    NotifyAfterQueued = FALSE
    Mutation = "permit_not_converted"
PROPERTIES                     \* must hold of every behaviour
    EveryAwaiterEnds
