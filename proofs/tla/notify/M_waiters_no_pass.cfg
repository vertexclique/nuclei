\* MUTATION waiters_no_pass: notify_waiters moves the generation but asks for no
\* pass. Expected: AwaitersMadeBeforeAWaitersCallEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiting thread at the end is not what this run looks for
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- Broadcast
    NotifyAfterQueued = TRUE
    Mutation = "waiters_no_pass"
PROPERTIES                     \* must hold of every behaviour
    AwaitersMadeBeforeAWaitersCallEnd
