\* A waiter queued before a notify_one and a notify_waiters, and one made after
\* both: the notify_one's count is the queued waiter's, served to it or, once the
\* broadcast moved the generation, taken by it as the broadcast expires it, so
\* no permit is left and the late waiter is never done. Every safety property.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the late waiter waits for good, by design
CONSTANTS
    Waiters <- EarlyAfter
    Notifier <- OneThenBroadcast
    Notifier2 <- NoCalls          \* no second notifier
    NotifyAfterQueued = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    NoSparePermit
