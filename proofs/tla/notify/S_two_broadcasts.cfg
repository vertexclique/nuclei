\* Two notifiers each call notify_waiters at once, as two watch senders do, with two
\* waiters made and queued at any moment around them: every safety property, and the
\* queued waiters always of one generation (L_two_broadcasts checks the liveness, on one).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a waiter made after every call waits for good, by design
CONSTANTS
    Waiters <- TwoAwait
    Notifier <- Broadcast
    Notifier2 <- Broadcast          \* a second notify_waiters at the same time
    NotifyAfterQueued = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousWake
    NoOverServe
    NoStrandedArrival
    QueuedOneGeneration
