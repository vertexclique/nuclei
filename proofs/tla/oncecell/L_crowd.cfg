\* Three initializers (one fails, one is dropped), a racing builder and a set at
\* once: one value whoever wins, one writer of the slot, every call ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Inits <- Crowd
    Racers = 1
    Setters = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneValue
    OneWriter
    NoInitAfterPublish
PROPERTIES                     \* must hold of every behaviour
    EveryCallEnds
    FilledInTheEnd
