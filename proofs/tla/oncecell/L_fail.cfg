\* An initializer that fails, then one that succeeds: the turn goes on, every
\* safety property, every call ends, the cell is filled.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Inits <- FailThenOk
    Racers = 0
    Setters = 0
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneValue
    OneWriter
    NoInitAfterPublish
PROPERTIES                     \* must hold of every behaviour
    EveryCallEnds
    FilledInTheEnd
