\* Two initializers: one value, one writer of the slot, every call ends with it.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Inits <- TwoOk
    Racers = 0
    Setters = 0
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneValue
    OneWriter
    NoInitAfterPublish
PROPERTIES                     \* must hold of every behaviour
    EveryCallEnds
    FilledInTheEnd
