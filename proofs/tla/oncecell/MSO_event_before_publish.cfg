\* MUTATION event_before_publish: the set raises the event before it publishes the value.
\* For that moment the event is set over an empty cell: a waiter it wakes looks, finds no
\* value, and its wait on the set event answers at once, so it spins until the publish.
\* Expected: EventMeansValue broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Setters = {"s1"}            \* one setter
    Waiters = {"w1"}            \* one waiter
    Mutation = "event_before_publish"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    EventMeansValue
