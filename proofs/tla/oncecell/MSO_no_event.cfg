\* MUTATION no_event: the set publishes the value and never sets the event. A waiter that
\* queued before the publish sleeps for good with the value there. Expected: WaitsEnd
\* broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Setters = {"s1"}            \* one setter
    Waiters = {"w1"}            \* one waiter
    Mutation = "no_event"       \* the rule this run takes away
PROPERTIES                     \* must hold of every behaviour
    WaitsEnd
