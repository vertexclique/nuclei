\* MUTATION close_before_publish: the initializer closes the turn queue before its
\* compare-and-swap publishes the value. The other initializer, waiting for the turn, is
\* ended by the close and reads the value pointer while it is still null: it answers
\* nothing, and a different value is published after. Expected: OneValue broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Inits <- TwoOk
    Racers = 0
    Setters = 0
    Mutation = "close_before_publish"
INVARIANTS                     \* must hold in every reachable state
    OneValue
