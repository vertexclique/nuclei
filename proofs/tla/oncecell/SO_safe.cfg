\* Two sets racing two waits: one set takes the cell and the other is refused (the cell
\* is taken, or being taken), the event never runs ahead of the value, and every
\* waiter ends with the value.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Setters = {"s1", "s2"}      \* two setters, one `set` each
    Waiters = {"w1", "w2"}      \* two waiters, one `wait` each
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    OneOk
    EventMeansValue
PROPERTIES                     \* must hold of every behaviour
    WaitsEnd
