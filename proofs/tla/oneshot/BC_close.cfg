\* The receiver closes, then awaits: a value sent first still arrives;
\* a send after the close fails and the value comes back.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_close_recv      \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    ValueReadOnce
    WakeMeansVisible
    NoSendPastClose
    AnswerSound
