\* The receiver closes, then drops its handle, racing a send: the drop runs on the
\* note the close took from its fetch_or (a value sent first is destroyed by the
\* drop, a send after the close fails and takes its value back). This is the only
\* run where the drop finds the note already written.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_close_drop      \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    ValueReadOnce
    WakeMeansVisible
    NoSendPastClose
    AnswerSound
