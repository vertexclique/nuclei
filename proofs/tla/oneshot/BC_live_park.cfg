\* Liveness: a sender parked in closed() is always woken by the close,
\* and the refused send that follows always returns.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_park_send         \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_close_keep         \* the receiver's program
    Mutation = "none"           \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
