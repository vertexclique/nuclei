\* The sender parks in closed(), the receiver closes and wakes it, and
\* the send that follows fails.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_park_send         \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_close_keep         \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    ValueReadOnce
    WakeMeansVisible
    NoSendPastClose
    AnswerSound
