\* The sender parks in closed(), the receiver drops: the park is woken
\* (or sees the close on its re-check), then the sender drops too.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_park_drop         \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_drop            \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    ValueReadOnce
    WakeMeansVisible
    NoSendPastClose
    AnswerSound
