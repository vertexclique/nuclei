\* The receiver closes twice and then drops, racing a sender that waits in closed()
\* and then sends: the second close changes nothing, so the drop reads the value
\* only when the first close saw it sent.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_park_send         \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_reclose_drop    \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    ValueReadOnce
    WakeMeansVisible
    NoSendPastClose
    AnswerSound
PROPERTIES                     \* must hold over every behaviour
    Termination
