\* A send against a receiver that awaits it, every order of their steps:
\* the value arrives, the receiver takes it or is woken first, and every
\* safety property holds (TLC's deadlock check runs too).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_recv            \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    ValueReadOnce
    WakeMeansVisible
    NoSendPastClose
    AnswerSound
