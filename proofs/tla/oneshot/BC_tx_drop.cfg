\* The sender dropped while the receiver waits: the receiver is woken and
\* answers the error, never a value.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- P_drop              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_recv            \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
    ValueReadOnce
    WakeMeansVisible
    NoSendPastClose
    AnswerSound
