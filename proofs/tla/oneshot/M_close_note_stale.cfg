\* MUTATION close_note_stale: the close takes its note from a load made before its
\* fetch_or. The load sees no value; the send publishes in between, finds no close
\* and answers Ok; the close then notes "empty", so the drop leaves the sent value in
\* the cell with both halves gone: the value is leaked, never dropped.
\* Expected: ValueConserved broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_close_drop      \* the receiver's program
    Mutation = "close_note_stale"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
