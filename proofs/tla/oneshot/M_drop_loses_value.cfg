\* MUTATION drop_loses_value: the receiver's drop skips reading the
\* value it owns, so it is left in the cell with nobody left to read
\* it. Expected: ValueConserved broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_drop            \* the receiver's program
    Mutation = "drop_loses_value"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    ValueConserved
