\* MUTATION error_despite_value: the resolve answers the TX_DROPPED bit
\* before the VALUE_SENT bit, so a sent value meets an error.
\* Expected: AnswerSound broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_recv            \* the receiver's program
    Mutation = "error_despite_value"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    AnswerSound
