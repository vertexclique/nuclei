\* MUTATION reclose: a second close does the fetch_or again and writes a new note.
\* The first close saw no value, so the send after it is refused and takes its value
\* back; the second close now sees VALUE_SENT and notes "with value", and the drop
\* reads the cell the refused send already emptied: the value is read twice.
\* Expected: ValueReadOnce broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_reclose_drop    \* the receiver's program
    Mutation = "reclose"        \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    ValueReadOnce
