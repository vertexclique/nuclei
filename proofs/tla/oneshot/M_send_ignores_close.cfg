\* MUTATION send_ignores_close: a send answers Ok although the receiver
\* had closed first. Expected: NoSendPastClose broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_close_keep         \* the receiver's program
    Mutation = "send_ignores_close"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoSendPastClose
