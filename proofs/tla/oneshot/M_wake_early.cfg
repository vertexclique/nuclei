\* MUTATION wake_early: the send wakes before it publishes, a wake with
\* nothing visible (and the wake after the publish still comes: this is
\* the double wake). Expected: WakeMeansVisible broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_recv            \* the receiver's program
    Mutation = "wake_early"     \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    WakeMeansVisible
