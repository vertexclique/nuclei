\* WITNESS: the value lands while the receiver is between its
\* registration and its re-check, the lost-wake window the re-check
\* closes. Expected: NoValueAtRecheck broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Prog <- P_send              \* the sender's program (MC_Oneshot.tla)
    RxProg <- R_recv            \* the receiver's program
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoValueAtRecheck
