\* MUTATION no_role: a pusher that sees the flag drains without the taker's role. Expected: OneTaker broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the end of every thread is not a deadlock here
CONSTANTS
    Pushers = {1, 2}     \* 2 pushing threads
    Timers = 2           \* 2 timers in the wheel
    Mutation = "no_role"
INVARIANTS                     \* must hold in every reachable state
    OneTaker
