\* MUTATION drive_waits: the drive that fired the timer on the way to park waits on the poller all
\* the same. Expected: a deadlock (the task the timer woke never runs).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = TRUE     \* a task sleeps on a timer of the shard's wheel
    Mutation = "drive_waits"\* the rule this run takes away
