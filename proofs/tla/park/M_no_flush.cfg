\* MUTATION no_flush: the shard parks without submitting what its runs retired: it sleeps holding
\* its batch, which nothing else submits until it wakes. Expected: SleepsHoldingNothing broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the broken invariant is what this run looks for
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = FALSE    \* no task on a timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = FALSE  \* no block_on future on a timer
    FullQueue = FALSE    \* the wake's read is in the kernel
    NotifyFails = 0      \* no notification fails
    Retires = TRUE       \* every run retires into the batch
    Mutation = "no_flush"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    SleepsHoldingNothing
