\* MUTATION no_submit_first: the wait hands the kernel only what the submission queue holds. The
\* future's timer comes due on the way to park, the drive fires it, and its notification lands
\* in the eventfd while the wake's read still waits behind the full queue: the shard sleeps with
\* no deadline and nothing in the kernel can end the wait, which hung tests_cap in CI.
\* Expected: SleepSeesWake broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the broken invariant is what this run looks for
CONSTANTS
    Wakers = {}          \* no waker with work
    TimerTask = FALSE    \* no task on a timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = TRUE   \* the block_on future sleeps on a timer of the shard's wheel
    FullQueue = TRUE     \* the wake's read starts out behind a full submission queue
    NotifyFails = 0      \* no notification fails
    Mutation = "no_submit_first"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    SleepSeesWake
