\* MUTATION no_submit_first, with a wake from another thread: the waker pushes its work after the
\* shard's last look and notifies the sleeping shard, but the wake's read still waits behind the
\* full queue, so the work is never run. Expected: SleepSeesWake broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the broken invariant is what this run looks for
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = FALSE    \* no task on a timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = FALSE  \* no block_on future on a timer
    FullQueue = TRUE     \* the wake's read starts out behind a full submission queue
    Mutation = "no_submit_first"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    SleepSeesWake
