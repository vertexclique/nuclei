\* MUTATION notify_swallowed: a notification whose kernel call failed is dropped, as
\* kqueue's and the port's `Notifier::notify` did. The waker took the flag back, so no
\* other waker notifies the shard, which sleeps with work in its inbox.
\* Expected: a deadlock (the wake is lost).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = FALSE    \* no timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = FALSE  \* no block_on future on a timer
    FullQueue = FALSE    \* the wake's read is in the kernel from the start
    NotifyFails = 1      \* the first notification fails
    Mutation = "notify_swallowed"\* the rule this run takes away
