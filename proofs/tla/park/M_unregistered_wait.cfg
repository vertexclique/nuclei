\* MUTATION unregistered_wait: `Proactor::wait` on a thread that runs a shard (inside a
\* task or a `block_on`) runs the turn without entering the shard into `WAITING`, as its
\* first branch did. The `Proactor::wake` walks `WAITING`, finds nothing, and the one wait,
\* which only that wake ends, never returns.
\* Expected: a deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {}          \* no waker with work
    TimerTask = FALSE    \* no timer
    ProactorWake = TRUE  \* a Proactor::wake comes
    TimerFuture = FALSE  \* no block_on future on a timer
    FullQueue = FALSE    \* the wake's read is in the kernel from the start
    NotifyFails = 0      \* no notification fails
    Mutation = "unregistered_wait"\* the rule this run takes away
