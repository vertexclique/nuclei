\* One waker, the block_on future on a timer and a full submission queue as in P_full, every run
\* retiring into the shard's kovan batch, which frees a value whose drop closes a source: the
\* shard sleeps holding nothing back, and no destructor takes the poller while the wait borrows it.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = FALSE    \* no task on a timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = TRUE   \* the block_on future sleeps on a timer of the shard's wheel
    FullQueue = TRUE     \* the wake's read starts out behind a full submission queue
    NotifyFails = 0      \* no notification fails
    Retires = TRUE       \* every run retires into the batch
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ConsumedOnce
    OneNotifyPerPark
    SleepSeesWake
    SleepsHoldingNothing
    NoCloseInBorrow
