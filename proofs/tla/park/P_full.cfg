\* One waker, and the block_on future on a timer that comes due at any point, its own drive among
\* them, while the shard's operations fill the submission queue and the wake's read waits behind
\* them: every safety property, the asleep shard always sees its notification, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = FALSE    \* no task on a timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = TRUE   \* the block_on future sleeps on a timer of the shard's wheel
    FullQueue = TRUE     \* the wake's read starts out behind a full submission queue
    NotifyFails = 0      \* no notification fails
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ConsumedOnce
    OneNotifyPerPark
    SleepSeesWake
