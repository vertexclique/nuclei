\* Liveness behind a full submission queue: under weak fairness every thread finishes, so the
\* wakers' work runs and the future its timer woke runs too.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    Wakers = {1, 2}      \* 2 waker threads
    TimerTask = FALSE    \* no task on a timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = TRUE   \* the block_on future sleeps on a timer of the shard's wheel
    FullQueue = TRUE     \* the wake's read starts out behind a full submission queue
    NotifyFails = 0      \* no notification fails
    Retires = FALSE      \* no run retires into the batch
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
