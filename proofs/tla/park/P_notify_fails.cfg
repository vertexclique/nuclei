\* Two wakers, the first two notifications failing: every safety property, and every
\* thread finishes (the waker that took the flag back tries again, so no wake is lost).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {1, 2}      \* 2 waker threads
    TimerTask = FALSE    \* no timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = FALSE  \* no block_on future on a timer
    FullQueue = FALSE    \* the wake's read is in the kernel from the start
    NotifyFails = 2      \* the first two notifications fail
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ConsumedOnce
    OneNotifyPerPark
    SleepSeesWake
PROPERTIES                     \* must hold over every behaviour
    Termination
