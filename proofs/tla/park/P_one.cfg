\* One waker: every safety property, and no deadlock (no lost wake).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = FALSE    \* no timer
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = FALSE  \* no block_on future on a timer
    FullQueue = FALSE    \* the wake's read is in the kernel from the start
    NotifyFails = 0      \* no notification fails
    Retires = FALSE      \* no run retires into the batch
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ConsumedOnce
    OneNotifyPerPark
