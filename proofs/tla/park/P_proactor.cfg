\* A thread inside Proactor::wait, whose one wait only a Proactor::wake ends: the wake ends it
\* wherever it lands, so the call returns (no deadlock, every thread finishes).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {}          \* no waker with work
    TimerTask = FALSE    \* no timer
    ProactorWake = TRUE  \* a Proactor::wake comes
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
