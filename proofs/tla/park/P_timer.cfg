\* One waker and a task of the shard's own on a timer that comes due at any point: every safety
\* property, and no deadlock (no wake lost, the timer's task always runs).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Wakers = {1}         \* 1 waker thread
    TimerTask = TRUE     \* a task sleeps on a timer of the shard's wheel
    ProactorWake = FALSE \* no Proactor::wake
    TimerFuture = FALSE  \* no block_on future on a timer
    FullQueue = FALSE    \* the wake's read is in the kernel from the start
    NotifyFails = 0      \* no notification fails
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    ConsumedOnce
    OneNotifyPerPark
