\* Liveness with the timer: under weak fairness every thread finishes, so all the work runs, the
\* timer's task included.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    Wakers = {1, 2}      \* 2 waker threads
    TimerTask = TRUE     \* a task sleeps on a timer of the shard's wheel
    ProactorWake = FALSE \* no Proactor::wake
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
