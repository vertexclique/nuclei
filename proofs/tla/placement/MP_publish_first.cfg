\* MUTATION publish_first: the slot is published before the thread is asked for, as before the fix. A
\* spawn finds the shard and queues its task there; the thread does not start, the shard is stopped and
\* dropped with its run, and the task with it. Expected: NoSilentLoss broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the invariant is what this run looks for
CONSTANTS
    Mutation = "publish_first"
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
