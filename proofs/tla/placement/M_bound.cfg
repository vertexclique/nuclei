\* MUTATION bound: a placed task is bound to the thread that ran shard k when it was made (queued
\* on that thread's home, as a `spawn_local` task is), instead of to the shard. Expected:
\* RunsOnItsWorker broken. The runner begins the first task's poll and the monitor hands the shard
\* to the spare; the old thread, its poll done, runs the second task of its home on a shard of its
\* own, off worker k. Two tasks and one handoff are enough: one in the poll, one waiting at home.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    Tasks = {1, 2}             \* two tasks, each placed by a spawner of its own
    MaxPolls = 1               \* every poll completes
    MaxHandoffs = 1            \* the monitor may hand shard k on once
    Mode = "bound"             \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    RunsOnItsWorker
