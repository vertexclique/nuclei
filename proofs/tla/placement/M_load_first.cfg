\* MUTATION load_first: `may_exit` reads `load` before `draining`. Expected: NoSilentLoss broken.
\* The loop reads `load` at zero; the task is counted and its second look finds `draining` down;
\* the drain comes; the loop reads `draining` up and stops; the task, pushed after that, is dropped
\* by `push_remote`'s look at `stopped`, and its spawn answers Ok. One task and no handoff are
\* enough for that order.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    Tasks = {1}                \* one task
    MaxPolls = 1               \* every poll completes
    MaxHandoffs = 0            \* no handoff
    Mode = "load_first"        \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
