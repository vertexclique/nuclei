\* MUTATION look_before_count: the second look comes before the count (steps 2 and 3 swapped).
\* Expected: NoSilentLoss broken. Both looks find `draining` down; the drain comes; the loop finds
\* `draining` up and `load` still at zero and stops; the task, counted and pushed after that, is
\* dropped by `push_remote`'s look at `stopped`, and its spawn answers Ok. One task and no handoff
\* are enough for that order.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    Tasks = {1}                \* one task
    MaxPolls = 1               \* every poll completes
    MaxHandoffs = 0            \* no handoff
    Mode = "look_before_count" \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
