\* MUTATION refuse_after_push: the second look at `draining` comes after the task was scheduled.
\* Expected: RefusedNeverRuns broken. The task is pushed and the loop begins its poll; the drain
\* comes; the late look finds `draining` up and the spawn refuses a task that already ran. One task
\* and no handoff are enough for that order.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    Tasks = {1}                \* one task
    MaxPolls = 1               \* every poll completes
    MaxHandoffs = 0            \* no handoff
    Mode = "refuse_after_push" \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    RefusedNeverRuns
