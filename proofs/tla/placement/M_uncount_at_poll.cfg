\* MUTATION uncount_at_poll: a task's count goes as the loop takes it for its first poll, not when
\* it completes (`load` counting queued tasks, not live ones). Expected: NoSilentLoss broken. The
\* task's first poll ends Pending and it is queued again, uncounted; the drain comes; the loop
\* finds `draining` up and `load` at zero and stops, dropping the task its spawn answered Ok. One
\* task with two polls and no handoff are enough for that order.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    Tasks = {1}                \* one task
    MaxPolls = 2               \* its first poll may end Pending
    MaxHandoffs = 0            \* no handoff
    Mode = "uncount_at_poll"   \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
