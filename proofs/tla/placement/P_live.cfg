\* Liveness: every task whose spawn answered Ok runs to its end, the worker drained or not, its
\* shard handed on or not, under weak fairness of the spawners, the loop and the old runner, and
\* strong fairness of the loop's take. Two tasks with one poll each: one in the poll the handoff
\* leaves on the old thread, the other waiting in the queue the new runner takes over. The
\* re-push of a Pending poll is P_live_repush's (a liveness check costs far more per state).
SPECIFICATION Spec              \* the system, with its fairness
CHECK_DEADLOCK FALSE           \* a run that is over (every spawn answered, the loop gone) is no deadlock
CONSTANTS
    Tasks = {1, 2}             \* two tasks, each placed by a spawner of its own
    MaxPolls = 1               \* every poll completes
    MaxHandoffs = 1            \* the monitor may hand shard k on once
    Mode = "ok"                \* the code as it is
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
PROPERTIES                     \* must hold of every fair behaviour
    EveryOkRuns
