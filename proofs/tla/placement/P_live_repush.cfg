\* Liveness of a task whose poll the handoff left on the old thread and which ended Pending: its
\* waker, on a thread that runs no shard, pushes it back to shard k, whose new runner polls it to
\* its end. One task with two polls is the whole case; the queue the new runner takes over is
\* P_live's.
SPECIFICATION Spec              \* the system, with its fairness
CHECK_DEADLOCK FALSE           \* a run that is over (every spawn answered, the loop gone) is no deadlock
CONSTANTS
    Tasks = {1}                \* one task
    MaxPolls = 2               \* its first poll may end Pending
    MaxHandoffs = 1            \* the monitor may hand shard k on once
    Mode = "ok"                \* the code as it is
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
PROPERTIES                     \* must hold of every fair behaviour
    EveryOkRuns
