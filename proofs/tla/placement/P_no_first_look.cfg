\* The first look at `draining` (`worker_shard`) taken away: every property still holds, so the
\* first look is no guard, only a refusal that comes before the task is made. The second look,
\* after the count, refuses every spawn the first would have. Sizes as P_safe, for the same reasons.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over (every spawn answered, the loop gone) is no deadlock
CONSTANTS
    Tasks = {1, 2}             \* two tasks, each placed by a spawner of its own
    MaxPolls = 2               \* a task's first poll may end Pending
    MaxHandoffs = 1            \* the monitor may hand shard k on once
    Mode = "no_first_look"     \* no first look at `draining`
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
    RefusedNeverRuns
    RunsOnItsWorker
    StoppedQueuesNothing
