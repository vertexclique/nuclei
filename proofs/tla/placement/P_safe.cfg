\* Two tasks placed on worker k while it is drained and its shard is handed to the spare once:
\* no task answered Ok is dropped unrun, no refused task is polled, every poll begins on shard k
\* by the thread that runs it then, and a stopped shard queues nothing. Why this size is enough:
\* two tasks let one be in the poll a handoff leaves on the old thread while the other waits in
\* the queue; two polls a task let a poll end Pending on the old thread, whose wake pushes the
\* task back to the shard; one handoff, as a second only swaps the two threads' roles; one drain,
\* as `draining` only goes up.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over (every spawn answered, the loop gone) is no deadlock
CONSTANTS
    Tasks = {1, 2}             \* two tasks, each placed by a spawner of its own
    MaxPolls = 2               \* a task's first poll may end Pending
    MaxHandoffs = 1            \* the monitor may hand shard k on once
    Mode = "ok"                \* the code as it is
INVARIANTS                     \* must hold in every reachable state
    NoSilentLoss
    RefusedNeverRuns
    RunsOnItsWorker
    StoppedQueuesNothing
