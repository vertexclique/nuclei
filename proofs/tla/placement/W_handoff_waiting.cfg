\* WITNESS: the monitor hands shard k on while a placed task waits in its queue (the runner in
\* another task's poll). Expected: NoHandoffWhileWaiting broken. Every behaviour of this size is
\* one of P_safe's, so P_safe's search reaches the case too.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    Tasks = {1, 2}             \* two tasks, each placed by a spawner of its own
    MaxPolls = 1               \* every poll completes
    MaxHandoffs = 1            \* the monitor may hand shard k on once
    Mode = "ok"                \* the code as it is
INVARIANTS                     \* must hold in every reachable state
    NoHandoffWhileWaiting
