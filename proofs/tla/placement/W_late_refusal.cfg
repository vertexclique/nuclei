\* WITNESS: a spawn is refused at its second look, after its task was counted (the drain came
\* between the two looks), and the task is dropped unrun. Expected: NoLateRefusal broken. Every
\* behaviour of this size is one of P_safe's, so P_safe's search reaches the case too.
SPECIFICATION Spec              \* the system (its fairness plays no part in invariants)
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    Tasks = {1}                \* one task
    MaxPolls = 1               \* every poll completes
    MaxHandoffs = 0            \* no handoff
    Mode = "ok"                \* the code as it is
INVARIANTS                     \* must hold in every reachable state
    NoLateRefusal
