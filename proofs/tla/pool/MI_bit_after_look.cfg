\* MUTATION bit_after_look: the thread sets its bit after its look at the queue. Its look finds nothing; a submitter pushes,
\* sees it counted idle, finds no bit, cannot start a thread at the cap, and the thread then sets its bit and waits for good.
\* Expected: AllRan broken (a job lost).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11, 12}          \* the submitting threads
    Jobs = 1                       \* jobs each submitter sends
    Max = 1                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "bit_after_look"    \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    AllRan
