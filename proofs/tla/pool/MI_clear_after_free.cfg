\* MUTATION clear_after_free: at its keep-alive a thread frees its slot first and clears its bit after. Another thread takes
\* the slot, goes idle and sets its bit, and the late clear erases it: a waiting thread the bitmap misses.
\* Expected: IndexComplete broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11, 12}          \* the submitting threads
    Jobs = 1                       \* jobs each submitter sends
    Max = 2                        \* the pool's most threads, and its slots
    Timeouts = TRUE                \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "clear_after_free"  \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    IndexComplete
