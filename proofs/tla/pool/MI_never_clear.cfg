\* MUTATION never_clear: a woken slot's bit is never cleared, so it names a busy slot and sends every submitter to a
\* compare-and-swap that loses. No job is lost (PI_never_clear_runs). Expected: IndexTight broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11, 12}          \* the submitting threads
    Jobs = 1                       \* jobs each submitter sends
    Max = 1                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "never_clear"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    IndexTight
