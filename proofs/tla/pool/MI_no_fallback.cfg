\* MUTATION no_fallback, with stale loads of the bitmap: a submitter that finds no candidate neither starts a thread nor
\* scans. A stale load misses the bit of a thread that waits idle, and the job waits for good. Expected: AllRan broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11}              \* the submitting threads
    Jobs = 2                       \* jobs each submitter sends
    Max = 1                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "relaxed"          \* how a submitter loads the bitmap
    Fallback = "scan"              \* what follows no candidate
    Mutation = "no_fallback"       \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    AllRan
