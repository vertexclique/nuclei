\* MUTATION submitter_clears: the submitter clears the bit after its claim, not the woken thread. The thread wakes, runs, goes
\* idle again and sets its bit before that clear lands, which erases it; the next job finds no bit and no room.
\* Expected: AllRan broken (a job lost).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11}              \* the submitting threads
    Jobs = 3                       \* jobs each submitter sends
    Max = 1                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "submitter_clears"  \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    AllRan
