\* MUTATION trust_index: a submitter takes a set bit for a claim and stores woken without the compare-and-swap. Two submitters
\* read one bit and both count the one thread out, or one counts out a thread that took its slot back: the idle count goes
\* below zero (in the code it wraps). Expected: IdleCounted broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11, 12}          \* the submitting threads
    Jobs = 1                       \* jobs each submitter sends
    Max = 1                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "trust_index"       \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    IdleCounted
