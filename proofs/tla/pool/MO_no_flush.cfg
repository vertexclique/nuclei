\* MUTATION no_flush: a pool thread waits for its slot without submitting what its jobs retired.
\* Expected: SleepsHoldingNothing broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11}
    Jobs = 1
    Max = 1
    Timeouts = FALSE
    Mutation = "no_flush"
INVARIANTS                     \* must hold in every reachable state
    SleepsHoldingNothing
