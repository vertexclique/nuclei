\* MUTATION check_before_decrement: a submitter whose start failed looks at the count before its own
\* count goes. With a pool of one thread it reads its own count, runs nothing, then takes the count
\* back: no thread is counted, none will start, and the jobs wait for good. Expected: AllRan broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the property is what this run looks for
CONSTANTS
    Max = 1              \* the pool's most threads
    Mutation = "check_before_decrement"
PROPERTIES                     \* must hold over every behaviour
    AllRan
