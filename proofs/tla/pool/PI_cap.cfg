\* Liveness at the cap: a pool of one thread, three jobs, no keep-alive exit. A submitter that finds no candidate cannot start
\* a thread; the thread's look after its bit catches the job.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11}              \* the submitting threads
    Jobs = 3                       \* jobs each submitter sends
    Max = 1                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "none"              \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    AllRan
