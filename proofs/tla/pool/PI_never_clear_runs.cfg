\* The mutation never_clear (a woken slot's bit is never cleared) is a performance bug only: stale bits send submitters to
\* busy slots, whose compare-and-swap loses, and every job still runs. MI_never_clear shows what it breaks.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11, 12}          \* the submitting threads
    Jobs = 1                       \* jobs each submitter sends
    Max = 2                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "never_clear"       \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    AllRan
