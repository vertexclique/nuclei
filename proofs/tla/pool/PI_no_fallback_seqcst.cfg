\* With sequentially consistent loads of the bitmap the fallback is not needed for correctness: a submitter that finds no
\* candidate and gives up loses no job (each idle-counted thread it missed still looks at the queue after its bit). It
\* still starts threads for throughput. MI_no_fallback shows that stale loads need it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11}              \* the submitting threads
    Jobs = 3                       \* jobs each submitter sends
    Max = 1                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "seqcst"           \* how a submitter loads the bitmap
    Fallback = "start"             \* what follows no candidate
    Mutation = "no_fallback"       \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    AllRan
