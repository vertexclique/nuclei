\* Stale loads of the bitmap with today's full scan as the fallback, no keep-alive exit: every job runs.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11, 12}          \* the submitting threads
    Jobs = 1                       \* jobs each submitter sends
    Max = 2                        \* the pool's most threads, and its slots
    Timeouts = FALSE               \* whether a keep-alive can run out
    IndexLoad = "relaxed"          \* how a submitter loads the bitmap
    Fallback = "scan"              \* what follows no candidate
    Mutation = "none"              \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    AllRan
