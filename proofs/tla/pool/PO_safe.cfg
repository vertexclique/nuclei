\* Two submitters of two jobs each, a pool of two threads whose time may run out: a job runs once, the bounds hold.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* threads wait for work for good once it is all done
CONSTANTS
    Submitters = {11, 12}
    Jobs = 2
    Max = 2
    Timeouts = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    RunOnce
    Bounded
    OneOwner
    IdleCounted
