\* Two submitters and a pool of 2 thread(s): every start may fail and every start hook may panic, each
\* panic caught. No job runs twice, the cap holds, every job runs, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Max = 2              \* the pool's most threads
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    RunOnce
    Bounded
PROPERTIES                     \* must hold over every behaviour
    AllRan
