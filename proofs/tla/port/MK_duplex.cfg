\* A defect still open: the source moves with a TCP send out into a full socket, whose peer reads only after it got
\* what it waits for from us. The registration waits for the send, the send for the peer, the peer for the task's
\* read, which waits for the registration: both ends wait for good. Expected: ReadServed broken, until a moved source's
\* reads go on with its send still out.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 1
    Back = FALSE
    Duplex = TRUE
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    ReadServed
