\* MUTATION fail_on_ops: a bind that fails while operations are out fails the registration. Expected: NoFailure broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 2
    Back = TRUE
    Mutation = "fail_on_ops"
INVARIANTS                     \* must hold in every reachable state
    NoFailure
