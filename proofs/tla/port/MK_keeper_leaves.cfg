\* MUTATION keeper_leaves: the keeper leaves once no operation is out, though the source still waits to move off its
\* port: the task's second read, made there after the send ended, is never delivered. Expected: ReadServed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 1
    Back = FALSE
    Duplex = TRUE
    Mutation = "keeper_leaves"
PROPERTIES                     \* must hold over every behaviour
    ReadServed
