\* MUTATION no_here: a registration with the shard whose port the handle is bound to binds all the same, as it did; the
\* bind fails with the send out, the registration waits for it, the send for the peer and the peer for the read: both
\* ends wait for good. Expected: ReadServed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 1
    Back = TRUE
    Duplex = TRUE
    Mutation = "no_here"
PROPERTIES                     \* must hold over every behaviour
    ReadServed
