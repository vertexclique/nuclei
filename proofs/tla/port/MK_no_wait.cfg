\* MUTATION no_wait: the shard drains its port without waiting for the keeper it stopped. Expected: OneDrainer broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 2
    Back = TRUE
    Mutation = "no_wait"
INVARIANTS                     \* must hold in every reachable state
    OneDrainer
