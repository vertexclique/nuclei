\* MUTATION handle_wait: a pending call waits on the handle's own signal, which the other call's end sets: it returns
\* before its own end, and the kernel then writes into its frame. Expected: NoDeadWrite broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel waits for good once both calls ended
CONSTANTS
    Overlapped = TRUE
    Mutation = "handle_wait"
INVARIANTS                     \* must hold in every reachable state
    NoDeadWrite
