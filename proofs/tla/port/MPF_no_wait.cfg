\* MUTATION no_wait: a call that comes back with ERROR_IO_PENDING answers it as its error and returns, as it did: its
\* frame is gone when the kernel ends the write and writes its status there. Expected: NoDeadWrite broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel waits for good once both calls ended
CONSTANTS
    Overlapped = TRUE
    Mutation = "no_wait"
INVARIANTS                     \* must hold in every reachable state
    NoDeadWrite
