\* MUTATION would_block_waits: a read that finds the announced chunk taken waits with no look sent for it, so the next
\* chunk is never seen. Expected: Served broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the task waits for good once it read, by design
CONSTANTS
    Mutation = "would_block_waits"
PROPERTIES                     \* must hold over every behaviour
    Served
