\* MUTATION keep_readable: a receive that goes out leaves its side marked readable, so a later read the pool has no buffer for calls on a socket the receive emptied. Expected: NeverBlocks broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 0
    Held = 0
    Path = "tcp"
    Mutation = "keep_readable"
INVARIANTS                     \* must hold in every reachable state
    NeverBlocks
