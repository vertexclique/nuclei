\* MUTATION no_resubmit: the zero-byte receive ends, and sends out no receive and wakes nobody; the request that came is never read. Expected: Served broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 2
    Held = 0
    Path = "tcp"
    Mutation = "no_resubmit"
PROPERTIES                     \* must hold over every behaviour
    Served
