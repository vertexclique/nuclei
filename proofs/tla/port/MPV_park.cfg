\* MUTATION park: a starved reader waits for a buffer to come back and reads nothing itself, as it did before; both buffers wait in receives of peers that never send, and the request that came is never read. Expected: Served broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 2
    Held = 0
    Path = "tcp"
    Mutation = "park"
PROPERTIES                     \* must hold over every behaviour
    Served
