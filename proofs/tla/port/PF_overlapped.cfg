\* A cursor write and a positional write on a handle opened for overlapped IO: each call waits on its own event for
\* its own end, so the kernel never writes into a frame a call left, each answers what the kernel said of it, and both
\* return.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel waits for good once both calls ended
CONSTANTS
    Overlapped = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoDeadWrite OwnResult
PROPERTIES                     \* must hold over every behaviour
    Returns
