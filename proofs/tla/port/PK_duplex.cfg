\* The source moves with a TCP send out into a full socket whose peer reads only after it got what it waits for from
\* us, its shard gone: the source stays on its old port, whose keeper serves both of its reads, the send ends once the
\* peer read, and the move is made.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 1
    Back = FALSE
    Duplex = TRUE
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    ReadServed
    Registers
    AllDelivered
