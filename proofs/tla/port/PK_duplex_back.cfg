\* The same, with the old shard able to run again and take its port back from its keeper: both reads are served, the
\* move is made, and every packet is delivered.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 1
    Back = TRUE
    Duplex = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneDrainer
PROPERTIES                     \* must hold over every behaviour
    ReadServed
    Registers
    AllDelivered
