\* A source that moves with a receive out whose peer needs nothing from us: its read on the other port is served.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 1
    Back = FALSE
    Duplex = FALSE
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    ReadServed
