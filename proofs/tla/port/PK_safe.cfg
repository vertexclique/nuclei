\* Two operations out, the shard may run again: one drainer at most, no failed
\* registration, and the shard parked until its keeper is done holds no retired value back.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 2
    Back = TRUE
    Duplex = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneDrainer
    NoFailure
    SleepsHoldingNothing
