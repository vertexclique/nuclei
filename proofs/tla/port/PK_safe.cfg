\* Two operations out, the shard may run again: one drainer at most, and no failed registration.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a process waiting for good is what the properties look for
CONSTANTS
    Ops = 2
    Back = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneDrainer
    NoFailure
