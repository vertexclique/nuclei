\* A task that reads by looks, with an outside call that may take the chunk a look announced: no read answers an error
\* for it, and the task reads a chunk in the end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the task waits for good once it read, by design
CONSTANTS
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoSpuriousError
PROPERTIES                     \* must hold over every behaviour
    Served
