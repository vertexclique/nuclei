\* Every peer sends, and the pool cannot hold a buffer for every read at once: the invariants of PV_safe.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 0
    Held = 0
    Path = "tcp"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Buffers
    NeverBlocks
