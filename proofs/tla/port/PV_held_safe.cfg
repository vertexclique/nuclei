\* Every peer sends, and two tasks peek at their request and never read it, so their buffers stay read ahead and may fill the pool: the invariants of PV_safe.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 0
    Held = 2
    Path = "tcp"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Buffers
    NeverBlocks
