\* Pipes over a pool of two buffers, two of which nobody writes to: every buffer is accounted for, and no reader calls on an empty pipe.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 2
    Held = 0
    Path = "pipe"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Buffers
    NeverBlocks
