\* Three connections over a pool of two buffers, two of whose peers never send: every buffer is accounted for, and no reader calls on an empty socket.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 2
    Held = 0
    Path = "tcp"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Buffers
    NeverBlocks
