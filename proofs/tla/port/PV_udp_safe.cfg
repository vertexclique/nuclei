\* Datagram sockets over a pool of two buffers, two of whose peers never send: every buffer is accounted for, and no receiver calls on an empty socket, its look having left the datagram queued.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a task waiting for good is what the properties look for
CONSTANTS
    Idle = 2
    Held = 0
    Path = "udp"
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Buffers
    NeverBlocks
