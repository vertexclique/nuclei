\* A backend whose wait counts ticks (epoll; kqueue's timer is its twin), on the real clock: the poller's own timer ends the waits at precise deadlines, moved as they change; no deadlock.
SPECIFICATION Spec              \* the shard, weakly fair
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "coarse"     \* the wait counts ticks
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
