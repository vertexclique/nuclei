\* G_skew over every behaviour: with the running clock advanced once, every sleep ends.
SPECIFICATION Spec              \* the shard, weakly fair
CHECK_DEADLOCK FALSE           \* a stuck shard is what the property catches
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "coarse"     \* the wait counts ticks
    Skews = TRUE           \* a task may advance the running clock once
    Mutation = "none"      \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
