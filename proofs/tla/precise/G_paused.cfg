\* A paused clock: it jumps to the earliest deadline of either wheel, so every sleep ends at its own time; no deadlock.
SPECIFICATION Spec              \* the shard, weakly fair
CONSTANTS
    Paused = TRUE          \* the clock moves by jumps
    Backend = "fine"       \* not looked at on a paused clock
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
