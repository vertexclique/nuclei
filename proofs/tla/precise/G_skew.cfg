\* A backend whose wait counts ticks (epoll; kqueue's timer is its twin), on the real clock, which a task advances once while the poller's own timer is armed: the timer is armed again for the deadline as the system now sees it, and the precise sleeps still end at their deadlines; no deadlock.
SPECIFICATION Spec              \* the shard, weakly fair
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "coarse"     \* the wait counts ticks
    Skews = TRUE           \* a task may advance the running clock once
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
