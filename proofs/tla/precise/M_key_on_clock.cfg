\* MUTATION key_on_clock: the poller keeps the deadline on the clock it armed its own timer for, as before the fix, and arms nothing for the same one. Expected: OnTime broken.
\* The bug it plants: the timer is armed for a precise deadline, then a task advances the running clock; at the next park the deadline on the clock is the one kept, so the timer stays armed for the system's time it had before, which is now later on the clock, and the precise sleep ends there or at its tick, after its deadline.
SPECIFICATION Spec              \* the shard, weakly fair
CHECK_DEADLOCK FALSE           \* a late sleep is what this run looks for
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "coarse"     \* the wait counts ticks
    Skews = TRUE           \* a task may advance the running clock once
    Mutation = "key_on_clock"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    OnTime
