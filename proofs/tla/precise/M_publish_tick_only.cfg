\* MUTATION publish_tick_only: a paused shard publishes the tick wheel's deadline alone, so the clock jumps past a precise deadline. Expected: OnTime broken.
SPECIFICATION Spec              \* the shard, weakly fair
CHECK_DEADLOCK FALSE           \* a late sleep is what this run looks for
CONSTANTS
    Paused = TRUE          \* the clock moves by jumps
    Backend = "fine"       \* not looked at on a paused clock
    Mutation = "publish_tick_only"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    OnTime
