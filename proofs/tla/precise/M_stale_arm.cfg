\* MUTATION stale_arm: the poller's own timer is armed only when none is and never moved, so a precise sleep that came later with an earlier deadline waits for the old one, or for the tick. Expected: OnTime broken.
SPECIFICATION Spec              \* the shard, weakly fair
CHECK_DEADLOCK FALSE           \* a late sleep is what this run looks for
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "coarse"     \* the wait counts ticks
    Mutation = "stale_arm"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    OnTime
