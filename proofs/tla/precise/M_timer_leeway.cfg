\* MUTATION timer_leeway: the poller's own timer, which ends a wait at a precise deadline, is not marked critical (Apple's `NOTE_CRITICAL`), so the system fires it a unit late to coalesce it with another timer. Expected: OnTime broken.
SPECIFICATION Spec              \* the shard, weakly fair
CHECK_DEADLOCK FALSE           \* a late sleep is what this run looks for
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "coarse"     \* the wait counts ticks
    Mutation = "timer_leeway"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    OnTime
