\* MUTATION wait_tick_only: the shard's wait looks at the tick wheel alone, so it sleeps past a precise deadline. Expected: OnTime broken.
SPECIFICATION Spec              \* the shard, weakly fair
CHECK_DEADLOCK FALSE           \* a late sleep is what this run looks for
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "fine"       \* the wait itself is precise
    Mutation = "wait_tick_only"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    OnTime
