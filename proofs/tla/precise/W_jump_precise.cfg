\* WITNESS: a paused clock jumps to a precise deadline. Expected: NoJumpToPrecise broken.
SPECIFICATION Spec              \* the shard, weakly fair
CONSTANTS
    Paused = TRUE          \* the clock moves by jumps
    Backend = "fine"       \* not looked at on a paused clock
    Skews = FALSE          \* no advance of the running clock
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoJumpToPrecise
