\* WITNESS: after a task advanced the running clock, the poller's own timer is armed again for a deadline on the clock it was armed for already, so G_skew checks the timer moved by the advance. Expected: NoSkewRearm broken.
SPECIFICATION Spec              \* the shard, weakly fair
CONSTANTS
    Paused = FALSE         \* the real clock
    Backend = "coarse"     \* the wait counts ticks
    Skews = TRUE           \* a task may advance the running clock once
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoSkewRearm
