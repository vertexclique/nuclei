\* A child watched on A, which may stop running, the waiter then on B: one watch out, no ECHILD outcome.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the kernel and the shards wait for good once the child is done
CONSTANTS
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneWatch
    NoEchild
