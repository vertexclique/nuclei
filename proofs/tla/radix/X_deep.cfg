\* Two producers of three values each, two children a node, a window of two: values taken past a stalled position while the root grows twice. The same properties.
\* The two producers run the same push from the same start and no property names one of them, so a state and the same state with the two swapped are one state to TLC (SYMMETRY): every state is still checked, up to the producers' names, about half as many of them. Every witness and every mutation of this family but MX_no_recheck still breaks its property at these constants with the swap on; MX_no_recheck's bug needs a window of three (at a window of two the receiver only looks one position past its head), and these constants with a window of three break PerSenderOrder with it.
SPECIFICATION Spec              \* the algorithm, every process but kovan weakly fair
CONSTANTS
    Producers = {p1, p2}        \* two producers, named by model values so they can be swapped
    Pushes = 3
    Fan = 2
    Window = 2
    Mutation = "none"
SYMMETRY Perms                  \* both namings of the two producers are one state (MC_Radix.tla)
INVARIANTS                     \* must hold in every reachable state
    NoFreedTouch
    RootLive
    TakenOnce
    WaitFree
    PerSenderOrder
