\* Two producers of two values each, two children a node (the root grows once): nothing freed is read, the root stays live, every value taken once and only once written, every push within its step bound, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process but kovan weakly fair
CONSTANTS
    Producers = {"p1", "p2"}
    Pushes = 2
    Fan = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoFreedTouch
    RootLive
    TakenOnce
    WaitFree
