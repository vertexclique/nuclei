\* An owner three deep beside one that locks once: every safety property, every
\* owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- DeepShallow
    SharedIds = FALSE    \* every task locks with a token of its own
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    DepthMatches
    NoFalseReenter
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
