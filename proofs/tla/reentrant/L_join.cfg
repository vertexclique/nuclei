\* An owner joins two locks while another owner may hold the lock: both of its
\* requests queue, the older is handed the permit, and the join keeps that
\* guard until the younger completes. The younger looks for its owner's id at
\* every poll, queued or not, so it enters as soon as the older did: one owner
\* at a time, the depth its guards, every owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- JoinBeside
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    DepthMatches
    NoFalseReenter
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
