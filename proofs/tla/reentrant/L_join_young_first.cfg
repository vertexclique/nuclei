\* An owner joins two locks while another owner may hold the lock, the join polling the younger
\* request first: woken for the older's grant, it polls the younger before the older stored the
\* id, so the younger sleeps on; the older's entry then wakes it, it finds the id and enters. One
\* owner at a time, the depth its guards, every owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- JoinYoungFirst
    SharedIds = FALSE    \* every task locks with a token of its own
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    DepthMatches
    NoFalseReenter
    FreeAtEnd
PROPERTIES                     \* must hold over every behaviour
    AllOwnersEnd
