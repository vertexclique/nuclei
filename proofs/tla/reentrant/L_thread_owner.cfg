\* Two tasks of one thread lock with the thread's token: the lock is entered again by the other task,
\* the depth counts both, it is free again once both let go, and every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- TwoOnce
    SharedIds = TRUE     \* both tasks lock with their thread's one token
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
