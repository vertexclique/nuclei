\* Two owners each lock two deep, let one go, lock again, and let all go: one
\* owner at a time, the depth its guards, every owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- TwoDeep
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    DepthMatches
    NoFalseReenter
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
