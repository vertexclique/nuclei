\* MUTATION drop_keeps_grant: a read granted by a pass and dropped before its future looked
\* keeps the share. No reader is left, yet the count never falls to zero, and the writer's
\* second write waits for good. Expected: AllEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    OwnerProg <- DropThenRead   \* the owner's steps (MC_ReentrantRaw.tla)
    Mutation = "drop_keeps_grant"   \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    AllEnd
