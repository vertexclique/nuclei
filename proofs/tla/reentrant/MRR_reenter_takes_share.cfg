\* MUTATION reenter_takes_share: a nested read takes a share of the plain lock like a first
\* read. With the writer owed the lock it queues behind it, while the writer waits for this
\* owner's first read to end. Expected: NoWaitWhileHolding broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    OwnerProg <- NestedRead     \* the owner's steps (MC_ReentrantRaw.tla)
    Mutation = "reenter_takes_share"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoWaitWhileHolding
