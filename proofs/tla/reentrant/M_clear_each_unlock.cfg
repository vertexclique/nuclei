\* MUTATION clear_each_unlock: every unlock clears the holder, not only the last.
\* Expected: AllOwnersEnd broken (the owner's next lock waits on itself).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- TwoDeep
    Mutation = "clear_each_unlock"
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
