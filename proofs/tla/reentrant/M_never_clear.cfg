\* MUTATION never_clear: the last unlock gives the permit back but leaves its id.
\* Expected: Exclusion broken (it locks again without the permit, beside the next owner).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- DeepShallow
    Mutation = "never_clear"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
