\* MUTATION no_sibling_wake: an owner's entry wakes none of its other queued requests (the code
\* before 0.5.4's fix). The join polls the younger request first; woken for the older's grant, the
\* pass polls the younger before the older stored the id, so it sleeps on, and nothing wakes it
\* again: the owner waits on itself although every poll looks for its id. The same holds for a
\* younger request in another task of the same owner. Expected: AllOwnersEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- JoinYoungFirst
    SharedIds = FALSE    \* every task locks with a token of its own
    Mutation = "no_sibling_wake"
PROPERTIES                     \* must hold over every behaviour
    AllOwnersEnd
