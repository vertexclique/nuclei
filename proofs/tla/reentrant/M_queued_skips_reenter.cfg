\* MUTATION queued_skips_reenter: a queued request only looks at its node, not
\* for its owner's id. The older of a join's two requests enters, the younger
\* sleeps in the queue for the permit its own owner holds, and the join waits
\* for it: the owner deadlocks on itself. Expected: AllOwnersEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- JoinBeside
    SharedIds = FALSE    \* every task locks with a token of its own
    Mutation = "queued_skips_reenter"
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
