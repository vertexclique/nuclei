\* MUTATION release_before_clear: the last unlock gives the permit back before it
\* clears the holder. Expected: AllOwnersEnd broken (the next owner's id is
\* cleared, and its own next lock waits on itself).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- TwoDeep
    Mutation = "release_before_clear"
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
