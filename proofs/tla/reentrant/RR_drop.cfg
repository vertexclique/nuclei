\* A read dropped while queued (granted just before, or not), then a read, against a writer
\* that writes twice: the dropped read's share goes back, and both end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    OwnerProg <- DropThenRead   \* the owner's steps (MC_ReentrantRaw.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWaitWhileHolding
PROPERTIES                     \* must hold over every behaviour
    AllEnd
