\* An owner reads, reads again nested and lets both go, while a writer twice waits and may
\* come to be owed the lock: the nested read never queues behind the owed writer, and both
\* end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    OwnerProg <- NestedRead     \* the owner's steps (MC_ReentrantRaw.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWaitWhileHolding
PROPERTIES                     \* must hold over every behaviour
    AllEnd
