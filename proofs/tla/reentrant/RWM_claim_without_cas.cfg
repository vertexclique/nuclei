\* MUTATION claim_without_cas: a claim takes the record it saw free without the
\* compare-and-swap. Expected: ReadsMatch broken (a racing owner's record is taken).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- ClaimRace
    Mutation = "claim_without_cas"
INVARIANTS                     \* must hold in every reachable state
    ReadsMatch
