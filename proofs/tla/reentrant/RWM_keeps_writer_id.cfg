\* MUTATION keep_writer_id: the last write leaves its owner's id.
\* Expected: FreeAtEnd broken (its last read keeps the read share).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- DowngradeNested
    Mutation = "keep_writer_id"
INVARIANTS                     \* must hold in every reachable state
    FreeAtEnd
