\* MUTATION queued_read_claims_again: a queued read that was granted records
\* itself as a first read, without looking for its owner's record. Of a join's
\* two reads granted in one pass, the younger claims a second record for the
\* same owner. Expected: OneRecordEach broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- JoinReads
    Mutation = "queued_read_claims_again"
INVARIANTS                     \* must hold in every reachable state
    OneRecordEach
