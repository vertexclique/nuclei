\* MUTATION queued_read_skips_reenter: a queued read only looks at its node,
\* not at its owner's write. The join's write enters, the read sleeps in the
\* queue for a share the owner's own write keeps out, and the join keeps the
\* write until the read ends: the owner deadlocks on itself. Expected:
\* AllOwnersEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- JoinWriteRead
    Mutation = "queued_read_skips_reenter"
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
