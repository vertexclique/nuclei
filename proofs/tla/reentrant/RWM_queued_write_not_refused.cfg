\* MUTATION queued_write_not_refused: a queued write only looks at its node,
\* not at its owner's reads. The owner reads while its write waits, and the
\* write then waits for that read, which the owner keeps until the write ends:
\* the owner deadlocks on itself. Expected: AllOwnersEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- WriteQueuedRead
    Mutation = "queued_write_not_refused"
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
