\* MUTATION read_ignores_own_record: an owner that reads does not look for its own
\* record first. Expected: OneRecordEach broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- DowngradeNested
    Mutation = "read_ignores_own_record"
INVARIANTS                     \* must hold in every reachable state
    OneRecordEach
