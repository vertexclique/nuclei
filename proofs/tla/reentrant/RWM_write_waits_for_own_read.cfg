\* MUTATION write_waits_for_own_read: a reading owner's write is not refused.
\* Expected: AllOwnersEnd broken (it waits for its own read).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- ReadInWriteRefused
    Mutation = "write_waits_for_own_read"
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
