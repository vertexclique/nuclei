\* Two owners that each read, let go and read again, so their claims race for a
\* freed record: every safety property, every owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- ClaimRace
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    SharesMatch
    GuardsCovered
    OneRecordEach
    ReadsMatch
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
