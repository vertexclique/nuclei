\* An owner joins two reads while another owner may write: both queue, one
\* pass grants both, and the younger finds the record the older claimed, gives
\* its own share back and reads again on that record: one record per owner,
\* every safety property, every owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- JoinReads
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    SharesMatch
    GuardsCovered
    OneRecordEach
    ReadsMatch
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
