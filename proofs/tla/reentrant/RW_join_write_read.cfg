\* An owner joins a write and a read while another owner may write: both of its
\* requests queue, the write is handed over first, and the join keeps the write
\* until the read completes. The read looks at its owner's write at every
\* poll, queued or not, so it reads as soon as the write entered: every safety
\* property, every owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- JoinWriteRead
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    SharesMatch
    GuardsCovered
    OneRecordEach
    ReadsMatch
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
