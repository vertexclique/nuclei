\* A writer that reads inside and lets the read go first, beside a reader that
\* asks to write and is refused: every safety property, every owner ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- ReadInWriteRefused
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    SharesMatch
    GuardsCovered
    OneRecordEach
    ReadsMatch
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
