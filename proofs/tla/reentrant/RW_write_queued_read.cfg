\* An owner asks to write while another owner may read; the write queues, the
\* owner reads meanwhile, and the write, polled again, finds its owner reading
\* and is refused instead of waiting for that read (or it was taken at once,
\* and the read inside it outlives it): every safety property, every owner
\* ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Progs <- WriteQueuedRead
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
    SharesMatch
    GuardsCovered
    OneRecordEach
    ReadsMatch
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
