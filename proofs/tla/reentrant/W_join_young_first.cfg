\* WITNESS of a gap the code leaves open: the join polls the younger request
\* first. Waking for the older's grant, the pass polls the younger before the
\* older stored the id, so it sleeps on, and nothing wakes it again: the owner
\* waits on itself although every poll looks for its id. The same holds for a
\* younger request in another task of the same owner. Expected: AllOwnersEnd
\* broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Progs <- JoinYoungFirst
    Mutation = "none"
PROPERTIES                     \* must hold of every behaviour
    AllOwnersEnd
