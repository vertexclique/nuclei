\* WITNESS: two tasks of one thread lock with the thread's token (`Owner::thread`), the same id for
\* both: the second finds that id stored and enters at once, one level deeper, while the first
\* holds the lock, so two tasks hold it at once. Sound, as both run on the one thread, but no
\* exclusion between them, as `Owner::thread` documents. Expected: Exclusion broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Progs <- TwoOnce
    SharedIds = TRUE     \* both tasks lock with their thread's one token
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
