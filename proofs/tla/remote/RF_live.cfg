\* RF_safe's two owners and two freeing threads with two blocks, over every behaviour: every thread ends.
\* Why two blocks are enough: two pushes are still counted in at once, so one still loses its compare-and-swap to the other (or to the owner's take) and reads the head again; a push still finds the list closed; the next owner still takes back a block the first allocated. A thread that would retry for good (a compare-and-swap that never reads the head again, a push that tries a closed list again instead of giving up) is still caught at this size. With a bound of two and two blocks the list is never full: RF_live_tight takes that way out.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Blocks = {"b1", "b2"}
    Foreign = {"f1", "f2"}
    Kept = 2
    Allocs = 3
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Terminates
