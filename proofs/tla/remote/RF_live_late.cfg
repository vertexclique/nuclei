\* RF_live with Late: an owner's own late free takes its record's path, and every thread still ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Blocks = {"b1", "b2"}
    Foreign = {"f1", "f2"}
    Kept = 2
    Allocs = 3
    Late = TRUE                 \* an owner's task may end on its thread after the cache went
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Terminates
