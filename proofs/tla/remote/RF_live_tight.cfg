\* RF_tight's bound of one with two blocks, over every behaviour: every thread ends.
\* Why this one too: with a bound of one a push finds the list full and gives its block back, the way out RF_live never takes; a push still finds the list closed, the owner's take or close still makes a push read the head again, and the next owner still takes back a block the first allocated. A thread that would retry for good is still caught at this size.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Blocks = {"b1", "b2"}
    Foreign = {"f1", "f2"}
    Kept = 1
    Allocs = 3
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Terminates
