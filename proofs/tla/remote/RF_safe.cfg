\* Three blocks, two owners one after the other, two freeing threads: the list holds what was pushed, is bounded, open while owned, and every block goes back.
\* The blocks are alike (each starts with the system, and an owner takes any one there), so are the freeing threads (the same code, each on the blocks it was handed), and no property names one of them, so a state and the same state with the blocks or the threads renamed are one state to TLC (SYMMETRY): every state is still checked, up to those names, less than a tenth as many of them. Every mutation and witness of this family still breaks its property at these constants with the renaming on.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Blocks = {b1, b2, b3}       \* three blocks, named by model values so they can be swapped
    Foreign = {f1, f2}          \* two freeing threads, named the same way
    Kept = 2
    Allocs = 3
    Mutation = "none"
SYMMETRY Perms                  \* every renaming of the blocks and of the freeing threads is one state (MC_RemoteFree.tla)
INVARIANTS                     \* must hold in every reachable state
    ListConsistent
    ClosedEmpty
    BoundedList
    OpenWhileOwned
    CountOK
    AllFreed
