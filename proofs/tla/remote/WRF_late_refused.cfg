\* WITNESS: an owner's task ends on the owner's own thread after its cache went, and its free finds
\* the owner's list closed, so the block goes back to the system. Expected: NoLateRefused broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Blocks = {"b1", "b2"}
    Foreign = {"f1", "f2"}
    Kept = 2
    Allocs = 3
    Late = TRUE                 \* an owner's task may end on its thread after the cache went
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLateRefused
