\* MUTATION close_before_flush: no lease keeps the object open while an entry naming its number waits to reach the kernel, so another file takes the number and the entry reaches that file. Expected: NoStray broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Table = FALSE        \* a slot naming the handle's own descriptor
    Here = TRUE          \* dropped on the ring's own thread
    Busy = TRUE          \* the kernel holds completions it has no room for
    Mutation = "close_before_flush"
INVARIANTS                     \* must hold in every reachable state
    NoStray
