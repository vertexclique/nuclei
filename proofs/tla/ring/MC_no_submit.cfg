\* MUTATION no_submit: the detach leaves the cancel for the ring's next wait, as before the fix, so the file is still held when the drop returns (a thread that then blocks never closes it). Expected: ClosedAtDrop broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Table = FALSE        \* a slot naming the handle's own descriptor
    Here = TRUE          \* dropped on the ring's own thread
    Busy = FALSE         \* the kernel takes every entry at once
    Mutation = "no_submit"
INVARIANTS                     \* must hold in every reachable state
    ClosedAtDrop
