\* MUTATION charge_len: a chunk counts its length only. A peer that sends one unit at a time puts a chunk a unit, and the
\* receive holds more chunks than the cap at the minimum charge allows before the ring stops it. Expected: CapHeld broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    N = 5                \* messages the peer writes
    Total = 2            \* buffers in the group
    Size = 2             \* units in a buffer
    Cap = 2              \* units of charge a receive may hold before the ring stops it
    MinCharge = 2        \* the least a chunk counts against its receive's cap
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    CqCap = 1            \* completions the kernel may post ahead of the ring
    Datagram = FALSE     \* a stream, each message one unit
    Mutation = "charge_len"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    CapHeld
