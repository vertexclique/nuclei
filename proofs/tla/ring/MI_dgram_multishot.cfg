\* MUTATION dgram_multishot: a datagram socket arms a multishot receive on the group filled in pieces. The second datagram
\* finds one unit of room left in the buffer and the kernel cuts it. Expected: NoCut broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    N = 3                \* messages the peer writes
    Total = 2            \* buffers in the group
    Size = 3             \* units in a buffer
    Cap = 2              \* units of charge a receive may hold before the ring stops it
    MinCharge = 2        \* the least a chunk counts against its receive's cap
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    CqCap = 2            \* completions the kernel may post ahead of the ring
    Datagram = TRUE      \* a datagram socket, each message two units
    Mutation = "dgram_multishot"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoCut
