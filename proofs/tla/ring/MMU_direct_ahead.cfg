\* MUTATION direct_ahead: a big read goes straight to the socket with chunks read ahead and not taken. The stop brought the
\* first two messages, and the read takes the third before them. Expected: InOrder broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    N = 3                \* messages the peer writes
    Total = 3            \* buffers in the group
    Cap = 1              \* buffers a receive may hold before the ring stops it
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    Lent = FALSE         \* plain reads
    Direct = TRUE        \* reads big enough to go straight on the socket, and small ones
    Bigs = 2             \* big reads the reader makes at most
    Mutation = "direct_ahead"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    InOrder
