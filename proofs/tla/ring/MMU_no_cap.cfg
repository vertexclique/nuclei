\* MUTATION no_cap: the ring never stops a receive. Expected: a receive holds past its cap and the
\* kernel's burst (CapHeld broken).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    N = 4                \* messages the peer writes
    Total = 4            \* buffers in the group
    Cap = 1              \* buffers a receive may hold before the ring stops it
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    Lent = FALSE         \* plain reads
    Direct = FALSE       \* no read straight on the socket
    Bigs = 0             \* no big read
    Mutation = "no_cap"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    CapHeld
