\* MUTATION look_unissued: with a submission thread, a look made before the kernel armed the
\* receive counts as done. The bug it plants: the first try's piece is reaped and looked at with
\* no end there yet; the second piece and the end then come before the arming, whose one pass
\* takes the piece and waits for a wake that never comes, and no look follows. Expected:
\* Termination broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the stuck reader is what the property catches
CONSTANTS
    B = 2                \* two pieces: one for the first try, one for the gap before the arming
    SqPoll = TRUE        \* a submission thread issues the entries
    Mutation = "look_unissued" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Termination
