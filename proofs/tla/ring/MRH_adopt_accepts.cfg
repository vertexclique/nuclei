\* MUTATION adopt_accepts: the adopt cancels and arms again an accept too. The cancelled accept stays
\* the listener's first exclusive waiter until its old thread ends it, so it takes the connection's
\* wake, and the new accept, armed before the connection came, is never woken, even once the old
\* runner is back and the zombie gone. Expected: IoRescued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "uninterruptible"         \* how the old runner waits
    Ends = TRUE                       \* whether its wait ends
    Kind = "accept"                   \* the request it armed
    Mutation = "adopt_accepts"        \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    IoRescued
