\* MUTATION coop_taskrun: the ring runs a thread's completion work only at its next enter, with no
\* signal (IORING_SETUP_COOP_TASKRUN), which a ring any thread submits to must not. The new runner,
\* asleep in its wait with nothing in its completion queue, never runs its own request's work, and
\* the reader waits for good. Expected: IoRescued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "uninterruptible"         \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "poll"                     \* the request it armed
    Mutation = "coop_taskrun"         \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    IoRescued
