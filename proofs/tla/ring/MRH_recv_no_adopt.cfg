\* MUTATION no_adopt, on a multishot receive: the new runner leaves the old runner's receive armed,
\* as the adopt did before it took receives. The datum's work is queued to the old runner, which
\* sits in a wait no signal ends for good, and the reader waits as long. Expected: IoRescued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "uninterruptible"         \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "recv"                     \* the request it armed
    Mutation = "no_adopt"             \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    IoRescued
