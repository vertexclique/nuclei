\* MUTATION two_out: the adopt arms the new request without telling the side the old one ended, so
\* the side has two out as its own. Expected: OneOut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "interruptible"           \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "poll"                     \* the request it armed
    Mutation = "two_out"              \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OneOut
