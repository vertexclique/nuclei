\* MUTATION no_adopt: the new runner leaves the old runner's readiness request as it is, as before the
\* fix. Its completion is queued to the old runner, which sits in a wait no signal ends, so the edge
\* never comes and the reader waits for good. Expected: IoRescued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "uninterruptible"         \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "poll"                     \* the request it armed
    Mutation = "no_adopt"             \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    IoRescued
