\* MUTATION zombie_drops_data: a receive's zombie hands what it took nowhere, as a poll's zombie its
\* edges. The old runner, woken by a signal, takes the datum into the ring's buffers before or just
\* after the cancel; the new runner reaps it as the zombie's and lets it go, and no request ever sees
\* it again. Expected: IoRescued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "interruptible"           \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "recv"                     \* the request it armed
    Mutation = "zombie_drops_data"    \* the rule taken away, if any
PROPERTIES                     \* must hold over every behaviour
    IoRescued
