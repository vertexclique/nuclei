\* MUTATION zombie_reaches_side: the old request's completions, which its old thread runs late, are
\* handed to the side as its own, though the side has the new runner's request out: the side takes an
\* end of a request it no longer has. Expected: OwnEnds broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "interruptible"           \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "poll"                     \* the request it armed
    Mutation = "zombie_reaches_side"  \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OwnEnds
