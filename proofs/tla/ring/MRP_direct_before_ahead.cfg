\* MUTATION direct_before_ahead: past a switch back to readiness, a read goes to the socket while the receive's chunks
\* wait to be read: a later message comes before an earlier one. Expected: InOrder broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    N = 3                \* messages the peer writes
    Buf = 1              \* messages a read by readiness asks for
    Exact = TRUE         \* the kernel counts what a read leaves, or not
    Ends = 0             \* times the kernel may end the poll on its own
    Switch = TRUE        \* the side may switch to the receive and back, or not
    MaxSwitch = 2        \* switches at most
    Close = FALSE        \* the peer does not close
    Mutation = "direct_before_ahead"   \* the rule this run takes away, if any
INVARIANTS                     \* must hold in every reachable state
    InOrder
