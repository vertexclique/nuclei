\* MUTATION drained_after_fire: a read that took all it asked for is taken as having emptied the socket, whatever the
\* kernel counted: two messages the poll fired for once, the first read, and the reader waits for an edge that will not
\* come for the second. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    N = 2                \* messages the peer writes
    Buf = 1              \* messages a read by readiness asks for
    Exact = TRUE         \* the kernel counts what a read leaves, or not
    Ends = 0             \* times the kernel may end the poll on its own
    Switch = FALSE       \* the side may switch to the receive and back, or not
    MaxSwitch = 0        \* switches at most
    Close = FALSE        \* the peer does not close
    Mutation = "drained_after_fire"   \* the rule this run takes away, if any
PROPERTIES                     \* must hold over every behaviour
    Termination
