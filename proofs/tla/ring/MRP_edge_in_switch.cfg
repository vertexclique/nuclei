\* MUTATION edge_in_switch: past a switch back to readiness, the receive's end is taken as the socket found empty and its
\* poll as one still armed: the reader waits for a poll that is not there. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    N = 3                \* messages the peer writes
    Buf = 1              \* messages a read by readiness asks for
    Exact = TRUE         \* the kernel counts what a read leaves, or not
    Ends = 0             \* times the kernel may end the poll on its own
    Switch = TRUE        \* the side may switch to the receive and back, or not
    MaxSwitch = 2        \* switches at most
    Close = FALSE        \* the peer does not close
    Mutation = "edge_in_switch"   \* the rule this run takes away, if any
PROPERTIES                     \* must hold over every behaviour
    Termination
