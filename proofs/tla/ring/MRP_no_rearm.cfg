\* MUTATION no_rearm: a poll is armed once and never again after it ended: once the kernel ends it on its own, a reader
\* that found the socket empty waits for a poll that is not there. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    N = 3                \* messages the peer writes
    Buf = 1              \* messages a read by readiness asks for
    Exact = TRUE         \* the kernel counts what a read leaves, or not
    Ends = 1             \* times the kernel may end the poll on its own
    Switch = FALSE       \* the side may switch to the receive and back, or not
    MaxSwitch = 0        \* switches at most
    Close = FALSE        \* the peer does not close
    Mutation = "no_rearm"   \* the rule this run takes away, if any
PROPERTIES                     \* must hold over every behaviour
    Termination
