\* MUTATION ahead_after_poll: for a task that receives a Unix datagram itself the ring receives ahead into the smallest buffer, which cuts it. Expected: NoCut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "ring"
    Unix = TRUE
    Ahead = FALSE
    Mutation = "ahead_after_poll"
INVARIANTS                     \* must hold in every reachable state
    NoCut
