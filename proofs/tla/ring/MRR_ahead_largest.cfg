\* MUTATION ahead_largest: a look at readability receives the datagram ahead into the pool's largest buffer, as it did before, and a Unix datagram larger than that is cut. Expected: NoCut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Ring = FALSE
    Unix = TRUE
    Mutation = "ahead_largest"
INVARIANTS                     \* must hold in every reachable state
    NoCut
