\* MUTATION armed_waits: a Unix datagram's call waits behind the ring's armed poll as behind an operation out, so it never asks the kernel again and waits forever. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "ring"
    Unix = TRUE
    Ahead = FALSE
    Buf = 3              \* the task's buffer holds every datagram
    Mutation = "armed_waits"
PROPERTIES                     \* must hold over every behaviour
    Termination
