\* MUTATION bound_small: the ring receives UDP datagrams ahead into buffers smaller than the largest datagram, which is cut. Expected: NoCut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Ring = TRUE
    Unix = FALSE
    Mutation = "bound_small"
INVARIANTS                     \* must hold in every reachable state
    NoCut
