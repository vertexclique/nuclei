\* MUTATION no_wake: the edge of a datagram's arrival wakes nobody, so the call that waits for it waits forever. Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "poller"
    Unix = TRUE
    Ahead = FALSE
    Buf = 3              \* the task's buffer holds every datagram
    Mutation = "no_wake"
PROPERTIES                     \* must hold over every behaviour
    Termination
