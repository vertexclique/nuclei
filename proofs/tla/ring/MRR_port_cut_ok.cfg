\* MUTATION port_cut_ok (the code before): on a port a datagram longer than the task's buffer, received ahead whole, is
\* answered cut to it as a success, where std's receive answers WSAEMSGSIZE. Expected: AsStd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Unix = FALSE
    Ahead = TRUE
    Buf = 1              \* the task's buffer is shorter than the largest datagram
    Mutation = "port_cut_ok"
INVARIANTS                     \* must hold in every reachable state
    AsStd
