\* MUTATION task_sized: a ring receives UDP ahead into a buffer as large as the call that waits asked for, as its receive into the pool did when the group ran dry: a look cuts the largest datagram. Expected: NoCut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "ring"
    Unix = FALSE
    Ahead = TRUE
    Mutation = "task_sized"
INVARIANTS                     \* must hold in every reachable state
    NoCut
