\* MUTATION copy_large: a large chunk that finds the socket full is copied into the write-behind and taken at once, as before. Expected: NoLargeCopy broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Lent = FALSE
    Stream = TRUE
    Mutation = "copy_large"
INVARIANTS                     \* must hold in every reachable state
    NoLargeCopy
