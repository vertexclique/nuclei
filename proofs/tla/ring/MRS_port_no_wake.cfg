\* MUTATION no_wake: the port's poll for room wakes nobody, so a call that found the socket full waits for good.
\* Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Lent = FALSE
    Stream = FALSE
    Mutation = "no_wake"
PROPERTIES                     \* must hold over every behaviour
    Termination
