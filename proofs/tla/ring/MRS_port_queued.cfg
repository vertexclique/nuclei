\* MUTATION port_queues: a port's call copies its datagram, queues it and answers taken at once, as it did, so the
\* kernel's refusal of one with no route reaches the next call, whose own datagram is never sent. Expected: OwnResult
\* broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Lent = FALSE
    Stream = FALSE
    Mutation = "port_queues"
INVARIANTS                     \* must hold in every reachable state
    OwnResult
