\* MUTATION direct_ahead: a large chunk goes to the kernel while the write-behind is still ahead of it, and overtakes it. Expected: InOrder broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "unix"
    Lent = FALSE
    Stream = TRUE
    Mutation = "direct_ahead"
INVARIANTS                     \* must hold in every reachable state
    InOrder
