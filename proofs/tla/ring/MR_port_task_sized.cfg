\* MUTATION task_sized: a port receives UDP ahead into a buffer as large as the call that waits asked for, as it did, and a look at the sender asks for none: the largest datagram is cut to the pool's smallest buffer, and the next receive takes the cut one as a success. Expected: NoCut broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Unix = FALSE
    Ahead = TRUE
    Mutation = "task_sized"
INVARIANTS                     \* must hold in every reachable state
    NoCut
