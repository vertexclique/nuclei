\* Four messages, reads big and small: a big read stops an armed receive and waits, takes what the stop brought first,
\* then reads straight on the socket; the next small read arms a receive again. Every safety property.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    N = 4                \* messages the peer writes
    Total = 3            \* buffers in the group
    Cap = 1              \* buffers a receive may hold before the ring stops it
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    Lent = FALSE         \* plain reads
    Direct = TRUE        \* reads big enough to go straight on the socket, and small ones
    Bigs = 2             \* big reads the reader makes at most
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    InOrder
    OneOut
    NoArmWithAhead
    CapHeld
    BuffersBack
