\* Four messages through a group of three buffers, a cap of one, a burst of one: every safety
\* property, the dry path and the stop included.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    N = 4                \* messages the peer writes
    Total = 3            \* buffers in the group
    Cap = 1              \* buffers a receive may hold before the ring stops it
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    Lent = FALSE         \* plain reads
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    InOrder
    OneOut
    NoArmWithAhead
    CapHeld
    BuffersBack
