\* A slot naming the handle's own descriptor, dropped on another thread (the detach through the mailbox): every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Table = FALSE        \* a slot naming the handle's own descriptor
    Here = FALSE         \* dropped on another thread
    Busy = FALSE         \* the kernel takes every entry at once
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStray
    SlotReserved
    ClosedAtDrop
