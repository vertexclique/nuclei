\* A slot naming the handle's own descriptor, dropped on another thread while the kernel cannot take everything: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Table = FALSE        \* a slot naming the handle's own descriptor
    Here = FALSE         \* dropped on another thread
    Busy = TRUE          \* the kernel holds completions it has no room for
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStray
    SlotReserved
    ClosedAtDrop
