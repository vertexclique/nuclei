\* A fixed file dropped on another thread while the kernel is busy, the kernel refusing its first take-out from the table: every safety property, a free slot always empty, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Table = TRUE         \* a fixed file of the ring's table
    Here = FALSE         \* dropped on another thread
    Busy = TRUE          \* the kernel holds completions it has no room for
    UpdateFails = TRUE   \* the kernel refuses the first take-out from the table
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStray
    SlotReserved
    ClosedAtDrop
    SlotEmpty
