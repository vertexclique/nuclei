\* Liveness on a ring with no submission thread: under weak fairness every thread finishes, so
\* the reader gets both pieces and then the end, whenever the end comes.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    B = 2                \* pieces the peer writes before its end
    SqPoll = FALSE       \* the enter that hands an entry over issues it
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
