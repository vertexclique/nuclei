\* Two pieces and an end, on a ring with no submission thread: no piece lost, the end last, one
\* receive out, in every order the peer's writes, its end and the kernel's moves can take.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    B = 2                \* pieces the peer writes before its end
    SqPoll = FALSE       \* the enter that hands an entry over issues it
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoLoss
    EndLast
    OneOut
