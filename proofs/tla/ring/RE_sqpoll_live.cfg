\* As RE_live, with a submission thread: a look made before the arming proves nothing, and the
\* next arrival looks again, so the reader still gets the end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    B = 2                \* pieces the peer writes before its end
    SqPoll = TRUE        \* a submission thread issues the entries
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
