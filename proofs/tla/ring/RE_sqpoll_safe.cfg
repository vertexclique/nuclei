\* As RE_safe, with the kernel's own thread issuing the entries: the ring may reap the first
\* try's completion before the receive is armed.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    B = 2                \* pieces the peer writes before its end
    SqPoll = TRUE        \* a submission thread issues the entries
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoLoss
    EndLast
    OneOut
