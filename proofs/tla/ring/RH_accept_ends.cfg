\* An accept of the old runner's, which the adopt leaves as it is, with the old runner in a wait no
\* signal ends that ends in the end: the connection's wake reaches it, its completion runs once the
\* old runner is back, and the reader gets the connection.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "uninterruptible"         \* how the old runner waits
    Ends = TRUE                       \* whether its wait ends
    Kind = "accept"                   \* the request it armed
    Mutation = "none"                 \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OneOut
    OwnEnds
PROPERTIES                     \* must hold over every behaviour
    IoRescued
