\* A data operation of the old runner's, which the adopt leaves as it is, with the old runner asleep
\* where a signal wakes it: its completion runs there, and the reader gets the datum.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "interruptible"           \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "data"                     \* the request it armed
    Mutation = "none"                 \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OneOut
    OwnEnds
PROPERTIES                     \* must hold over every behaviour
    IoRescued
