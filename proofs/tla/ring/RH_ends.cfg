\* The old runner sits in a wait no signal ends, and comes back in the end: the reader gets the
\* datum through the new runner's request, and the zombie the old runner ends then is freed.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "uninterruptible"         \* how the old runner waits
    Ends = TRUE                       \* whether its wait ends
    Kind = "poll"                     \* the request it armed
    Mutation = "none"                 \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OneOut
    OwnEnds
PROPERTIES                     \* must hold over every behaviour
    IoRescued
    ZombieFreed
