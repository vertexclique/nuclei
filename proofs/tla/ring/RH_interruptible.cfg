\* The old runner sleeps where a signal wakes it, and never comes back: its readiness request is
\* cancelled and armed again by the new runner, the old one's completions go nowhere but its end, which
\* frees it. The side has one request out and takes only its own completions, the reader gets the
\* datum, and the zombie is freed.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "interruptible"           \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "poll"                     \* the request it armed
    Mutation = "none"                 \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OneOut
    OwnEnds
PROPERTIES                     \* must hold over every behaviour
    IoRescued
    ZombieFreed
