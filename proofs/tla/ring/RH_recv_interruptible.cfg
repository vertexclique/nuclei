\* The old runner sleeps where a signal wakes it, with a multishot receive armed: its work may take
\* the datum before or after the cancel, and what its zombie takes still reaches the side; its end
\* goes nowhere but frees it. One request out, only its own ends taken, the datum read, the zombie
\* freed.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "interruptible"           \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "recv"                     \* the request it armed
    Mutation = "none"                 \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OneOut
    OwnEnds
PROPERTIES                     \* must hold over every behaviour
    IoRescued
    ZombieFreed
