\* The old runner sits in a wait no signal ends, for good, with a multishot receive armed: the new
\* runner cancels it and arms another, whose bytes come on the new runner, while the old one's work
\* waits on its thread. The side has one request out and takes only its own ends, and the reader
\* gets the datum (tests/handoff_uninterruptible.rs, the receive).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "uninterruptible"         \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "recv"                     \* the request it armed
    Mutation = "none"                 \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    OneOut
    OwnEnds
PROPERTIES                     \* must hold over every behaviour
    IoRescued
