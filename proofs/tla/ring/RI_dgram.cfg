\* A datagram socket on a group filled in pieces: its receives take a buffer of the pool, one datagram each, so none is
\* cut. The same properties.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    N = 3                \* messages the peer writes
    Total = 2            \* buffers in the group
    Size = 3             \* units in a buffer
    Cap = 2              \* units of charge a receive may hold before the ring stops it
    MinCharge = 2        \* the least a chunk counts against its receive's cap
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    CqCap = 1            \* completions the kernel may post ahead of the ring
    Datagram = TRUE      \* a datagram socket, each message two units
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    InOrder
    NoReuse
    BuffersBack
    CapHeld
    NoCut
