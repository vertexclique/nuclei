\* Liveness with five messages and two completions posted ahead of the ring.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property says, not a deadlock check
CONSTANTS
    N = 5                \* messages the peer writes
    Total = 2            \* buffers in the group
    Size = 2             \* units in a buffer
    Cap = 2              \* units of charge a receive may hold before the ring stops it
    MinCharge = 2        \* the least a chunk counts against its receive's cap
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    CqCap = 2            \* completions the kernel may post ahead of the ring
    Datagram = FALSE     \* a stream, each message one unit
    Mutation = "none"    \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
