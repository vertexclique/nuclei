\* Four one-unit messages through two buffers of two units, filled in pieces, the ring reaping each completion as it comes:
\* every message in order, no buffer back under the kernel or a live chunk, every buffer back at the end, the cap held at
\* the minimum charge, no datagram cut.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    N = 4                \* messages the peer writes
    Total = 2            \* buffers in the group
    Size = 2             \* units in a buffer
    Cap = 2              \* units of charge a receive may hold before the ring stops it
    MinCharge = 2        \* the least a chunk counts against its receive's cap
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    CqCap = 1            \* completions the kernel may post ahead of the ring
    Datagram = FALSE     \* a stream, each message one unit
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    InOrder
    NoReuse
    BuffersBack
    CapHeld
    NoCut
