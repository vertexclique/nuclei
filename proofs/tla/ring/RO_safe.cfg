\* A task on another thread writes twice through the ring while a retire comes: every safety property.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the ring's thread loops for good; what must happen is a property
CONSTANTS
    defaultInitValue = defaultInitValue   \* the value PlusCal gives a procedure variable before its call
    Retires = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OneOut
    NoOverwrite
    SingleIssuer
    RetiredIdle
