\* Two messages read by readiness, one a read, with the kernel counting what each read leaves but not the end, the peer
\* closing after them, the kernel ending the poll once on its own: every message in order, and the reader reads the end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    N = 2                \* messages the peer writes
    Buf = 1              \* messages a read by readiness asks for
    Exact = TRUE         \* the kernel counts what a read leaves, or not
    Ends = 1             \* times the kernel may end the poll on its own
    Switch = FALSE       \* the side may switch to the receive and back, or not
    MaxSwitch = 0        \* switches at most
    Close = TRUE         \* the peer closes after its messages, its end not in the count
    Mutation = "none"   \* the rule this run takes away, if any
INVARIANTS                     \* must hold in every reachable state
    InOrder
    OneOut
PROPERTIES                     \* must hold over every behaviour
    Termination
