\* Three messages, one a read, the side switching to the multishot receive and back, twice at most, the kernel ending
\* the poll once on its own: every message in order, never both at once, and the reader gets every message.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    N = 3                \* messages the peer writes
    Buf = 1              \* messages a read by readiness asks for
    Exact = TRUE         \* the kernel counts what a read leaves, or not
    Ends = 1             \* times the kernel may end the poll on its own
    Switch = TRUE        \* the side may switch to the receive and back, or not
    MaxSwitch = 2        \* switches at most
    Close = FALSE        \* the peer does not close
    Mutation = "none"   \* the rule this run takes away, if any
INVARIANTS                     \* must hold in every reachable state
    InOrder
    OneOut
PROPERTIES                     \* must hold over every behaviour
    Termination
