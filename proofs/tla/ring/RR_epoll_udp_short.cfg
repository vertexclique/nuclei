\* UDP on epoll or kqueue, the task's buffer shorter than the second datagram: it is cut to the buffer as a success, as
\* std's receive on unix cuts it.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "poller"
    Unix = FALSE
    Ahead = TRUE
    Buf = 1              \* the task's buffer is shorter than the largest datagram
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    AsStd
    InOrder
