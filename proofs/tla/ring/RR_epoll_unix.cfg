\* Unix datagrams on epoll or kqueue, one larger than the pool's largest buffer, with looks at readability: every one received whole, in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Ring = FALSE
    Unix = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoCut
    InOrder
