\* UDP on a port, received ahead into buffers of the pool that hold the largest datagram, whatever the call asked for: every one whole, in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Unix = FALSE
    Ahead = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoCut
    InOrder
