\* UDP on a port received ahead whole, the task's buffer shorter than the second datagram: that one answers its first
\* bytes and the error WSAEMSGSIZE, as std's receive does on Windows; every datagram in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Unix = FALSE
    Ahead = TRUE
    Buf = 1              \* the task's buffer is shorter than the largest datagram
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    AsStd
    InOrder
