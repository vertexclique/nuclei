\* UDP on a port the pool has no buffer for: a zero-byte look, then the task's own receive, every datagram whole and in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Unix = FALSE
    Ahead = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoCut
    InOrder
