\* UDP on a port with no buffer in the pool, so the task receives each datagram itself once its look said one came,
\* into a buffer shorter than the second: that one answers WSAEMSGSIZE, as std's does.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Unix = FALSE
    Ahead = FALSE
    Buf = 1              \* the task's buffer is shorter than the largest datagram
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    AsStd
    InOrder
