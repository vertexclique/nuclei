\* UDP on a ring that receives no datagram ahead (its group fills buffers in pieces, or holds less than the largest datagram): the task receives each into its own buffer behind the armed poll, every one whole, in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "ring"
    Unix = FALSE
    Ahead = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoCut
    InOrder
