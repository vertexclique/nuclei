\* UDP on a ring received ahead whole, the task's buffer shorter than the second datagram: that one is cut to the
\* buffer and answered as a success, as std's receive on unix cuts it; the caller sizes the buffer.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "ring"
    Unix = FALSE
    Ahead = TRUE
    Buf = 1              \* the task's buffer is shorter than the largest datagram
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    AsStd
    InOrder
