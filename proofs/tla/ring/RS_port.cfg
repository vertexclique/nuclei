\* A port's borrowed sends from the task, as on unix: one too large and one with no route refused by their own calls,
\* the others taken in order, a full socket waited out on the port's poll for room.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "port"
    Lent = FALSE
    Stream = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OwnResult
    InOrder
