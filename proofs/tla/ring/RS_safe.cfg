\* A lent datagram whose task may go, then a refused one and one more, on a socket that starts full: each call answers its own datagram's verdict, in order.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Lent = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OwnResult
    InOrder
