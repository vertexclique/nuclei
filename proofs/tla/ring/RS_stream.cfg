\* A stream's small and large chunks on a socket that starts full: the kernel takes them in order, each write answers its own result, and no large chunk is ever copied into the write-behind.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck call is what the properties look for
CONSTANTS
    Backend = "unix"
    Lent = FALSE
    Stream = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    OwnResult
    InOrder
    NoLargeCopy
