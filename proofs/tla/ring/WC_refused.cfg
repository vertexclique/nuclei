\* WITNESS: the kernel refuses a take-out from the table and the take-out is tried again. Expected: NoRefusal broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for, or the property catches it
CONSTANTS
    Table = TRUE         \* a fixed file of the ring's table
    Here = TRUE          \* dropped on the ring's own thread
    Busy = FALSE         \* the kernel takes every entry at once
    UpdateFails = TRUE   \* the kernel refuses the first take-out from the table
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoRefusal
