\* WITNESS: a message comes straight into a lent buffer. Expected: NoLentGot broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    N = 3                \* messages the peer writes
    Total = 3            \* buffers in the group
    Cap = 1              \* buffers a receive may hold before the ring stops it
    Burst = 1            \* arrivals the kernel may make before a cancel takes it
    Lent = TRUE          \* lent reads after the first
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoLentGot
