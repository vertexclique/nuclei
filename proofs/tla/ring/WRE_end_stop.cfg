\* WITNESS: the ring finds the end queued at an arrival and stops the receive, so the window the
\* fix is for is reached. Expected: NoEndStop broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    B = 1                \* one piece before the end
    SqPoll = FALSE       \* the enter that hands an entry over issues it
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoEndStop
