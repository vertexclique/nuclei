\* the old runner in a wait no signal ends for good. Its completion runs only on that thread, and the
\* reader waits for it as long. Expected: IoRescued broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
