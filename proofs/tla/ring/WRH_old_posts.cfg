\* WITNESS: the old runner, asleep where a signal wakes it, posts a completion of its old request
\* after the take, which the new runner reaps. Expected: NoOldPost broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the runners wait for good once nothing is left: the properties say what must happen
CONSTANTS
    Block = "interruptible"           \* how the old runner waits
    Ends = FALSE                      \* whether its wait ends
    Kind = "poll"                     \* the request it armed
    Mutation = "none"                 \* the rule taken away, if any
INVARIANTS                     \* must hold in every reachable state
    NoOldPost
