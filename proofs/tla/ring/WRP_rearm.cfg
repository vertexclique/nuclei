\* WITNESS: the kernel ends the poll on its own and the next wait arms another. Expected: NoRearm broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    N = 3                \* messages the peer writes
    Buf = 1              \* messages a read by readiness asks for
    Exact = TRUE         \* the kernel counts what a read leaves, or not
    Ends = 1             \* times the kernel may end the poll on its own
    Switch = FALSE       \* the side may switch to the receive and back, or not
    MaxSwitch = 0        \* switches at most
    Close = FALSE        \* the peer does not close
    Mutation = "none"   \* the rule this run takes away, if any
INVARIANTS                     \* must hold in every reachable state
    NoRearm
