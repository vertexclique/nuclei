\* One task reads three times past a waiting writer: the writer is owed a
\* handoff in the end; every safety property, every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- BargeWriter
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
