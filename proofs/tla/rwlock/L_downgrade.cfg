\* A write downgraded to a read while another task reads: every safety property,
\* every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- DowngradeRead
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
