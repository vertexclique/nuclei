\* A write downgraded to a read that is held until the other task reads beside it: the
\* downgrade tells the waiting reader, which enters, and both end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- DowngradeHoldRead
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
    OwedSettled
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
