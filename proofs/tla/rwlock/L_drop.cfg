\* A write dropped while two tasks read, a handoff owed from the first loss:
\* every safety property. (Three tasks: too many states to check the ending
\* too; L_drop_live does, with two.)
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- DropWrite
    MaxBypass = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
