\* A write dropped while a task reads, a handoff owed from the first loss: every
\* safety property, every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- DropWriteTwo
    MaxBypass = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
