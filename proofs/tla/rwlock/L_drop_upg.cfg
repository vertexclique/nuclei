\* An upgradable read dropped while it waits for another: it leaves the line, nothing is
\* left behind, and every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- DropUpg
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
    OwedSettled
    ReadersBounded
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
