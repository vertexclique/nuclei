\* Two readers on a lock that admits one at a time: the second waits for the first, never
\* two inside, and both end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- ReadRead
    MaxBypass = 2
    MaxReaders = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
    OwedSettled
    ReadersBounded
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
