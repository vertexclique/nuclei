\* An upgradable read against a writer: the writer waits for the upgradable read to go,
\* every safety property holds, both end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- UpgWrite
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
    OwedSettled
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
