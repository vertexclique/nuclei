\* An upgrade dropped while it waits for the reader inside: its node goes, the upgradable
\* read and UPGRADING go with it, the reads held back behind UPGRADING get in, and every
\* task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- UpgradeDropRead
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
    OwedSettled
    ReadersBounded
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
