\* An upgrade waiting for the other task's read, that task then asking for the write: the
\* last reader out tells the upgrade, the write queues behind it, and every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- UpgradeReadWrite
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
    OwedSettled
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
