\* An upgrade waiting for a reader with a writer queued as well: the last reader out tells
\* the upgrade, which takes the write before the queued writer; every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Prog <- UpgradeReadWrite
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    StateMatches
    Exclusion
    NoReaderWhileUpgrading
    NoUpgradeOverReaders
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    FreeAtEnd
    OwedSettled
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
