\* MUTATION absorb_after_sweep: the pass counts the owed marks of the withdrawn nodes it lets go
\* by looking at the waiting list after it swept it, where none is left, so a write that was owed
\* a handoff and withdrew while on the list stays counted owed for good. Expected: OwedSettled
\* broken. The readers keep getting in past the write until it is owed (a bypass bound of one is
\* reached at the first loss), then the write is dropped while its node is on the list, and every
\* task ends with the owed count still at one. The two readers run the same program, so a state
\* and the same state with them swapped are one state to TLC (SYMMETRY): the search meets every
\* state up to the readers' names, about half as many, and so the bug.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- DropWriteNamed     \* two readers and a write dropped at its first wait (MC_RwLockSym)
    MaxBypass = 1               \* owed at the first loss
    Mutation = "absorb_after_sweep"
    t1 = t1                    \* the task names, model values
    t2 = t2
    t3 = t3
SYMMETRY ReadersSwapped        \* both namings of the two readers are one state (MC_RwLockSym.tla)
INVARIANTS                     \* must hold in every reachable state
    OwedSettled
