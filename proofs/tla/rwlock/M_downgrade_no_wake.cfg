\* MUTATION downgrade_no_wake: a downgrade leaves the queued reader asleep. The downgraded
\* holder waits for that reader to join it, and the reader waits for a pass that never
\* comes. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- DowngradeHoldRead
    MaxBypass = 2
    Mutation = "downgrade_no_wake"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
