\* MUTATION exit_ignores_wake_front: the drain gives its role up over a release's request to
\* wake the front, which came while it passed; that release asked nothing more, and the
\* front sleeps for good. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- ReadWrite
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "exit_ignores_wake_front"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
