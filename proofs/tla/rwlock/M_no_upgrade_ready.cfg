\* MUTATION no_upgrade_ready: the last reader out does not tell the waiting upgrade. With a
\* nudge out to the queued writer, its release asks for no pass, and the upgrade waits for
\* good. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- UpgradeReadWrite
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "no_upgrade_ready"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
