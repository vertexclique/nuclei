\* MUTATION read_ignores_upgrading: a read enters while an upgrade is under way.
\* Expected: NoReaderWhileUpgrading broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- UpgradeRead
    MaxBypass = 2
    Mutation = "read_ignores_upgrading"
INVARIANTS                     \* must hold in every reachable state
    NoReaderWhileUpgrading
