\* MUTATION readers_unbounded: a read enters past the reader bound. Expected:
\* ReadersBounded broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- ReadRead
    MaxBypass = 2
    MaxReaders = 1
    Mutation = "readers_unbounded"
INVARIANTS                     \* must hold in every reachable state
    ReadersBounded
