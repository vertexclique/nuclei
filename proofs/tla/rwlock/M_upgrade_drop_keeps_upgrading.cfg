\* MUTATION upgrade_drop_keeps_upgrading: a dropped upgrade leaves UPGRADING up. Every read
\* after it waits for an upgrade that no longer exists. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- UpgradeDropRead
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "upgrade_drop_keeps_upgrading"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
