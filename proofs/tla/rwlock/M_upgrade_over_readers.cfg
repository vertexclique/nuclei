\* MUTATION upgrade_over_readers: a pass grants the upgrade with a reader inside.
\* Expected: NoUpgradeOverReaders broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- UpgradeRead
    MaxBypass = 2
    Mutation = "upgrade_over_readers"
INVARIANTS                     \* must hold in every reachable state
    NoUpgradeOverReaders
