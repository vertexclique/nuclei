\* MUTATION write_ignores_upgradable: a write enters while an upgradable read holds the lock.
\* Expected: Exclusion broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Prog <- UpgWrite
    MaxBypass = 2
    MaxReaders = 3
    Mutation = "write_ignores_upgradable"
INVARIANTS                     \* must hold in every reachable state
    Exclusion
