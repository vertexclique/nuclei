\* The same with a block_on future, woken and waking itself as it likes: it and every place
\* are served within 2I - 1 turns.
SPECIFICATION Spec              \* the algorithm, the loop weakly fair
CONSTANTS
    I = 3                \* the inbox interval
    L = 2                \* the slot's runs in a row
    Cap = 2              \* the local queue holds two runnables at most
    Future = TRUE        \* a block_on future runs the loop
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Served
