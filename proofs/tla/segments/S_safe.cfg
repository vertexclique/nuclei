\* Two producers of two values each, one cell a segment: nothing freed is read, the tail pointer stays live, no walk passes its segment, every value taken once and only once written, a retired segment empty, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process but kovan weakly fair
CONSTANTS
    Producers = {"p1", "p2"}
    Pushes = 2
    Seg = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoFreedTouch
    TailLive
    WalkInBounds
    TakenOnce
    RetiredEmpty
