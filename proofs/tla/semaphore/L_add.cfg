\* A lock on a semaphore with no permits, against add_permits(1): the added permit reaches
\* the waiter, every safety property holds, and both end.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 0
    Prog <- AddWait
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    PermitsBackAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
