\* A mutex: one task gives up its wait while two lock, a handoff owed from the
\* first loss: every safety property. (Three tasks: too many states to check
\* the ending too; L_cancel_live does, with two.) The two that lock run the same
\* program from the same start and no property names one of them, so a state and
\* the same state with the two swapped are one state to TLC (SYMMETRY): every
\* state is still checked, up to the lockers' names, about half as many of them.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 1
    Prog <- MutexCancelNamed   \* MutexCancel, its tasks named t1, t2, t3
    Closer = FALSE
    MaxBypass = 1
    Mutation = "none"
    t1 = t1                    \* the task names, model values
    t2 = t2
    t3 = t3
SYMMETRY LockersSwapped        \* both namings of the two lockers are one state (MC_SemaphoreSym.tla)
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
