\* A mutex: one task gives up its wait while two lock, a handoff owed from the
\* first loss: every safety property. (Three tasks: too many states to check
\* the ending too; L_cancel_live does, with two.)
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 1
    Prog <- MutexCancel
    Closer = FALSE
    MaxBypass = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
