\* A lock against a waiter dropped at its first wait, the sweep running only now and then
\* as `List::tidy` does: a withdrawn node, an owed one too, may stay linked across passes,
\* and every safety property holds and every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 1
    Prog <- MutexDrop
    Closer = FALSE
    MaxBypass = 1
    TidyMaybe = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
