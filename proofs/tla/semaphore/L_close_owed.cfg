\* A barging task, a waiter that may come to be owed a handoff, and the close at any
\* moment: the close grants an owed waiter the close too, its owed mark settled, and every
\* safety property holds.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 1
    Prog <- MutexBarge
    Closer = TRUE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
