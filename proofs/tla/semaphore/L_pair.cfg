\* A mutex: two tasks lock twice each: every safety property, every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 1
    Prog <- MutexPair
    Closer = FALSE
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
