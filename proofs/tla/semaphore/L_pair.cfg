\* A mutex: two tasks lock twice each: every safety property. (Two tasks locking
\* twice: too many states to check the ending too; L_pair_live does, with one
\* task locking twice and the other once.) The two run the same program from the
\* same start and no property names one of them, so a state and the same state
\* with the two swapped are one state to TLC (SYMMETRY): every state is still
\* checked, up to the tasks' names, about half as many of them.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 1
    Prog <- MutexPairNamed     \* MutexPair, its tasks named t1, t2
    Closer = FALSE
    MaxBypass = 2
    Mutation = "none"
    t1 = t1                    \* the task names, model values (t3 unused here)
    t2 = t2
    t3 = t3
SYMMETRY PairSwapped           \* both namings of the two tasks are one state (MC_SemaphoreSym.tla)
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
