\* A mutex: one task locks twice and another once: every safety property, every
\* task ends, no deadlock. The ending of L_pair's scenario, one lock smaller: the
\* second lock still competes with a waiter that was nudged, which can lose to it
\* and wait again, which is what a release that asks for no pass leaves waiting
\* for good (M_release_no_pass breaks AllTasksEnd here too).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 1
    Prog <- PairOneTwo
    Closer = FALSE
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
