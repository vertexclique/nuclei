\* A lock of both permits given back one, then the other, against a single lock and a
\* forget_permits(1) on three permits (two are left for the lock of two): no permit is made
\* up or lost, and every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 3
    Prog <- SplitForget
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    PermitsBackAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
