\* Two permits: a request for both behind requests for one: every safety
\* property, every task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Permits = 2
    Prog <- Weighted
    Closer = FALSE
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    MutualExclusion
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    NoAdmitAfterClose
    PermitsBackAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
