\* A weighted wait for both permits, dropped at its first wait, against two single locks:
\* whatever it was set aside or granted goes back, every safety property holds, and every
\* task ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 2
    Prog <- WeightedDrop
    Closer = FALSE
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    BypassBounded
    NoBargePastOwed
    NoStrandedArrival
    PermitsBackAtEnd
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
