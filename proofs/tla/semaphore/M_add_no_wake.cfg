\* MUTATION add_no_wake: add_permits adds the permit and asks for no pass. The queued waiter
\* sleeps beside a free permit for good. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 0
    Prog <- AddWait
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "add_no_wake"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
