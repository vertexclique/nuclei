\* MUTATION close_admits: a caller's attempt ignores the closed bit.
\* Expected: NoAdmitAfterClose broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexTwo
    Closer = TRUE
    MaxBypass = 2
    Mutation = "close_admits"
INVARIANTS                     \* must hold in every reachable state
    NoAdmitAfterClose
