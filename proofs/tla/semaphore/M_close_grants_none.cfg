\* MUTATION close_grants_none: the close's pass grants no waiter. The waiter queued behind the
\* holder is never granted the close, and the closed semaphore admits nobody: it sleeps for
\* good. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexTwo
    Closer = TRUE
    MaxBypass = 2
    Mutation = "close_grants_none"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
