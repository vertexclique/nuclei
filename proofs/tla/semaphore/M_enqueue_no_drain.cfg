\* MUTATION enqueue_no_drain: an enqueue raises QUEUED without claiming the drain role or
\* marking its holder dirty. With the role free, its node sits on the arrival stack.
\* Expected: NoStrandedArrival broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexTwo
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "enqueue_no_drain"
INVARIANTS                     \* must hold in every reachable state
    NoStrandedArrival
