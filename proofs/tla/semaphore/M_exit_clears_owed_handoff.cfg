\* MUTATION exit_clears_owed_handoff: the drain lowers HANDOFF on its way out with a waiter
\* still owed. Barging opens again and the owed waiter loses past the bound. Expected:
\* BypassBounded broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexBarge4
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "exit_clears_owed_handoff"
INVARIANTS                     \* must hold in every reachable state
    BypassBounded
