\* MUTATION exit_ignores_dirty: the drain gives its role up over a change made
\* during its pass. Expected: NoStrandedArrival broken (a waiter that queued
\* meanwhile is left on the arrival stack with nobody to take it in).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexCancel
    Closer = FALSE
    MaxBypass = 2
    Mutation = "exit_ignores_dirty"
INVARIANTS                     \* must hold in every reachable state
    NoStrandedArrival
