\* MUTATION exit_ignores_wake: the drain gives its role up over a release's request to wake the
\* front, which came while it passed. That release asked nothing more, so the front sleeps
\* for good. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexTwo
    Closer = FALSE
    MaxBypass = 2
    Mutation = "exit_ignores_wake"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
