\* MUTATION finish_keeps_marker: a waiter granted by the handoff leaves NUDGE_OUT up. The
\* releases that follow see the marker with no handoff owed and ask for no pass, so a waiter
\* behind sleeps for good. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexBarge4
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "finish_keeps_marker"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
