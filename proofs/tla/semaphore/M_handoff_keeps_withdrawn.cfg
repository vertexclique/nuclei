\* MUTATION handoff_keeps_withdrawn: a node that withdrew as the handoff granted it drops the
\* permits set aside for it instead of giving them back. One task locks twice, so the other, which
\* waits and may drop its wait, loses a retry and is owed the handoff; it withdraws at the grant,
\* and the permit is gone for good. Expected: Conservation broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Permits = 1
    Prog <- LockTwiceDrop      \* one task locks twice, the other waits and may drop
    Closer = FALSE
    MaxBypass = 1              \* the first lost retry makes a waiter owed
    TidyMaybe = FALSE
    Mutation = "handoff_keeps_withdrawn"
INVARIANTS                     \* must hold in every reachable state
    Conservation
