\* MUTATION handoff_keeps_withdrawn: a handoff to a front that withdrew at that very grant
\* drops the permits with the node. Expected: Conservation broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexBarge4
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "handoff_keeps_withdrawn"
INVARIANTS                     \* must hold in every reachable state
    Conservation
