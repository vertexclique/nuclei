\* MUTATION keep_grant: a waiter that leaves keeps what a grant gave it.
\* Expected: PermitsBackAtEnd broken. Two tasks are enough for the leak: the one
\* that locks twice barges past the waiter, whose last allowed loss raises the
\* handoff; the waiter then leaves, and the pass grants it the permit as it goes.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- LockTwiceDrop
    Closer = FALSE
    MaxBypass = 1
    Mutation = "keep_grant"
INVARIANTS                     \* must hold in every reachable state
    PermitsBackAtEnd
