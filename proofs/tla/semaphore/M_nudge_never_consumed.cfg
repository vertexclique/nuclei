\* MUTATION nudge_never_consumed: a nudged waiter leaves NUDGE_OUT up as it retries. It loses
\* to the barging task and sleeps; that task's releases see the marker and ask for no pass,
\* so the waiter sleeps for good. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexBarge
    Closer = FALSE
    MaxBypass = 2
    TidyMaybe = FALSE
    Mutation = "nudge_never_consumed"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
