\* MUTATION owe_without_handoff: the last allowed loss raises no handoff.
\* Expected: BypassBounded broken (the waiter keeps losing).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexBarge4
    Closer = FALSE
    MaxBypass = 2
    Mutation = "owe_without_handoff"
INVARIANTS                     \* must hold in every reachable state
    BypassBounded
