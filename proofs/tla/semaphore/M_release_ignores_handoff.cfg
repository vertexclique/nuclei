\* MUTATION release_ignores_handoff: a release that sees a nudge out asks for no pass even
\* though a handoff is owed. The owed waiter, past barging, waits for a pass that never
\* comes. Expected: AllTasksEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexBarge4
    Closer = FALSE
    MaxBypass = 2
    Mutation = "release_ignores_handoff"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
