\* MUTATION release_no_pass: a release never asks for a pass.
\* Expected: AllTasksEnd broken (a waiter is never nudged).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexTwo
    Closer = FALSE
    MaxBypass = 2
    Mutation = "release_no_pass"
PROPERTIES                     \* must hold of every behaviour
    AllTasksEnd
