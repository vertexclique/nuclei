\* MUTATION try_ignores_handoff: a caller's attempt takes past an owed handoff.
\* Expected: NoBargePastOwed broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexBarge4
    Closer = FALSE
    MaxBypass = 2
    Mutation = "try_ignores_handoff"
INVARIANTS                     \* must hold in every reachable state
    NoBargePastOwed
