\* WITNESS: a waiter that leaves gives back what a grant gave it.
\* Expected: NoGrantGivenBack broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexCancel
    Closer = FALSE
    MaxBypass = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoGrantGivenBack
