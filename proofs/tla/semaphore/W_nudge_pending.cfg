\* WITNESS: a nudge finds its waiter still carrying the last one, and keeps the
\* marker up. Expected: NoNudgePending broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Permits = 1
    Prog <- MutexPair
    Closer = FALSE
    MaxBypass = 2
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoNudgePending
