\* MUTATION empty_peek: a look at the next datagram's sender peeks into an empty buffer, as the code did. macOS's
\* kernel names no sender for it, and a socket connected to nothing has no peer to name instead, so the look
\* answers an error. Expected: PeeksName broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Total = 3            \* datagrams the peer sends
    Empty = FALSE        \* receives into buffers with room: the kernel names the sender
    Connected = FALSE    \* a socket connected to nothing
    Mutation = "empty_peek"
INVARIANTS                     \* must hold in every reachable state
    PeeksName
