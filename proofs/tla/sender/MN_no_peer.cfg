\* MUTATION no_peer: a receive into an empty buffer, for which macOS's kernel names no sender, answers an error, as
\* the code did, though the socket is connected and the kernel names its peer. The datagram the kernel handed over
\* is gone. Expected: Conservation broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Total = 3            \* datagrams the peer sends
    Empty = TRUE         \* receives into an empty buffer: the kernel names no sender
    Connected = TRUE     \* the socket is connected to the peer
    Mutation = "no_peer"
INVARIANTS                     \* must hold in every reachable state
    Conservation
