\* macOS: three datagrams received into an empty buffer, for which the kernel names no sender, on a socket connected
\* to the peer, while the process runs out of descriptors and gets them back: the peer the kernel names is the
\* sender, so none is lost, they come in order, and every look at a sender names one.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Total = 3            \* datagrams the peer sends
    Empty = TRUE         \* receives into an empty buffer: the kernel names no sender
    Connected = TRUE     \* the socket is connected to the peer
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    Order
    PeeksName
