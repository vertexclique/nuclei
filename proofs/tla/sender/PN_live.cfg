\* Liveness: under weak fairness the task receives every datagram and every process ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Total = 3            \* datagrams the peer sends
    Empty = FALSE        \* receives into buffers with room: the kernel names the sender
    Connected = FALSE    \* a socket connected to nothing
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    Termination
