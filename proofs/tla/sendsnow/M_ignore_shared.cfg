\* MUTATION ignore_shared: the owner's look leaves out the side's mode. A side made shared has no
\* `intent` to raise: the foreign writer holds it with the second part of its write left in the
\* side and its bit still in its buffer, the owner sends on its own stale bit, and its byte lands
\* between the two parts. Expected: Contiguous broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = FALSE       \* the side starts shared
    Foreign = TRUE       \* the foreign writer makes its owned write
    Mutation = "ignore_shared"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    Contiguous
