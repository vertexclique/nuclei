\* The owner alone on a biased side: its bytes go out in order, on the bit once a release said
\* the side holds nothing, through its poll while bytes wait in the side.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Foreign = FALSE      \* no foreign writer
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Contiguous
    InOrder
PROPERTIES                     \* must hold over every behaviour
    AllSent
