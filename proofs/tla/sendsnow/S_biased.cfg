\* A biased side and a foreign owned write of two parts: no byte of the owner lands between them,
\* though the foreign writer's bit may sit in its store buffer.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = TRUE        \* the side starts biased to its owner
    Foreign = TRUE       \* the foreign writer makes its owned write
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Contiguous
    InOrder
PROPERTIES                     \* must hold over every behaviour
    AllSent
