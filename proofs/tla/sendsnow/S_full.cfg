\* The owner's straight send finds the socket full, with no take: its poll blocks the side on that
\* answer, as no driver runs during the poll. The side waits only for an edge that is owed or
\* queued, and the byte goes out in the end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Handoffs = 0                   \* no take
    Mutation = "none"              \* no rule taken away
INVARIANTS                      \* must hold in every reachable state
    BlockedOwed
PROPERTIES                      \* must hold over every behaviour
    Sent
