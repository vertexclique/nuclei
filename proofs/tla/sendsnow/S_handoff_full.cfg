\* The owner's straight send finds the socket full, and the shard may be taken before the rest of
\* the poll, its new thread's driver passing over the edge the refusal owed: the poll's way of any
\* thread asks the kernel again. The side waits only for an edge that is owed or queued, and the
\* byte goes out in the end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Handoffs = 1                   \* one take, between the poll's calls
    Mutation = "none"              \* no rule taken away
INVARIANTS                      \* must hold in every reachable state
    BlockedOwed
PROPERTIES                      \* must hold over every behaviour
    Sent
