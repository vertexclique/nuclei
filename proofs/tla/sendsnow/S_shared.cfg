\* A side shared from the start (no heavy fence in the process), the foreign writer taking its
\* word at once: the owner never sends on the bit, and the owned write stays whole.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Biased = FALSE       \* the side starts shared
    Foreign = TRUE       \* the foreign writer makes its owned write
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Contiguous
    InOrder
PROPERTIES                     \* must hold over every behaviour
    AllSent
