\* Liveness: every task that waits is served or dropped, and every task ends.
SPECIFICATION Spec              \* every task, weakly fair
CHECK_DEADLOCK FALSE           \* a stuck task is what the property catches
CONSTANTS
    Needs <- NeedsMixed    \* b needs 2, a and c need 1
    Cancels = {"b"}         \* b's acquire may be dropped
    Tries = {}             \* nobody only tries
    Mutation = "none"      \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
