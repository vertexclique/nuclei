\* A task that needs both permits between two that need one, the big one droppable: every safety property, and no deadlock.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsMixed    \* b needs 2, a and c need 1
    Cancels = {"b"}         \* b's acquire may be dropped
    Tries = {}             \* nobody only tries
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
