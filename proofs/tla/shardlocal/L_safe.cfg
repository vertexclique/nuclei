\* Two tasks that need both permits and one that needs one, the second's acquire droppable at any point: every safety property, and no deadlock.
SPECIFICATION Spec              \* every task, weakly fair
CONSTANTS
    Needs <- NeedsBig      \* a and b need 2, c needs 1
    Cancels = {"b"}         \* b's acquire may be dropped
    Tries = {}             \* nobody only tries
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Safe
