\* MUTATION no_bracket: `with` takes the value without coming back into the shard (no store of the
\* word, no look at the claim). Expected: DetachedNeverHolds broken. The monitor takes S while A
\* is outside in its task's poll; A's `with`, which never looks at the claim, still finds S and
\* holds its value on a thread S was taken from. One poll with one `with` is enough.
SPECIFICATION Spec              \* every behaviour from the start
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    MaxPolls = 1               \* A makes one poll
    MaxWiths = 1               \* with one call of `with`
    Nested = FALSE             \* no nested `block_on`
    Mode = "no_bracket"        \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    DetachedNeverHolds
