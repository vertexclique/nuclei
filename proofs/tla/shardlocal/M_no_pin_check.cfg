\* MUTATION no_pin_check: the monitor takes without looking at the pins. Expected: ExclusiveValue
\* broken. A's `with` holds the value and runs a nested `block_on`, whose poll goes outside; the
\* monitor sees that word, claims, finds it unchanged and takes S; B runs S and its `with` gets
\* the value A still holds. One poll with one nested `with` is enough for that order.
SPECIFICATION Spec              \* every behaviour from the start
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    MaxPolls = 1               \* A makes one poll
    MaxWiths = 1               \* with one call of `with`
    Nested = TRUE              \* which nests a `block_on`
    Mode = "no_pin_check"      \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    ExclusiveValue
