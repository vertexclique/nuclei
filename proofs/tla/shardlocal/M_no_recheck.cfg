\* MUTATION no_recheck: the monitor looks at the pins but does not read the word again after its
\* claim. Expected: ExclusiveValue broken. The monitor sees A outside; A's `with` comes back in and
\* finds no claim, and has not pinned yet; the monitor claims, finds no pin and takes S; A pins and
\* holds the value, and so does B's `with` on S. The pin alone does not keep the shard: the second
\* read of the word is what catches a `with` between its way back in and its pin. One poll with
\* one `with` is enough.
SPECIFICATION Spec              \* every behaviour from the start
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    MaxPolls = 1               \* A makes one poll
    MaxWiths = 1               \* with one call of `with`
    Nested = FALSE             \* no nested `block_on`
    Mode = "no_recheck"        \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    ExclusiveValue
