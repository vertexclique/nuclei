\* MUTATION per_thread: the value is kept per thread (a thread-local) instead of in the shard.
\* Expected: OneValuePerShard broken. A's `with` gets A's value; the monitor hands S to B; B's
\* `with` on the same shard gets another one, B's. One poll with one `with` is enough.
SPECIFICATION Spec              \* every behaviour from the start
CHECK_DEADLOCK FALSE           \* a run that is over is no deadlock
CONSTANTS
    MaxPolls = 1               \* A makes one poll
    MaxWiths = 1               \* with one call of `with`
    Nested = FALSE             \* no nested `block_on`
    Mode = "per_thread"        \* the rule taken away
INVARIANTS                     \* must hold in every reachable state
    OneValuePerShard
