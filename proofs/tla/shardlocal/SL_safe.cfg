\* Thread A's tasks call `with` on shard S, once with a nested `block_on` whose poll goes outside,
\* while the monitor may take S and hand it to B, whose task calls `with` too: at most one thread
\* holds the value, every `with` gets S's own, and a thread whose shard was taken never holds it.
\* Why this size is enough: two polls give the monitor a word of one poll to compare with the
\* next one's; two calls of `with` give one that ends before a take and one a take meets (refused,
\* or answered the access error); the nested poll is the one way A holds the value outside the
\* shard; one handoff, as B is the only spare and nobody watches B's fresh slot.
SPECIFICATION Spec              \* every behaviour from the start
CHECK_DEADLOCK FALSE           \* a run that is over (every poll made, the handoff given) is no deadlock
CONSTANTS
    MaxPolls = 2               \* A makes two polls
    MaxWiths = 2               \* A's task code calls `with` twice in all
    Nested = TRUE              \* a `with` may nest a `block_on`
    Mode = "ok"                \* the code as it is
INVARIANTS                     \* must hold in every reachable state
    ExclusiveValue
    OneValuePerShard
    DetachedNeverHolds
