\* MUTATION own_flag: a close after the first answers Ok from the side's own note that it shut, without asking
\* the kernel, as the code did. On macOS the kernel says ENOTCONN to that shutdown, and std's shutdown with it,
\* so the close answers something std never does. Expected: AsTheKernel broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the closes
    Closes = 2           \* closes the task makes
    Platform = "macos"   \* a second shutdown is answered ENOTCONN
    Mutation = "own_flag"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    AsTheKernel
