\* MUTATION shut_first: a close shuts the writing half without waiting for the write-behind. The FIN goes ahead
\* of bytes the task wrote before it, and the kernel refuses those bytes once the half is shut, so the peer
\* sees the stream end short. Expected: FinLast broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 2            \* bytes written before the closes
    Closes = 1           \* closes the task makes
    Platform = "linux"   \* either kernel: the bytes are lost on both
    Mutation = "shut_first"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    FinLast
