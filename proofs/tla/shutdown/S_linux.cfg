\* Linux: two bytes written behind, then three closes. Every close waits for the bytes and asks the kernel,
\* which says Ok each time; the FIN follows both bytes, none is refused, and the task makes every close.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Bytes = 2            \* bytes written before the closes
    Closes = 3           \* closes the task makes
    Platform = "linux"   \* a second shutdown is answered Ok
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    AsTheKernel
    FinLast
    NoneLost
PROPERTIES                     \* must hold over every behaviour
    Termination
