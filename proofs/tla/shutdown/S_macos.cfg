\* macOS: two bytes written behind, then three closes. The kernel answers the second and third ENOTCONN, and
\* so does each close, as std's would; the FIN follows both bytes, none is refused, every close is made.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Bytes = 2            \* bytes written before the closes
    Closes = 3           \* closes the task makes
    Platform = "macos"   \* a second shutdown is answered ENOTCONN
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    AsTheKernel
    FinLast
    NoneLost
PROPERTIES                     \* must hold over every behaviour
    Termination
