\* WITNESS: on macOS a close after the first is answered ENOTCONN, which the run must reach to show it checks
\* that answer at all. Expected: NoRefusedClose broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    Bytes = 1            \* bytes written before the closes
    Closes = 2           \* closes the task makes
    Platform = "macos"   \* a second shutdown is answered ENOTCONN
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoRefusedClose
