\* MUTATION ignore_leases: the close drops the object though a job's lease is out, so the job's call runs on a
\* descriptor that closed (or that another file took). Expected: NoUseOfClosed broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    defaultInitValue = defaultInitValue   \* the value PlusCal gives a procedure variable before its call
    Mutation = "ignore_leases"
INVARIANTS                     \* must hold in every reachable state
    NoUseOfClosed
