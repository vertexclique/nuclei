\* MUTATION displace_no_wake: the waker a registration displaces is dropped, not woken; its task sleeps for
\* good. Expected: AllTook broken.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a task that sleeps for good is what the property catches
CONSTANTS
    Readers = 3                \* tasks that poll the side
    Slots = 1                  \* slots of the contended set
    Mutation = "displace_no_wake"
PROPERTIES                     \* must hold over every behaviour
    AllTook
