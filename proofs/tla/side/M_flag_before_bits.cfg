\* MUTATION flag_before_bits: the deferrer raises DEFER before its bits are in the deferred word. The holder's
\* release takes the flag, finds the word empty and lets go; the bits land after, and nobody does the work.
\* Expected: DeferDone broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Total = 1            \* bytes that arrive
    Defers = TRUE        \* another thread leaves side-local work once
    Panics = FALSE       \* no step panics
    Mutation = "flag_before_bits"
PROPERTIES                     \* must hold over every behaviour
    DeferDone
