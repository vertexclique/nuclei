\* MUTATION release_ignores_waiting: the holder takes WAITING and wakes nobody. Expected: a deadlock (a contended reader never woken).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Total = 2            \* bytes that arrive
    Defers = FALSE       \* no side-local work left
    Panics = FALSE       \* no step panics
    Mutation = "release_ignores_waiting"
