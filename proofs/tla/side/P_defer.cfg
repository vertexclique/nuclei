\* Two bytes, and side-local work left once by another thread (a buffer back, a completion): every safety
\* property, the work done whoever holds the side, and every thread finishes.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Total = 2            \* bytes that arrive
    Defers = TRUE        \* another thread leaves side-local work once
    Panics = FALSE       \* no step panics
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    Exclusive
PROPERTIES                     \* must hold over every behaviour
    DeferDone
    Termination
