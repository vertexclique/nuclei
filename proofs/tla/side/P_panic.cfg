\* Two bytes, work deferred once, and the reader's step panicking once under the guard: the guard's drop leaves
\* the work others left in the word, and the next holder does it; every safety property, the work done, and every
\* thread finishes.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Total = 2            \* bytes that arrive
    Defers = TRUE        \* another thread leaves side-local work once
    Panics = TRUE        \* the reader's step panics once
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    Exclusive
PROPERTIES                     \* must hold over every behaviour
    DeferDone
    Termination
