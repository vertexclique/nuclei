\* Three bytes: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Total = 3            \* bytes that arrive
    Defers = FALSE       \* no side-local work left
    Panics = FALSE       \* no step panics
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Conservation
    Exclusive
