\* Four tasks and two slots: as WS_three_one with free slots first.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a task that sleeps for good is what the property catches
CONSTANTS
    Readers = 4                \* tasks that poll the side
    Slots = 2                  \* slots of the contended set
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    AllTook
