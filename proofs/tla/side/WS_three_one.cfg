\* Three tasks and one slot: every registration past the first displaces the last, whose task is woken and
\* polls again; every task takes the side in the end.
SPECIFICATION Spec              \* the algorithm, every task weakly fair
CHECK_DEADLOCK FALSE           \* a task that sleeps for good is what the property catches
CONSTANTS
    Readers = 3                \* tasks that poll the side
    Slots = 1                  \* slots of the contended set
    Mutation = "none"
PROPERTIES                     \* must hold over every behaviour
    AllTook
