\* MUTATION count_before_flag: the retire reads the count before it raises its flag, and goes by that read. The owner's
\* count + 1 is still in its buffer, so the retire reads zero and lets the object go while the kernel holds the operation.
\* (Reading one instead, it sleeps on a wake the last op_done may already have missed.) Expected: FreedAfterOps broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    OpsA = 1                       \* operations ring A may submit
    OpsB = 0                       \* operations ring B may submit (no move here)
    Rehome = FALSE                 \* whether the source moves to ring B
    Mutation = "count_before_flag" \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    FreedAfterOps
