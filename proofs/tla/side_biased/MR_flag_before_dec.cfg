\* MUTATION flag_before_dec: op_done reads the retire's flag before its decrement, not after. It reads the flag down; the
\* retire then raises it, fences and still sees one operation out, and sleeps; the decrement to zero wakes nobody.
\* Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    OpsA = 1                       \* operations ring A may submit
    OpsB = 0                       \* operations ring B may submit (no move here)
    Rehome = FALSE                 \* whether the source moves to ring B
    Mutation = "flag_before_dec"   \* the rule taken away, if any
PROPERTIES                      \* must hold over every behaviour
    Termination
