\* MUTATION no_fence: the retire raises its flag and reads the count with no heavy fence between. The owner's count + 1 is
\* still in its buffer while the kernel holds the operation, so the retire reads zero and lets the object go. (It also loses
\* the wake: a retire that reads the count stale and sleeps is missed by the op_done that read the flag before it landed.)
\* Expected: FreedAfterOps broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    OpsA = 1                       \* operations ring A may submit
    OpsB = 0                       \* operations ring B may submit (no move here)
    Rehome = FALSE                 \* whether the source moves to ring B
    Mutation = "no_fence"          \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    FreedAfterOps
