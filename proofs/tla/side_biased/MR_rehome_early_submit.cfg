\* MUTATION rehome_early_submit: ring B submits as soon as the source is its, before the count reaches zero. Its plain
\* count + 1 and ring A's plain count - 1 race, and one store overwrites the other. Expected: NoLostUpdate broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    OpsA = 1                       \* operations ring A may submit
    OpsB = 1                       \* operations ring B may submit once the source is its
    Rehome = TRUE                  \* whether the source moves to ring B
    Mutation = "rehome_early_submit" \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    NoLostUpdate
