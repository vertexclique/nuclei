\* MUTATION rehome_no_fence: ring B's wait reads the count with no heavy fence after its flag. Ring A's count + 1 is still in
\* its buffer, so ring B reads zero and takes the count over; ring A's completion then counts down a count ring B writes.
\* Expected: NoLostUpdate broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run names the property the bug breaks
CONSTANTS
    OpsA = 1                       \* operations ring A may submit
    OpsB = 1                       \* operations ring B may submit once the source is its
    Rehome = TRUE                  \* whether the source moves to ring B
    Mutation = "rehome_no_fence"   \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    NoLostUpdate
