\* MUTATION foreign_stays_biased: a foreign thread that reads own = 0 holds the side through its intent alone, without
\* switching to shared mode or raising BUSY. The owner's next take sees intent = 1, falls back to today's word, finds BUSY free
\* and holds the side as well. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "foreign_stays_biased" \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
