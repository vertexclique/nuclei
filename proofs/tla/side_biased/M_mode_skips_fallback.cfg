\* MUTATION mode_skips_fallback: the owner, finding intent = 1, reads mode and holds while it still says biased. The foreign
\* thread has not switched the mode yet (or its store has not reached the owner), so both hold the side. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "mode_skips_fallback" \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
