\* MUTATION move_mid_take: the monitor claims and takes the shard while its owner is inside a take, not outside in a task's
\* code. The old owner finishes its biased take while the new owner makes one, and both hold the side. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 2                      \* driver edges on the owner
    Foreign = {}                   \* the foreign threads
    Calls <- NoCalls               \* the calls each foreign thread makes
    Handoffs = 1                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "move_mid_take"     \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
