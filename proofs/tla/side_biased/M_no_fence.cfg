\* MUTATION no_fence: a foreign take raises intent and reads own with no heavy fence between. The owner's own := 1 is still in its
\* buffer, so the foreign thread reads own = 0, switches to shared mode and takes the word while the owner holds the side.
\* Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "no_fence"          \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
