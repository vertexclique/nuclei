\* MUTATION owner_no_intent: the owner stores own := 1 and holds without reading intent. A foreign thread that read own = 0
\* just before has switched to shared mode and holds the word, and the owner holds the side too. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "owner_no_intent"   \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
