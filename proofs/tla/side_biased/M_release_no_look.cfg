\* MUTATION release_no_look: the owner lets go with own := 0 and never looks for work a foreign thread left. A poll that
\* found the owner holding the side raised WAITING and sleeps, and nobody wakes it. Expected: a deadlock (a lost wake).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "release_no_look"   \* the rule taken away, if any
