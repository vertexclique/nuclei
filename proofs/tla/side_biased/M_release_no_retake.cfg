\* MUTATION release_no_retake: the owner's release finds work left after its locked look but does not take the side again: it
\* only wakes a waiting poll. A defer that found the owner holding the side left DEFER, which nobody ever does.
\* Expected: NoLostWork broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OneDefer              \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "release_no_retake" \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    NoLostWork
