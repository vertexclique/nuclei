\* MUTATION release_plain_look: the owner's release, having read intent = 1, reads the flag word with a plain load. That load
\* runs ahead of its own := 0 and sees no WAITING yet; the poll raises WAITING, looks once more at own, still reads 1 from
\* memory, and sleeps, and nobody wakes it. Expected: a deadlock (a lost wake).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "release_plain_look" \* the rule taken away, if any
