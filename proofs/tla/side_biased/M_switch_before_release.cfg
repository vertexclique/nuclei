\* MUTATION switch_before_release: the owner stores the switch to shared before its own := 0, while it still holds biased.
\* The store lands and a second foreign poll takes the word before the owner has let go. Expected: Exclusive broken (the
\* model's hold lasts until own := 0; on x86 the owner touches nothing after its last step, so this shows the contract).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3, 4}               \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "always"          \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "switch_before_release" \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
