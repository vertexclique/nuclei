\* MUTATION unfenced_reads_own: a foreign call whose heavy fence failed reads own anyway. The owner's own := 1 is still in its
\* buffer, so the call reads zero, switches the side and takes the word while the owner holds it. Expected: Exclusive broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not the bug this run plants
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "always"          \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "unfenced_reads_own" \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
