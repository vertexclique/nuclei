\* The claimant's shard serves one edge, then lets go of the source for good, while a foreign poll's
\* fences always fail: the claimant gives its claim up and does what was left before, or the poll
\* finds the claim given up and takes the side itself. One holder at a time, no wait on another
\* thread, no left work lost, shared mode for good, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "always"          \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    ClaimStops = TRUE              \* whether the claimant's shard lets go of the source for good
    Rehomed = FALSE                \* whether the source is homed elsewhere, the claimant still running
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
    NoSpin
    NoLostWork
PROPERTIES                      \* must hold over every behaviour
    SharedAbsorbing
