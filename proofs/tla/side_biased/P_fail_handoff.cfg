\* A handoff mid-run, then the old owner polls as a foreign thread whose fence may fail: its nudge reaches the shard's new
\* runner. The same properties as P_fail.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 2                      \* driver edges on the owner
    Foreign = {}                   \* the foreign threads
    Calls <- NoCalls               \* the calls each foreign thread makes
    Handoffs = 1                   \* moves of the shard the monitor may make
    FenceFails = "maybe"           \* whether a foreign heavy fence may fail
    OldCalls <- OnePoll            \* the calls of the first owner once it is foreign
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
    NoSpin
    NoLostWork
PROPERTIES                      \* must hold over every behaviour
    SharedAbsorbing
