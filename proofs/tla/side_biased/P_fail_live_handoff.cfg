\* Liveness with a handoff and a failing fence after it: every thread ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Edges = 2                      \* driver edges on the owner
    Foreign = {}                   \* the foreign threads
    Calls <- NoCalls               \* the calls each foreign thread makes
    Handoffs = 1                   \* moves of the shard the monitor may make
    FenceFails = "maybe"           \* whether a foreign heavy fence may fail
    OldCalls <- OnePoll            \* the calls of the first owner once it is foreign
    Mutation = "none"              \* the rule taken away, if any
PROPERTIES                      \* must hold over every behaviour
    Termination
