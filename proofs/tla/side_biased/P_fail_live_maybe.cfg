\* Liveness with fences that may fail, two polls: every poll is served and every thread ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- TwoPolls              \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "maybe"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "none"              \* the rule taken away, if any
PROPERTIES                      \* must hold over every behaviour
    Termination
