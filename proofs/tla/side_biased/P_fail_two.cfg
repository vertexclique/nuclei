\* Two foreign threads polling once each, every fence failing, one edge. The same properties as P_fail.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 1                      \* driver edges on the owner
    Foreign = {3, 4}               \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "always"          \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    ClaimStops = FALSE             \* the claimant's shard never lets go of the source
    Rehomed = FALSE                \* the source stays homed on the claimant's shard
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
    NoSpin
    NoLostWork
PROPERTIES                      \* must hold over every behaviour
    SharedAbsorbing
