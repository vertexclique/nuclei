\* A handoff mid-run: the owner, the spare and one foreign thread polling once, two edges; the monitor may move the shard
\* once, between or before the edges. The same properties as P_one, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 2                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 1                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
    NoSpin
    NoLostWork
PROPERTIES                      \* must hold over every behaviour
    SharedAbsorbing
