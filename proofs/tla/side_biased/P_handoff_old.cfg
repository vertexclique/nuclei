\* A handoff mid-run with the old owner calling afterwards: the owner and the spare, two edges; the monitor may move the
\* shard once, and the first owner then polls and makes a request as a foreign thread. The same properties as P_one, and
\* no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 2                      \* driver edges on the owner
    Foreign = {}                   \* the foreign threads
    Calls <- NoCalls               \* the calls each foreign thread makes
    Handoffs = 1                   \* moves of the shard the monitor may make
    FenceFails = "never"           \* whether a foreign heavy fence may fail
    OldCalls <- PollReq            \* the calls of the first owner once it is foreign
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
    NoSpin
    NoLostWork
PROPERTIES                      \* must hold over every behaviour
    SharedAbsorbing
