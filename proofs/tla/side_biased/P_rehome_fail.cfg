\* The source is homed elsewhere while the claimant's thread still runs it, every foreign fence
\* failing: a foreign poll leaves its work and nudges the claimant, whose own call, foreign too, reads
\* its own `own`, holds nothing, and takes the side itself. The same properties, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Edges = 0                      \* driver edges on the owner
    Foreign = {3}                  \* the foreign threads
    Calls <- OnePoll               \* the calls each foreign thread makes
    Handoffs = 0                   \* moves of the shard the monitor may make
    FenceFails = "always"          \* whether a foreign heavy fence may fail
    OldCalls <- NoCalls            \* the calls of the first owner once it is foreign
    ClaimStops = FALSE             \* whether the claimant's shard lets go of the source for good
    Rehomed = TRUE                 \* whether the source is homed elsewhere, the claimant still running
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    Exclusive
    NoSpin
    NoLostWork
PROPERTIES                      \* must hold over every behaviour
    SharedAbsorbing
