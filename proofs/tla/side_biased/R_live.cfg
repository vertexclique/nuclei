\* Liveness: under weak fairness the retire lets the object go and every process ends (two operations).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    OpsA = 2                       \* operations ring A may submit
    OpsB = 0                       \* operations ring B may submit (no move here)
    Rehome = FALSE                 \* whether the source moves to ring B
    Mutation = "none"              \* the rule taken away, if any
PROPERTIES                      \* must hold over every behaviour
    Termination
