\* A re-home with an operation still out on ring A: ring B waits for the count to reach zero before it submits; no lost
\* update, the IO object goes only once every operation is over, and no deadlock (every wait is woken).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OpsA = 1                       \* operations ring A may submit
    OpsB = 1                       \* operations ring B may submit once the source is its
    Rehome = TRUE                  \* whether the source moves to ring B
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    NoLostUpdate
    FreedAfterOps
