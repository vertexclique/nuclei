\* The same with two operations on ring A and one on ring B.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OpsA = 2                       \* operations ring A may submit
    OpsB = 1                       \* operations ring B may submit once the source is its
    Rehome = TRUE                  \* whether the source moves to ring B
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    NoLostUpdate
    FreedAfterOps
