\* The owner submitting and completing two operations, a retire on another thread: the IO object goes only once every
\* operation is over, and no deadlock (a retire that waits is woken).
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OpsA = 2                       \* operations ring A may submit
    OpsB = 0                       \* operations ring B may submit (no move here)
    Rehome = FALSE                 \* whether the source moves to ring B
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    FreedAfterOps
    NoLostUpdate
