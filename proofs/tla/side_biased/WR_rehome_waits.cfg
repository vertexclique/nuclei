\* WITNESS: a re-home finds an operation still out on ring A, waits, and ring A's last op_done wakes it.
\* Expected: NoRehomeWait broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    OpsA = 1                       \* operations ring A may submit
    OpsB = 1                       \* operations ring B may submit once the source is its
    Rehome = TRUE                  \* whether the source moves to ring B
    Mutation = "none"              \* the rule taken away, if any
INVARIANTS                      \* must hold in every reachable state
    NoRehomeWait
