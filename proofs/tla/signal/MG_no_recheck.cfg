\* MUTATION no_recheck: the listener sleeps without looking again. Expected: SeesAll broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the pumps wait for good once the deliveries end
CONSTANTS
    N = 2                \* two deliveries
    Pumps = {1, 2}       \* two shards with a pump
    Mutation = "no_recheck"
PROPERTIES                     \* must hold over every behaviour
    SeesAll
