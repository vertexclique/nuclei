\* MUTATION no_wake_at_drop: the drop lowers the flag but wakes nobody: the listener asleep
\* never polls again to start a pump. Expected: SeesAll broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the pumps wait for good once the deliveries end
CONSTANTS
    N = 2                \* two deliveries
    Drops = 1            \* one pump may be dropped
    Mutation = "no_wake_at_drop"
PROPERTIES                     \* must hold over every behaviour
    SeesAll
