\* MUTATION pump_dropped: a pump dropped with its shard leaves the flag raised and wakes
\* nobody, as when the flag was the thread's. A listener asleep then has no pump, and the next
\* poll starts none. Expected: SeesAll broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the pumps wait for good once the deliveries end
CONSTANTS
    N = 2                \* two deliveries
    Drops = 1            \* one pump may be dropped
    Mutation = "pump_dropped"
PROPERTIES                     \* must hold over every behaviour
    SeesAll
