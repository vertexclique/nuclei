\* MUTATION wake_before_down: the drop wakes the listeners before it lowers the flag: one
\* that polls in between finds the flag raised, starts no pump and sleeps. Expected: SeesAll
\* broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the pumps wait for good once the deliveries end
CONSTANTS
    N = 2                \* two deliveries
    Drops = 1            \* one pump may be dropped
    Mutation = "wake_before_down"
PROPERTIES                     \* must hold over every behaviour
    SeesAll
