\* Two deliveries, two pumps, one listener: never an item more than the deliveries.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the pumps wait for good once the deliveries end
CONSTANTS
    N = 2                \* two deliveries
    Pumps = {1, 2}       \* two shards with a pump
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoExtraItem
