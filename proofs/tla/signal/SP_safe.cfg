\* Two deliveries, one pump that may be dropped: never an item more than the deliveries, and
\* one pump at most at a time.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* the pumps wait for good once the deliveries end
CONSTANTS
    N = 2                \* two deliveries
    Drops = 1            \* one pump may be dropped
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoExtraItem
    OnePump
