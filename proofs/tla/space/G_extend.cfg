\* A reservation on a file system that reserves (UFS), the range past the end, another
\* party writing anywhere and a call that may fail: it grows the file to the range's end and no
\* further, reserves, loses nothing of theirs, and changes no length when it fails.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "extend"
    Size0 = 2
    Empty = FALSE
    Appends = FALSE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLostWrite
    NoGrowthPastEnd
    ErrorKeepsLength
    Grown
    Reserved
PROPERTIES                     \* must hold of every behaviour
    Termination
