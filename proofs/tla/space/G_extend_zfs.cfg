\* A reservation on a file system that reserves nothing (ZFS): it answers the file system's
\* refusal, `EOPNOTSUPP` as `Unsupported`, and changes nothing.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "extend"
    Size0 = 2
    Empty = FALSE
    Appends = FALSE
    Cuts = FALSE
    Reserves = FALSE
    HasSpacectl = TRUE
    Fails = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoLostWrite
    ErrorKeepsLength
PROPERTIES                     \* must hold of every behaviour
    Termination
