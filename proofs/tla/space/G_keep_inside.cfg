\* A `KeepSize` range inside the file, another party writing anywhere, a call that may fail:
\* it reserves and keeps the length.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "keep"
    Size0 = 4
    Empty = FALSE
    Appends = FALSE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    KeepsLength
    Reserved
    ErrorKeepsLength
    NoLostWrite
PROPERTIES                     \* must hold of every behaviour
    Termination
