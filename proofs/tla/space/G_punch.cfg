\* A hole in a range inside the file, a signal that may stop a pass part way, another party
\* writing anywhere, a call that may fail: the range reads as zeros and the length stays.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "punch"
    Size0 = 4
    Empty = FALSE
    Appends = FALSE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Zeroed
    NoLostWrite
    NoGrowthPastEnd
    ErrorKeepsLength
    HoleKeepsLength
PROPERTIES                     \* must hold of every behaviour
    Termination
