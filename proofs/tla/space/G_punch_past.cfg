\* A hole in a range that runs past the end: what lies inside reads as zeros, and the file
\* does not grow.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "punch"
    Size0 = 2
    Empty = FALSE
    Appends = FALSE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Zeroed
    NoGrowthPastEnd
    HoleKeepsLength
    NoLostWrite
PROPERTIES                     \* must hold of every behaviour
    Termination
