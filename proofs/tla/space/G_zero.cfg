\* A zeroed range that runs past the end, another party writing anywhere, a call that may fail:
\* it reads as zeros, the file grows to its end and no further, nothing of theirs is lost.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "zero"
    Size0 = 2
    Empty = FALSE
    Appends = FALSE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Zeroed
    Grown
    NoLostWrite
    NoGrowthPastEnd
    ErrorKeepsLength
PROPERTIES                     \* must hold of every behaviour
    Termination
