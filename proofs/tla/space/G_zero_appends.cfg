\* As G_zero with descriptors that append: the zero goes through one that does not.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "zero"
    Size0 = 2
    Empty = FALSE
    Appends = TRUE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Zeroed
    Grown
    NoLostWrite
    NoGrowthPastEnd
    ErrorKeepsLength
PROPERTIES                     \* must hold of every behaviour
    Termination
