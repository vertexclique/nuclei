\* As G_zero with another party that may also cut the file.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "zero"
    Size0 = 2
    Empty = FALSE
    Appends = FALSE
    Cuts = TRUE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Zeroed
    NoLostWrite
    NoGrowthPastEnd
    ErrorKeepsLength
PROPERTIES                     \* must hold of every behaviour
    Termination
