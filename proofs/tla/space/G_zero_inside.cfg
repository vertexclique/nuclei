\* A zeroed range inside the file, a signal that may stop a pass part way: it reads as zeros
\* and the file keeps its length.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mode = "zero"
    Size0 = 4
    Empty = FALSE
    Appends = FALSE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    Zeroed
    Grown
    NoLostWrite
    NoGrowthPastEnd
PROPERTIES                     \* must hold of every behaviour
    Termination
