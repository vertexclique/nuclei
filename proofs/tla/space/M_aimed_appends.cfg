\* MUTATION aimed_appends: the zero goes through the call's own descriptor, which appends. The call
\* looks at the length, another party appends a byte, and the zero lands at the end past the range.
\* Expected: NoGrowthPastEnd broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run looks for one broken invariant
CONSTANTS
    Mode = "zero"
    Size0 = 2
    Empty = FALSE
    Appends = TRUE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = FALSE
    Mutation = "aimed_appends"
INVARIANTS                     \* must hold in every reachable state
    NoGrowthPastEnd
