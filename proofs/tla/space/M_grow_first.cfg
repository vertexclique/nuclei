\* MUTATION grow_first: a zeroed range grows the file before the free. An empty range past the end
\* grows the file by its write of one zero, and the free then answers `EINVAL`.
\* Expected: ErrorKeepsLength broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run looks for one broken invariant
CONSTANTS
    Mode = "zero"
    Size0 = 0
    Empty = TRUE
    Appends = FALSE
    Cuts = FALSE
    Reserves = TRUE
    HasSpacectl = TRUE
    Fails = FALSE
    Mutation = "grow_first"
INVARIANTS                     \* must hold in every reachable state
    ErrorKeepsLength
