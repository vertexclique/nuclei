\* MUTATION no_freeze: a frame that opens leaves the waits under it queued (the code before
\* 0.5.4's fix). Waiter 1's blocking frame queues first and runs waiter 2, whose own blocking
\* frame queues behind it on top. The release hands the lock to waiter 1, whose frame is not
\* polled while waiter 2's frame is on top, and waiter 2 waits for the lock waiter 1 was handed:
\* both wait for good with the lock free. Expected: OthersEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck waiter is what the property says, not a deadlock
CONSTANTS
    Waiters = 2                 \* two waiters
    Stalls = {}                 \* nobody stalls for good
    Nest <- OneRunsTwo          \* waiter 1's frame runs waiter 2 (MC_Stall.tla)
    Mutation = "no_freeze"      \* the frame freezes nothing
PROPERTIES                     \* must hold of every behaviour
    OthersEnd
