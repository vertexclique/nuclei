\* MUTATION release_no_grant: a release frees the lock and hands it to nobody,
\* so the waiters in line, who wait to be handed it, wait for good. Expected:
\* OthersEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck waiter is what the property says, not a deadlock
CONSTANTS
    Waiters = 2                 \* two waiters
    Stalls = {}                 \* nobody stalls
    Nest = {}                   \* no nested frames
    Mutation = "release_no_grant"   \* the rule this run takes away
PROPERTIES                     \* must hold of every behaviour
    OthersEnd
