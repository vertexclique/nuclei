\* Nested blocking frames on one thread: waiter 1's blocking frame queues first and runs waiter
\* 2, whose own blocking frame opens on top and freezes waiter 1's wait. The release hands the
\* lock to waiter 2, whose frame can run; once it ends, waiter 1's frame is on top again and its
\* wait asks again. One at a time, and both end with the lock free.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters = 2                 \* two waiters
    Stalls = {}                 \* nobody stalls for good
    Nest <- OneRunsTwo          \* waiter 1's frame runs waiter 2 (MC_Stall.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Exclusion
PROPERTIES                     \* must hold of every behaviour
    OthersEnd
