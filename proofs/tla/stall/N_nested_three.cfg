\* Three waiters, waiter 1's frame running waiter 2 and waiter 2's running waiter 3: each frame
\* that opens freezes the waits under it, so the lock always goes to the waiter on top, and every
\* waiter ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Waiters = 3                 \* three waiters
    Stalls = {}                 \* nobody stalls for good
    Nest <- Chain               \* 1 runs 2, 2 runs 3 (MC_Stall.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    Exclusion
PROPERTIES                     \* must hold of every behaviour
    OthersEnd
