\* WITNESS of the documented contract (a waiter that never runs again): the
\* first waiter queues and is never polled again. The release hands it the lock,
\* which it never takes up, so the waiter behind it waits for good although it
\* is polled whenever it is woken. Expected: OthersEnd broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck waiter is what the property says, not a deadlock
CONSTANTS
    Waiters = 2                 \* two waiters
    Stalls = {1}                \* the first waiter is never polled again
    Nest = {}                   \* no nested frames
    Mutation = "none"           \* no rule taken away
PROPERTIES                     \* must hold of every behaviour
    OthersEnd
