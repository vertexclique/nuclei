\* A task reads straight into its own buffer at every size, a request of four pieces one read at a time, the last sent after the others: every request is read, because the kernel's count of what is left, or the floor of it that covers more than the read, tells a read that took a piece whether to look again.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 1
    Mutation = "none"
    Exact = TRUE
    RingPoll = FALSE
PROPERTIES                     \* must hold over every behaviour
    Read
