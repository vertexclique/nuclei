\* A task reads straight into its own buffer at every size, a request of two pieces one read at a time: every request is read, because the kernel's count of what is left tells a read that took a piece whether to look again.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 1
    Mutation = "none"
    Exact = TRUE
PROPERTIES                     \* must hold over every behaviour
    Read
