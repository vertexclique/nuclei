\* As FS_exact, on an io_uring ring: the edges come from the ring's multishot poll, which a task that waits arms and the kernel looks at the socket for as it does, and which the kernel may end on its own, its end waking the task to arm another: every request is read.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 1
    Mutation = "none"
    Exact = TRUE
    RingPoll = TRUE
PROPERTIES                     \* must hold over every behaviour
    Read
