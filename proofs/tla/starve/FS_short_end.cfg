\* Reads into buffers of the pool, every peer closing after its request with the hangup on the edge of its last part: a TCP read shorter than it asked for would be taken as having emptied the socket, but the side is unsure once the hangup's edge is served, so the task reads its request and then the end.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 0
    Mutation = "none"
    Exact = FALSE
    End = TRUE
PROPERTIES                     \* must hold over every behaviour
    Read
