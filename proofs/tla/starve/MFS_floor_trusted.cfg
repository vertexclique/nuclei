\* MUTATION floor_trusted: the floor the kernel's last count left covers the read that takes its last piece too, which is taken as having emptied the socket; the last piece of the request, sent after the count, is never read. Expected: Read broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 1
    Mutation = "floor_trusted"
    Exact = TRUE
PROPERTIES                     \* must hold over every behaviour
    Read
