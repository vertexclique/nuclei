\* MUTATION inq_ignored: a read that took a piece is taken as having emptied the socket, whatever the kernel says is left; the task waits for an edge that never comes. Expected: Read broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 1
    Mutation = "inq_ignored"
    Exact = TRUE
PROPERTIES                     \* must hold over every behaviour
    Read
