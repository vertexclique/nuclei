\* MUTATION park: a starved reader waits for a buffer to come back and calls nothing itself, as it did before; the buffer holds bytes no task will read, and the request that came is never read. Expected: Read broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 1
    Mutation = "park"
    Exact = FALSE
PROPERTIES                     \* must hold over every behaviour
    Read
