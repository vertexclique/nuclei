\* MUTATION peek_drains: a starved reader's peek, which leaves the request in the socket, is taken as having emptied it; the read after it waits for an edge that never comes. Expected: Read broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck reader is what the properties look for
CONSTANTS
    Holders = 1
    Mutation = "peek_drains"
    Exact = FALSE
PROPERTIES                     \* must hold over every behaviour
    Read
