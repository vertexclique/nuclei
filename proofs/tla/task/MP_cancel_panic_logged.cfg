\* MUTATION cancel_panic_logged: a cancel whose future panics as it is dropped logs the
\* panic though the handle waits for it, and the handle is told only that the task was
\* cancelled. Expected: AwaiterGetsPanic broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Runners = {1}            \* 1 runner thread
    HandleOp = "cancel"     \* the handle cancels and waits for the future to go
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = FALSE        \* the future does not wake itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {"future"}
                            \* these panic: future
    Shutdown = FALSE        \* every runnable is run
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = FALSE         \* no abort handle
    Mutation = "cancel_panic_logged"\* the rule this run takes away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    AwaiterGetsPanic
