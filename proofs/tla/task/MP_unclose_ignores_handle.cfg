\* MUTATION unclose_ignores_handle: the cancel of a detached task whose future panics as
\* it is dropped completes it with the panic though no handle is left to take it: the
\* memory goes with the panic still in it. Expected: FreedAfterFuture broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Runners = {1}            \* 1 runner thread
    HandleOp = "detach"     \* the handle detaches at once
    WakeKind = "drop"       \* the waker thread only drops the wakers it is handed
    SelfWake = FALSE        \* the future does not wake itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {"future"}
                            \* these panic: future
    Shutdown = FALSE        \* every runnable is run
    Mutation = "unclose_ignores_handle"\* the rule this run takes away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    FreedAfterFuture
