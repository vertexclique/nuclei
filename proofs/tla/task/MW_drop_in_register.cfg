\* MUTATION clone_in_register, with the drop of the waker a store replaces panicking: that drop ran
\* while REGISTERING was held too, and its panic leaves the flag set the same way. Expected deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1}           \* 1 runner thread
    HandleOp = "await"      \* the handle awaits the output, then is dropped
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = FALSE        \* the future does not wake itself
    Spurious = 1            \* the handle may be polled 1 time without a wake
    Panics = {"awdrop"}     \* these panic: awdrop
    Shutdown = FALSE        \* every runnable is run
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = FALSE         \* no abort handle
    Mutation = "clone_in_register" \* the rule this run takes away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
