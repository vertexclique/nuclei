\* MUTATION pending_drops_woken: the exchange after a Pending poll drops the
\* run's reference though the future woke the task during the poll, so the
\* runnable scheduled again holds none; a later run touches freed memory.
\* Expected: NothingAfterFree broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Runners = {1}           \* 1 runner thread
    HandleOp = "detach"     \* the handle detaches
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = TRUE         \* the future wakes itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {}             \* none of the task's own code panics
    Shutdown = FALSE        \* every runnable is run
    Mutation = "pending_drops_woken"\* the rule this run takes away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    NothingAfterFree
