\* MUTATION pending_leaks_future: the run that holds the last reference of a
\* task with no handle frees it and leaves the future behind. The only waker is
\* dropped without a wake. Expected: FreedAfterFuture broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Runners = {1}           \* 1 runner thread
    HandleOp = "detach"     \* the handle detaches
    WakeKind = "drop"       \* the waker thread drops its waker without a wake
    SelfWake = FALSE        \* the future does not wake itself
    Spurious = 0            \* the handle is polled only when woken
    Mutation = "pending_leaks_future" \* the rule this run takes away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    FreedAfterFuture
