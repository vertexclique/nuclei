\* MUTATION pending_two_steps: a Pending run clears RUNNING, then drops its
\* reference in a step of its own; the task, woken meanwhile, completes on the
\* other runner and its handle goes, so the late drop frees it on a runner.
\* Expected: RunnerFreesNoAwaited broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    Runners = {1, 2}        \* 2 runner threads
    HandleOp = "detach"     \* the handle detaches
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = TRUE         \* the future wakes itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {}             \* none of the task's own code panics
    Shutdown = FALSE        \* every runnable is run
    Mutation = "pending_two_steps"\* the rule this run takes away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    RunnerFreesNoAwaited
