\* The handle cancels and waits while the future, which panics as it is dropped, is
\* polled or queued, on two runners: the cancel ends as a completion with that panic, for
\* the handle.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1, 2}         \* 2 runner threads
    HandleOp = "cancel"     \* the handle cancels and waits for the future to go
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = TRUE         \* the future wakes itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {"future", "free"}
                            \* these panic: future, free
    Shutdown = FALSE        \* every runnable is run
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
    RunnerFreesNoAwaited
    RunnableScheduled
    NoAbort
    PanicTold
    AwaiterGetsPanic
