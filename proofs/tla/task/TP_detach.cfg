\* A detached task whose last waker is dropped without a wake: its future, which panics
\* as it is dropped, goes on a runner, and the panic is logged.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1}            \* 1 runner thread
    HandleOp = "detach"     \* the handle detaches at once
    WakeKind = "drop"       \* the waker thread only drops the wakers it is handed
    SelfWake = FALSE        \* the future does not wake itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {"future", "output", "free"}
                            \* these panic: future, output, free
    Shutdown = FALSE        \* every runnable is run
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = FALSE         \* no abort handle
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
    RunnerFreesNoAwaited
    RunnableScheduled
    NoAbort
    PanicTold
    AwaiterGetsPanic
