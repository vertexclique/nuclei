\* A hook around the first poll panics, the future panics as it is dropped, and so does
\* the shutdown on the task's panic, while the handle cancels and waits: the hook's panic
\* is the outcome, for the handle; the others are logged.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1, 2}         \* 2 runner threads
    HandleOp = "cancel"     \* the handle cancels and waits for the future to go
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = FALSE        \* the future does not wake itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {"hook", "future", "shutdown"}
                            \* these panic: hook, future, shutdown
    Shutdown = FALSE        \* every runnable is run
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
    RunnerFreesNoAwaited
    RunnableScheduled
    NoAbort
    PanicTold
    AwaiterGetsPanic
