\* The shutdown may drop the runnable while the handle cancels and waits, on two runners;
\* the future and the task's memory panic as they are dropped.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1, 2}         \* 2 runner threads
    HandleOp = "cancel"     \* the handle cancels and waits for the future to go
    WakeKind = "by_ref"     \* the waker thread wakes by reference, then drops its waker
    SelfWake = FALSE        \* the future does not wake itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Panics = {"future", "free"}
                            \* these panic: future, free
    Shutdown = TRUE         \* a runner may drop a runnable instead of running it
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = FALSE         \* no abort handle
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
    RunnerFreesNoAwaited
    RunnableScheduled
    NoAbort
    PanicTold
    AwaiterGetsPanic
    CancelWaits
    OutputGoneAtNone
