\* An abort handle cancels the task from a thread of its own and is dropped, its reference
\* keeping the task alive until then, while the handle awaits: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1}           \* 1 runner thread
    HandleOp = "await"      \* the handle awaits the output, then is dropped
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = FALSE        \* the future does not wake itself
    Spurious = 0            \* the handle is polled only when woken
    Panics = {}             \* none of the task's own code panics
    Shutdown = FALSE        \* every runnable is run
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = TRUE          \* an abort handle cancels the task from its own thread
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
    RunnerFreesNoAwaited
    RunnableScheduled
    AwaiterOnce
    OneAtTheCell
