\* Two runners; the future wakes itself during its first poll and the waker
\* thread wakes it by reference.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1, 2}        \* 2 runner threads
    HandleOp = "await"      \* the handle awaits the output, then is dropped
    WakeKind = "by_ref"     \* the waker thread wakes by reference, then drops its waker
    SelfWake = TRUE         \* the future wakes itself during its first poll
    Spurious = 0            \* the handle is polled only when woken
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
