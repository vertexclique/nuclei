\* The handle is polled, stores its waker, and is detached with the waker still in the cell; the
\* waker thread only drops its wakers, so the last one closes the task and the runner drops the future
\* without a word naming the waker: the free drops it with the memory. Every safety property, and no
\* deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1}           \* 1 runner thread
    HandleOp = "poll_detach" \* the handle is polled, then detached with its waker stored
    WakeKind = "drop"       \* the waker thread only drops every waker it is handed
    SelfWake = FALSE        \* the future does not wake itself
    Spurious = 0            \* the handle is polled only when woken
    Panics = {}             \* none of the task's own code panics
    Shutdown = FALSE        \* every runnable is run
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = FALSE         \* no abort handle
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
    RunnerFreesNoAwaited
    RunnableScheduled
    AwaiterOnce
    OneAtTheCell
