\* The handle's waker panics as it is woken, as it is dropped, and once as it is cloned, at a
\* registration while an earlier waker is stored; the handle's executor polls it once without a wake.
\* Each wake and drop runs once the word's change is complete, in a catch that logs; the clone runs
\* before any flag is taken, so its panic ends the handle's poll with the word untouched, and the waker
\* stored before is woken by the completion. Every safety property, no panic aborts or goes untold, no
\* deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1}           \* 1 runner thread
    HandleOp = "await"      \* the handle awaits the output, then is dropped
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = FALSE        \* the future does not wake itself
    Spurious = 1            \* the handle may be polled 1 time without a wake
    Panics = {"wake", "awdrop", "clone"} \* these panic: wake, awdrop, clone
    Shutdown = FALSE        \* every runnable is run
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = FALSE         \* no abort handle
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    AwaitGetsOutput
    RunnerFreesNoAwaited
    RunnableScheduled
    AwaiterOnce
    OneAtTheCell
    NoAbort
    PanicTold
