\* As T_waker_panics with the handle cancelling and waiting for the future to go, and the shutdown
\* dropping the runnable unrun: the wakes and drops of the shutdown's notify and the run's finish
\* panic, caught. Every safety property, no panic aborts or goes untold, no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Runners = {1}           \* 1 runner thread
    HandleOp = "cancel"     \* the handle cancels and waits for the future to go
    WakeKind = "by_value"   \* the waker thread wakes the task by value
    SelfWake = FALSE        \* the future does not wake itself
    Spurious = 0            \* the handle is polled only when woken
    Panics = {"wake", "awdrop"} \* these panic: wake, awdrop
    Shutdown = TRUE         \* a runner may drop a runnable instead of running it
    PushStopped = FALSE     \* every push finds the shard running
    HandleWakers = 1        \* the handle is polled with one waker throughout
    Aborter = FALSE         \* no abort handle
    Mutation = "none"       \* no rule taken away
    defaultInitValue = defaultInitValue \* the PlusCal translator's start value for a parameter
INVARIANTS                     \* must hold in every reachable state
    OnePoll
    FutureOnce
    NoPollAfterDrop
    NothingAfterFree
    OutputOnce
    FreedAfterFuture
    CleanEnd
    RunnerFreesNoAwaited
    RunnableScheduled
    CancelWaits
    OutputGoneAtNone
    AwaiterOnce
    OneAtTheCell
    NoAbort
    PanicTold
