\* A worker's start racing a runtime's drop, every step of the start able to come between any two of
\* the drop's, the start the runtime's first or not: the drop returns, and every thread the start
\* started has ended when it does. No deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    StartedJoined
PROPERTIES                     \* must hold over every behaviour
    DropReturns
