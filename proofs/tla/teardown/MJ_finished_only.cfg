\* MUTATION finished_only: a received message counts for nothing, only reading as finished does. W0's
\* message wakes the wait before W0 reads as finished; the wait looks, sees W0 running and waits for a
\* message that never comes. With no deadline it waits for good. Expected: Returns broken.
SPECIFICATION Spec              \* the algorithm, every fair process weakly fair
CHECK_DEADLOCK FALSE           \* the property is what this run looks for
CONSTANTS
    Mutation = "finished_only"
PROPERTIES                     \* must hold over every behaviour
    Returns
