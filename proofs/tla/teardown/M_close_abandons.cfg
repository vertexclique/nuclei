\* MUTATION close_abandons: at the close nothing is dropped or walked, as before the task lists. T1 goes on
\* with its bound task live, which no thread runs or drops again (a wake later leaks it, and its handle
\* never resolves). Expected: HomeSettled broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the property is what this run looks for
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "close_abandons"
INVARIANTS                     \* must hold in every reachable state
    HomeSettled
