\* MUTATION detached_unbounded: the drop waits for T1, detached, with no deadline. T1's poll never returns,
\* and the drop waits for good. Expected: DropReturnsOrBlocked broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the property is what this run looks for
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = TRUE         \* T1's poll may never return
    Mutation = "detached_unbounded"
PROPERTIES                     \* must hold over every behaviour
    DropReturnsOrBlocked
