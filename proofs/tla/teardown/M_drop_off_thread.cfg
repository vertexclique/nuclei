\* MUTATION drop_off_thread: T2 lets go of S without dropping S's queues or walking its list. B2, bound to T2,
\* still has its runnable in S's queue, and S's last holder, T1, drops it as S goes: a future that is not
\* Send dropped on a thread that is not its own. Expected: DroppedOnHome broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the property is what this run looks for
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "drop_off_thread"
INVARIANTS                     \* must hold in every reachable state
    DroppedOnHome
