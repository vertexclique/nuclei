\* MUTATION no_detached_filter: the list keeps T1 though its shard was taken while it was blocked in its
\* poll. The drop waits on T1, which may never return. Expected: JoinsNoDetached broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the invariant is what this run looks for
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "no_detached_filter"
INVARIANTS                     \* must hold in every reachable state
    JoinsNoDetached
