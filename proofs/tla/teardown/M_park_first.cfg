\* MUTATION park_first: a spare parks before its first look at the close. One that pushes itself after
\* the close popped the queue is never unparked, and the drop that joins it waits for good. Expected:
\* a deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "park_first"
