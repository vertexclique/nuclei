\* MUTATION self_join: the drop, in a task on runner W, keeps W in its list, as before the fix. It
\* joins its own thread: a failed join that panics (Linux, macOS, FreeBSD) or one that never returns
\* (Windows). Expected: NoSelfJoin broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the invariant is what this run looks for
CONSTANTS
    OnRunner = TRUE      \* the drop runs on runner W
    Mutation = "self_join"
INVARIANTS                     \* must hold in every reachable state
    NoSelfJoin
