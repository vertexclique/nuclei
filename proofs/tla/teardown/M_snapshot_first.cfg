\* MUTATION snapshot_first: the drop takes the list of threads while the monitor may still take, as
\* before the fix. The monitor's pass, under way as the close came, takes S after the list counted T1
\* as not detached: the drop waits on T1, blocked in a poll whose shard was taken, which may never
\* return. Expected: JoinsNoDetached broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the invariant is what this run looks for
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "snapshot_first"
INVARIANTS                     \* must hold in every reachable state
    JoinsNoDetached
