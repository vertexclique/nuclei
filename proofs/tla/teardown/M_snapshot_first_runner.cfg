\* MUTATION snapshot_first, as M_snapshot_first, seen from the runner the late take starts: the
\* monitor hands S to T2, started after the list was taken, so the drop returns with T2 still running
\* S (and dropping its tasks after the drop). Expected: StartedJoined broken.
