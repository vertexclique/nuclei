\* MUTATION unlisted: A, a task of S, is not put in S's list when its first poll returns pending. It is in no
\* queue and no list, so the walk as S stops leaves it live: its future is never dropped and its handle
\* never resolves. Expected: ShardSettled broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the property is what this run looks for
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "unlisted"
INVARIANTS                     \* must hold in every reachable state
    ShardSettled
