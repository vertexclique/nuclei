\* At the close, T1 (detached or not) walks its home's list and cancels its bound task on its own thread,
\* waiting for a wake on its way until its runnable lands or the deadline passes: the bound task always
\* ends (run, cancelled, or left and said), never left live as before the task lists.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    HomeSettled
    LeftSaid
    DroppedOnHome
PROPERTIES                     \* must hold over every behaviour
    AllEnd
