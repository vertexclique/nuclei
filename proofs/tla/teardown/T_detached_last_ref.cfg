\* T1's poll may never return. The drop waits for T1, detached, only until its deadline: it returns (unless
\* T1 was never taken, a runner's poll the drop waits for as it always has), with
\* S still alive only once the deadline passed and, if T1 is still in its taken poll, saying so; the
\* tasks of S end as its runner stops or as S goes, and every other check of T_safe holds.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = TRUE         \* T1's poll may never return
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    JoinsNoDetached
    StartedJoined
    NoSelfJoin
    LastDropInRuntime
    DropDropsTasks
    LeftReported
    ShardSettled
    HomeSettled
    LeftSaid
    DroppedOnHome
PROPERTIES                     \* must hold over every behaviour
    DropReturnsOrBlocked
