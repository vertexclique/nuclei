\* As T_safe, with the drop in a task on W, one of the runtime's own runner threads: the list leaves W
\* out, so the drop joins every other thread and returns, and every task still ends on its own thread.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OnRunner = TRUE      \* the drop runs on runner W
    Stuck = FALSE        \* T1's poll returns
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    JoinsNoDetached
    StartedJoined
    NoSelfJoin
    LastDropInRuntime
    DropDropsTasks
    LeftReported
    ShardSettled
    HomeSettled
    LeftSaid
    DroppedOnHome
PROPERTIES                     \* must hold over every behaviour
    DropReturns
    AllEnd
