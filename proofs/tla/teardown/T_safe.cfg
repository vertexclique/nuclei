\* The drop on a user's thread, the monitor joined before the list is taken: whatever the monitor's last
\* pass takes or starts, the drop never waits without a bound on a detached thread blocked in its poll,
\* every thread it started is joined, it never joins itself, a shard's last reference goes inside its
\* runtime; each runner, as it is done with S and with its home, cancels every task there on its own
\* thread, so no task of S or of a home is left live and no bound task is dropped elsewhere; no
\* deadlock, the drop returns, and every task ends.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    JoinsNoDetached
    StartedJoined
    NoSelfJoin
    LastDropInRuntime
    DropDropsTasks
    LeftReported
    ShardSettled
    HomeSettled
    LeftSaid
    DroppedOnHome
PROPERTIES                     \* must hold over every behaviour
    DropReturns
    AllEnd
