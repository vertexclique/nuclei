\* Witness: with no rule broken, T1's walk of its home finds its bound task's wake on its way, and waits for
\* its runnable (so T_safe checks that wait). Expected: NoWokenAtWalk broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the property is what this run looks for
CONSTANTS
    OnRunner = FALSE     \* the drop runs on a thread of the user's
    Stuck = FALSE        \* T1's poll returns
    Mutation = "none"    \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoWokenAtWalk
