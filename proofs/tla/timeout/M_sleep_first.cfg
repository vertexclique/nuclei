\* MUTATION sleep_first: the sleep is polled before the future. Woken once the deadline
\* passed, with the future ready too, the poll answers Elapsed and drops a ready output.
\* Expected: ReadyWins broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run ends with every process done or the clock stopped
CONSTANTS
    Duration = 2                \* the timeout's duration
    ReadyAt = 2                 \* when the inner future is ready (past 9: never)
    MaxStep = 3                 \* the clock moves on by 1 to 3 units a step
    Horizon = 9                 \* the clock stops at 9
    Range = 20                  \* the last instant the clock can name
    Mutation = "sleep_first"
INVARIANTS                     \* must hold in every reachable state
    ReadyWins
