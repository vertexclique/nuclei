\* A duration past the clock's range: the deadline is the far future, nothing panics, and
\* the future's own wake completes the timeout.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run ends with every process done or the clock stopped
CONSTANTS
    Duration = 30               \* the timeout's duration
    ReadyAt = 4                 \* when the inner future is ready (past 9: never)
    MaxStep = 3                 \* the clock moves on by 1 to 3 units a step
    Horizon = 9                 \* the clock stops at 9
    Range = 20                  \* the last instant the clock can name
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ReadyWins
    InRange
PROPERTIES                     \* must hold over every behaviour
    Ends
