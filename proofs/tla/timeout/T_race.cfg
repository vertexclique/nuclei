\* The future is ready the moment the deadline passes: a poll that finds it ready answers
\* its output whatever the clock says, and the timeout always completes.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* the run ends with every process done or the clock stopped
CONSTANTS
    Duration = 3                \* the timeout's duration
    ReadyAt = 3                 \* when the inner future is ready (past 9: never)
    MaxStep = 3                 \* the clock moves on by 1 to 3 units a step
    Horizon = 9                 \* the clock stops at 9
    Range = 20                  \* the last instant the clock can name
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ReadyWins
    InRange
PROPERTIES                     \* must hold over every behaviour
    Ends
