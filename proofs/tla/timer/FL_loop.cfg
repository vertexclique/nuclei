\* The shard's own loop fires three timers, the first one's waker panicking: the guard wakes the
\* other two, the loop catches the panic and logs it, and the shard runs on.
SPECIFICATION Spec              \* the algorithm, weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what a property catches
CONSTANTS
    Due = 3                     \* three timers came due in the pass
    PanicsAt = 1
    InTask = FALSE
    Mutation = "none"
INVARIANTS
    PanicReachesTask
PROPERTIES
    DueWoken
    ShardRunsOn
