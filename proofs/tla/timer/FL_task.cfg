\* `time::advance` inside a task fires three timers, the middle one's waker panicking: the other
\* two are woken, the panic reaches the task, and the shard runs on.
SPECIFICATION Spec              \* the algorithm, weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what a property catches
CONSTANTS
    Due = 3                     \* three timers came due in the pass
    PanicsAt = 2
    InTask = TRUE
    Mutation = "none"
INVARIANTS
    PanicReachesTask
PROPERTIES
    DueWoken
    ShardRunsOn
