\* MUTATION orphan_ignores_cancel: the orphan of a going shard does not look at the cancelled
\* flag. It lands between the drop's cancel and its taking of the waker, and wakes the task
\* of a sleep whose drop began. Expected: NoWakeAfterDrop broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    DropIt = TRUE          \* the sleep is dropped at some point
    Goes = TRUE            \* the first shard may go first
    Mutation = "orphan_ignores_cancel"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoWakeAfterDrop
