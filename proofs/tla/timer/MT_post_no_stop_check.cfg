\* MUTATION post_no_stop_check: a post never looks at the shard's stopped flag. The first
\* shard goes and drains its mailbox for the last time; the arm request posted after that
\* stays there, applied by nobody and orphaning nothing, so the cell keeps the task's waker
\* for good. Expected: NoStrandedWaker broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    DropIt = FALSE         \* the sleep is awaited to the end
    Goes = TRUE            \* the first shard may go first
    Mutation = "post_no_stop_check"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoStrandedWaker
