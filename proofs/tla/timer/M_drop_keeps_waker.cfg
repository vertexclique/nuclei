\* MUTATION drop_keeps_waker: the drop leaves the waker in the cell, so a fire
\* racing the cancel wakes a dropped sleep's task. Expected: NoWakeAfterDrop broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    DropIt = TRUE          \* the sleep is dropped at some point
    Goes = FALSE           \* the shard stays until it fires the timer
    Moves = FALSE          \* the sleep stays with the task that first polled it
    Driven = TRUE          \* the first shard runs its loop
    Mutation = "drop_keeps_waker"\* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoWakeAfterDrop
