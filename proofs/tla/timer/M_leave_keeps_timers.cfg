\* MUTATION leave_keeps_timers: a visiting thread that leaves block_on keeps the timers it holds
\* for others, with nobody to fire them. Expected: SleepEnds broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Leaves = TRUE
    Mutation = "leave_keeps_timers"
PROPERTIES                     \* must hold over every behaviour
    SleepEnds
