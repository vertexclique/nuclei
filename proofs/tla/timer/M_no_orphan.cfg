\* MUTATION no_orphan: the first shard goes and lets go of the timer it held without waking anyone, so the cell
\* keeps the task's waker and the task keeps the cell, for good. Expected: NoStrandedWaker broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    DropIt = FALSE         \* the sleep is awaited to the end
    Goes = TRUE            \* the first shard may go first
    Moves = FALSE          \* the sleep stays with the task that first polled it
    Driven = TRUE          \* the first shard runs its loop
    Mutation = "no_orphan"     \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoStrandedWaker
