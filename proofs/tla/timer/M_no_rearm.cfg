\* MUTATION no_rearm: the sleep woken for its orphaned cell waits on that cell again, which nothing will ever fire.
\* Expected: Termination broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    DropIt = FALSE         \* the sleep is awaited to the end
    Goes = TRUE            \* the first shard may go first
    Moves = FALSE          \* the sleep stays with the task that first polled it
    Driven = TRUE          \* the first shard runs its loop
    Mutation = "no_rearm"      \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Termination
