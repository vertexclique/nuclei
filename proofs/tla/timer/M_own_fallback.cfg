\* MUTATION own_fallback: with no worker taking tasks the request goes to the calling thread's
\* own shard, which nobody drives while that thread is outside block_on (the witness this
\* replaces, W_undriven_own). Expected: SleepEnds broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Leaves = FALSE
    Mutation = "own_fallback"
PROPERTIES                     \* must hold over every behaviour
    SleepEnds
