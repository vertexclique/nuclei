\* MUTATION recheck_fired_only: a poll's look after it registered its waker is at `fired` alone,
\* the orphan mark never looked at. Expected: Termination broken.
\* The bug it plants: the first shard goes before it fires the timer, so the cell is orphaned and
\* the waker it held woken (the first task's, or, once the sleep moved, still the first task's
\* while the second has not registered). The poll that follows registers and looks at `fired`
\* only: nothing will ever fire the orphaned cell or wake the task again, and the sleep never
\* ends. Before the fix, the code looked at the orphan mark once, before the register, which a
\* shard going between that look and the register gets past the same way.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    DropIt = FALSE         \* the sleep is awaited to the end
    Goes = TRUE            \* the first shard may go first
    Moves = TRUE           \* the sleep may move to a second task
    Driven = TRUE          \* the first shard runs its loop
    Mutation = "recheck_fired_only" \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Termination
