\* An awaited sleep whose task may move to the second shard, the first one may go: the
\* first arming is let go (removed through the mailbox, or with the going shard), the sleep
\* arms again where it runs, it completes, and no wheel keeps its entry.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    DropIt = FALSE
    Goes = TRUE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NothingLeft
PROPERTIES                     \* must hold over every behaviour
    Completes
