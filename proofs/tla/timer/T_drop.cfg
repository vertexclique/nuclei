\* The sleep is dropped at any point: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    DropIt = TRUE          \* the sleep is dropped at some point
    Goes = FALSE           \* the shard stays until it fires the timer
    Moves = FALSE          \* the sleep stays with the task that first polled it
    Driven = TRUE          \* the first shard runs its loop
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NothingLeft
    NoWakeAfterDrop
    NoStrandedWaker
