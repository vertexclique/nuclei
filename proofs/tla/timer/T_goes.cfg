\* The sleep is awaited and the first shard may go before it fires the timer: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    DropIt = FALSE         \* the sleep is awaited to the end
    Goes = TRUE            \* the first shard may go first
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NothingLeft
    NoWakeAfterDrop
    NoStrandedWaker
