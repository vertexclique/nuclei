\* Liveness: an awaited sleep finishes, and every thread does.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    DropIt = FALSE         \* the sleep is awaited to the end
    Goes = FALSE           \* the shard stays until it fires the timer
    Mutation = "none"      \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
