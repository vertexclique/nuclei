\* Liveness when the sleep moves to a second task between two polls and the first shard may go,
\* at any step of either poll: the awaited sleep finishes all the same, and every thread does.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what the property catches
CONSTANTS
    DropIt = FALSE         \* the sleep is awaited to the end
    Goes = TRUE            \* the first shard may go first
    Moves = TRUE           \* the sleep may move to a second task
    Driven = TRUE          \* the first shard runs its loop
    Mutation = "none"      \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Termination
