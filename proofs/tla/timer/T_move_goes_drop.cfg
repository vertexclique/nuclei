\* The sleep may move to a second task, is dropped at any point, and the first shard may go
\* before it fires the timer: every safety property, and no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    DropIt = TRUE          \* the sleep is dropped at some point
    Goes = TRUE            \* the first shard may go first
    Moves = TRUE           \* the sleep may move to a second task
    Driven = TRUE          \* the first shard runs its loop
    Mutation = "none"      \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NothingLeft
    NoWakeAfterDrop
    NoStrandedWaker
