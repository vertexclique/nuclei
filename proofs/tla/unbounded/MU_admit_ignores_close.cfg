\* MUTATION admit_ignores_close: the admission ignores the closed bit. The receiver closes,
\* finds the channel idle and answers the end, and the send gets in after it. Expected:
\* EndAfterAll broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = TRUE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxCloseOne
    Mutation = "admit_ignores_close"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
