\* MUTATION finish_early: the receiver answers the end once the channel is closed, not
\* once it is also idle. A send admitted before the close is still being written.
\* Expected: EndAfterAll broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = TRUE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxCloseOne
    Mutation = "finish_early"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
