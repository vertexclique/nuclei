\* MUTATION flag_before_write: a send looks at the flag before it writes. It finds the flag
\* down; the receiver then looks, raises its flag, looks again and sleeps; the value is
\* written after, with nobody to wake it. Expected: Ends broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = TRUE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxOne
    Mutation = "flag_before_write"  \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Ends
