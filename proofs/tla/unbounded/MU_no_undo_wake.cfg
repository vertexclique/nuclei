\* MUTATION no_undo_wake: a send the close refused takes its count back without waking the receiver, which saw the count up and sleeps. Expected: a deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Senders = {"s1", "s2"}
    Mutation = "no_undo_wake"
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
