\* MUTATION no_undo_wake: a send the close refused takes its count back without waking the
\* receiver, which saw the count up and sleeps on a channel held open. Expected: a deadlock.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Senders = {"s1", "s2"}
    KeepOpen = TRUE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxCloseOne
    Mutation = "no_undo_wake"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
