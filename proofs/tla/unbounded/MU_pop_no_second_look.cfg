\* MUTATION pop_no_second_look: a pop that reads a sender count of zero answers the end
\* without looking at the queue again. The value is written and its sender gone between
\* the first look and the count. Expected: EndAfterAll broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = FALSE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxOne
    Mutation = "pop_no_second_look"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
