\* MUTATION push_no_wake: a send never wakes the receiver. The receiver sleeps after its
\* look again found nothing, and the value comes after. Expected: Ends broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = TRUE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxOne
    Mutation = "push_no_wake"  \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Ends
