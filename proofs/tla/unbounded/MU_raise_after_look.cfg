\* MUTATION raise_after_look: the receiver raises its flag only after its look again. The
\* send writes and looks at the flag between the two, finds it down, and wakes nobody.
\* Expected: Ends broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = TRUE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxOne
    Mutation = "raise_after_look"  \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Ends
