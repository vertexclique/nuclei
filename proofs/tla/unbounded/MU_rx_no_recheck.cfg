\* MUTATION rx_no_recheck: the receiver registers and sleeps without looking again. The
\* value lands between its look and its flag, and the send saw the flag down: nobody
\* wakes it. Expected: Ends broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = TRUE
    WithClone = FALSE           \* no clone
    WithWeak = FALSE
    RxProg <- RxOne
    Mutation = "rx_no_recheck"  \* the rule this run takes away
PROPERTIES                     \* must hold over every behaviour
    Ends
