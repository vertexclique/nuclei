\* MUTATION upgrade_from_zero: a weak sender upgrades after the last sender went. The
\* receiver took the one value, saw no sender and answered the end; the upgraded sender
\* then sends a value nobody will take. Expected: EndAfterAll broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what the deadlock check looks for here
CONSTANTS
    Senders = {"s1"}
    KeepOpen = FALSE
    WithClone = FALSE           \* no clone
    WithWeak = TRUE
    RxProg <- RxTwo
    Mutation = "upgrade_from_zero"  \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
