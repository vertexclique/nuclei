\* The receiver closes while two senders send, the channel held open by a third sender:
\* sends after the close are refused and wake the receiver when the channel is idle, and
\* the receiver ends only with every admitted value received.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {"s1", "s2"}      \* two senders, one send each
    KeepOpen = TRUE             \* a sender held for good: only the close ends it
    WithClone = FALSE           \* no clone
    WithWeak = FALSE            \* no weak sender
    RxProg <- RxCloseRecv       \* the receiver's program (MC_Unbounded.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
    CountSound
PROPERTIES                     \* must hold over every behaviour
    Ends
