\* Liveness: two senders and a weak sender against a receiver that receives until the
\* end, which it always reaches.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {"s1", "s2"}      \* two senders, one send each
    KeepOpen = FALSE            \* the last sender's drop ends the channel
    WithClone = FALSE           \* no clone
    WithWeak = TRUE             \* a weak sender upgrades and sends once
    RxProg <- RxRecvs           \* the receiver's program (MC_Unbounded.tla)
    Mutation = "none"           \* no rule taken away
PROPERTIES                     \* must hold over every behaviour
    Ends
