\* Two senders, a clone of one and a weak sender that upgrades, against a receiver that
\* receives one by one and in a batch until the end: the end only with every admitted
\* value received, the count never below zero, and no thread stuck.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Senders = {"s1", "s2"}      \* two senders, one send each
    KeepOpen = FALSE            \* the last sender's drop ends the channel
    WithClone = TRUE            \* s1 clones itself; the clone sends once
    WithWeak = TRUE             \* a weak sender upgrades and sends once
    RxProg <- RxMixed           \* the receiver's program (MC_Unbounded.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
    CountSound
