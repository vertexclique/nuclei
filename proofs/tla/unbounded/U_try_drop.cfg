\* Try receives around a close, and a try then the drop, racing two senders and a weak
\* one: the end only with every admitted value received, the count never below zero.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    Senders = {"s1", "s2"}      \* two senders, one send each
    KeepOpen = FALSE            \* the last sender's drop ends the channel
    WithClone = FALSE           \* no clone
    WithWeak = TRUE             \* a weak sender upgrades and sends once
    RxProg <- RxTries           \* the receiver's program (MC_Unbounded.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
    CountSound
