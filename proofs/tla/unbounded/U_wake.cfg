\* Liveness of the wake handshake: one sender against two receives on a channel held open,
\* so only the send's wake can end the receiver's sleep.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is what the property catches
CONSTANTS
    Senders = {"s1", "s2"}      \* two senders, one send each
    KeepOpen = TRUE             \* a sender held for good
    WithClone = FALSE           \* no clone
    WithWeak = FALSE            \* no weak sender
    RxProg <- RxTwo             \* the receiver's program (MC_Unbounded.tla)
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    EndAfterAll
    CountSound
PROPERTIES                     \* must hold over every behaviour
    Ends
