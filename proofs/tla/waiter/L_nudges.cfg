\* Two nudges before the grant, a spin, a spurious poll and a leave: every safety
\* property, everything ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Rounds = 1
    Nudges = 2
    Spin = TRUE
    Cancel = TRUE
    Owe = FALSE
    Spurious = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotExclusive
    NoStaleAccess
    PoolFree
    ArmedApart
    OwedSettled
    NoClaimWhileSpinning
PROPERTIES                     \* must hold of every behaviour
    AllEnd
