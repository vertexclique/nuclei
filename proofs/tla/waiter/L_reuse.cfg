\* Two futures use the node in turn through the pool, each nudged then granted, each
\* able to leave and to owe: every safety property, everything ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Rounds = 2
    Nudges = 1
    Spin = FALSE
    Cancel = TRUE
    Owe = TRUE
    Spurious = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotExclusive
    NoStaleAccess
    PoolFree
    ArmedApart
    OwedSettled
    NoClaimWhileSpinning
PROPERTIES                     \* must hold of every behaviour
    AllEnd
