\* A future that spins and is polled once without a wake, nudged then granted: every
\* safety property, everything ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    Rounds = 1
    Nudges = 1
    Spin = TRUE
    Cancel = FALSE
    Owe = FALSE
    Spurious = 1
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    SlotExclusive
    NoStaleAccess
    PoolFree
    ArmedApart
    OwedSettled
    NoClaimWhileSpinning
PROPERTIES                     \* must hold of every behaviour
    AllEnd
