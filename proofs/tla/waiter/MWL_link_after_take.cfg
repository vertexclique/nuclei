\* MUTATION link_after_take: the list reads the next node's link after the take let go of
\* the wake reference. The future, which held the other reference, finishes and frees the
\* node in between, and the pool hands it to a new future that rewrites the link: the
\* list reads freed memory. Expected: NoStaleAccess broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    K = 2                       \* two nodes in the list
    PanicAt = 0                 \* no waker panics
    Mutation = "link_after_take"   \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    NoStaleAccess
