\* MUTATION no_rest: no WakeRest guard sits on the stack while a waker runs. The first
\* node's waker panics, and the unwinding drops the list with two nodes never woken:
\* their futures were granted or nudged and sleep for good. Expected: AllWoken broken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    K = 3                       \* three nodes in the list
    PanicAt = 1                 \* the first node's waker panics
    Mutation = "no_rest"        \* the rule this run takes away
INVARIANTS                     \* must hold in every reachable state
    AllWoken
