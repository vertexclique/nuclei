\* MUTATION free_on_queue_release: the queue's release returns the node to the pool
\* whoever else holds it. Expected: NoStaleAccess broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Rounds = 1
    Nudges = 1
    Spin = FALSE
    Cancel = FALSE
    Owe = FALSE
    Spurious = 0
    Mutation = "free_on_queue_release"
INVARIANTS                     \* must hold in every reachable state
    NoStaleAccess
