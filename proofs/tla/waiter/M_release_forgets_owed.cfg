\* MUTATION release_forgets_owed: the queue lets an owed node go without settling the
\* mark. Expected: OwedSettled broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Rounds = 1
    Nudges = 1
    Spin = FALSE
    Cancel = FALSE
    Owe = TRUE
    Spurious = 0
    Mutation = "release_forgets_owed"
INVARIANTS                     \* must hold in every reachable state
    OwedSettled
