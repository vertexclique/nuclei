\* MUTATION spin_keeps_armed: a spinning future leaves its waker armed.
\* Expected: NoClaimWhileSpinning broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is what a property says, not a deadlock
CONSTANTS
    Rounds = 1
    Nudges = 1
    Spin = TRUE
    Cancel = FALSE
    Owe = FALSE
    Spurious = 0
    Mutation = "spin_keeps_armed"
INVARIANTS                     \* must hold in every reachable state
    NoClaimWhileSpinning
