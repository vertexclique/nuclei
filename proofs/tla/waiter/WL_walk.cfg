\* A wake list of three nodes whose futures let go at any moment, no waker panicking:
\* the list never reads a node it let go of, and every node is woken.
SPECIFICATION Spec              \* the algorithm, every process weakly fair
CONSTANTS
    K = 3                       \* three nodes in the list
    PanicAt = 0                 \* no waker panics
    Mutation = "none"           \* no rule taken away
INVARIANTS                     \* must hold in every reachable state
    NoStaleAccess
    AllWoken
