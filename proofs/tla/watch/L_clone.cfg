\* A sender clones itself and sends, the clone sends once: nothing is published after the
\* close, every value is announced, and the receiver ends having seen the last version.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsClone
    WithChanged = TRUE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    NoSendPastClose
    StoresAnnounced
    SawTheLast
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
