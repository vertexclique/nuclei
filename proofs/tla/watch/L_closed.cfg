\* A sender waits until every receiver went (the borrower goes on its own): it
\* ends, and every safety property holds.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsOne
    WithChanged = FALSE
    WithBorrower = TRUE
    WithClosed = TRUE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    PairedNoOlder
    VersionCountsPublications
PROPERTIES                     \* must hold of every behaviour
    ProducerEnds
