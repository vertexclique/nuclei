\* Sends and modifying sends race; a receiver waits for changes: it never
\* answers closed with a version it has not seen, it ends having seen the last
\* version, the version counts every publication. The borrower of this race
\* runs in L_mixed_borrow, as in L_sends and for the same reason: the two
\* receivers decide nothing by each other. At this size a compare-and-swap is
\* still lost and started over (W_cas_retry), `changed` reading the state
\* before making its `Notified` (M_read_before_notified) still never ends, and
\* answering the closed bit first (M_closed_first) still misses the last change.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsMixed
    WithChanged = TRUE
    WithBorrower = FALSE        \* the borrower runs in L_mixed_borrow
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    VersionCountsPublications
    SawTheLast
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
