\* L_mixed's sends and modifying sends with the borrower alone: a borrow never
\* pairs a version with an older value, the version counts every publication.
\* The waiting receiver of this race runs in L_mixed, as the two receivers
\* decide nothing by each other (see L_sends). At this size a compare-and-swap
\* is still lost and started over (W_cas_retry), a borrow that loads the value
\* before the version (M_value_first) still pairs a version with an older
\* value, and a borrow still reads a value one send ahead of its version
\* (W_borrow_ahead).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsMixed
    WithChanged = FALSE         \* the waiting receiver runs in L_mixed
    WithBorrower = TRUE
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    PairedNoOlder
    VersionCountsPublications
