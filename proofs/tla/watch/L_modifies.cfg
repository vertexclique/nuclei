\* Two senders modify the value in place: no change lost, every safety property,
\* the waiting receiver ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsModifies
    WithChanged = TRUE
    WithBorrower = FALSE
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    PairedNoOlder
    VersionCountsPublications
    SawTheLast
    NoLostModify
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
