\* A send_replace and a send race a receiver waiting for changes: the version counts both
\* publications and the receiver ends having seen the last.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsReplace
    WithChanged = TRUE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    VersionCountsPublications
    StoresAnnounced
    SawTheLast
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
