\* A send_replace whose clone of the old value panics: the new value is published (a
\* version and a wake) before the clone, so the receiver hears of it, sees the last
\* version and ends once the unwinding sender's drop closes the channel.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsReplacePanic
    WithChanged = TRUE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    StoresAnnounced
    SawTheLast
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
