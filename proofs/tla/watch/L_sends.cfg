\* Two senders send; a receiver waits for changes: it never answers closed with
\* a version it has not seen, it ends having seen the last version, the version
\* counts every publication, and no deadlock. The borrower of this race runs in
\* L_sends_borrow: it and the waiting receiver decide nothing by each other
\* (the borrower only reads the version and the value; the count of receivers
\* both lower only decides a wake for a sender's `closed`, and no run here has
\* one), so every property is decided as it was with both in one run, where
\* the borrower only multiplied the states by every place it could be. At this
\* size, `changed` reading the state before making its `Notified`
\* (M_read_before_notified) still never ends, and answering the closed bit
\* first (M_closed_first) still misses the last change.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsSends
    WithChanged = TRUE
    WithBorrower = FALSE        \* the borrower runs in L_sends_borrow
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    VersionCountsPublications
    SawTheLast
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
