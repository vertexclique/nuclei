\* Two senders send; a receiver waits for changes, another borrows: every safety
\* property, the waiting receiver ends, no deadlock.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsSends
    WithChanged = TRUE
    WithBorrower = TRUE
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    PairedNoOlder
    VersionCountsPublications
    SawTheLast
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
