\* L_sends' two senders with the borrower alone: a borrow never pairs a version
\* with an older value, the version counts every publication, and no deadlock.
\* The waiting receiver of this race runs in L_sends, as it and the borrower
\* decide nothing by each other (see L_sends): the borrower meets here every
\* interleaving of the senders it met with the receiver there. At this size, a
\* borrow that loads the value before the version (M_value_first) still pairs a
\* version with an older value, and a borrow still reads a value one send
\* ahead of its version (W_borrow_ahead).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsSends
    WithChanged = FALSE         \* the waiting receiver runs in L_sends
    WithBorrower = TRUE
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    PairedNoOlder
    VersionCountsPublications
