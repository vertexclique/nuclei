\* A sender sends, subscribes a receiver and sends again: the subscribed receiver's
\* changed answers only the send after it subscribed, or the close, and it ends.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsSubscribe
    WithChanged = TRUE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    ErrOnlyWhenSeen
    SubSeesOnlyNewer
    SawTheLast
PROPERTIES                     \* must hold of every behaviour
    SubEnds
    ReceiverEnds
