\* wait_for(f) races two sends, f accepting only the second value: it ends with it, and
\* never answers closed without judging the newest value.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsTwo
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = TRUE          \* one wait_for receiver
    FitAt = 2                   \* f accepts the second value sent
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    WaitForErrOnNewest
PROPERTIES                     \* must hold of every behaviour
    WaitForEnds
