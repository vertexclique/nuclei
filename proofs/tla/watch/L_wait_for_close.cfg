\* wait_for(f) races two sends and the close, f accepting no value: it answers closed, and
\* only after f turned down the newest value.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CONSTANTS
    SendOps <- OpsTwo
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = TRUE          \* one wait_for receiver
    FitAt = 3                   \* f accepts no value sent
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    WaitForErrOnNewest
PROPERTIES                     \* must hold of every behaviour
    WaitForEnds
