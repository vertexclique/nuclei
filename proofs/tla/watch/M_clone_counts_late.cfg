\* MUTATION clone_counts_late: the clone counts itself only once it runs. The original
\* sender goes first, finds itself the last, and closes the channel; the clone then sends
\* on a closed channel. Expected: NoSendPastClose broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsCloneOnly
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "clone_counts_late"
INVARIANTS                     \* must hold in every reachable state
    NoSendPastClose
