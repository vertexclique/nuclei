\* MUTATION count_before_notified: a sender's closed counts the receivers before
\* making its Notified. Expected: ProducerEnds broken (the last receiver's wake
\* is missed).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsOne
    WithChanged = FALSE
    WithBorrower = TRUE
    WithClosed = TRUE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "count_before_notified"
PROPERTIES                     \* must hold of every behaviour
    ProducerEnds
