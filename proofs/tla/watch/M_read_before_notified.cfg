\* MUTATION read_before_notified: changed reads the state before making its
\* Notified. Expected: ReceiverEnds broken (a wake between the two is missed).
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsTwoSenders
    WithChanged = TRUE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "read_before_notified"
PROPERTIES                     \* must hold of every behaviour
    ReceiverEnds
