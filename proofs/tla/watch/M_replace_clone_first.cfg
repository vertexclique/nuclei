\* MUTATION replace_clone_first: send_replace clones the old value before it publishes the
\* new one, and the clone panics: the sender unwinds with the new value stored and no
\* version or wake for it, so no receiver ever hears of it. Expected: StoresAnnounced
\* broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsReplacePanic
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "replace_clone_first"
INVARIANTS                     \* must hold in every reachable state
    StoresAnnounced
