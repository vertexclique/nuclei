\* MUTATION store_not_cas: a modifying send stores its copy without comparing.
\* Expected: NoLostModify broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsModifies
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    Mutation = "store_not_cas"
INVARIANTS                     \* must hold in every reachable state
    NoLostModify
