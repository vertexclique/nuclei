\* MUTATION subscribe_from_zero: subscribe starts the new receiver at version zero instead
\* of the version it loads. Its first changed answers at once for the send made before it
\* subscribed. Expected: SubSeesOnlyNewer broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsSendSubscribe
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "subscribe_from_zero"
INVARIANTS                     \* must hold in every reachable state
    SubSeesOnlyNewer
