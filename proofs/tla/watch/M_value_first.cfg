\* MUTATION value_first: a borrow loads the value before it reads the version.
\* Expected: PairedNoOlder broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsTwo
    WithChanged = FALSE
    WithBorrower = TRUE
    WithClosed = FALSE
    Mutation = "value_first"
INVARIANTS                     \* must hold in every reachable state
    PairedNoOlder
