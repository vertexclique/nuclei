\* MUTATION value_first: a borrow loads the value before it reads the version.
\* Expected: PairedNoOlder broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsTwo
    WithChanged = FALSE
    WithBorrower = TRUE
    WithClosed = FALSE
    WithWaitFor = FALSE         \* no wait_for receiver
    FitAt = 0                   \* (unused without one)
    Mutation = "value_first"
INVARIANTS                     \* must hold in every reachable state
    PairedNoOlder
