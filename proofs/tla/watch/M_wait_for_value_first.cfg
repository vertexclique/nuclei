\* MUTATION wait_for_value_first: wait_for's snapshot reads the value before the version.
\* It reads the old value, the send lands and closes the channel, and it pairs the old
\* value with the new version: f turns the old value down, the new version is marked
\* seen, and the close then answers closed with the newest value never judged.
\* Expected: WaitForErrOnNewest broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsOne
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    WithWaitFor = TRUE          \* one wait_for receiver
    FitAt = 1                   \* f accepts the value sent
    Mutation = "wait_for_value_first"
INVARIANTS                     \* must hold in every reachable state
    WaitForErrOnNewest
