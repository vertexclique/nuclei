\* WITNESS: a borrow reads a value one send ahead of its version (the harmless
\* extra change the docs of borrow warn of). Expected: NeverAhead broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsOne
    WithChanged = FALSE
    WithBorrower = TRUE
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NeverAhead
