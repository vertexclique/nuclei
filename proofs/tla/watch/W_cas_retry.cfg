\* WITNESS: a modifying send loses its compare-and-swap to another and starts over.
\* Expected: NoRetry broken.
SPECIFICATION Spec              \* the algorithm, every thread weakly fair
CHECK_DEADLOCK FALSE           \* a stuck thread is not what this run looks for
CONSTANTS
    SendOps <- OpsTwoModifiers
    WithChanged = FALSE
    WithBorrower = FALSE
    WithClosed = FALSE
    Mutation = "none"
INVARIANTS                     \* must hold in every reachable state
    NoRetry
