\* MUTATION cascade_fires_all: an advance fires every timer of the slot it took, also a
\* higher level's timer whose slot came before its deadline. Expected: NeverEarly broken.
SPECIFICATION Spec              \* the algorithm, the shard weakly fair
CHECK_DEADLOCK FALSE           \* a stuck process is not what this run looks for
CONSTANTS
    B = 1                       \* two slots a level
    L = 2                       \* two levels: a span of four
    Owners = {"a", "b"}         \* two owners of timers
    Arms = 2                    \* each arms at most twice
    MaxAhead = 4                \* a deadline up to four past the clock: past the span
    MaxStep = 3                 \* an advance moves the clock by one to three
    Horizon = 7                 \* the clock stops at seven
    Mutation = "cascade_fires_all"
INVARIANTS                     \* must hold in every reachable state
    NeverEarly
